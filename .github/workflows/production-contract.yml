name: Production Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-contract-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_OS:-}"
          test -n "${RUNNER_ARCH:-}"
          echo "runner=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "run=${GITHUB_RUN_ID}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
      - name: Vercel static deployment contract
        run: python scripts/vercel_static_contract.py
      - name: Production contract
        run: python scripts/production-contract.py
      - name: Capability registry contract
        run: python scripts/capability-audit.py --check
      - name: Module contract reachability
        run: python scripts/module-contract.py
      - name: Evidence audit
        run: python scripts/evidence-audit.py --summary
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -not -path './build/*' -print0)
          echo "node --check clean"
      - name: Configuration syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('config').rglob('*.json')) if Path('config').exists() else []
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'Validated {len(files)} JSON configuration files.')
          PY
      - name: Execution marker
        run: |
          echo 'PRODUCTION_CONTRACT_EXECUTED=true'
          echo "PRODUCTION_CONTRACT_RUN_ID=${GITHUB_RUN_ID}"
          echo "PRODUCTION_CONTRACT_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
