name: Workflow Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate workflow contracts
        run: python3 scripts/workflow-contract.py

      - name: Validate local production gate help path
        run: bash scripts/ci-local.sh --help
