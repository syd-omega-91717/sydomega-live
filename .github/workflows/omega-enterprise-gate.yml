name: Omega Enterprise Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: omega-enterprise-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    name: Enterprise architecture gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Architecture evolution gate
        run: python scripts/omega_enterprise_architecture_gate.py

      # Three steps were removed here, not weakened. `compileall -q core scripts
      # tests`, `omega_fabric_audit.py` and `omega_fabric_platform_gate.py` are
      # byte-identical to steps in omega-intelligence-fabric.yml, which fires on
      # exactly the same events as this workflow (push[main] + pull_request with
      # no branch filter), so every commit that reached them here still reaches
      # them there. Re-adding them costs Actions minutes and buys no coverage.
      #
      # The two steps below are deliberately NOT deduplicated even though
      # repository-integrity.yml and omega-release-readiness.yml also run them:
      # both of those filter `pull_request: branches: [main]`, which is NARROWER
      # than this workflow's unfiltered `pull_request:`. Removing them would
      # silently drop coverage on a PR targeting any other base branch. Dedupe
      # only against a sibling whose trigger is identical or wider.

      - name: Repository integrity gate
        run: python scripts/repository_integrity_audit.py

      - name: Static production artifact gate
        run: bash scripts/vercel-build.sh

      - name: Artifact contract
        run: test -s public/index.html && test -s public/vendor/supabase-js.js
