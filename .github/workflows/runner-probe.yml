# Runner canary for issue #157.
#
# Proves the registered runner actually executes work: a non-zero runner id,
# real steps, and a retrievable log -- #157's acceptance criterion.
#
# SHELL HISTORY, so nobody re-litigates it. Runs 1-29 of this workflow all
# failed, and not one was a code failure. On the registered Windows runner
# `bash` resolves to the WSL shim at C:\Windows\System32\bash.exe with no
# distro installed, so it died before reading any script:
#
#   WSL (10 - Relay) ERROR: CreateProcessCommon:800:
#   execvpe(/bin/bash) failed: No such file or directory
#
# Three spellings failed: `shell: cmd` + `bash ...`; `shell: bash`, which
# Actions also resolved to the shim (run 27's log reads
# "shell: C:\Windows\system32\bash.EXE --noprofile --norc -e -o pipefail {0}");
# and an absolute Git-bash path, which the runner refused to parse
# ("Second path fragment must not be a drive or UNC name").
#
# A capability probe (run 33342384308) then MEASURED what this runner has,
# rather than guessing again. All four worked: pwsh, powershell, python, and
# the default shell. So `pwsh` is used here and across the gate workflows --
# it exists on this Windows runner AND is preinstalled on GitHub's Linux
# runners, which is what makes those workflows runner-agnostic.
name: Runner Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  self-hosted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Prove the runner is real
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          if (-not $env:RUNNER_ARCH) { exit 1 }
          "runner_name=$env:RUNNER_NAME"
          "runner_os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"
          "run_id=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
          "SELF_HOSTED_RUNNER_OK=true"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A real repo check, run the way the gates run theirs. Deliberately not
      # ci-local.sh: that needs bash, which does not work here, and ci.yml
      # already runs all 18 blocking checks on this same runner.
      - name: Toolchain and a real repo check execute on this runner
        run: |
          python --version
          node --version
          python scripts/workflow-contract.py
      - name: Execution marker
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          "RUNNER_PROBE_EXECUTED=true"
          "RUNNER_PROBE_RUN_ID=$env:GITHUB_RUN_ID"
          "RUNNER_PROBE_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
