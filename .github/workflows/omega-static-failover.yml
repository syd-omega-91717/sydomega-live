name: Omega Static Failover

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: omega-static-failover
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build canonical static artifact
        shell: bash
        run: bash scripts/vercel-build.sh

      - name: Bind canonical domain in Pages artifact
        shell: bash
        run: printf '%s\n' 'sydomega.com' > public/CNAME

      - name: Validate failover artifact
        shell: bash
        run: python3 scripts/omega-pages-failover-smoke.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # actions/upload-pages-artifact is deliberately NOT used. It is a composite action that calls
      # actions/upload-artifact@v4 by tag, and this repository's policy ("all actions must be pinned to a
      # full-length commit SHA") rejects an unpinned action even when it is nested, so the job failed at
      # "Set up job" on every push to main. These two steps are its v3.0.1 steps (commit 56afc609, Linux
      # branch) verbatim, with upload-artifact pinned to the SHA this repo already uses (v4.6.2). The
      # artifact name (github-pages), the tar layout and retention are unchanged, so deploy-pages is unaffected.
      - name: Archive Pages artifact
        shell: sh
        env:
          INPUT_PATH: public
        run: |
          echo ::group::Archive artifact
          tar \
            --dereference --hard-dereference \
            --directory "$INPUT_PATH" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          echo ::endgroup::

      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # The deploy job runs on a fresh runner: without a checkout the smoke script
      # below does not exist and the step fails after a successful deploy.
      - name: Checkout smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke test deployed Pages site
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 scripts/omega-pages-failover-smoke.py --url "${PAGES_URL}"
