name: Vercel Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the validated main artifact to Vercel Production'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.ico'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.mp4'
      - '**/*.webm'
      - 'vendor/**'
      - 'i18n/**'
      - 'assets/**'
      - 'static/**'
      - 'images/**'
      - 'img/**'
      - 'icons/**'
      - 'media/**'
      - 'fonts/**'
      - 'audio/**'
      - 'video/**'
      - 'css/**'
      - 'js/**'
      - '.well-known/**'
      - 'vercel.json'
      - 'scripts/vercel-build.sh'
      - 'scripts/vercel-build-enhance.mjs'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          echo "runner=${RUNNER_NAME}"
          echo "run=${GITHUB_RUN_ID}"
      - name: Execution marker
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          echo "VERCEL_PRODUCTION_VALIDATE_EXECUTED=true"
          echo "VERCEL_PRODUCTION_VALIDATE_RUN_ID=${GITHUB_RUN_ID}"
      - name: Static contract
        run: python scripts/vercel_static_contract.py
      - name: Build artifact
        run: bash scripts/vercel-build.sh
      - name: Production surface contract
        run: python scripts/omega-production-surface-contract.py
      - name: Artifact invariants
        run: |
          set -euo pipefail
          test -s public/index.html
          test -f public/vendor/supabase-js.js
          test "$(find public -type f -name '*.html' | wc -l)" -gt 0
          echo 'VERCEL_PRODUCTION_ARTIFACT=PASS'

  credentials:
    name: Resolve deployment credentials
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      org: ${{ steps.export.outputs.org }}
      project: ${{ steps.export.outputs.project }}
    steps:
      - id: check
        shell: bash
        env:
          # Only VERCEL_TOKEN is secret. Org/project identifiers are safe public
          # project metadata and remain overridable through repository variables.
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_w0v6eD1jUUzfPjiDq3ztOfvp' }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_H3aTU3D4mR7TD19etdPTeYmhvANY' }}
        run: |
          set -euo pipefail
          echo "org_resolved=${ORG:+yes}"
          echo "project_resolved=${PROJECT:+yes}"
          if [[ -n "$TOKEN" && -n "$ORG" && -n "$PROJECT" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_CREDENTIALS=READY'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_CREDENTIALS=NOT_CONFIGURED missing=VERCEL_TOKEN'
          fi
      - id: export
        shell: bash
        env:
          ORG: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_w0v6eD1jUUzfPjiDq3ztOfvp' }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_H3aTU3D4mR7TD19etdPTeYmhvANY' }}
        run: |
          set -euo pipefail
          echo "org=$ORG" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Production promotion
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ needs.credentials.outputs.org }}
      VERCEL_PROJECT_ID: ${{ needs.credentials.outputs.project }}
    steps:
      - name: Controlled state when token is unavailable
        if: needs.credentials.outputs.ready != 'true'
        run: |
          echo 'VERCEL_PRODUCTION_DEPLOYMENT=CONTROLLED'
          echo 'Artifact validation passed; production promotion is waiting for VERCEL_TOKEN.'
          echo 'No provider mutation was attempted.'
          echo '::warning title=Production promotion pending::VERCEL_TOKEN is not configured. Artifact and deployment contracts are green, but this run cannot promote the production alias.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.credentials.outputs.ready == 'true'
        with:
          node-version: '20'
      - name: Pin deployment to the intended Vercel project
        if: needs.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
      - name: Deploy to Vercel Production
        if: >-
          needs.credentials.outputs.ready == 'true' &&
          (github.event_name == 'push' || inputs.deploy == true)
        run: npx --yes vercel@59.6.0 deploy --prod --yes --token "$VERCEL_TOKEN"
