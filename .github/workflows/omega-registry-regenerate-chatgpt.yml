name: One-off Omega Registry Regeneration

on:
  push:
    branches:
      - chatgpt/elemental-resonance-composer-20261128-v2
    paths:
      - .github/workflows/omega-registry-regenerate-chatgpt.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - name: Run canonical registry generator
        run: python3 scripts/omega-registry.py
      - name: Emit generated registry for reviewed branch update
        run: |
          echo '--- OMEGA REGISTRY BEGIN ---'
          cat OMEGA_SKILL_REGISTRY.md
          echo '--- OMEGA REGISTRY END ---'
