<style>
:root{--void:#0A0A0F;--panel:#0d0d18;--gold:#C9A84C;--solar:#E2C86D;--cyan:#00E5FF;--crim:#8B0000;--green:#3fb27f;--ink:#e9e6dc;--muted:#85837b;--line:rgba(201,168,76,0.12);--D:'Cinzel Decorative',serif;--B:'Rajdhani',sans-serif;--M:'Courier Prime',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--B);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(201,168,76,.06),transparent 55%)}
a{color:inherit;text-decoration:none}
.shell{position:relative;z-index:1;display:flex;min-height:100vh}
.side{width:80px;flex-shrink:0}
.main{flex:1;min-width:0;padding-bottom:80px}
.pad{padding:0 clamp(14px,3vw,36px)}
.topbar{border-bottom:1px solid var(--line);padding:20px clamp(14px,3vw,36px);background:rgba(8,8,15,.9)}
.topbar .t{font-family:var(--D);font-weight:700;color:var(--gold);font-size:clamp(16px,2.5vw,24px);letter-spacing:2px}
.topbar .t small{display:block;font-family:var(--M);font-size:9px;color:var(--muted);letter-spacing:3px;margin-top:3px}
.sechead{font-family:var(--M);font-size:10px;letter-spacing:4px;color:var(--cyan);margin:28px clamp(14px,3vw,36px) 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}

/* STATS */
.vault-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border-bottom:1px solid var(--line)}
.vs-item{padding:16px 20px;border-right:1px solid var(--line);text-align:center}
.vs-item:last-child{border-right:none}
.vs-label{font-family:var(--M);font-size:7px;letter-spacing:3px;color:var(--muted);margin-bottom:5px}
.vs-val{font-family:var(--D);font-size:clamp(20px,3vw,30px);font-weight:700;animation:vs-glow 4s ease-in-out infinite}
@keyframes vs-glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}

/* TROPHY CARDS */
.trophy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.trophy-card{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),rgba(7,7,11,.7));padding:20px;text-align:center;position:relative;overflow:hidden;transition:all .22s}
.trophy-card:hover{transform:translateY(-3px)}
.trophy-card.earned{border-color:rgba(201,168,76,.4)}
.trophy-card.earned::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.tc-canvas{display:block;margin:0 auto 12px}
.tc-num{font-family:var(--M);font-size:7px;letter-spacing:3px;color:var(--muted);margin-bottom:3px}
.tc-name{font-family:var(--D);font-size:13px;font-weight:700;margin-bottom:4px}
.tc-element{font-family:var(--M);font-size:8px;letter-spacing:2px;margin-bottom:6px}
.tc-tier{font-family:var(--M);font-size:8px;letter-spacing:2px;padding:3px 9px;border:1px solid;display:inline-block;margin-bottom:6px}
.tc-date{font-family:var(--M);font-size:8px;color:var(--muted);margin-top:4px}
.tc-locked{font-family:var(--M);font-size:8px;color:rgba(133,131,123,.4);margin-top:8px;letter-spacing:1px}

/* MEDAL RACK */
.medal-rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.medal-card{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),transparent);padding:14px;display:flex;gap:12px;align-items:center;transition:all .2s}
.medal-card:hover{border-color:rgba(201,168,76,.3)}
.medal-card.earned{border-left:3px solid}
.mc-icon{width:36px;height:36px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-family:var(--D);font-size:14px;flex-shrink:0;animation:medal-spin 8s linear infinite}
@keyframes medal-spin{0%{transform:rotateY(0deg)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.mc-body .mcb-name{font-family:var(--D);font-size:11px;font-weight:700;margin-bottom:2px}
.mc-body .mcb-cat{font-family:var(--M);font-size:7px;letter-spacing:2px;color:var(--muted)}

/* CERT LIST */
.cert-list{display:flex;flex-direction:column;gap:0}
.cert-row{display:flex;align-items:center;gap:16px;padding:14px clamp(14px,3vw,36px);border-bottom:1px dashed rgba(201,168,76,.06);transition:background .15s}
.cert-row:hover{background:rgba(201,168,76,.03)}
.cert-row.issued{border-left:3px solid}
.cr-num{font-family:var(--D);font-size:18px;font-weight:700;min-width:28px;opacity:.6}
.cr-body{flex:1}
.cr-name{font-family:var(--D);font-size:13px;font-weight:700;margin-bottom:2px}
.cr-domain{font-family:var(--M);font-size:8px;letter-spacing:2px;color:var(--muted)}
.cr-grade{font-family:var(--M);font-size:8px;letter-spacing:2px;padding:2px 8px;border:1px solid;display:inline-block}
.cr-date{font-family:var(--M);font-size:8px;color:var(--muted);text-align:right;flex-shrink:0}

@media(max-width:760px){.shell{flex-direction:column}.side{width:100%;height:auto}.vault-stats{grid-template-columns:1fr 1fr}}
</style>

const TROPHY_DATA=[

function drawTrophyIcon(cv,col,earned){
  cv.width=120;cv.height=100;cv.style.width='60px';cv.style.height='50px';
  const ctx=cv.getContext('2d');let t=0;
  function f(){
    t+=.025;ctx.clearRect(0,0,120,100);
    if(!earned){ctx.fillStyle='rgba(133,131,123,0.1)';ctx.beginPath();ctx.arc(60,50,44,0,Math.PI*2);ctx.fill();return;}
    const g=ctx.createRadialGradient(60,50,0,60,50,44);g.addColorStop(0,col+'55');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(60,50,44,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(60,50);ctx.rotate(t*.6);ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);
    ctx.strokeStyle=col+'44';ctx.lineWidth=1;ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(60,50);ctx.rotate(-t*.4);ctx.beginPath();ctx.ellipse(0,0,38,14,0,0,Math.PI*2);
    ctx.strokeStyle=col+'22';ctx.lineWidth=.7;ctx.stroke();ctx.restore();
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=14+5*Math.sin(t*2);
    ctx.font='700 22px "Cinzel Decorative",serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('\u03A9',60,51);ctx.shadowBlur=0;requestAnimationFrame(f);}f();
}

async function boot(){
  const sess=(await sb.auth.getSession()).data.session;
  if(!sess){window.location.href='/account.html';return;}
  const uid=sess.user.id;
  const pr=await sb.from('profiles').select('is_owner').eq('id',uid).maybeSingle();
  const isOwner=pr.data?.is_owner||false;
  /* Fetch achievements */
  const [{data:earned_t},{data:earned_m},{data:earned_c}]=await Promise.all([
    sb.from('trophies').select('trophy_num,earned_at').eq('user_id',uid),
    sb.from('medals').select('medal_num,earned_at').eq('user_id',uid),
    sb.from('certificates').select('cert_num,issued_at').eq('user_id',uid),
  ]);
  const tnums=isOwner?TROPHY_DATA.map(t=>t.n):(earned_t||[]).map(t=>t.trophy_num);
  const mnums=isOwner?MEDAL_DATA.map(m=>m.n):(earned_m||[]).map(m=>m.medal_num);
  const cnums=isOwner?CERT_DATA.map(c=>c.n):(earned_c||[]).map(c=>c.cert_num);
  document.getElementById('t-count').textContent=tnums.length+'/12';
  document.getElementById('m-count').textContent=mnums.length+'/12';
  document.getElementById('c-count').textContent=cnums.length+'/12';
  const total=tnums.length+mnums.length+cnums.length;
  document.getElementById('a-tier').textContent=total===36?'OMEGA MASTER':total>=24?'PLATINUM':total>=12?'GOLD':'SAND';
  document.getElementById('a-tier').style.color=total===36?'#C9A84C':total>=24?'#E8D5B7':total>=12?'#C9A84C':'#D9B86A';

  /* Trophies */
  const tg=document.getElementById('trophy-grid');tg.innerHTML='';
  TROPHY_DATA.forEach(td=>{
    const earned=tnums.includes(td.n);
    const eDate=earned&&!isOwner?(earned_t||[]).find(t=>t.trophy_num===td.n)?.earned_at:null;
    const card=document.createElement('div');card.className='trophy-card'+(earned?' earned':'');
    if(earned) card.style.cssText+=`border-top-color:${td.col}77`;
    const cv=document.createElement('canvas');cv.className='tc-canvas';
    card.innerHTML=`<div class="tc-num">TROPHY ${td.n} OF 12</div><div class="tc-name" style="color:${earned?td.col:'var(--muted)'}">${td.name}</div><div class="tc-element" style="color:${earned?td.col:'rgba(133,131,123,.4)'}">ELEMENT: ${td.el}</div><span class="tc-tier" style="color:${earned?td.col:'var(--muted)'};border-color:${earned?td.col+'44':'rgba(133,131,123,.2)'}">OMEGA</span>${eDate?`<div class="tc-date">EARNED: ${new Date(eDate).toLocaleDateString()}</div>`:isOwner?'<div class="tc-date">EARNED: OMEGA MASTER</div>':'<div class="tc-locked">LOCKED -- PROGRESS REQUIRED</div>'}`;
    card.insertBefore(cv,card.firstChild);
    tg.appendChild(card);
    requestAnimationFrame(()=>drawTrophyIcon(cv,td.col,earned));
  });

  /* Medals */
  const mg=document.getElementById('medal-rack');mg.innerHTML='';
  MEDAL_DATA.forEach(md=>{
    const earned=mnums.includes(md.n);
    const c=document.createElement('div');c.className='medal-card'+(earned?' earned':'');
    if(earned) c.style.cssText+=`border-left-color:${md.col}`;
    c.innerHTML=`<div class="mc-icon" style="border-color:${earned?md.col:'rgba(133,131,123,.2)'};color:${earned?md.col:'var(--muted)'}">${md.n}</div><div class="mc-body"><div class="mcb-name" style="color:${earned?md.col:'var(--muted)'}">${md.name}</div><div class="mcb-cat" style="color:${earned?md.col+'aa':'rgba(133,131,123,.4)'}">${md.cat}</div></div>`;
    mg.appendChild(c);
  });

  /* Certificates */
  const cl=document.getElementById('cert-list');cl.innerHTML='';
  CERT_DATA.forEach(cd=>{
    const issued=cnums.includes(cd.n);
    const row=document.createElement('div');row.className='cert-row'+(issued?' issued':'');
    if(issued) row.style.cssText+=`border-left-color:${cd.col}`;
    row.innerHTML=`<div class="cr-num" style="color:${issued?cd.col:'rgba(133,131,123,.2)'}">${cd.n}</div><div class="cr-body"><div class="cr-name" style="color:${issued?cd.col:'var(--muted)'}">${cd.name}</div><div class="cr-domain">${cd.domain}</div></div><span class="cr-grade" style="color:${issued?cd.col:'var(--muted)'};border-color:${issued?cd.col+'44':'rgba(133,131,123,.15)'}">${issued?'ISSUED':'PENDING'}</span><div class="cr-date">${issued?'CERTIFIED':' -- '}</div>`;
    cl.appendChild(row);
  });
}
boot();
</script>
