name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          echo "run=${GITHUB_RUN_ID}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          test -n "${RUNNER_NAME}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.js )
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Inline JavaScript syntax
        run: python3 scripts/check-inline-js.py

      - name: Repository audit
        run: python3 scripts/audit.py

      - name: Audit tooling tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Production contract
        run: python3 scripts/production-contract.py

      - name: Workflow contract
        run: python3 scripts/workflow-contract.py

      - name: 16-block architecture contract
        run: python3 scripts/architecture-contract.py

      - name: Capability registry
        run: python3 scripts/capability-audit.py --check

      - name: Capability runtime audit
        run: python3 scripts/capability-audit.py

      - name: Registry JSON
        run: python3 -m json.tool docs/capabilities/registry.json >/dev/null

      - name: Schema dictionary
        run: python3 scripts/schema-dictionary.py
        continue-on-error: true

      - name: RLS audit
        run: python3 scripts/rls-auditor.py
        continue-on-error: true

      - name: Silent failure audit
        run: python3 scripts/silent-failure-detector.py
        continue-on-error: true

      - name: Migration consistency
        run: python3 scripts/migration-consistency.py
        continue-on-error: true

      - name: Upsert conflict audit
        run: python3 scripts/upsert-conflict-check.py
        continue-on-error: true

      - name: Skill and agent registry
        run: python3 scripts/omega-registry.py --check

      - name: Context budget
        run: python3 scripts/context-budget.py

      - name: Client credential scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -rIn --exclude-dir=.git --include='*.js' --include='*.html' --include='*.json' \
            -e 'service_role' -e 'SUPABASE_SERVICE_ROLE_KEY' .; then
            echo 'client credential marker detected'
            exit 1
          fi

      - name: Final execution marker
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME}"
          echo "CI_EXECUTED=true"
          echo "CI_RUN_ID=${GITHUB_RUN_ID}"
          echo "CI_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
