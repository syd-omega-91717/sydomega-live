name: Capability Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_NAME)) { throw 'RUNNER_NAME is empty' }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_OS)) { throw 'RUNNER_OS is empty' }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_ARCH)) { throw 'RUNNER_ARCH is empty' }
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "runner_os=$env:RUNNER_OS"
          Write-Host "runner_arch=$env:RUNNER_ARCH"
          Write-Host "run=$env:GITHUB_RUN_ID"
          Write-Host "attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate capability registry
        run: python scripts/capability-audit.py --check
      - name: Source runtime audit
        run: python scripts/capability-audit.py
      - name: Validate registry JSON
        run: python -m json.tool docs/capabilities/registry.json
      - name: Validate architecture runtime
        run: python scripts/architecture-readiness.py
      - name: Execution marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_NAME)) { throw 'Runner identity missing' }
          Write-Host 'CAPABILITY_EVIDENCE_EXECUTED=true'
          Write-Host "CAPABILITY_EVIDENCE_RUN_ID=$env:GITHUB_RUN_ID"
          Write-Host "CAPABILITY_EVIDENCE_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
