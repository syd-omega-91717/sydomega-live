# Runner canaries for issue #157.
#
# Two lanes, deliberately:
#
#   self-hosted  - the runner the quality gates actually use. Proves runner
#                  provisioning and real step execution. This lane may fail.
#   github-hosted - answers the open question in #157 ("are GitHub-hosted
#                  runners restored?") with a fact on every push instead of a
#                  blind check of billing/policy settings. It is
#                  continue-on-error, so it can NEVER gate anything: it is an
#                  instrument, not a requirement. Read its result, don't rely
#                  on it. When it starts passing, hosted runners are available
#                  again and #157's routing decision can be made on evidence.
#
# #157's acceptance criterion is a non-zero runner ID, at least one executed
# step, and a real job log. Both lanes print exactly that, so whichever one
# works, the criterion is demonstrable rather than asserted.
name: Runner Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-hosted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prove the runner is real
        shell: cmd
        run: |
          @echo off
          if "%RUNNER_NAME%"=="" exit /b 1
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if "%RUNNER_ARCH%"=="" exit /b 1
          echo runner_name=%RUNNER_NAME%
          echo runner_os=%RUNNER_OS% arch=%RUNNER_ARCH%
          echo run_id=%GITHUB_RUN_ID% attempt=%GITHUB_RUN_ATTEMPT%
          echo SELF_HOSTED_RUNNER_OK=true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime tools
        shell: cmd
        run: |
          python --version
          node --version
      # The Git for Windows bash by ABSOLUTE PATH. Two weaker attempts failed
      # here first, both proven by the runner log:
      #   `shell: cmd` + `bash ...`  -> bare bash is C:\Windows\System32\bash.exe,
      #      the WSL shim, and no WSL distro is installed:
      #      "WSL (10 - Relay) ERROR: execvpe(/bin/bash) failed"
      #   `shell: bash`              -> Actions ALSO resolved that to the shim.
      #      The log line was literally
      #      "shell: C:\Windows\system32\bash.EXE --noprofile --norc -e -o pipefail {0}"
      #      so the documented "uses Git for Windows bash" behaviour does not
      #      hold on this runner -- System32 wins the PATH lookup.
      # Naming the interpreter outright is the only form that cannot be
      # re-resolved. -e -o pipefail matches what `shell: bash` would have set.
      - name: Deterministic contract on the registered runner
        shell: 'C:\Program Files\Git\bin\bash.exe -eo pipefail {0}'
        run: scripts/ci-local.sh
      - name: Execution marker
        shell: cmd
        run: |
          @echo off
          if "%RUNNER_NAME%"=="" exit /b 1
          echo RUNNER_PROBE_EXECUTED=true
          echo RUNNER_PROBE_RUN_ID=%GITHUB_RUN_ID%
          echo RUNNER_PROBE_RUN_ATTEMPT=%GITHUB_RUN_ATTEMPT%
