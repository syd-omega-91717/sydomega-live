name: Workflow Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-contract:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_NAME)) { throw 'RUNNER_NAME is empty' }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_OS)) { throw 'RUNNER_OS is empty' }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_ARCH)) { throw 'RUNNER_ARCH is empty' }
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "runner_os=$env:RUNNER_OS"
          Write-Host "runner_arch=$env:RUNNER_ARCH"
          Write-Host "run=$env:GITHUB_RUN_ID"
          Write-Host "attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workflow contracts
        run: python scripts/workflow-contract.py
      - name: Validate architecture contract
        run: python scripts/architecture-contract.py
      - name: Validate implementation readiness
        run: python scripts/architecture-readiness.py
      - name: Validate local production gate help path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'scripts/ci-local.sh' -PathType Leaf)) { throw 'scripts/ci-local.sh is missing' }
          $text = Get-Content 'scripts/ci-local.sh' -Raw
          if ($text -notmatch '--help') { throw 'ci-local.sh help contract is missing' }
          Write-Host 'ci-local.sh help contract verified'
      - name: Execution marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_NAME)) { throw 'Runner identity missing' }
          Write-Host 'WORKFLOW_CONTRACT_EXECUTED=true'
          Write-Host "WORKFLOW_CONTRACT_RUN_ID=$env:GITHUB_RUN_ID"
          Write-Host "WORKFLOW_CONTRACT_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
