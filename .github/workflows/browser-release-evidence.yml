name: Browser Accessibility and Performance Evidence

# This job tests LIVE production, not PR previews. Cloudflare Pages is the
# production host. Keep the full browser suite off every PR; run weekly, on
# demand, and after relevant shared-runtime/visual changes reach main. The
# pushed SHA is checked against Cloudflare's deployment status before testing.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "omega-live.js"
      - "bg.js"
      - "omega-a11y.js"
      - "omega-world-engine.js"
      - "omega-sculpture.js"
      - "omega-visual-universe.css"
      - "omega-world-engine.css"
      - "omega-spatial-system.css"
      - "omega-opening-system.css"
      - "omega-page-elevation.css"
      - "omega-cinematic-system.css"
      - "tests/release/browser.spec.cjs"
      - "playwright.config.cjs"

permissions:
  contents: read
  checks: read

concurrency:
  group: browser-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMEGA_BASE_URL: https://sydomega.com
      npm_config_package_lock: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Wait for Cloudflare Pages to deploy the pushed SHA
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" --jq '.check_runs[] | select(.name == "Cloudflare Pages") | [.status, (.conclusion // "")] | @tsv' 2>/dev/null | tail -n 1 || true)"
            if [ "$state" = "$(printf 'completed\tsuccess')" ]; then
              echo "Cloudflare Pages deployment succeeded for ${HEAD_SHA}"
              exit 0
            fi
            if [ "$state" = "$(printf 'completed\tfailure')" ]; then
              echo "Cloudflare Pages deployment failed for ${HEAD_SHA}" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Pages deployment for ${HEAD_SHA}" >&2
          exit 1

      - name: Install isolated browser test dependencies
        run: npm install --no-save --ignore-scripts @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser release suite
        run: npx --no-install playwright test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omega-browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 30
