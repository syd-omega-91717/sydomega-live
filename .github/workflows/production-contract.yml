name: Production Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-contract-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_OS:-}"
          test -n "${RUNNER_ARCH:-}"
          echo "runner=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "run=${GITHUB_RUN_ID}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
      - name: Vercel static deployment contract
        run: python scripts/vercel_static_contract.py
      - name: Production contract
        run: python scripts/production-contract.py
      - name: Capability registry contract
        run: python scripts/capability-audit.py --check
      - name: Capability evidence freshness
        run: python scripts/capability-evidence-freshness.py
      - name: Module contract reachability
        run: python scripts/module-contract.py
      - name: Evidence audit
        run: python scripts/evidence-audit.py --summary
      - name: JavaScript syntax
        run: python scripts/check-js-syntax.py
      - name: Configuration syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('config').rglob('*.json')) if Path('config').exists() else []
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'Validated {len(files)} JSON configuration files.')
          PY
      - name: Execution marker
        run: |
          echo 'PRODUCTION_CONTRACT_EXECUTED=true'
          echo "PRODUCTION_CONTRACT_RUN_ID=${GITHUB_RUN_ID}"
          echo "PRODUCTION_CONTRACT_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
