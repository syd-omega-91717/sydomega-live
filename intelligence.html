<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>&#937; SYD OMEGA 91717 -- Intelligence Layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Courier+Prime:wght@400;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--void:#0A0A0F;--panel:#0d0d18;--gold:#C9A84C;--solar:#E2C86D;--cyan:#00E5FF;--crim:#8B0000;--green:#3fb27f;--ink:#e9e6dc;--muted:#85837b;--line:rgba(201,168,76,0.12);--D:'Cinzel Decorative',serif;--B:'Rajdhani',sans-serif;--M:'Courier Prime',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--B);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(155,107,240,.06),transparent 55%)}
a{color:inherit;text-decoration:none}
.shell{position:relative;z-index:1;display:flex;min-height:100vh}
.side{width:80px;flex-shrink:0}
.main{flex:1;min-width:0;padding-bottom:80px}
.topbar{border-bottom:1px solid var(--line);padding:20px clamp(14px,3vw,36px);background:rgba(8,8,15,.9)}
.topbar .t{font-family:var(--D);font-weight:700;color:var(--gold);font-size:clamp(16px,2.5vw,24px);letter-spacing:2px}
.topbar .t small{display:block;font-family:var(--M);font-size:9px;color:var(--muted);letter-spacing:3px;margin-top:3px}
.pad{padding:0 clamp(14px,3vw,36px)}
.sechead{font-family:var(--M);font-size:10px;letter-spacing:4px;color:var(--cyan);margin:28px clamp(14px,3vw,36px) 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}

/* LIVE SYSTEM HEADER */
.sys-header{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(14px,3vw,36px);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;background:rgba(8,8,15,.7)}
.sh-status{display:flex;align-items:center;gap:8px;font-family:var(--M);font-size:10px;letter-spacing:3px}
.sh-dot{width:8px;height:8px;border-radius:50%;animation:zenith-pulse 1.5s ease-in-out infinite}
@keyframes zenith-pulse{0%,100%{box-shadow:0 0 6px currentColor}50%{box-shadow:0 0 18px currentColor,0 0 30px currentColor}}
.sh-clock{font-family:var(--M);font-size:11px;color:var(--muted);letter-spacing:2px}

/* ANALYTICS MAIN GRID */
.analytics-grid{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:320px;border-bottom:1px solid var(--line)}
@media(max-width:900px){.analytics-grid{grid-template-columns:1fr}}

/* LEFT: Axis radar */
.radar-panel{border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;align-items:center}
.rp-title{font-family:var(--M);font-size:9px;letter-spacing:3px;color:var(--muted);margin-bottom:14px;text-align:center}
#radar-cv{display:block}

/* RIGHT: Metrics + streams */
.metrics-panel{padding:20px clamp(14px,2.5vw,28px);display:flex;flex-direction:column;gap:16px}
.metrics-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.metric-card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);padding:14px;text-align:center;position:relative;overflow:hidden}
.metric-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--col,#C9A84C);opacity:.5}
.mc-label{font-family:var(--M);font-size:7px;letter-spacing:3px;color:var(--muted);margin-bottom:5px}
.mc-val{font-family:var(--D);font-size:clamp(16px,2.5vw,22px);font-weight:700;animation:mc-pulse 4s ease-in-out infinite}
@keyframes mc-pulse{0%,100%{opacity:1}50%{opacity:.7}}
.mc-trend{font-family:var(--M);font-size:8px;margin-top:3px}

/* DATA STREAM */
.stream-container{border:1px solid var(--line);background:rgba(7,7,11,.8);height:120px;overflow:hidden;position:relative;font-family:var(--M);font-size:9px;color:var(--green);padding:10px;line-height:1.6}
.stream-container::after{content:"";position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(0deg,rgba(7,7,11,.9),transparent)}
#stream-inner{animation:stream-scroll 12s linear infinite}
@keyframes stream-scroll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}

/* AGENT LOGS */
.agent-log{display:flex;flex-direction:column;gap:0}
.al-entry{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px dashed rgba(201,168,76,.06)}
.al-entry:last-child{border-bottom:none}
.ale-time{font-family:var(--M);font-size:8px;color:var(--muted);min-width:70px;flex-shrink:0;padding-top:2px}
.ale-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px;animation:ale-glow 2s ease-in-out infinite}
@keyframes ale-glow{0%,100%{opacity:1}50%{opacity:.4}}
.ale-body .alb-agent{font-family:var(--M);font-size:9px;letter-spacing:2px;margin-bottom:2px}
.ale-body .alb-action{font-size:12px;font-weight:300;color:var(--muted);line-height:1.5}

/* DIMENSION MAP */
.dim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.dim-card{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),transparent);padding:16px;position:relative;overflow:hidden}
.dim-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px}
.dc-n{font-family:var(--D);font-size:26px;font-weight:700;opacity:.4;margin-bottom:4px}
.dc-name{font-family:var(--D);font-size:13px;font-weight:700;margin-bottom:5px}
.dc-desc{font-size:11px;font-weight:300;color:var(--muted);line-height:1.5;margin-bottom:8px}
.dc-bar-wrap{height:3px;background:rgba(201,168,76,.08);border-radius:2px;overflow:hidden}
.dc-bar{height:100%;border-radius:2px;transition:width 1.4s ease}
.dc-val{font-family:var(--M);font-size:9px;margin-top:5px}

@media(max-width:760px){.shell{flex-direction:column}.side{width:100%;height:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="omega-side" data-page="intelligence"></aside>
  <main class="main">
    <div class="topbar">
      <div class="t">INTELLIGENCE LAYER<small>M17 . AI ANALYTICS . AGENT MESH . DIMENSION VIEWER . LIVE REASONING</small></div>
    </div>

    <!-- LIVE SYSTEM HEADER -->
    <div class="sys-header">
      <div class="sh-status">
        <div class="sh-dot" style="background:var(--green);color:var(--green)"></div>
        <span style="color:var(--green)">SYSTEM STATUS: ZENITH OPERATIONAL</span>
        <span style="color:var(--muted)"> . </span>
        <div class="sh-dot" style="background:var(--gold);color:var(--gold)"></div>
        <span style="color:var(--muted)">ALL 12 AGENTS ONLINE</span>
      </div>
      <div class="sh-clock" id="intel-clock">--:--:-- UTC</div>
    </div>

    <!-- ANALYTICS GRID -->
    <div class="analytics-grid">
      <div class="radar-panel">
        <div class="rp-title">AXIS RADAR -- MATRIX INTELLIGENCE</div>
        <canvas id="radar-cv" width="400" height="400" style="width:200px;height:200px"></canvas>
      </div>
      <div class="metrics-panel">
        <div class="metrics-row" id="metrics-row"></div>
        <div>
          <div style="font-family:var(--M);font-size:8px;letter-spacing:3px;color:var(--muted);margin-bottom:8px">LIVE DATA STREAM -- AGENT MESH BROADCAST</div>
          <div class="stream-container">
            <div id="stream-inner"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- AGENT LOGS -->
    <div class="sechead">AGENT EXECUTION LOGS</div>
    <div class="pad"><div class="agent-log" id="agent-log"></div></div>

    <!-- DIMENSION VIEWER -->
    <div class="sechead">9 DIMENSION VIEWER -- MATRIX AXES</div>
    <div class="pad"><div class="dim-grid" id="dim-grid"></div></div>
  </main>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient("https://ydqhzvvoyufiiqvzcjns.supabase.co","sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q");

/* LIVE CLOCK */
setInterval(()=>{
  const n=new Date();
  const t=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+':'+n.getSeconds().toString().padStart(2,'0');
  const el=document.getElementById('intel-clock');if(el) el.textContent=t+' UTC';
},1000);

const DIMENSIONS=[
  {n:1,name:'KNOWLEDGE',desc:'Information absorption and learning velocity across Academy and Research modules.',col:'#00E5FF'},
  {n:2,name:'MASTERY',desc:'Performance and achievement metrics from Gaming Arena and exam completions.',col:'#E86A3A'},
  {n:3,name:'CONTRIBUTION',desc:'Value generated for the Order through social, creative, and economic outputs.',col:'#3fb27f'},
  {n:4,name:'RESONANCE',desc:'Alignment of your matrix coordinates with the 9.1717Hz sovereign frequency.',col:'#C9A84C'},
  {n:5,name:'LINEAGE',desc:'Depth of family constellation, heritage archive completions, and bloodline nodes.',col:'#D9B86A'},
  {n:6,name:'ECONOMY',desc:'Token balances, marketplace activity, investment allocations, and portfolio growth.',col:'#E2C86D'},
  {n:7,name:'CELESTIAL',desc:'Zodiac alignment accuracy, horoscope engagement, and Oracle prediction validation.',col:'#9B6BF0'},
  {n:8,name:'SOVEREIGNTY',desc:'Overall governance participation, compliance score, and constitutional adherence.',col:'#C9A84C'},
  {n:9,name:'OMEGA',desc:'The master dimension. Composite authority across all eight axes. The apex metric.',col:'#C9A84C'},
];

const AGENTS_LOG=[
  {name:'SENTINEL',col:'#C7CDD6',action:'Zero-trust perimeter scan completed. 0 anomalies detected. Session integrity verified.',time:'00:00'},
  {name:'ANALYST',col:'#34C6E6',action:'Portfolio valuation recalculated. 41% splintering engine active. Investment vectors aligned.',time:'00:01'},
  {name:'ORACLE',col:'#9B6BF0',action:'Daily celestial alignment computed. Horoscope reading dispatched to sovereign members.',time:'00:02'},
  {name:'HISTORIAN',col:'#D9B86A',action:'Heritage archive snapshot created. 5-layer memory stack synchronised with hash-chain.',time:'00:03'},
  {name:'TUTOR',col:'#A9C2D8',action:'Knowledge axis progression tracked. Academy module completion events logged.',time:'00:04'},
  {name:'BEACON',col:'#E86A3A',action:'Onboarding sequences reviewed. New member pathways optimised for fast ascension.',time:'00:05'},
  {name:'WARDEN',col:'#D9B86A',action:'Family constellation integrity verified. Bloodline vault nodes confirmed secure.',time:'00:06'},
  {name:'AUDITOR',col:'#C7CDD6',action:'Certificate hash-chain validated. No counterfeit credentials detected in archive.',time:'00:07'},
  {name:'SOVEREIGN',col:'#C9A84C',action:'Master control loop active. All agents reporting nominal status. Frequency lock: 9.17Hz.',time:'00:08'},
];

function drawRadar(a,b,c){
  const cv=document.getElementById('radar-cv');
  const ctx=cv.getContext('2d');
  let t=0;
  function frame(){
    t+=.015; ctx.clearRect(0,0,400,400);
    const CX=200,CY=200;
    /* Grid rings */
    for(let r=1;r<=9;r++){
      ctx.beginPath(); ctx.arc(CX,CY,r*18,0,Math.PI*2);
      ctx.strokeStyle='rgba(201,168,76,'+(r===9?'0.25':'0.07')+')'; ctx.lineWidth=r===9?1:.5; ctx.stroke();
    }
    /* Axis lines */
    for(let i=0;i<3;i++){
      const angle=-Math.PI/2+i*(Math.PI*2/3);
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+Math.cos(angle)*162,CY+Math.sin(angle)*162);
      ctx.strokeStyle='rgba(201,168,76,0.15)'; ctx.lineWidth=.8; ctx.stroke();
    }
    /* Data polygon */
    const pts=[[a/9*162,-Math.PI/2],[b/9*162,-Math.PI/2+(Math.PI*2/3)],[c/9*162,-Math.PI/2+(Math.PI*4/3)]];
    ctx.beginPath();
    pts.forEach((p,i)=>{const ax=CX+Math.cos(p[1])*p[0],ay=CY+Math.sin(p[1])*p[0];i===0?ctx.moveTo(ax,ay):ctx.lineTo(ax,ay);});
    ctx.closePath();
    const g=ctx.createRadialGradient(CX,CY,0,CX,CY,162);
    g.addColorStop(0,'rgba(201,168,76,0.3)'); g.addColorStop(1,'rgba(201,168,76,0.05)');
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(201,168,76,0.7)'; ctx.lineWidth=1.5; ctx.shadowColor='rgba(201,168,76,.4)'; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;
    /* Axis labels */
    [['A\nKNOWLEDGE','#00E5FF',-Math.PI/2],['B\nMASTERY','#E86A3A',-Math.PI/2+(Math.PI*2/3)],['C\nCONTRIBUTION','#3fb27f',-Math.PI/2+(Math.PI*4/3)]].forEach(l=>{
      const ax=CX+Math.cos(l[2])*178,ay=CY+Math.sin(l[2])*178;
      ctx.fillStyle=l[1]; ctx.font='700 9px "Courier Prime",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(l[0].split('\n')[0],ax,ay-6); ctx.fillStyle='rgba(133,131,123,0.7)'; ctx.font='7px "Courier Prime",monospace'; ctx.fillText(l[0].split('\n')[1],ax,ay+5);
    });
    requestAnimationFrame(frame);
  }
  frame();
}

function buildStream(a,b,c){
  const logs=[];
  const t=new Date();
  for(let i=0;i<24;i++){
    const types=['[INFO]','[SYNC]','[AUTH]','[EXEC]','[DATA]'];
    const msgs=['Matrix node event processed','Frequency lock maintained: 9.17Hz','Agent mesh handshake verified','Knowledge axis event +0.25','Contribution vector updated',`Authority score: ${Math.sqrt(a*a+b*b+c*c).toFixed(3)}`,'Supabase sync completed','Cache invalidated -- fresh data loaded','PQC handshake verified (FIPS 208)'];
    const type=types[i%5]; const msg=msgs[i%msgs.length];
    const h=(t.getHours()-Math.floor(i/4)).toString().padStart(2,'0');
    const m=(t.getMinutes()-i%4*15+60)%60;
    logs.push(`<div style="opacity:${1-i*.04}">${h}:${m.toString().padStart(2,'0')} <span style="color:var(--gold)">${type}</span> ${msg}</div>`);
  }
  // Duplicate for seamless loop
  const all=[...logs,...logs];
  const el=document.getElementById('stream-inner');
  if(el) el.innerHTML=all.join('');
}

function buildMetrics(a,b,c,tasks){
  const auth=Math.sqrt(a*a+b*b+c*c);
  const nodes=Math.round(a*b*c*9);
  const g=document.getElementById('metrics-row'); g.innerHTML='';
  [
    {l:'AUTHORITY',v:auth.toFixed(2),col:'#C9A84C',trend:'+0.25 today'},
    {l:'MATRIX NODES',v:nodes,col:'#00E5FF',trend:'Active'},
    {l:'KNOWLEDGE A',v:a.toFixed(1),col:'#00E5FF',trend:'Axis A'},
    {l:'MASTERY B',v:b.toFixed(1),col:'#E86A3A',trend:'Axis B'},
    {l:'CONTRIBUTION C',v:c.toFixed(1),col:'#3fb27f',trend:'Axis C'},
    {l:'TASKS COMPLETE',v:tasks,col:'#E2C86D',trend:'All time'},
  ].forEach(m=>{
    const card=document.createElement('div'); card.className='metric-card'; card.style.setProperty('--col',m.col);
    card.innerHTML=`<div class="mc-label">${m.l}</div><div class="mc-val" style="color:${m.col}">${m.v}</div><div class="mc-trend" style="color:var(--muted)">${m.trend}</div>`;
    g.appendChild(card);
  });
}

function buildAgentLog(){
  const g=document.getElementById('agent-log'); g.innerHTML='';
  const now=new Date();
  AGENTS_LOG.forEach((al,i)=>{
    const d=document.createElement('div'); d.className='al-entry';
    const t=new Date(now-i*47000);
    const ts=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    d.innerHTML=`<div class="ale-time">${ts} UTC</div><div class="ale-dot" style="background:${al.col};color:${al.col}"></div><div class="ale-body"><div class="alb-agent" style="color:${al.col}">${al.name} AGENT</div><div class="alb-action">${al.action}</div></div>`;
    g.appendChild(d);
  });
}

function buildDimensions(a,b,c){
  const auth=Math.sqrt(a*a+b*b+c*c);
  const g=document.getElementById('dim-grid'); g.innerHTML='';
  DIMENSIONS.forEach((dim,i)=>{
    const vals=[a/9,b/9,c/9,auth/15.58,Math.random()*.5+.3,Math.random()*.4+.2,auth/20,auth/15,auth/15.58];
    const pct=Math.round(vals[i]*100);
    const c2=document.createElement('div'); c2.className='dim-card';
    c2.style.borderTopColor=dim.col+'55';
    c2.innerHTML=`<div class="dc-n" style="color:${dim.col}">${dim.n}</div><div class="dc-name" style="color:${dim.col}">${dim.name}</div><div class="dc-desc">${dim.desc}</div><div class="dc-bar-wrap"><div class="dc-bar" style="width:0%;background:linear-gradient(90deg,${dim.col},${dim.col}55)"></div></div><div class="dc-val" style="color:${dim.col}">${pct}% ACTIVE</div>`;
    g.appendChild(c2);
    setTimeout(()=>c2.querySelector('.dc-bar').style.width=pct+'%',200+i*80);
  });
}

async function boot(){
  const sess=(await sb.auth.getSession()).data.session;
  if(!sess){window.location.href='/account.html';return;}
  const pr=await sb.from('profiles').select('axis_a,axis_b,axis_c').eq('id',sess.user.id).maybeSingle();
  const a=parseFloat(pr.data?.axis_a)||1,b=parseFloat(pr.data?.axis_b)||1,c=parseFloat(pr.data?.axis_c)||1;
  const {count:tasks}=await sb.from('task_completions').select('*',{count:'exact',head:true}).eq('user_id',sess.user.id);
  buildMetrics(a,b,c,tasks||0);
  buildStream(a,b,c);
  buildAgentLog();
  buildDimensions(a,b,c);
  requestAnimationFrame(()=>drawRadar(a,b,c));
}
boot();
</script>
<script src="/nav.js"></script><script src="/bg.js"></script>
</body>
</html>
