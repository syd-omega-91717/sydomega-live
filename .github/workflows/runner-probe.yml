# Manual canary for the optional registered Windows runner.
# It is intentionally not a push gate: a disconnected self-hosted runner must
# never block production CI or deployment verification.
name: Runner Probe

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: python

jobs:
  self-hosted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove runner execution
        run: |
          import os, sys
          required = ("RUNNER_NAME", "RUNNER_OS", "RUNNER_ARCH")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("::error::missing runner identity: " + ", ".join(missing))
              sys.exit(1)
          print("runner=" + os.environ["RUNNER_NAME"])
          print("runner_os=" + os.environ["RUNNER_OS"])
          print("runner_arch=" + os.environ["RUNNER_ARCH"])
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Real repository check
        run: python scripts/workflow-contract.py
      - name: Execution marker
        run: |
          import os
          print("RUNNER_PROBE_EXECUTED=true")
          print("RUNNER_PROBE_RUN_ID=" + os.environ.get("GITHUB_RUN_ID", ""))
          print("RUNNER_PROBE_RUN_ATTEMPT=" + os.environ.get("GITHUB_RUN_ATTEMPT", ""))
