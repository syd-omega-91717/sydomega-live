name: Workflow Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-contract:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_OS:-}"
          test -n "${RUNNER_ARCH:-}"
          echo "runner=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "run=${GITHUB_RUN_ID}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workflow contracts
        run: python scripts/workflow-contract.py
      - name: Validate architecture contract
        run: python scripts/architecture-contract.py
      - name: Validate implementation readiness
        run: python scripts/architecture-readiness.py
      - name: Validate local production gate help path
        shell: bash
        run: bash scripts/ci-local.sh --help
      - name: Execution marker
        run: |
          test -n "${RUNNER_NAME:-}"
          echo 'WORKFLOW_CONTRACT_EXECUTED=true'
          echo "WORKFLOW_CONTRACT_RUN_ID=${GITHUB_RUN_ID}"
          echo "WORKFLOW_CONTRACT_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
