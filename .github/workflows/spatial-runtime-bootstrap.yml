name: Ω Spatial Runtime Bootstrap
on:
  push:
    branches:
      - fix/spatial-runtime-bootstrap
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omega-spatial-runtime-bootstrap
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node scripts/integrate-spatial-realms.js
      - run: node --check omega-spatial-realms.js && node --check scripts/integrate-spatial-realms.js
      - run: |
          grep -q 'src="/omega-spatial-realms.js"' gaming.html
          grep -q 'src="/omega-spatial-realms.js"' cinema.html
          grep -q 'data-omega-spatial-realm="gaming"' gaming.html
          grep -q 'data-omega-spatial-realm="cinema"' cinema.html
      - name: Commit materialized bootstrap
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gaming.html cinema.html
          git commit -m 'fix(spatial): bootstrap gaming and cinema realm runtime'
          git push
