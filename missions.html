<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>&#937; SYD OMEGA 91717 &mdash; Missions</title>
<style>
/* DAY PROGRESS */
.day-progress{background:rgba(201,168,76,.04);border:1px solid rgba(201,168,76,.12);border-radius:3px;padding:12px 16px;margin-bottom:12px}
.dp-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dp-title{font-family:var(--M);font-size:12px;letter-spacing:2px;color:rgba(201,168,76,.5)}
.dp-pct{font-family:var(--M);font-size:14px;color:var(--gold)}
.dp-bar-wrap{height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden}
.dp-bar{height:100%;background:linear-gradient(90deg,var(--gold),rgba(201,168,76,.6));border-radius:3px;transition:width 1s ease}
.dp-xp{font-family:var(--M);font-size:12px;color:var(--muted);margin-top:5px;text-align:right}

/* MISSION CARD */
.missions-list{display:flex;flex-direction:column;gap:10px}
.mission-card{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.12);border-radius:4px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;transition:.15s;position:relative;overflow:hidden}
.mission-card:hover:not(.completed){border-color:rgba(201,168,76,.3)}
.mission-card.completed{border-color:rgba(0,255,136,.2);background:rgba(0,255,136,.02)}
.mission-card.completed::after{content:'COMPLETE';position:absolute;top:8px;right:12px;font-family:var(--M);font-size:12px;letter-spacing:1.5px;color:var(--green)}
.mission-card.legendary-card{border-color:rgba(155,89,182,.25);background:rgba(155,89,182,.02)}
.mc-icon{font-size:26px;flex-shrink:0;line-height:1;margin-top:2px}
.mc-body{flex:1;min-width:0}
.mc-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.mc-title{font-family:var(--M);font-size:12px;color:rgba(255,255,255,.9);letter-spacing:.4px}
.mc-tier{font-family:var(--M);font-size:12px;letter-spacing:1.5px;padding:2px 8px;border-radius:1px;border:1px solid}
.mc-tier.daily{color:rgba(201,168,76,.7);border-color:rgba(201,168,76,.2);background:rgba(201,168,76,.05)}
.mc-tier.weekly{color:rgba(0,229,255,.7);border-color:rgba(0,229,255,.2);background:rgba(0,229,255,.05)}
.mc-tier.legendary{color:rgba(155,89,182,.8);border-color:rgba(155,89,182,.25);background:rgba(155,89,182,.05)}
.mc-desc{font-family:var(--M);font-size:12px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:8px}
.mc-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.mc-xp{font-family:var(--M);font-size:12px;color:var(--gold)}
.mc-element{font-family:var(--M);font-size:12px;color:var(--muted)}
.mc-time{font-family:var(--M);font-size:12px;color:var(--muted)}
.mc-action{font-family:var(--M);font-size:12px;letter-spacing:1.5px;padding:5px 14px;border:1px solid rgba(201,168,76,.25);color:var(--gold);background:none;border-radius:2px;cursor:pointer;transition:.12s;flex-shrink:0;margin-left:auto}
.mc-action:hover{background:rgba(201,168,76,.1);border-color:var(--gold)}
.mc-action.done{border-color:rgba(0,255,136,.2);color:var(--green);cursor:default}
.mc-progress{height:2px;background:rgba(255,255,255,.04);border-radius:1px;overflow:hidden;margin-top:8px}
.mc-progress-fill{height:100%;background:var(--gold);border-radius:1px;transition:width .5s ease}

/* HISTORY */
.hist-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:2px;margin-bottom:6px}
.hi-icon{font-size:14px}
.hi-title{font-family:var(--M);font-size:12px;color:rgba(255,255,255,.7);flex:1}
.hi-xp{font-family:var(--M);font-size:12px;color:var(--gold)}
.hi-date{font-family:var(--M);font-size:12px;color:var(--muted)}

/* HEATMAP */
.heatmap-wrap{overflow-x:auto;padding-bottom:4px}
.heatmap{display:flex;gap:3px;align-items:flex-end;min-width:400px}
.hm-cell{width:12px;height:12px;border-radius:1px;transition:.15s;cursor:pointer;flex-shrink:0}
.hm-cell:hover{transform:scale(1.3)}

.empty{text-align:center;padding:32px;font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted)}
.oms{margin:12px 0 18px;padding:16px;border:1px solid rgba(201,168,76,.16);background:rgba(10,10,15,.6);border-radius:4px}.oms-title{font-family:var(--M);font-size:12px;letter-spacing:2px;color:rgba(201,168,76,.7);margin-bottom:8px}.oms-status{display:inline-block;font-family:var(--M);font-size:12px;letter-spacing:1.5px;padding:3px 8px;border:1px solid rgba(201,168,76,.2);color:var(--gold)}.oms-status[data-state="LIVE"]{color:var(--green);border-color:rgba(0,255,136,.25)}.oms-status[data-state="PARTIAL"]{color:var(--gold)}.oms-status[data-state="UNAVAILABLE"]{color:var(--muted)}.oms-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.oms-card{padding:10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}.oms-card b{display:block;font-family:var(--D);font-size:20px;color:var(--gold)}.oms-card span{font-family:var(--M);font-size:12px;color:var(--muted);letter-spacing:1px}.oms-note{font-family:var(--M);font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 0}@media(max-width:700px){.oms-grid{grid-template-columns:1fr}}
#msn-toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(4,4,12,.97);border:1px solid rgba(201,168,76,.3);border-radius:3px;padding:10px 24px;font-family:var(--M);font-size:12px;letter-spacing:1.5px;color:var(--gold);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.xp-popup{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);font-family:var(--M);font-size:22px;color:var(--gold);z-index:9999;opacity:0;pointer-events:none;text-shadow:0 0 20px rgba(201,168,76,.5);transition:opacity .4s,transform .4s}
</style>
</head>
<body>
<aside id="omega-side" data-page="missions"></aside>
<div class="page-shell" id="app" style="display:none">

<header class="topbar">
  <div class="topbar-title">MISSION BOARD<span class="topbar-sub">DAILY &middot; WEEKLY &middot; LEGENDARY</span></div>
  <canvas data-omega-ring data-ring-size="40" data-ring-color="gold" data-ring-value="0" data-ring-live aria-label="Authority ring"></canvas>
</header>

<div class="tab-bar">
  <button class="tab-btn active" onclick="setTab('missions')">&#9685; MISSIONS</button>
  <button class="tab-btn" onclick="setTab('weekly')">&#9672; WEEKLY</button>
  <button class="tab-btn" onclick="setTab('progress')">&#9733; PROGRESS</button>
  <button class="tab-btn" onclick="setTab('science')">&#9670; SCIENCE</button>
</div>

<!-- MISSIONS TAB (daily) -->
<div class="tab-panel active" id="tab-missions">
  <div class="kpi-row" data-stagger data-stagger-gap="70">
    <div class="kpi-card" data-reveal="fade-up"><div class="kpi-val" id="missionActiveCount">0</div><div class="kpi-label">ACTIVE DEFINITIONS</div></div>
    <div class="kpi-card" data-reveal="fade-up"><div class="kpi-val" id="missionRunningCount">0</div><div class="kpi-label">RUNNING</div></div>
    <div class="kpi-card" data-reveal="fade-up"><div class="kpi-val" id="missionCompletedCount">0</div><div class="kpi-label">COMPLETED</div></div>
    <div class="kpi-card" data-reveal="fade-up"><div class="kpi-val" id="missionEvidenceCount">0</div><div class="kpi-label">EVIDENCE EVENTS</div></div>
  </div>
  <div class="day-progress" style="display:none"></div>
  <div class="oms" id="missionReality" data-omega-mission-state></div>
  <div class="missions-list" id="dailyList"></div>
</div>

<!-- WEEKLY TAB -->
<div class="tab-panel" id="tab-weekly">
  <div class="missions-list" id="weeklyList"></div>
  <div style="margin-top:16px;font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:8px">&#9670; LEGENDARY QUESTS</div>
  <div class="missions-list" id="legendaryList"></div>
</div>

<!-- PROGRESS TAB -->
<div class="tab-panel" id="tab-progress">
  <div style="font-family:var(--M);font-size:12px;letter-spacing:2.5px;color:rgba(201,168,76,.5);margin-bottom:12px">&#9670; MISSION HISTORY</div>
  <div id="historyList"></div>
  <div style="font-family:var(--M);font-size:12px;letter-spacing:2.5px;color:rgba(201,168,76,.5);margin:16px 0 12px">&#9670; 90-DAY ACTIVITY MAP</div>
  <div class="heatmap-wrap"><div class="heatmap" id="heatmapGrid"></div></div>
</div>

<!-- SCIENCE TAB -->
<div class="tab-panel" id="tab-science">
  <div class="sechead">MISSION SCIENCE — LIVE CONTRACT</div><div id="scienceLive"></div>
  <div class="kpi-row" data-stagger data-stagger-gap="70">
    <div class="kpi-card" data-reveal="fade-up"><div class="kpi-val">7</div><div class="kpi-label">DAILY QUESTS</div></div>
    <div class="kpi-card" data-reveal="fade-up"><div class="kpi-val">5</div><div class="kpi-label">WEEKLY QUESTS</div></div>
    <div class="kpi-card" data-reveal="fade-up"><div class="kpi-val">4</div><div class="kpi-label">LEGENDARY</div></div>
    <div class="kpi-card" data-reveal="fade-up"><div class="kpi-val">365</div><div class="kpi-label">HISTORY LIMIT</div></div>
  </div>
  
</div>

</div><!-- end page-shell -->
<div id="msn-toast"></div>
<div class="xp-popup" id="xpPopup"><div data-page-emblem="missions" style="margin:20px auto 0"></div>
</div>

<script>
function setTab(name){
  var tabs=['missions','weekly','progress','science'];
  document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active',tabs[i]===name);});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='tab-'+name);});
  if(name==='progress') renderHeatmap();
}
</script>

<script type="module">import "/omega-mission-board.js";</script>
<script src="/bg.js" defer></script>
<script src="/omega-sparkline.js" defer></script>
<script type="module" src="/omega-analytics-init.js"></script><script type="module" src="/omega-speed-insights-init.js"></script><script src="/omega-mission-state.js" defer></script>
</body></html>
