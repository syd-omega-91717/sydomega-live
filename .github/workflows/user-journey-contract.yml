name: User Journey Contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: user-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate journeys
        shell: pwsh
        run: python scripts/user-journey-contract.py
