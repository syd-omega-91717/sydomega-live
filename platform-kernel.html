<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ω SYD OMEGA 91717 — Platform Kernel</title><link rel="stylesheet" href="/omega-visual-universe.css"><link rel="stylesheet" href="/omega-cinematic-system.css"><script src="/bg.js" defer></script><script src="/omega-platform-kernel.js" defer></script><style>main{max-width:1200px;margin:auto;padding:32px 20px 70px}h1{font-family:var(--D);font-weight:400;color:var(--gold);font-size:clamp(30px,5vw,62px)}.label,table{font:12px var(--M);letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0}.card{padding:16px;border:1px solid rgba(201,168,76,.18);background:rgba(201,168,76,.035);border-radius:6px}.n{font:30px var(--D);color:var(--gold)}.ok{color:#3fb27f}.bad{color:#c4453c}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid rgba(201,168,76,.1)}a{color:var(--cyan)}</style></head><body><main><div class="label">Ω PLATFORM KERNEL / TRUTH SURFACE</div><h1>PLATFORM KERNEL</h1><p>Canonical capabilities, layers and browser-observed route health. Unknown remains unknown.</p><div class="grid"><div class="card"><div class="label">KERNEL</div><div class="n" id="state">CHECKING</div></div><div class="card"><div class="label">CAPABILITIES</div><div class="n" id="count">—</div></div><div class="card"><div class="label">OBSERVED ROUTES</div><div class="n" id="routes">—</div></div><div class="card"><div class="label">ERRORS</div><div class="n" id="errors">—</div></div></div><section class="card"><div class="label">CAPABILITY CONTRACT</div><table><thead><tr><th>ID</th><th>DOMAIN</th><th>STATE</th><th>ROUTE</th></tr></thead><tbody id="caps"><tr><td colspan="4">Loading…</td></tr></tbody></table></section><p><a href="/control-center.html">OPEN CONTROL CENTER →</a></p></main><script>(function(){function render(s){var c=s.capabilities||[],a=s.assets||[],e=s.errors||[];document.getElementById('state').textContent=s.ready?'READY':'ERROR';document.getElementById('state').className=s.ready?'ok':'bad';document.getElementById('count').textContent=c.length;document.getElementById('routes').textContent=a.filter(function(x){return x.ok;}).length+'/'+a.length;document.getElementById('errors').textContent=e.length;document.getElementById('caps').innerHTML=c.map(function(x){return '<tr><td>'+x.id+'</td><td>'+x.domain+'</td><td>'+x.state+'</td><td class="'+(x.route_observed?'ok':'bad')+'">'+(x.route_observed?'OBSERVED':'UNVERIFIED')+'</td></tr>';}).join('');}document.addEventListener('omega:kernel',function(e){render(e.detail.payload||{});});setTimeout(function(){if(window.OmegaPlatformKernel)OmegaPlatformKernel.check().then(render);},300);}());</script></body></html>
