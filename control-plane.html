<!DOCTYPE html> <html lang=en> <head> <meta charset=UTF-8> <meta name=viewport content=width=device-width,initial-scale=1> <title>OMEGA CONTROL PLANE · SYD OMEGA 91717</title> <meta name=description content=Operational brain of the SYD OMEGA platform. System health, content inventory, duplicate detection, realm analytics.> <link rel=manifest href=/manifest.json> <script src=/bg.js defer></script> <script src=/omega-control-plane.js defer></script> <style> :root{--gold:#C9A84C;--dim:rgba(201,168,76,.15);--crim:#8b0000;--green:#3fb27f;--cyan:#00E5FF;--purple:#9B6BF0;--solar:#E2C86D;--muted:rgba(138,134,118,.5);--ink:rgba(220,210,180,.8);--M:monospace;--D:serif;--R:sans-serif;--pad:clamp(14px,3vw,36px)} *{box-sizing:border-box;margin:0;padding:0} body{background:#020206;color:var(--ink);font-family:var(--R);line-height:1.6} .shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh} .side{background:rgba(201,168,76,.03);border-right:1px solid var(--dim);padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto} .main{min-width:0} .topbar{display:flex;align-items:center;padding:14px var(--pad);border-bottom:1px solid var(--dim);background:rgba(2,2,6,.8);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10} .t{font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--gold)} .t small{display:block;font-size:12px;color:var(--muted);letter-spacing:1.5px;margin-top:2px} .pad{padding:20px var(--pad)} .sechead{font-family:var(--M);font-size:12px;letter-spacing:2.5px;color:var(--muted);margin:24px 0 12px} .glass{background:rgba(201,168,76,.04);border:1px solid var(--dim);border-radius:4px} .kpi{padding:14px 16px} .kpi-n{font-family:var(--D);font-size:clamp(22px,3vw,32px);color:var(--gold);line-height:1} .kpi-l{font-family:var(--M);font-size:12px;letter-spacing:1.5px;color:var(--muted);margin-top:6px} .tab-bar{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--dim);padding-bottom:8px;flex-wrap:wrap} .tab-btn{font-family:var(--M);font-size:12px;letter-spacing:1.2px;padding:6px 14px;background:none;border:1px solid transparent;border-radius:2px;color:var(--muted);cursor:pointer;transition:.12s} .tab-btn.active{color:var(--gold);border-color:var(--dim)} .tab-pane{display:none}.tab-pane.active{display:block} .page-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid rgba(201,168,76,.06);transition:.1s} .page-row:hover{background:rgba(201,168,76,.04)} .page-emblem{font-family:var(--D);font-size:18px;color:var(--gold);width:28px;text-align:center;flex-shrink:0} .page-info{flex:1;min-width:0} .page-title{font-family:var(--M);font-size:12px;color:var(--ink);letter-spacing:1px} .page-meta{font-family:var(--M);font-size:12px;color:var(--muted);margin-top:2px} .page-badge{font-family:var(--M);font-size:12px;padding:2px 8px;border-radius:2px;border:1px solid rgba(201,168,76,.2);color:var(--muted);white-space:nowrap} .page-badge.warning{border-color:rgba(139,0,0,.4);color:var(--crim)} .page-badge.ok{border-color:rgba(63,178,127,.4);color:var(--green)} .search-input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--dim);border-radius:2px;padding:8px 12px;color:var(--ink);font-family:var(--M);font-size:12px;margin-bottom:12px;outline:none} .search-input:focus{border-color:rgba(201,168,76,.4)} .realm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0} .skip-link{position:absolute;left:-9999px}.skip-link:focus{left:8px;top:8px;background:var(--gold);color:#000;padding:4px 8px;font-family:var(--M);font-size:12px;z-index:1000} @media(max-width:800px){.shell{grid-template-columns:1fr}.side{display:none}} </style> </head> <body> <a href=#main-content class=skip-link>SKIP TO CONTENT</a> <div class=shell> <aside class=side id=omega-side data-page=control-plane aria-label=Navigation></aside> <main class=main role=main id=main-content> <div class=topbar> <div class=t>OMEGA CONTROL PLANE<small>SYSTEM HEALTH · CONTENT INVENTORY · OPERATIONAL ANALYTICS · SYD OMEGA 91717</small></div> <span style=font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--gold);margin-left:auto id=live-clock>--:--:--</span> </div> <div class=pad> <div style=font-family:var(--M);font-size:12px;letter-spacing:3px;color:var(--muted);margin-bottom:4px>OPERATIONS · INTELLIGENCE</div> <h1 style=font-family:var(--M);font-size:18px;color:var(--gold);margin:0 0 16px;letter-spacing:2px>OMEGA CONTROL PLANE</h1> <div data-omega-control-dashboard></div> <div class=sechead>NAVIGATION · CONTROL TABS</div> <div class=tab-bar role=tablist> <button class=tab-btn active data-tab=inventory role=tab>◈ INVENTORY</button> <button class=tab-btn data-tab=realms role=tab>◈ REALMS</button> <button class=tab-btn data-tab=motion role=tab>◈ MOTION</button> <button class=tab-btn data-tab=duplicates role=tab>◈ DUPLICATES</button> <button class=tab-btn data-tab=audit role=tab>◈ AUDIT</button> </div> <div class=tab-pane active id=tab-inventory> <input type=text class=search-input id=pageSearch placeholder=Search pages by name, purpose, character... oninput=filterPages()> <div id=page-list></div> </div> <div class=tab-pane id=tab-realms> <div id=realm-visualization></div> </div> <div class=tab-pane id=tab-motion> <div id=motion-visualization></div> </div> <div class=tab-pane id=tab-duplicates> <div id=duplicate-report></div> </div> <div class=tab-pane id=tab-audit> <div id=audit-report></div> </div> </div> <div data-page-emblem="control-plane" style="margin:20px auto 0"></div>
</main> </div> <script> function updateClock(){var d=new Date();document.getElementById('live-clock').textContent=d.toLocaleTimeString('en-GB',{hour12:false})+' UTC';} setInterval(updateClock,1000);updateClock(); function switchTab(id,btn){document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');} document.querySelectorAll('.tab-btn').forEach(btn=>{btn.addEventListener('click',()=>switchTab(btn.dataset.tab,btn));}); document.addEventListener('omega:control-plane-ready',function(){renderInventory();renderRealms();renderMotion();renderDuplicates();renderAudit();}); function renderInventory(){var cp=window.OmegaControlPlane;if(!cp)return;var list=document.getElementById('page-list');if(!list)return;var entries=Object.entries(cp.registry).sort((a,b)=>a[0].localeCompare(b[0])); list.innerHTML=entries.map(([key,page])=>{ var status=page.emblem&&page.related&&page.related.length?'ok':'warning'; var statusText=status==='ok'?'COMPLETE':'INCOMPLETE'; return '<div class=page-row data-key='+key+' data-purpose=”'+page.purpose+'” data-character=”'+page.character+'”><div class=page-emblem>'+(page.emblem||'◈')+'</div><div class=page-info><div class=page-title>'+key.toUpperCase()+'</div><div class=page-meta>'+page.purpose+' · '+page.character+' · '+page.realm+' · Motion L'+page.motion+'</div></div><span class=”page-badge '+status+'”>'+statusText+'</span></div>';}).join(''); window._pageEntries=entries; } function filterPages(){var q=document.getElementById('pageSearch').value.toLowerCase();document.querySelectorAll('.page-row').forEach(row=>{ var key=row.dataset.key,purpose=row.dataset.purpose,character=row.dataset.character; var match=(key&&key.includes(q))||(purpose&&purpose.includes(q))||(character&&character.includes(q)); row.style.display=match?'flex':'none'; }); } function renderRealms(){var cp=window.OmegaControlPlane;if(!cp)return;var el=document.getElementById('realm-visualization');if(!el)return;var stats=cp.realms(); var max=Math.max(...Object.values(stats)); el.innerHTML='<div style=display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px>'+Object.entries(stats).sort((a,b)=>b[1]-a[1]).map(([name,count])=>{ var pct=Math.round((count/max)*100); var colors={command:'var(--gold)',identity:'var(--cyan)',ascend:'var(--green)',cosmos:'var(--purple)',universe:'var(--crim)',vault:'var(--solar)',order:'var(--gold)',services:'#3fb27f',intel:'var(--cyan)',govern:'var(--muted)',arena:'#E86A3A'}; return '<div class=glass style=padding:14px><div style=display:flex;align-items:center;gap:10px;margin-bottom:8px><div class=realm-dot style=background:'+(colors[name]||'var(--gold)')+'></div><span style=font-family:var(--M);font-size:12px;letter-spacing:1px;color:var(--ink)>'+name.toUpperCase()+'</span><span style=font-family:var(--M);font-size:12px;color:var(--gold);margin-left:auto>'+count+'</span></div><div style=width:100%;height:4px;background:rgba(201,168,76,.1);border-radius:2px><div style=width:'+pct+'%;height:100%;background:'+(colors[name]||'var(--gold)')+';border-radius:2px;transition:width .6s></div></div></div>';}).join('')+'</div>'; } function renderMotion(){var cp=window.OmegaControlPlane;if(!cp)return;var el=document.getElementById('motion-visualization');if(!el)return;var stats=cp.motion(); var labels=['STATIC','MICRO','ANIMATED','3D','CINEMATIC','WORLD']; var colors=['var(--muted)','var(--green)','var(--cyan)','var(--purple)','var(--solar)','var(--gold)']; var total=stats.reduce((a,b)=>a+b,0); el.innerHTML='<div style=display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px>'+stats.map((count,i)=>{ var pct=total?Math.round((count/total)*100):0; return '<div class=glass style=padding:14px><div style=font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:6px>LEVEL '+i+' — '+labels[i]+'</div><div style=font-family:var(--D);font-size:clamp(20px,3vw,28px);color:'+colors[i]+'>'+count+'</div><div style=width:100%;height:3px;background:rgba(201,168,76,.08);border-radius:2px;margin-top:8px><div style=width:'+pct+'%;height:100%;background:'+colors[i]+';border-radius:2px;transition:width .6s></div></div><div style=font-family:var(--M);font-size:12px;color:var(--muted);margin-top:4px>'+pct+'% of platform</div></div>';}).join('')+'</div>'; } function renderDuplicates(){var cp=window.OmegaControlPlane;if(!cp)return;var el=document.getElementById('duplicate-report');if(!el)return;var dups=cp.duplicates(); var html=''; if(dups.purpose.length===0&&dups.action.length===0){ html='<div class=glass style=padding:20px;text-align:center><div style=font-family:var(--D);font-size:24px;color:var(--green)>✦ CLEAN</div><div style=font-family:var(--M);font-size:12px;color:var(--muted);margin-top:8px>NO DUPLICATE PURPOSES OR ACTIONS DETECTED</div></div>'; }else{ html='<div style=display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px>'; if(dups.purpose.length){ html+='<div class=glass style=padding:16px><div style=font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--crim);margin-bottom:10px>PURPOSE DUPLICATES</div>'+dups.purpose.map(([k1,k2,val])=>'<div style=padding:6px 0;border-bottom:1px solid rgba(139,0,0,.1)><span style=font-family:var(--M);font-size:12px;color:var(--crim)>'+val+'</span><div style=font-family:var(--M);font-size:12px;color:var(--muted);margin-top:2px>'+k1+' ↔ '+k2+'</div></div>').join('')+'</div>'; } if(dups.action.length){ html+='<div class=glass style=padding:16px><div style=font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--solar);margin-bottom:10px>ACTION DUPLICATES</div>'+dups.action.map(([k1,k2,val])=>'<div style=padding:6px 0;border-bottom:1px solid rgba(226,200,109,.1)><span style=font-family:var(--M);font-size:12px;color:var(--solar)>'+val+'</span><div style=font-family:var(--M);font-size:12px;color:var(--muted);margin-top:2px>'+k1+' ↔ '+k2+'</div></div>').join('')+'</div>'; } html+='</div>'; } el.innerHTML=html; } function renderAudit(){var cp=window.OmegaControlPlane;if(!cp)return;var el=document.getElementById('audit-report');if(!el)return;var entries=Object.entries(cp.registry); var missingEmblem=entries.filter(([,p])=>!p.emblem).map(([k])=>k); var missingRelated=entries.filter(([,p])=>!p.related||!p.related.length).map(([k])=>k); var missingMotion=entries.filter(([,p])=>typeof p.motion!=='number').map(([k])=>k); var html='<div style=display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px>'; html+='<div class=glass style=padding:16px><div style=font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:10px>MISSING EMBLEMS ('+missingEmblem.length+')</div>'+(missingEmblem.length?missingEmblem.map(k=>'<div style=font-family:var(--M);font-size:12px;color:var(--crim);padding:2px 0>● '+k+'</div>').join(''):'<div style=font-family:var(--M);font-size:12px;color:var(--green)>ALL PAGES HAVE EMBLEMS</div>')+'</div>'; html+='<div class=glass style=padding:16px><div style=font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:10px>MISSING RELATED ('+missingRelated.length+')</div>'+(missingRelated.length?missingRelated.map(k=>'<div style=font-family:var(--M);font-size:12px;color:var(--solar);padding:2px 0>● '+k+'</div>').join(''):'<div style=font-family:var(--M);font-size:12px;color:var(--green)>ALL PAGES HAVE RELATED LINKS</div>')+'</div>'; html+='<div class=glass style=padding:16px><div style=font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:10px>MISSING MOTION ('+missingMotion.length+')</div>'+(missingMotion.length?missingMotion.map(k=>'<div style=font-family:var(--M);font-size:12px;color:var(--cyan);padding:2px 0>● '+k+'</div>').join(''):'<div style=font-family:var(--M);font-size:12px;color:var(--green)>ALL PAGES HAVE MOTION LEVELS</div>')+'</div>'; html+='</div>'; el.innerHTML=html; } </script> </body> </html>
