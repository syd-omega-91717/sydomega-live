<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ω SYD OMEGA 91717 — Approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Courier+Prime:wght@400;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --void:#07070b; --panel:#0d0d15; --panel-2:#11111c; --gold:#C9A84C; --solar:#E2C86D; --cyan:#00E5FF; --crimson:#8B0000; --green:#3fb27f; --ink:#e9e6dc; --muted:#85837b; --line:rgba(201,168,76,0.16); --display:'Cinzel Decorative',serif; --body:'Rajdhani',sans-serif; --mono:'Courier Prime',monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 26% 14%,rgba(201,168,76,.07),transparent 42%)}
  a{color:inherit;text-decoration:none}
  .shell{position:relative;z-index:1;display:flex;min-height:100vh}
  .side{width:248px;flex-shrink:0;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,rgba(13,13,21,.6),transparent)}
  .brand{font-family:var(--display);font-weight:900;color:var(--gold);font-size:22px;letter-spacing:1px;text-align:center}
  .brand small{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:4px;margin-top:6px}
  .nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
  .nav a,.nav .lk{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--ink);padding:11px 12px;border-left:2px solid transparent;cursor:pointer}
  .nav a:hover{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.04)}
  .nav a.on{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.06)}
  .nav .sec{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin:18px 0 6px 12px}
  .nav .lk{color:var(--muted);cursor:default}
  .nav .lk .ph{font-size:8px;letter-spacing:1px;color:var(--crimson);border:1px solid rgba(139,0,0,.5);padding:2px 5px}
  .side .out{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--cyan);padding:11px 12px;cursor:pointer;border-top:1px solid var(--line)}

  .main{flex:1;min-width:0;padding:24px clamp(16px,3vw,40px) 60px}
  .topbar{border-bottom:1px solid var(--line);padding-bottom:18px}
  .topbar .t{font-family:var(--display);font-weight:700;color:var(--gold);font-size:clamp(18px,3vw,26px);letter-spacing:2px}
  .topbar .t small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:4px}
  .intro{font-weight:300;color:var(--muted);max-width:64ch;margin:20px 0 6px;font-size:15px}
  .sechead{font-family:var(--mono);font-size:11px;letter-spacing:4px;color:var(--cyan);margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);padding:18px}
  .req{border-bottom:1px dashed rgba(201,168,76,.14);padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
  .req:last-child{border-bottom:none}
  .req .info{font-family:var(--mono);font-size:12px;color:var(--ink);line-height:1.7}
  .req .info b{color:var(--gold)} .req .info .e{color:var(--solar)}
  .req .act button{font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:8px 16px;cursor:pointer;border:1px solid}
  .req .act .ap{color:var(--void);background:var(--green);border-color:var(--green)}
  .req .act .rv{color:var(--crimson);background:transparent;border-color:rgba(139,0,0,.6)}
  .empty{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .gate-card{max-width:440px;margin:14vh auto 0;border:1px solid var(--line);background:var(--panel);padding:40px 30px;text-align:center}
  .gate-card .g{font-family:var(--display);font-size:56px;color:var(--gold)}
  .gate-card h2{font-family:var(--display);color:var(--gold);font-weight:700;margin:10px 0}
  .gate-card p{font-weight:300;color:var(--muted);margin-bottom:22px}
  .gate-card a{display:inline-block;font-family:var(--mono);letter-spacing:2px;font-size:12px;color:var(--void);background:var(--gold);padding:14px 26px}
  #app{display:none}
  @media(max-width:760px){ .shell{flex-direction:column} .side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line)} .nav{flex-direction:row;flex-wrap:wrap} .nav .sec,.nav .lk{display:none} }
</style>
</head>
<body>
<div id="gate" class="gate-card" style="display:none">
  <div class="g">Ω</div>
  <h2 id="gate-h">Approvals</h2>
  <p id="gate-p">Owner access only.</p>
  <a href="/dashboard.html">← RETURN TO DASHBOARD</a>
</div>

<div class="shell" id="app">
  <aside class="side" id="omega-side" data-page="approvals"></aside>
  <main class="main">
    <div class="topbar"><div class="t">APPROVALS<small>SOVEREIGN ADMISSION · OWNER</small></div></div>
    <p class="intro">No one becomes active in the Order without your approval. Admit or revoke each sovereign here.</p>

    <div class="sechead">AWAITING APPROVAL</div>
    <div class="card"><div id="pending-list"></div></div>

    <div class="sechead">ADMITTED</div>
    <div class="card"><div id="approved-list"></div></div>

    <div class="sechead">PUBLICATIONS AWAITING APPROVAL</div>
    <div class="card"><div id="pub-list"></div></div>
  </main>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient("https://ydqhzvvoyufiiqvzcjns.supabase.co","sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q");
  function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function showGate(h,p){ document.getElementById('gate-h').textContent=h; document.getElementById('gate-p').textContent=p; document.getElementById('gate').style.display='block'; document.getElementById('app').style.display='none'; }

  async function setApproved(id,val){ await supabase.from('profiles').update({access_approved:val}).eq('id',id); load(); }

  async function load(){
    var pend=await supabase.from('profiles').select('id,email,display_name,sign,access_requested_at').eq('access_approved',false).order('access_requested_at',{ascending:true}).limit(200);
    var pl=document.getElementById('pending-list'); pl.innerHTML='';
    if(!pend.data || !pend.data.length){ pl.innerHTML='<div class="empty">No one is awaiting approval.</div>'; }
    else pend.data.forEach(function(p){
      var when=p.access_requested_at?new Date(p.access_requested_at).toLocaleString():'—';
      var d=document.createElement('div'); d.className='req';
      d.innerHTML='<div class="info"><span class="e">'+esc(p.email||'(no email)')+'</span><br>'+esc(p.display_name||'unnamed')+' · '+esc((p.sign||'no sign'))+' · requested '+when+'</div><div class="act"><button class="ap">APPROVE</button></div>';
      d.querySelector('.ap').addEventListener('click',function(){ setApproved(p.id,true); });
      pl.appendChild(d);
    });

    var appr=await supabase.from('profiles').select('id,email,display_name,sign').eq('access_approved',true).order('email',{ascending:true}).limit(400);
    var al=document.getElementById('approved-list'); al.innerHTML='';
    if(!appr.data || !appr.data.length){ al.innerHTML='<div class="empty">No admitted members yet.</div>'; }
    else appr.data.forEach(function(p){
      var d=document.createElement('div'); d.className='req';
      d.innerHTML='<div class="info"><span class="e">'+esc(p.email||'(no email)')+'</span> · '+esc(p.display_name||'unnamed')+' · '+esc((p.sign||'—'))+'</div><div class="act"><button class="rv">REVOKE</button></div>';
      d.querySelector('.rv').addEventListener('click',function(){ setApproved(p.id,false); });
      al.appendChild(d);
    });
  }

  async function approvePub(id){ await supabase.from('publications').update({status:'approved'}).eq('id',id); loadPubs(); }
  async function loadPubs(){
    var box=document.getElementById('pub-list');
    var r=await supabase.from('publications').select('id,user_id,kind,title,created_at').eq('status','private').order('created_at',{ascending:true}).limit(200);
    box.innerHTML='';
    if(!r.data||!r.data.length){ box.innerHTML='<div class="empty">No works awaiting approval.</div>'; return; }
    r.data.forEach(function(w){
      var when=w.created_at?new Date(w.created_at).toLocaleString():'';
      var d=document.createElement('div'); d.className='req';
      d.innerHTML='<div class="info"><b></b><br>'+esc(w.kind||'')+' · member '+String(w.user_id).slice(0,8)+' · '+when+'</div><div class="act"><button class="ap">APPROVE</button></div>';
      d.querySelector('b').textContent=w.title||'Untitled';
      d.querySelector('.ap').addEventListener('click',function(){ approvePub(w.id); });
      box.appendChild(d);
    });
  }
  async function boot(){
    var sess=(await supabase.auth.getSession()).data.session;
    if(!sess){ showGate('Approvals','Sign in as the owner.'); return; }
    var me=await supabase.from('profiles').select('is_owner').eq('id',sess.user.id).maybeSingle();
    if(!me.data || !me.data.is_owner){ showGate('Owner Only','This chamber is reserved for the Architect.'); return; }
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='flex';
    load(); loadPubs();
  }
  document.getElementById('logout').addEventListener('click',async function(){ await supabase.auth.signOut(); window.location.href='/account.html'; });
  boot();
</script>
<script src="/nav.js"></script>
<script src="/bg.js"></script>
</body>
</html>
