name: Supabase Runtime Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Supabase runtime health
    # WAS [self-hosted, Windows, X64], where this job NEVER RAN. Every run of
    # this workflow sat `queued` and was eventually cancelled by a newer push;
    # not one ever reached a conclusion. The proof is runner-probe.yml, whose
    # only purpose is to prove that runner works: its last runs have been
    # `queued` since 2026-09-05 08:12 and none has started. A gate that never
    # executes is worse than no gate, because the board shows it as pending
    # rather than missing. Everything here is stdlib Python over a checkout,
    # with nothing Windows-specific, so it runs where the other 15 workflows
    # already run and finish in seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # `shell: python` feeds the run: block to the interpreter AS PYTHON
      # SOURCE. With `python scripts/...` as the body that is a SyntaxError on
      # line 1, so this job failed on every run it ever reached -- 28 seconds
      # of checkout and then a parse error, never the contract. runner-probe.yml
      # uses `shell: python` correctly, with real Python in the body; this one
      # wants a shell, so it gets bash -- the native shell on the hosted runner.
      - name: Runtime contract
        shell: bash
        run: python3 scripts/supabase-runtime-contract.py
