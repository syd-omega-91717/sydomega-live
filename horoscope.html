<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>&#937; SYD OMEGA 91717 &mdash; Horoscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Courier+Prime:wght@400;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--void:#07070b;--panel:#0d0d15;--gold:#C9A84C;--solar:#E2C86D;--cyan:#00E5FF;--crimson:#8B0000;--ink:#e9e6dc;--muted:#85837b;--line:rgba(201,168,76,0.16);--display:'Cinzel Decorative',serif;--body:'Rajdhani',sans-serif;--mono:'Courier Prime',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.shell{position:relative;z-index:1;display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,rgba(13,13,21,.6),transparent)}
.main{flex:1;min-width:0;padding:24px clamp(16px,3vw,40px) 80px;max-width:1320px}
.topbar{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.topbar .t{font-family:var(--display);font-weight:700;color:var(--gold);font-size:clamp(18px,3vw,26px);letter-spacing:2px}
.topbar .t small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:4px}
.tabs{display:flex;gap:0;border:1px solid var(--line);margin-bottom:28px;width:fit-content}
.tab{font-family:var(--mono);font-size:10px;letter-spacing:3px;padding:10px 20px;cursor:pointer;border-right:1px solid var(--line);color:var(--muted);transition:all .14s}
.tab:last-child{border-right:none}
.tab.on{color:var(--gold);background:rgba(201,168,76,.08)}
.tab:hover:not(.on){color:var(--ink);background:rgba(201,168,76,.04)}
.two-col{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.featured-card{border:1px solid rgba(201,168,76,.5);background:linear-gradient(180deg,var(--panel),transparent);position:relative;overflow:hidden}
.featured-card .top{display:flex;align-items:center;gap:20px;padding:24px 24px 0}
.featured-card .glyph{font-size:56px;line-height:1;opacity:.9}
.featured-card .sign-info .sign-name{font-family:var(--display);font-size:28px;font-weight:700;color:var(--gold)}
.featured-card .sign-info .date-range{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:4px}
.featured-card .sign-info .element-pill{display:inline-block;font-family:var(--mono);font-size:8px;letter-spacing:2px;padding:3px 10px;border:1px solid;margin-top:8px}
.featured-card .reading-wrap{padding:24px}
.period-label{font-family:var(--mono);font-size:9px;letter-spacing:4px;color:var(--cyan);margin-bottom:12px}
.reading-text{font-size:15px;font-weight:300;line-height:1.85;color:var(--ink)}
.planet-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.planet-pill{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);padding:4px 10px;border:1px solid var(--line)}
.planet-pill b{color:var(--solar)}
.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.score-item{text-align:center}
.score-item .label{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:6px}
.score-bar{height:4px;background:rgba(201,168,76,.12);border-radius:0;overflow:hidden}
.score-fill{height:100%;transition:width .6s;background:var(--gold)}
.score-val{font-family:var(--mono);font-size:11px;color:var(--solar);margin-top:4px}
/* Wheel */
.wheel-panel{border:1px solid var(--line);background:var(--panel);padding:18px}
.wheel-panel h3{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--cyan);margin-bottom:14px}
.sign-wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wheel-sign{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--line);cursor:pointer;transition:all .14s;text-align:center}
.wheel-sign:hover,.wheel-sign.active{border-color:var(--gold);background:rgba(201,168,76,.06)}
.wheel-sign.mine{border-color:rgba(0,229,255,.5);box-shadow:inset 0 0 8px rgba(0,229,255,.1)}
.wheel-sign .ws-glyph{font-size:20px}
.wheel-sign .ws-name{font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--muted)}
/* Planets */
.planet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.planet-item{border:1px solid var(--line);padding:10px 12px}
.planet-item .pname{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--gold)}
.planet-item .psign{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px}
.weekly-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
.day-card{border:1px solid var(--line);padding:10px 8px;text-align:center}
.day-card .day{font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--muted)}
.day-card .score{font-family:var(--display);font-size:18px;color:var(--gold);margin:6px 0}
.day-card .desc{font-size:11px;color:var(--muted);line-height:1.4}
.day-card.today{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.05)}
.loading{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:2px;padding:24px 0}
@media(max-width:960px){.two-col{grid-template-columns:1fr}.shell{flex-direction:column}.side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="shell">
<aside class="side" id="omega-side" data-page="horoscope"></aside>
<main class="main">
<div class="topbar">
  <div class="t">HOROSCOPE<small>CELESTIAL INTELLIGENCE &middot; DAILY &middot; WEEKLY &middot; MONTHLY</small></div>
</div>

<div class="tabs">
  <div class="tab on" data-tab="daily">DAILY</div>
  <div class="tab" data-tab="weekly">WEEKLY</div>
  <div class="tab" data-tab="monthly">MONTHLY</div>
</div>

<div class="two-col">
  <div>
    <div id="featured-wrap"></div>
    <div id="weekly-section" style="display:none;margin-top:24px">
      <div style="font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--cyan);margin-bottom:14px">7-DAY CELESTIAL FORECAST</div>
      <div class="weekly-grid" id="weekly-grid"></div>
    </div>
    <div id="monthly-section" style="display:none;margin-top:24px">
      <div style="font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--cyan);margin-bottom:14px">MONTHLY TRAJECTORY</div>
      <div id="monthly-text" style="font-size:14px;font-weight:300;line-height:1.85;color:var(--muted)"></div>
    </div>
  </div>
  <div>
    <div class="wheel-panel">
      <h3>ALL TWELVE SIGNS</h3>
      <div class="sign-wheel" id="sign-wheel"></div>
      <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--cyan);margin-bottom:10px">TODAY'S PLANETS</div>
        <div class="planet-grid" id="planet-grid"></div>
      </div>
    </div>
  </div>
</div>
</main>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient("https://ydqhzvvoyufiiqvzcjns.supabase.co","sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q");

const SIGNS = [
  {name:'Aries',glyph:'\u2648',dates:'MAR 21 &mdash; APR 19',el:'Fire',col:'#E86A3A',god:'Ares / Athena',planet:'Mars'},
  {name:'Taurus',glyph:'\u2649',dates:'APR 20 &mdash; MAY 20',el:'Metal',col:'#C7CDD6',god:'Aphrodite',planet:'Venus'},
  {name:'Gemini',glyph:'\u264A',dates:'MAY 21 &mdash; JUN 20',el:'Wind',col:'#A9C2D8',god:'Apollo',planet:'Mercury'},
  {name:'Cancer',glyph:'\u264B',dates:'JUN 21 &mdash; JUL 22',el:'Water',col:'#34C6E6',god:'Hermes',planet:'Moon'},
  {name:'Leo',glyph:'\u264C',dates:'JUL 23 &mdash; AUG 22',el:'Fire',col:'#E86A3A',god:'Zeus',planet:'Sun'},
  {name:'Virgo',glyph:'\u264D',dates:'AUG 23 &mdash; SEP 22',el:'Sand',col:'#D9B86A',god:'Demeter / Athena',planet:'Mercury'},
  {name:'Libra',glyph:'\u264E',dates:'SEP 23 &mdash; OCT 22',el:'Wind',col:'#A9C2D8',god:'Hephaestus',planet:'Venus'},
  {name:'Scorpio',glyph:'\u264F',dates:'OCT 23 &mdash; NOV 21',el:'Water',col:'#34C6E6',god:'Ares',planet:'Pluto'},
  {name:'Sagittarius',glyph:'\u2650',dates:'NOV 22 &mdash; DEC 21',el:'Fire',col:'#E86A3A',god:'Artemis',planet:'Jupiter'},
  {name:'Capricorn',glyph:'\u2651',dates:'DEC 22 &mdash; JAN 19',el:'Metal',col:'#C7CDD6',god:'Hestia',planet:'Saturn'},
  {name:'Aquarius',glyph:'\u2652',dates:'JAN 20 &mdash; FEB 18',el:'Wind',col:'#A9C2D8',god:'Hera',planet:'Uranus'},
  {name:'Pisces',glyph:'\u2653',dates:'FEB 19 &mdash; MAR 20',el:'Water',col:'#34C6E6',god:'Poseidon',planet:'Neptune'}
];

const DAILY_READINGS = {
  'Aries':['The sovereign path opens. Your fire cuts through doubt &mdash; act with precision today, for Mars amplifies every decision you make. A moment of courage now rewrites the trajectory of the week.','Authority radiates from your actions. Those who witness your momentum today will remember it. Do not hesitate where others calculate.'],
  'Taurus':['Patience is not passivity &mdash; it is the sovereign accumulation of strength. Venus rewards those who build with intention. Solidify what you have before reaching for what you want.','Your endurance becomes your most powerful currency today. A structure you have been building quietly is ready to hold real weight.'],
  'Gemini':['Information is your weapon and your gift. Mercury clears the channels &mdash; speak clearly, listen deeper. A connection you have overlooked holds the answer you have been constructing.','Your mind moves faster than others can follow. Translate the velocity into clarity. One precise message today reaches farther than a thousand unclear ones.'],
  'Cancer':['The Moon draws your intuition to the surface. Trust what you feel before you trust what you see. A home, a memory, a person &mdash; something close to you requires care and presence.','Depth is your strength. Dive into what others avoid feeling. Your emotional intelligence is a form of intelligence that most minds cannot access.'],
  'Leo':['The Sun does not ask permission to shine. Lead by presence today. Your confidence is a source for others, not a burden on them. Let them orbit your certainty.','A recognition arrives or a contribution becomes visible. Accept it without diminishing it. Sovereigns receive honours with dignity, not false modesty.'],
  'Virgo':['Every detail you attended to begins to compound into visible excellence. The precision you have practiced becomes undeniable today. Sand refines all other forces &mdash; including yourself.','Demeter moves through your hands. What you create or correct today carries long-term weight. Your service to something greater than yourself returns to you multiplied.'],
  'Libra':['The balance you seek is not between opposites &mdash; it is the alignment of your judgment with your action. Hephaestus forges with both fire and craft. Build something that lasts.','A decision you have been weighing becomes clear. The scales tip not by force but by clarity. Choose with your full self, not with the part that fears.'],
  'Scorpio':['Pluto moves below the surface and so do you. Your perception of what is actually happening around you is sharper than others realise. Trust the intelligence that runs beneath the visible.','Transformation does not ask if you are ready. Something old releases today &mdash; let it. The space it leaves is not emptiness; it is where the next phase builds.'],
  'Sagittarius':['Jupiter expands whatever you direct your attention toward. Your optimism is not naive &mdash; it is a form of vision. Aim for the thing that seems too large and hit something extraordinary.','A philosophical truth you have been living becomes transmissible. You can now articulate what has been driving you. That clarity makes you a force rather than just a force of nature.'],
  'Capricorn':['Saturn rewards those who climb without complaint. Your discipline today is not a sacrifice &mdash; it is the architecture of a future that others will study. Build the next tier.','A long-standing effort reaches a milestone. Do not overlook it in pursuit of the next objective. Acknowledge the ground you have gained &mdash; it strengthens your footing for the ascent ahead.'],
  'Aquarius':['Uranus breaks what does not serve the future. Your unconventional thinking is not a deviation &mdash; it is the direction. Systems and people around you need what you see.','Collective intelligence benefits from your solitary clarity. A contribution to something larger than yourself today returns as connection. You are more influential than you calculate.'],
  'Pisces':['Neptune dissolves the false borders. Your compassion today is not weakness &mdash; it is the most sophisticated form of navigation available to you. Feel the current and swim with it.','A dream or vision that seemed unreal contains instructions. Write it, trace it, follow it. Poseidon moves the deeps &mdash; and your depths are where the real power resides.']
};

const PLANETS_TODAY = [
  {name:'SUN',sign:'Cancer',influence:'Vitality, purpose'},
  {name:'MOON',sign:'Scorpio',influence:'Depth, intuition'},
  {name:'MERCURY',sign:'Leo',influence:'Communication, will'},
  {name:'VENUS',sign:'Virgo',influence:'Precision, beauty'},
  {name:'MARS',sign:'Gemini',influence:'Swift action'},
  {name:'JUPITER',sign:'Aries',influence:'Bold expansion'},
  {name:'SATURN',sign:'Pisces',influence:'Karmic structure'},
  {name:'URANUS',sign:'Taurus',influence:'Material change'}
];

var currentSign = 'Virgo';
var mySign = '';
var activeTab = 'daily';

function getReading(signName, tab){
  var readings = DAILY_READINGS[signName] || ['The celestial forces align in favour of deliberate action. Trust your training and your intuition in equal measure. The matrix records every evolution &mdash; including this one.'];
  var today = new Date().getDay();
  if(tab==='daily') return readings[today % readings.length];
  if(tab==='monthly') return 'This month, '+signName+' enters a phase of consolidation and strategic expansion. The planetary alignments favour those who combine disciplined effort with intuitive leaps. Mid-month brings a decisive shift in the balance between internal development and external action. The final days carry harvest energy &mdash; what you have built in silence becomes visible. Align with your matrix coordinates and advance.';
  return '';
}

function buildWeekly(sign){
  var days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var todayIdx=new Date().getDay();
  var grid=document.getElementById('weekly-grid'); grid.innerHTML='';
  var tones=['Initiate','Expand','Reflect','Act','Harvest','Connect','Consolidate'];
  var scores=[72,85,61,90,78,83,69];
  days.forEach(function(d,i){
    var isToday=i===todayIdx;
    var div=document.createElement('div');div.className='day-card'+(isToday?' today':'');
    div.innerHTML='<div class="day">'+d+'</div><div class="score">'+scores[i]+'</div><div class="desc">'+tones[i]+'</div>';
    grid.appendChild(div);
  });
}

function renderFeatured(signName, tab){
  var s = SIGNS.find(function(x){return x.name===signName;});
  if(!s) return;
  var reading = getReading(signName, tab);
  var isUser = signName===mySign;
  var wrap = document.getElementById('featured-wrap');
  var scores = {Love:Math.floor(55+Math.random()*40),Career:Math.floor(55+Math.random()*40),Health:Math.floor(55+Math.random()*40)};
  var hash = signName.split('').reduce(function(a,c){return a+c.charCodeAt(0);},0);
  scores = {Love:55+(hash*7)%40, Career:55+(hash*11)%40, Health:55+(hash*13)%40};
  var today = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  wrap.innerHTML='<div class="featured-card"'+( isUser?' style="box-shadow:0 0 28px rgba(201,168,76,.18)"':'')+'>'+
    '<div class="top">'+
      '<div class="glyph" style="color:'+s.col+'">'+s.glyph+'</div>'+
      '<div class="sign-info">'+
        '<div class="sign-name">'+s.name+'</div>'+
        '<div class="date-range">'+s.dates+'</div>'+
        '<div class="element-pill" style="color:'+s.col+';border-color:'+s.col+'55">'+s.el.toUpperCase()+' &middot; '+s.god.toUpperCase()+' &middot; '+s.planet.toUpperCase()+'</div>'+
        (isUser?'<div style="display:inline-block;font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--void);background:var(--cyan);padding:2px 8px;margin-left:8px">YOUR SIGN</div>':'')+
      '</div>'+
    '</div>'+
    '<div class="reading-wrap">'+
      '<div class="period-label">'+(tab==='daily'?'DAILY READING &middot; '+today.toUpperCase():tab==='weekly'?'WEEKLY FORECAST':'MONTHLY TRAJECTORY')+'</div>'+
      '<div class="reading-text">'+reading+'</div>'+
      '<div class="planet-row">'+
        '<div class="planet-pill"><b>RULER</b> '+s.planet.toUpperCase()+'</div>'+
        '<div class="planet-pill"><b>ELEMENT</b> '+s.el.toUpperCase()+'</div>'+
        '<div class="planet-pill"><b>GOD</b> '+s.god.toUpperCase()+'</div>'+
      '</div>'+
      '<div class="score-row">'+
        Object.entries(scores).map(function(kv){
          return '<div class="score-item"><div class="label">'+kv[0].toUpperCase()+'</div><div class="score-bar"><div class="score-fill" style="width:'+kv[1]+'%;background:'+(kv[0]==='Love'?s.col:kv[0]==='Career'?'var(--cyan)':'var(--green)')+'"></div></div><div class="score-val">'+kv[1]+'%</div></div>';
        }).join('')+
      '</div>'+
    '</div>'+
  '</div>';
}

function buildWheel(){
  var wheel=document.getElementById('sign-wheel'); wheel.innerHTML='';
  SIGNS.forEach(function(s){
    var div=document.createElement('div');
    div.className='wheel-sign'+(s.name===mySign?' mine':'')+(s.name===currentSign?' active':'');
    div.innerHTML='<div class="ws-glyph" style="color:'+s.col+'">'+s.glyph+'</div><div class="ws-name">'+s.name.toUpperCase()+'</div>';
    div.addEventListener('click',function(){
      currentSign=s.name;
      renderFeatured(currentSign, activeTab);
      document.querySelectorAll('.wheel-sign').forEach(function(el){el.classList.remove('active');});
      div.classList.add('active');
      if(activeTab==='weekly') buildWeekly(currentSign);
    });
    wheel.appendChild(div);
  });
}

function buildPlanets(){
  var grid=document.getElementById('planet-grid');grid.innerHTML='';
  PLANETS_TODAY.forEach(function(p){
    var div=document.createElement('div');div.className='planet-item';
    div.innerHTML='<div class="pname">'+p.name+'</div><div class="psign" style="font-size:9px">in '+p.sign.toUpperCase()+'</div><div class="psign">'+p.influence+'</div>';
    grid.appendChild(div);
  });
}

document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    activeTab=tab.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
    tab.classList.add('on');
    document.getElementById('weekly-section').style.display=(activeTab==='weekly'?'block':'none');
    document.getElementById('monthly-section').style.display=(activeTab==='monthly'?'block':'none');
    document.getElementById('featured-wrap').style.display=(activeTab==='daily'||activeTab==='monthly'?'block':'none');
    if(activeTab==='weekly'){
      renderFeatured(currentSign,'weekly');
      buildWeekly(currentSign);
      document.getElementById('featured-wrap').style.display='block';
    } else if(activeTab==='monthly'){
      renderFeatured(currentSign,'monthly');
      document.getElementById('monthly-text').textContent=getReading(currentSign,'monthly');
    } else {
      renderFeatured(currentSign,'daily');
    }
  });
});

async function boot(){
  var sess=(await sb.auth.getSession()).data.session;
  if(sess){
    var pr=(await sb.from('profiles').select('sign').eq('id',sess.user.id).maybeSingle()).data;
    if(pr&&pr.sign){ mySign=pr.sign; currentSign=pr.sign; }
  }
  buildWheel();
  buildPlanets();
  renderFeatured(currentSign,'daily');
}
boot();
</script>
<script src="/nav.js"></script><script src="/bg.js"></script>
</body>
