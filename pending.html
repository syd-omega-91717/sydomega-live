<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>&#937; SYD OMEGA 91717 -- Access Pending</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Courier+Prime:wght@400;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--void:#0A0A0F;--gold:#C9A84C;--solar:#E2C86D;--cyan:#00E5FF;--crim:#8B0000;--green:#3fb27f;--ink:#e9e6dc;--muted:#85837b;--D:'Cinzel Decorative',serif;--M:'Courier Prime',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--M);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bg-cv{position:fixed;inset:0;z-index:0}
.gate{position:relative;z-index:1;text-align:center;padding:32px 24px;max-width:520px;width:100%}
.gate-omega{font-family:var(--D);font-size:64px;color:var(--gold);animation:omega-breathe 3s ease-in-out infinite;display:block;margin-bottom:20px}
@keyframes omega-breathe{0%,100%{text-shadow:0 0 20px rgba(201,168,76,.3)}50%{text-shadow:0 0 50px rgba(201,168,76,.8),0 0 90px rgba(201,168,76,.2)}}
.gate-title{font-family:var(--D);font-size:clamp(18px,4vw,26px);color:var(--gold);font-weight:700;margin-bottom:8px;letter-spacing:2px}
.gate-sub{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:28px;line-height:1.9}
.status-box{border:1px solid rgba(201,168,76,.25);background:rgba(201,168,76,.04);padding:20px;margin-bottom:24px;position:relative;overflow:hidden}
.status-box::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scan 3s ease-in-out infinite}
@keyframes scan{0%,100%{opacity:.3}50%{opacity:1}}
.sb-label{font-size:8px;letter-spacing:4px;color:var(--muted);margin-bottom:6px}
.sb-status{font-family:var(--D);font-size:14px;color:var(--gold);margin-bottom:4px;animation:status-pulse 2s ease-in-out infinite}
@keyframes status-pulse{0%,100%{opacity:.7}50%{opacity:1}}
.sb-detail{font-size:9px;color:var(--muted);letter-spacing:1px}
.freq-line{font-family:var(--D);font-size:12px;color:var(--cyan);letter-spacing:3px;margin-bottom:24px;animation:freq-breathe 2s ease-in-out infinite}
@keyframes freq-breathe{0%,100%{opacity:.5}50%{opacity:1}}
.btn{font-family:var(--M);font-size:10px;letter-spacing:3px;padding:12px 28px;color:var(--void);background:linear-gradient(90deg,var(--gold),var(--solar));border:none;cursor:pointer;transition:all .2s;margin:6px;display:inline-block;text-decoration:none}
.btn:hover{box-shadow:0 0 20px rgba(201,168,76,.4)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid rgba(201,168,76,.2)}
.btn-ghost:hover{border-color:rgba(201,168,76,.4);color:var(--gold);box-shadow:none}
</style>
</head>
<body>
<canvas id="bg-cv"></canvas>
<div class="gate" id="gate-content">
  <span class="gate-omega">&#937;</span>
  <div class="gate-title">ACCESS REQUEST SUBMITTED</div>
  <div class="gate-sub">YOUR SOVEREIGN IDENTITY HAS BEEN REGISTERED<br/>THE ARCHITECT WILL REVIEW AND GRANT ACCESS<br/>YOU WILL BE NOTIFIED WHEN APPROVED</div>
  <div class="status-box">
    <div class="sb-label">REQUEST STATUS</div>
    <div class="sb-status" id="sb-status">PENDING ARCHITECT REVIEW</div>
    <div class="sb-detail" id="sb-detail">Refresh this page to check your access status</div>
  </div>
  <div class="freq-line">FREQUENCY: 9.1717 Hz</div>
  <a class="btn" href="#" onclick="checkStatus();return false;">CHECK STATUS</a>
  <a class="btn btn-ghost" href="/account.html" onclick="logout();return false;">SIGN OUT</a>
</div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient("https://ydqhzvvoyufiiqvzcjns.supabase.co","sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q");

/* Background canvas */
(function(){
  const cv=document.getElementById('bg-cv');
  const ctx=cv.getContext('2d');let t=0;
  function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  const stars=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),r:Math.random()+.3,s:Math.random()*.5+.1}));
  function frame(){
    t+=.006;ctx.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s=>{
      ctx.beginPath();ctx.arc(s.x*cv.width,s.y*cv.height,s.r*(0.6+0.4*Math.sin(t*s.s*3)),0,Math.PI*2);
      ctx.fillStyle='rgba(201,168,76,'+(0.05+0.12*Math.sin(t*s.s+s.x*4))+')';ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();
})();

window.logout=async function(){
  await sb.auth.signOut();
  window.location.href='/account.html';
};

window.checkStatus=async function(){
  const sess=(await sb.auth.getSession()).data.session;
  if(!sess){window.location.href='/account.html';return;}
  const pr=(await sb.from('profiles').select('is_owner,access_approved,is_trial,trial_expires_at').eq('id',sess.user.id).maybeSingle()).data;
  if(!pr){document.getElementById('sb-status').textContent='PROFILE NOT FOUND -- CONTACT ARCHITECT';return;}
  if(pr.is_owner||pr.access_approved){window.location.href='/dashboard.html';return;}
  if(pr.is_trial&&pr.trial_expires_at&&new Date(pr.trial_expires_at)>Date.now()){
    window.location.href='/dashboard.html';return;
  }
  document.getElementById('sb-status').textContent='STILL PENDING -- ARCHITECT WILL REVIEW SHORTLY';
};

async function boot(){
  const sess=(await sb.auth.getSession()).data.session;
  if(!sess){window.location.href='/account.html';return;}
  const pr=(await sb.from('profiles').select('is_owner,access_approved,is_trial,trial_expires_at').eq('id',sess.user.id).maybeSingle()).data;
  if(!pr) return;
  /* Owner bypass -- always gets through */
  if(pr.is_owner||pr.access_approved){window.location.href='/dashboard.html';return;}
  if(pr.is_trial&&pr.trial_expires_at&&new Date(pr.trial_expires_at)>Date.now()){
    window.location.href='/dashboard.html';return;
  }
  /* Auto-recheck every 15 seconds */
  setTimeout(()=>window.checkStatus(),15000);
}
boot();
</script>
</body>
</html>
