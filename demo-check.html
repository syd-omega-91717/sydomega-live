<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ω Demo &amp; Chronometer Diagnostic</title>
<style>
 body{background:#07070c;color:#d8d8e0;font:14px/1.6 system-ui,sans-serif;margin:0;padding:24px}
 h1{color:#C9A84C;font-size:18px;letter-spacing:2px;margin:0 0 4px}
 .sub{opacity:.55;font-size:12px;margin-bottom:20px}
 .row{display:flex;gap:10px;padding:9px 12px;border:1px solid #1e1e28;border-radius:8px;margin-bottom:7px;align-items:flex-start}
 .ok{border-color:#2f6b45}.bad{border-color:#7a2f2f}.warn{border-color:#7a6a2f}
 .tag{flex:0 0 62px;font-weight:700;font-size:11px;letter-spacing:1px}
 .ok .tag{color:#6ad39a}.bad .tag{color:#e88}.warn .tag{color:#e0c060}
 .msg{flex:1}.det{opacity:.55;font-size:12px;margin-top:3px;word-break:break-all}
 button{background:#C9A84C;color:#000;border:0;border-radius:7px;padding:9px 16px;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
 button.alt{background:transparent;color:#C9A84C;border:1px solid #C9A84C}
 #out{margin-top:18px}
</style></head><body>

<h1>Ω SYD OMEGA 91717 — DIAGNOSTIC</h1>
<div class="sub">Upload to your repo root and open <b>/demo-check.html</b> on the live site while signed in.
This page changes nothing. It reports what is actually deployed and reachable.</div>

<button onclick="runAll()">RUN DIAGNOSTIC</button>
<button class="alt" onclick="if(window.OmegaDemo)OmegaDemo.replay();else add('bad','OmegaDemo missing','omega-demo-video.js is not loaded on this page')">FORCE PLAY DEMO</button>
<button class="alt" onclick="if(window.OmegaChrono)OmegaChrono.status();else add('bad','OmegaChrono missing','omega-chronometer.js is not loaded')">CHRONO STATUS</button>

<div id="out"></div>

<script src="/bg.js"></script>
<script>
var SB_URL="https://ydqhzvvoyufiiqvzcjns.supabase.co";
var SB_KEY="sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q";
function add(k,m,d){var e=document.createElement('div');e.className='row '+k;
 e.innerHTML='<div class="tag">'+(k==='ok'?'PASS':k==='bad'?'FAIL':'WARN')+'</div><div class="msg">'+m+
 (d?'<div class="det">'+d+'</div>':'')+'</div>';document.getElementById('out').appendChild(e);}

async function runAll(){
 document.getElementById('out').innerHTML='';

 /* 1. Is the demo module even on the page? */
 add(window.OmegaDemo?'ok':'bad','omega-demo-video.js loaded',
     window.OmegaDemo?'window.OmegaDemo is defined':
     'NOT LOADED. bg.js should inject it. Run scripts/register_demo_video.py, redeploy, hard-refresh.');

 /* 2. Is bg.js itself alive? */
 add(document.querySelector('script[src*="bg.js"]')?'ok':'warn','bg.js present on page','');

 /* 3. Is the video file actually deployed? This is the check that matters. */
 try{
   var r=await fetch('/SYDOMEGA91717_DEMOD-1-.mp4',{method:'HEAD'});
   if(r.ok){
     var mb=(+r.headers.get('content-length')/1e6).toFixed(2);
     add(mb>0.5?'ok':'bad','Video reachable — HTTP '+r.status,
         mb+' MB · content-type: '+(r.headers.get('content-type')||'(none)')+
         (r.headers.get('content-type')!=='video/mp4'?'  ← should be video/mp4':''));
   } else {
     add('bad','Video NOT deployed — HTTP '+r.status,
       'The MP4 is missing from the deployment. Most likely it was never committed to git '+
       '(check: git ls-files | grep mp4), or Vercel is not serving it. This alone stops the demo.');
   }
 }catch(e){ add('bad','Video fetch threw',String(e)); }

 /* 4. Range request support — needed for smooth seek/stream */
 try{
   var rr=await fetch('/SYDOMEGA91717_DEMOD-1-.mp4',{headers:{Range:'bytes=0-99'}});
   add(rr.status===206?'ok':'warn','Range requests: HTTP '+rr.status,
       rr.status===206?'206 Partial Content — streaming supported':'Expected 206.');
 }catch(e){ add('warn','Range check failed',String(e)); }

 /* 5. Faststart check — read the first atoms */
 try{
   var fr=await fetch('/SYDOMEGA91717_DEMOD-1-.mp4',{headers:{Range:'bytes=0-4095'}});
   var buf=new Uint8Array(await fr.arrayBuffer());
   var head=new TextDecoder('latin1').decode(buf.slice(0,4096));
   var mo=head.indexOf('moov'), md=head.indexOf('mdat');
   if(mo>-1&&(md===-1||mo<md)) add('ok','MP4 is faststart','moov near the start — plays immediately');
   else add('bad','MP4 is NOT faststart',
     'moov is after mdat: the browser must download the whole 3.7 MB before the first frame. '+
     'Use the remuxed file in assets/ from the build bundle.');
 }catch(e){ add('warn','Faststart check failed',String(e)); }

 /* 6. Can the video element actually decode it? */
 await new Promise(function(res){
   var v=document.createElement('video'); v.muted=true; v.preload='metadata';
   var t=setTimeout(function(){add('bad','Video metadata timed out (10s)','Never fired loadedmetadata.');res();},10000);
   v.onloadedmetadata=function(){clearTimeout(t);
     add('ok','Video decodes',v.videoWidth+'x'+v.videoHeight+' · '+v.duration.toFixed(1)+'s');res();};
   v.onerror=function(){clearTimeout(t);
     add('bad','Video element error','code '+(v.error&&v.error.code)+' — file corrupt, missing, or wrong codec');res();};
   v.src='/SYDOMEGA91717_DEMOD-1-.mp4';
 });

 /* 7. Session + database state */
 try{
   var m=await import('https://esm.sh/@supabase/supabase-js@2');
   var sb=m.createClient(SB_URL,SB_KEY);
   var s=(await sb.auth.getSession()).data.session;
   add(s?'ok':'bad','Signed in',s?s.user.email:'Sign in first — the demo never shows to signed-out visitors');
   if(s){
     var p=await sb.from('profiles').select('access_approved,subscription_status,is_owner,demo_watched_at').eq('id',s.user.id).maybeSingle();
     if(p.error){
       add('bad','profiles select failed — THIS SILENTLY KILLED THE DEMO',
         p.error.message+' — a missing column returns 400 and v1 gave up with no console message. Run db/01_check_demo_columns.sql');
     } else if(!p.data){
       add('bad','No profiles row','Run migrations/0004_signup_pipeline.sql (creates the row + backfills)');
     } else {
       var d=p.data,el=d.is_owner===true||d.access_approved===true||d.subscription_status==='active';
       add(el?'ok':'bad','Eligible for the demo',
         'approved='+d.access_approved+' owner='+d.is_owner+' sub='+d.subscription_status);
       add(d.demo_watched_at?'warn':'ok','Already watched?',
         d.demo_watched_at?'Watched at '+d.demo_watched_at+' — that is why it does not auto-open. Use OmegaDemo.reset()':'Not yet — should auto-open');
     }
     for(var fn of ['engagement_heartbeat','get_engagement_status','start_trial_countdown']){
       var rp=await sb.rpc(fn);
       add(rp.error&&/does not exist|schema cache/i.test(rp.error.message)?'bad':'ok',
           'RPC '+fn, rp.error?rp.error.message:'available');
     }
   }
 }catch(e){ add('bad','Supabase check failed',String(e)); }

 add('ok','Diagnostic complete','Send this screen to whoever is fixing it.');
}
</script></body></html>
