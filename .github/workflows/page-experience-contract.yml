name: Page Experience Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Page experience contract
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate experience profiles
        shell: pwsh
        run: python scripts/page-experience-contract.py
