name: Supabase Auth Security Configuration

# Manual, protected production change. The environment approval and the scoped
# Supabase Management API token are the authorization boundary; no PR or push
# event can execute this mutation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-auth-security-config
  cancel-in-progress: false

jobs:
  enable-leaked-password-protection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-production
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Enable and verify leaked-password protection
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || {
            echo "::error::Missing SUPABASE_ACCESS_TOKEN in the protected supabase-production environment."
            exit 1
          }
          python3 scripts/enable-supabase-hibp.py
