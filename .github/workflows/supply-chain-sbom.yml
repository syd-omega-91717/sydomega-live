name: Supply Chain and SBOM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    name: Blocking supply-chain scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Semgrep SAST
        # Docker Hub rate-limits anonymous pulls per runner IP; on 2026-10-09 the
        # digest pull failed twice ("toomanyrequests") before any scan ran, leaving
        # main red with no finding. Only a failed PULL falls back to the pinned
        # PyPI engine; the scan itself, its rules and --error are identical, so a
        # real finding still fails the job either way.
        run: |
          IMAGE=semgrep/semgrep@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
          if docker pull "$IMAGE"; then
            docker run --rm -v "${PWD}:/src" "$IMAGE" semgrep scan --config=auto --error --sarif --output=/src/semgrep.sarif /src
          else
            echo "::warning::Semgrep image pull failed; using pinned PyPI semgrep==1.178.0"
            python3 -m pip install --quiet semgrep==1.178.0
            semgrep scan --config=auto --error --sarif --output=semgrep.sarif .
          fi

      - name: Identify blocking Semgrep findings
        if: failure()
        run: |
          IMAGE=semgrep/semgrep@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
          # Re-run only for diagnostics in JSON because SARIF's level did not identify
          # the single blocking result in the preceding run. The original scan remains
          # the gate; this diagnostic pass cannot turn a failed scan green.
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker run --rm -v "${PWD}:/src" "$IMAGE" semgrep scan --config=auto --error --json --output=/src/semgrep-diagnostics.json /src || true
          else
            if ! command -v semgrep >/dev/null 2>&1; then
              python3 -m pip install --quiet semgrep==1.178.0
            fi
            semgrep scan --config=auto --error --json --output=semgrep-diagnostics.json . || true
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("semgrep-diagnostics.json")
          if not path.exists():
              raise SystemExit("Semgrep JSON diagnostics were not produced; original scan remains failed.")
          data = json.loads(path.read_text(encoding="utf-8"))
          results = data.get("results", [])
          print(f"SEMgrep_DIAGNOSTIC_RESULTS={len(results)}")
          for result in results:
              extra = result.get("extra", {})
              metadata = extra.get("metadata", {})
              severity = extra.get("severity", "unknown")
              rule = result.get("check_id", "unknown-rule")
              file = result.get("path", "unknown-file")
              start = result.get("start", {})
              line = start.get("line", 0)
              message = " ".join(str(extra.get("message", "")).split())[:240]
              print(f"::error file={file},line={line}::{rule} severity={severity}: {message}")
              print(f"SEMGREP_FINDING rule={rule} severity={severity} file={file} line={line} metadata={json.dumps(metadata, sort_keys=True)[:500]}")
          for error in data.get("errors", []):
              print("SEMGREP_ENGINE_ERROR=" + json.dumps(error, sort_keys=True)[:1000])
          PY

      - name: Upload Semgrep SARIF
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: semgrep.sarif

      - name: Trivy filesystem vulnerability scan
        if: ${{ success() }}
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e # v0.36.0 lineage
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy IaC/misconfiguration scan
        if: ${{ success() }}
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e # v0.36.0 lineage
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-config.sarif

      - name: Upload Trivy config SARIF
        if: ${{ always() && hashFiles('trivy-config.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-config.sarif
          # Both Trivy uploads report tool "Trivy", and code scanning accepts one
          # SARIF per tool+category per job: this one needs its own category.
          category: trivy-config

      - name: Generate dependency SBOM
        if: ${{ success() }}
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e # v0.36.0 lineage
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: omega-sbom.cdx.json
          exit-code: '0'

      - name: Validate SBOM artifact
        if: ${{ success() }}
        run: |
          test -s omega-sbom.cdx.json
          python3 - <<'PY'
          import json
          with open("omega-sbom.cdx.json", encoding="utf-8") as f:
              data=json.load(f)
          if data.get("bomFormat") != "CycloneDX":
              raise SystemExit("SBOM_FORMAT_INVALID")
          if not data.get("components"):
              raise SystemExit("SBOM_COMPONENTS_EMPTY")
          print("SBOM=PASS components=%d" % len(data["components"]))
          PY

      - name: Upload SBOM
        if: ${{ always() && hashFiles('omega-sbom.cdx.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omega-sbom
          path: omega-sbom.cdx.json
          retention-days: 30
