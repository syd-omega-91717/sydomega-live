name: Evidence Matrix Refresh Branch

on:
  push:
    branches:
      - "automation/evidence-matrix-refresh-*"

permissions:
  contents: write

concurrency:
  group: evidence-matrix-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    name: Regenerate and commit the evidence matrix to the refresh branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the requested refresh branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate canonical evidence matrix
        run: python3 scripts/evidence-audit.py

      - name: Commit generated matrix to this refresh branch only
        shell: bash
        run: |
          if git diff --quiet -- EVIDENCE_MATRIX.md; then
            echo "EVIDENCE_MATRIX_REFRESH=NO_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EVIDENCE_MATRIX.md
          git commit -m "docs: refresh generated evidence matrix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
