name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}" && test -n "${RUNNER_OS:-}" && test -n "${RUNNER_ARCH:-}"
          echo "runner=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "run=$GITHUB_RUN_ID"
          echo "attempt=$GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Inline JavaScript syntax
        run: python scripts/check-inline-js.py
      - name: Repository audit
        run: python scripts/audit.py
      - name: Audit tooling tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Production contract
        run: python scripts/production-contract.py
      - name: Workflow contract
        run: python scripts/workflow-contract.py
      - name: 16-block architecture contract
        run: python scripts/architecture-contract.py
      - name: 16-block implementation readiness
        run: python scripts/architecture-readiness.py
      - name: Capability registry
        run: python scripts/capability-audit.py --check
      - name: Capability runtime audit
        run: python scripts/capability-audit.py
      - name: Registry JSON
        run: python -m json.tool docs/capabilities/registry.json
      - name: Schema dictionary
        run: python scripts/schema-dictionary.py
        continue-on-error: true
      - name: RLS audit
        run: python scripts/rls-auditor.py
        continue-on-error: true
      - name: Silent failure audit
        run: python scripts/silent-failure-detector.py
        continue-on-error: true
      - name: Migration consistency
        run: python scripts/migration-consistency.py
        continue-on-error: true
      - name: Upsert conflict audit
        run: python scripts/upsert-conflict-check.py
        continue-on-error: true
      - name: Skill and agent registry
        run: python scripts/omega-registry.py --check
      - name: i18n contract
        run: python scripts/i18n-contract.py
      - name: Context budget
        run: python scripts/context-budget.py
      - name: Client credential scan
        run: |
          set -euo pipefail
          if grep -RInE --include='*.js' --include='*.html' --include='*.json' 'service_role|SUPABASE_SERVICE_ROLE_KEY' .; then
            echo 'Client credential scan failed'
            exit 1
          fi
      - name: Execution marker
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          echo "CI_EXECUTED=true"
          echo "CI_RUN_ID=$GITHUB_RUN_ID"
          echo "CI_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
