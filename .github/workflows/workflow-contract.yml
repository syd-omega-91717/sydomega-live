name: Workflow Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  workflow-contract:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          if (-not $env:RUNNER_OS)   { exit 1 }
          if (-not $env:RUNNER_ARCH) { exit 1 }
          "runner=$env:RUNNER_NAME"
          "runner_os=$env:RUNNER_OS"
          "runner_arch=$env:RUNNER_ARCH"
          "run=$env:GITHUB_RUN_ID"
          "attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workflow contracts
        shell: pwsh
        run: python scripts/workflow-contract.py
      - name: Validate architecture contract
        shell: pwsh
        run: python scripts/architecture-contract.py
      - name: Validate implementation readiness
        shell: pwsh
        run: python scripts/architecture-readiness.py
      - name: Validate local production gate help path
        shell: pwsh
        run: |
          if (-not (Test-Path 'scripts/ci-local.sh')) { exit 1 }
          if (-not (Select-String -Path 'scripts/ci-local.sh' -SimpleMatch '--help' -Quiet)) { exit 1 }
          'ci-local.sh help contract verified'
      - name: Execution marker
        shell: pwsh
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          "WORKFLOW_CONTRACT_EXECUTED=true"
          "WORKFLOW_CONTRACT_RUN_ID=$env:GITHUB_RUN_ID"
          "WORKFLOW_CONTRACT_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
