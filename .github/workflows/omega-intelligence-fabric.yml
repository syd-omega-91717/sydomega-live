name: Omega Intelligence Fabric

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric:
    name: intelligence-fabric
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q core scripts tests
      - name: Fabric structural audit
        run: python scripts/omega_fabric_audit.py
      - name: Fabric platform gate
        run: python scripts/omega_fabric_platform_gate.py
      - name: Fabric unit tests
        run: python -m unittest discover -s tests -p 'test_intelligence_fabric.py' -v
