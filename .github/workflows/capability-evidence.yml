name: Capability Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sydomega-quality-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  evidence:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          if (-not $env:RUNNER_OS)   { exit 1 }
          if (-not $env:RUNNER_ARCH) { exit 1 }
          "runner=$env:RUNNER_NAME"
          "runner_os=$env:RUNNER_OS"
          "runner_arch=$env:RUNNER_ARCH"
          "run=$env:GITHUB_RUN_ID"
          "attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate capability registry
        shell: pwsh
        run: python scripts/capability-audit.py --check
      - name: Source runtime audit
        shell: pwsh
        run: python scripts/capability-audit.py
      - name: Validate registry JSON
        shell: pwsh
        run: python -m json.tool docs/capabilities/registry.json
      - name: Validate architecture runtime
        shell: pwsh
        run: python scripts/architecture-readiness.py
      - name: Runtime verification (headless render of capability entrypoints)
        shell: pwsh
        run: node scripts/verify-runtime.js
      - name: Execution marker
        shell: pwsh
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          "CAPABILITY_EVIDENCE_EXECUTED=true"
          "CAPABILITY_EVIDENCE_RUN_ID=$env:GITHUB_RUN_ID"
          "CAPABILITY_EVIDENCE_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
