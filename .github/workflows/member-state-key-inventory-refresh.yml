name: Member-State Key Inventory Refresh

on:
  push:
    branches:
      - "automation/member-state-key-inventory-*"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    name: Generate and commit the member-state key inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the requested inventory branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate member-state key inventory
        run: python3 scripts/member-state-key-audit.py --write

      - name: Commit generated inventory to this branch only
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/operations/MEMBER_STATE_KEY_INVENTORY.md)" ]; then
            echo "MEMBER_STATE_KEY_INVENTORY=NO_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/MEMBER_STATE_KEY_INVENTORY.md
          git commit -m "docs: refresh generated member-state key inventory"
          git push origin "HEAD:${GITHUB_REF_NAME}"
