<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph Admin · SYD OMEGA 91717</title>
<link rel="manifest" href="/manifest.json">
<style>
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.admin-panel{background:#0d0d0d;border:1px solid #1a1a1a;padding:20px}
.admin-title{font-family:'Courier New',monospace;font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:16px}
.search-box{width:100%;background:#000;border:1px solid #222;padding:10px;color:#e0e0e0;font-family:'Courier New',monospace;font-size:12px;margin-bottom:14px}
.entity-list,.rel-list{max-height:500px;overflow-y:auto;border:1px solid #1a1a1a;background:#000}
.entity-item,.rel-item{padding:12px;border-bottom:1px solid #0a0a0a;cursor:pointer;transition:background .2s;display:flex;justify-content:space-between;align-items:center}
.entity-item:hover,.rel-item:hover{background:#1a1a1a}
.entity-name,.rel-name{font-family:'Courier New',monospace;font-size:12px;color:#e0e0e0}
.entity-meta,.rel-meta{font-size:12px;color:var(--muted);margin-top:3px}
.conf-badge{padding:2px 6px;font-size:12px;font-family:'Courier New',monospace;border:1px solid;display:inline-block}
.conf-high{color:#4CAF50;border-color:#4CAF50}
.conf-med{color:#FFD700;border-color:#FFD700}
.conf-low{color:#FF4444;border-color:#FF4444}
.btn-icon{background:none;border:none;cursor:pointer;font-size:12px;padding:4px 8px;color:var(--muted)}
.btn-icon:hover{color:#e0e0e0}
.detail-panel{background:#0d0d0d;border:1px solid #1a1a1a;padding:20px;min-height:400px}
.detail-title{font-family:'Courier New',monospace;font-size:14px;color:var(--gold);margin-bottom:12px}
.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.meta-item{background:#000;padding:10px;border:1px solid #1a1a1a}
.meta-label{font-size:12px;color:var(--muted);font-family:'Courier New',monospace;letter-spacing:1px}
.meta-value{font-size:12px;color:#e0e0e0;margin-top:3px;font-family:'Courier New',monospace}
.evidence-section{margin-bottom:20px}
.section-label{font-family:'Courier New',monospace;font-size:12px;color:var(--muted);letter-spacing:2px;border-bottom:1px solid #1a1a1a;padding-bottom:8px;margin-bottom:12px}
.evidence-card{background:#000;border:1px solid #1a1a1a;padding:10px;margin-bottom:8px;font-size:12px;color:#888;line-height:1.5}
.action-row{display:flex;gap:8px;margin-top:20px}
.btn-primary{padding:10px 16px;background:var(--gold);border:none;color:#000;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;cursor:pointer;font-weight:700}
.btn-primary:hover{background:#d4b85c}
.btn-danger{padding:10px 16px;background:#FF4444;border:none;color:#fff;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;cursor:pointer;font-weight:700}
.btn-danger:hover{background:#FF6666}
.btn-secondary{padding:10px 16px;background:#1a1a1a;border:1px solid #333;color:#aaa;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;cursor:pointer}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-family:'Courier New',monospace;font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid #1a1a1a;padding-bottom:12px}
.tab{padding:8px 16px;font-family:'Courier New',monospace;font-size:12px;cursor:pointer;color:var(--muted);border:none;background:none;letter-spacing:1px}
.tab.act{color:var(--gold);border-bottom:2px solid var(--gold)}
</style>
</head>
<body>
<div class="shell">
<aside class="side" id="omega-side" data-page="graph-admin"></aside>
<main class="main">
<div class="topbar"><div class="t">GRAPH ADMIN<small>ENTITY & RELATIONSHIP CURATION · SYD OMEGA 91717</small></div></div>
<div style="padding:20px var(--pad,20px)">

<div class="tabs">
  <button class="tab act" onclick="switchView('entities',this)">ENTITIES</button>
  <button class="tab" onclick="switchView('relationships',this)">RELATIONSHIPS</button>
  <button class="tab" onclick="switchView('audit',this)">AUDIT LOG</button>
</div>

<div class="admin-grid">
  <div class="admin-panel" id="list-panel">
    <div class="admin-title" id="list-title">ENTITIES</div>
    <input type="text" class="search-box" id="search-box" placeholder="Search...">
    <div id="item-list" class="entity-list"></div>
  </div>

  <div id="detail-panel" class="detail-panel">
    <div class="empty-state">SELECT AN ITEM TO VIEW DETAILS</div>
  </div>
</div>

</div>
</main>
<div data-page-emblem="graph-admin" style="margin:20px auto 0"></div>
</div>

<script>
var currentView='entities';
var entities=[],relationships=[],auditLog=[];
var selectedId=null;
var sb=null;
var uid=null;
function textEl(tag,cls,text){var el=document.createElement(tag);if(cls)el.className=cls;el.textContent=String(text==null?'':text);return el;}
function setDetailEmpty(){var p=document.getElementById('detail-panel');p.replaceChildren(textEl('div','empty-state','SELECT AN ITEM TO VIEW DETAILS'));}
function safeNum(v){var n=Number(v);return Number.isFinite(n)?n:0;}

async function init(){
  if(!window.OmegaSupabase){setTimeout(init,100);return;}
  sb=window.OmegaSupabase.sb;
  if(!sb)return;
  uid=window.currentProfile?.id;
  if(!uid)return;
  await loadEntities();
  renderList();
}

async function switchView(v,el){
  currentView=v;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('act');});
  el.classList.add('act');
  selectedId=null;
  setDetailEmpty();
  if(v==='entities'){
    document.getElementById('list-title').textContent='ENTITIES';
    await loadEntities();
  }else if(v==='relationships'){
    document.getElementById('list-title').textContent='RELATIONSHIPS';
    await loadRelationships();
  }else if(v==='audit'){
    document.getElementById('list-title').textContent='AUDIT LOG';
    await loadAuditLog();
  }
  renderList();
}

async function loadEntities(){
  try{
    var res=await sb.from('graph_entities').select('*').eq('user_id',uid).order('confidence_score',{ascending:false});
    entities=res.data||[];
  }catch(e){console.error(e);}
}

async function loadRelationships(){
  try{
    var res=await sb.from('graph_relationships').select('*').eq('user_id',uid).order('strength',{ascending:false});
    relationships=res.data||[];
  }catch(e){console.error(e);}
}

async function loadAuditLog(){
  try{
    var res=await sb.from('graph_events').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(100);
    auditLog=res.data||[];
  }catch(e){console.error(e);}
}

function renderList(){
  var list=document.getElementById('item-list');
  var search=(document.getElementById('search-box').value||'').toLowerCase();
  var items=currentView==='entities'?entities:(currentView==='relationships'?relationships:auditLog);
  list.replaceChildren();
  if(currentView==='entities'){
    var filtered=items.filter(function(e){return String(e.display_name||'').toLowerCase().includes(search);});
    if(!filtered.length){list.appendChild(textEl('div','empty-state','NO ENTITIES'));return;}
    filtered.forEach(function(e){
      var conf=Math.max(0,Math.min(1,safeNum(e.confidence_score))),badge=conf>=.8?'conf-high':conf>=.5?'conf-med':'conf-low';
      var item=textEl('div','entity-item','');item.addEventListener('click',function(){showEntity(e.id);});
      var left=textEl('div','');left.append(textEl('div','entity-name',e.display_name||e.canonical_name));
      var meta=textEl('div','entity-meta',String(e.entity_type||'')+' · ');meta.appendChild(textEl('span','conf-badge '+badge,Math.round(conf*100)+'%'));left.appendChild(meta);
      var del=textEl('button','btn-icon','✕');del.type='button';del.setAttribute('aria-label','Delete entity');del.addEventListener('click',function(ev){deleteEntity(e.id,ev);});
      item.append(left,del);list.appendChild(item);
    });
  }else if(currentView==='relationships'){
    var filtered=items.filter(function(r){var q=String(r.relationship_type||'')+' '+String(r.source_entity_name||'')+' '+String(r.target_entity_name||'');return q.toLowerCase().includes(search);});
    if(!filtered.length){list.appendChild(textEl('div','empty-state','NO RELATIONSHIPS'));return;}
    filtered.forEach(function(r){
      var conf=Math.max(0,Math.min(1,safeNum(r.confidence))),badge=conf>=.8?'conf-high':conf>=.5?'conf-med':'conf-low';
      var item=textEl('div','rel-item','');item.addEventListener('click',function(){showRelationship(r.id);});
      var left=textEl('div','');left.appendChild(textEl('div','rel-name',String(r.source_entity_name||'')+' → '+String(r.target_entity_name||'')));
      var meta=textEl('div','rel-meta',String(r.relationship_type||'')+' · ');meta.appendChild(textEl('span','conf-badge '+badge,Math.round(conf*100)+'%'));left.appendChild(meta);
      var del=textEl('button','btn-icon','✕');del.type='button';del.setAttribute('aria-label','Delete relationship');del.addEventListener('click',function(ev){deleteRelationship(r.id,ev);});
      item.append(left,del);list.appendChild(item);
    });
  }else{
    if(!items.length){list.appendChild(textEl('div','empty-state','NO AUDIT LOG'));return;}
    items.forEach(function(a){
      var item=textEl('div','rel-item','');item.addEventListener('click',function(){showAuditEvent(a.id);});
      var left=textEl('div','');left.appendChild(textEl('div','rel-name',String(a.event_type||'')+' — '+String(a.entity_name||'')));
      left.appendChild(textEl('div','rel-meta',new Date(a.created_at).toLocaleDateString()));item.appendChild(left);list.appendChild(item);
    });
  }
}

async function showEntity(eid){
  selectedId=eid;var e=entities.find(function(x){return x.id===eid;});if(!e)return;
  var evRes=await sb.from('graph_evidence').select('*').eq('graph_entity_id',eid).limit(10),evidence=evRes.data||[],p=document.getElementById('detail-panel');p.replaceChildren();
  var title=textEl('div','detail-title',e.display_name||e.canonical_name),meta=textEl('div','detail-meta','');
  [['TYPE',e.entity_type],['CONFIDENCE',Math.round(safeNum(e.confidence_score)*100)+'%'],['FIRST SEEN',new Date(e.created_at).toLocaleDateString()],['SOURCES',evidence.length]].forEach(function(x){var m=textEl('div','meta-item','');m.append(textEl('div','meta-label',x[0]),textEl('div','meta-value',x[1]));meta.appendChild(m);});
  var desc=textEl('div','evidence-section','');desc.append(textEl('div','section-label','DESCRIPTION'),textEl('div','evidence-card',e.description||'[No description]'));
  var evs=textEl('div','evidence-section','');evs.appendChild(textEl('div','section-label','EVIDENCE ('+evidence.length+')'));evidence.forEach(function(ev){evs.appendChild(textEl('div','evidence-card',ev.evidence_text||''));});if(!evidence.length)evs.appendChild(textEl('div','empty-state','NO EVIDENCE'));
  var actions=textEl('div','action-row',''),v=textEl('button','btn-primary','✓ VERIFY'),mrg=textEl('button','btn-secondary','⟳ MERGE DUPLICATE'),del=textEl('button','btn-danger','✕ DELETE');v.addEventListener('click',function(){verifyEntity(e.id);});mrg.addEventListener('click',function(){duplicateEntity(e.id);});del.addEventListener('click',function(){deleteEntity(e.id);});actions.append(v,mrg,del);p.append(title,meta,desc,evs,actions);
}

async function showRelationship(rid){
  selectedId=rid;var r=relationships.find(function(x){return x.id===rid;});if(!r)return;
  var evRes=await sb.from('graph_evidence').select('*').eq('graph_relationship_id',rid).limit(10),evidence=evRes.data||[],p=document.getElementById('detail-panel');p.replaceChildren();
  var title=textEl('div','detail-title',String(r.source_entity_name||'')+' → '+String(r.target_entity_name||'')),meta=textEl('div','detail-meta','');
  [['TYPE',r.relationship_type],['CONFIDENCE',Math.round(safeNum(r.confidence)*100)+'%'],['STRENGTH',Math.round(safeNum(r.strength)*100)+'%'],['FIRST SEEN',new Date(r.created_at).toLocaleDateString()]].forEach(function(x){var m=textEl('div','meta-item','');m.append(textEl('div','meta-label',x[0]),textEl('div','meta-value',x[1]));meta.appendChild(m);});
  var evs=textEl('div','evidence-section','');evs.appendChild(textEl('div','section-label','EVIDENCE ('+evidence.length+')'));evidence.forEach(function(ev){evs.appendChild(textEl('div','evidence-card',ev.evidence_text||''));});if(!evidence.length)evs.appendChild(textEl('div','empty-state','NO EVIDENCE'));
  var actions=textEl('div','action-row',''),v=textEl('button','btn-primary','✓ VERIFY'),del=textEl('button','btn-danger','✕ DELETE');v.addEventListener('click',function(){verifyRelationship(r.id);});del.addEventListener('click',function(){deleteRelationship(r.id);});actions.append(v,del);p.append(title,meta,evs,actions);
}

async function showAuditEvent(eid){
  selectedId=eid;var e=auditLog.find(function(x){return x.id===eid;});if(!e)return;
  var p=document.getElementById('detail-panel');p.replaceChildren(),title=textEl('div','detail-title',e.event_type),meta=textEl('div','detail-meta','');
  [['ENTITY',e.entity_name],['TIMESTAMP',new Date(e.created_at).toLocaleString()],['DETAILS',e.details||'[No details]']].forEach(function(x){var m=textEl('div','meta-item','');m.append(textEl('div','meta-label',x[0]),textEl('div','meta-value',x[1]));meta.appendChild(m);});p.append(title,meta);
}

async function verifyEntity(eid){
  try{
    /* Supabase resolves to {data,error} rather than throwing, so the catch
       below never fired: PostgREST rejected the whole update on the unknown
       `verified` column, confidence_score was never written either, and the
       UI reloaded and re-rendered as though it had worked. `verified` is
       added by supabase/omega_graph_verified_fix.sql. */
    const {error}=await sb.from('graph_entities').update({confidence_score:1.0,verified:true}).eq('id',eid);
    if(error){alert('Could not verify entity: '+error.message);return;}
    await loadEntities();
    renderList();
    showEntity(eid);
  }catch(e){alert('Error: '+e.message);}
}

async function verifyRelationship(rid){
  try{
    /* `confidence` is not a column on this table -- the confidence analogue is
       `strength numeric(3,2) DEFAULT 1.0`, an exact match for the 1.0 being
       written here. Same silent-failure shape as verifyEntity above. */
    const {error}=await sb.from('graph_relationships').update({strength:1.0,verified:true}).eq('id',rid);
    if(error){alert('Could not verify relationship: '+error.message);return;}
    await loadRelationships();
    renderList();
    showRelationship(rid);
  }catch(e){alert('Error: '+e.message);}
}

async function deleteEntity(eid,ev){
  if(ev)ev.stopPropagation();
  if(!confirm('Delete entity? This will remove related relationships.'))return;
  try{
    /* .error checked, not try/catch: Supabase resolves rather than throws,
       so the catch below never saw a failed delete and the row vanished from
       the UI while still existing in the database. */
    const {error}=await sb.from('graph_entities').delete().eq('id',eid);
    if(error){alert('Could not delete entity: '+error.message);return;}
    await loadEntities();
    selectedId=null;
    renderList();
    setDetailEmpty();
  }catch(e){alert('Error: '+e.message);}
}

async function deleteRelationship(rid,ev){
  if(ev)ev.stopPropagation();
  if(!confirm('Delete relationship?'))return;
  try{
    const {error}=await sb.from('graph_relationships').delete().eq('id',rid);
    if(error){alert('Could not delete relationship: '+error.message);return;}
    await loadRelationships();
    selectedId=null;
    renderList();
    setDetailEmpty();
  }catch(e){alert('Error: '+e.message);}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

document.getElementById('search-box').addEventListener('input',renderList);
init();
</script>
<script src="/bg.js" defer></script>
<script type="module" src="/omega-analytics-init.js"></script><script type="module" src="/omega-speed-insights-init.js"></script></body>
</html>
