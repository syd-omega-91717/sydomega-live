name: Capability Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          echo "runner=${RUNNER_NAME}"
          echo "runner_id=${RUNNER_TRACKING_ID:-unknown}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          echo "run=${GITHUB_RUN_ID}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate capability registry
        run: python scripts/capability-audit.py --check
      - name: Source runtime audit
        run: python scripts/capability-audit.py
      - name: Validate registry JSON
        run: python -m json.tool docs/capabilities/registry.json
      - name: Validate architecture runtime
        run: python scripts/architecture-readiness.py
      - name: Execution marker
        run: |
          test -n "${RUNNER_NAME:-}"
          echo 'CAPABILITY_EVIDENCE_EXECUTED=true'
