name: Production Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-contract-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: python

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        run: |
          import os, sys
          for var in ("RUNNER_NAME", "RUNNER_OS", "RUNNER_ARCH"):
              if not os.environ.get(var):
                  print(f"::error::{var} is empty - no real runner")
                  sys.exit(1)
          print("runner=" + os.environ["RUNNER_NAME"])
          print("runner_os=" + os.environ["RUNNER_OS"])
          print("runner_arch=" + os.environ["RUNNER_ARCH"])
          print("run=" + os.environ.get("GITHUB_RUN_ID", ""))
          print("attempt=" + os.environ.get("GITHUB_RUN_ATTEMPT", ""))
      - name: Production contract
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/production-contract.py']).returncode)
      - name: JavaScript syntax
        shell: python
        run: |
          import pathlib, subprocess, sys
          bad = [p.name for p in sorted(pathlib.Path(".").glob("*.js"))
                 if subprocess.run(["node", "--check", p.name]).returncode != 0]
          if bad:
              print("::error::syntax error in: " + ", ".join(bad))
              sys.exit(1)
          print("node --check clean")
      - name: Execution marker
        shell: python
        run: |
          import os, sys
          if not os.environ.get("RUNNER_NAME"):
              sys.exit(1)
          print("PRODUCTION_CONTRACT_EXECUTED=true")
          print("PRODUCTION_CONTRACT_RUN_ID=" + os.environ.get("GITHUB_RUN_ID", ""))
          print("PRODUCTION_CONTRACT_RUN_ATTEMPT=" + os.environ.get("GITHUB_RUN_ATTEMPT", ""))
