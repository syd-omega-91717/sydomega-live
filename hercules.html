<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hercules — Labors & Trials</title>
  <script src="/bg.js" defer></script>
  <style>
    .labors-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
    .labor-card { padding: 1.5rem; --card-edge-w: 4px; }
    .labor-num { font-size: 0.85rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .labor-title { font-size: 1.3rem; margin: 0.5rem 0; font-family: var(--D); }
    .labor-desc { font-size: 0.95rem; line-height: 1.6; color: var(--ink); opacity: 0.9; margin: 1rem 0; }
    .labor-progress { margin-top: 1rem; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); transition: width 0.3s ease; }
    .trial-meta { display: flex; gap: 1rem; margin-top: 1rem; font-size: 0.9rem; flex-wrap: wrap; }
    .trial-tag { padding: 0.25rem 0.75rem; background: rgba(255,255,255,0.05); border-radius: 12px; }
    #labors-list { min-height: 400px; }
    .labor-state { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 0.75rem; }
    .labor-state.done { color: var(--green); }
    .labor-state.open { color: var(--muted); }
    .labor-act { margin-top: 1rem; min-height: 24px; padding: 0.4rem 0.9rem; font-size: 0.8rem;
      letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
      background: rgba(255,255,255,0.05); color: var(--ink);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; }
    .labor-act[disabled] { opacity: 0.45; cursor: default; }
    .labor-msg { font-size: 0.8rem; margin-top: 0.5rem; min-height: 1em; }
    .labor-msg.err { color: var(--crim); }
    .labor-card.done { opacity: 1; }
    #labors-error { color: var(--crim); font-size: 0.9rem; }
  </style>
</head>
<body data-page="hercules">
<div class="shell">
  <aside id="omega-side"></aside>
  <main class="main">
    <section class="main-header">
      <h1>⚔ Hercules</h1>
      <p>Twelve Labors · Trials & Triumphs</p>
    </section>

    <section class="main-content">
      <div class="card" style="margin-bottom: 2rem;" data-reveal="depth-in">
        <h2>The Twelve Labors</h2>
        <p>Legendary trials that forge strength. Track your own labors, triumphs, and the obstacles overcome.</p>
        <div class="labor-progress" style="margin-top:1.25rem;">
          <div class="progress-bar">
            <div id="overall-fill" class="progress-fill" style="width:0%"></div>
          </div>
          <div id="overall-label" style="font-size:0.85rem;margin-top:0.5rem;color:var(--muted);">LOADING YOUR RECORD…</div>
        </div>
      </div>

      <div id="labors-list" class="labors-grid" data-loading data-stagger data-stagger-gap="50">
        <!-- Loaded dynamically -->
      </div>
    </section>

    <section class="main-footer">
      <small>Hercules — Strength through trials. Every labor completed is wisdom earned.</small>
    </section>
  <div data-page-emblem="hercules" style="margin:20px auto 0"></div>
</main>
</div>

<script>
/* Labor data lives in /omega-hercules.js (injected by bg.js on every page) and
   is read from there rather than duplicated here. This page used to carry its
   own second copy of the 12 labors and 12 themes, which had already drifted
   from the module's: the module had ids and no descriptions, the page had
   descriptions and no ids. Two divergent copies of one canonical table is the
   bug class documented in CLAUDE.md section 8 for SIGN_ELEM. */

var listEl, overallFill, overallLabel;

function laborCard(labor, theme, done, canAct) {
  return '<div class="card card-edge labor-card' + (done ? ' done' : '') + '" data-reveal="depth-in" style="--card-accent: ' + theme.color + '">'
    + '<div class="labor-num">' + theme.icon + ' Labor ' + labor.num + '</div>'
    + '<div class="labor-title">' + labor.title + '</div>'
    + '<p class="labor-desc">' + labor.desc + '</p>'
    + '<div class="labor-state ' + (done ? 'done' : 'open') + '">'
    +   (done ? '\u2713 Completed' : 'Not yet recorded')
    + '</div>'
    + (done || !canAct ? '' :
        '<button type="button" class="labor-act" data-labor="' + labor.id + '">Mark complete</button>')
    + '<div class="labor-msg" data-msg="' + labor.id + '"></div>'
    + '<div class="trial-meta">'
    +   '<span class="trial-tag" style="border-left: 2px solid ' + theme.color + '">Theme: ' + labor.theme + '</span>'
    +   '<span class="trial-tag" style="border-left: 2px solid ' + theme.color + '">Difficulty: ' + labor.difficulty + '</span>'
    + '</div>'
    + '</div>';
}

function renderOverall(doneCount, total) {
  if (!overallFill || !overallLabel) return;
  var pct = total ? Math.round((doneCount / total) * 100) : 0;
  overallFill.style.width = pct + '%';
  overallLabel.textContent = doneCount + ' / ' + total + ' LABORS COMPLETE';
}

/* Renders real recorded state only.

   This page previously drew Math.floor(Math.random() * 100) as each labor's
   "% complete" -- a fabricated number, different on every reload, presented to
   the member as their own progress. task_completions records completion, not
   partial progress, so each labor is shown as completed or not, and the only
   percentage on the page is the genuine N-of-12 figure. */
async function renderLabors() {
  listEl = document.getElementById('labors-list');
  overallFill = document.getElementById('overall-fill');
  overallLabel = document.getElementById('overall-label');
  if (!listEl) return;

  var H = window.OmegaHercules;
  if (!H) {
    listEl.innerHTML = '<div id="labors-error">Labor data unavailable \u2014 /omega-hercules.js did not load.</div>';
    if (overallLabel) overallLabel.textContent = 'RECORD UNAVAILABLE';
    return;
  }

  var res = await H.completedLaborIds();
  listEl.removeAttribute('data-loading');

  /* An empty set means "none completed" only when the query actually
     succeeded. On error it means "we do not know", and saying 0/12 there
     would be the same class of lie as the random numbers this replaced. */
  if (res.error) {
    if (overallLabel) overallLabel.textContent = 'COULD NOT LOAD YOUR RECORD \u2014 ' + (res.error.message || 'query failed');
    listEl.innerHTML = H.LABORS.map(function (l) {
      return laborCard(l, H.getTheme(l.id), false, false);
    }).join('');
    return;
  }

  renderOverall(res.ids.size, H.LABORS.length);
  listEl.innerHTML = H.LABORS.map(function (l) {
    return laborCard(l, H.getTheme(l.id), res.ids.has(l.id), true);
  }).join('');
}

/* Delegated so it survives every re-render. */
document.addEventListener('click', async function (e) {
  var btn = e.target && e.target.closest ? e.target.closest('.labor-act[data-labor]') : null;
  if (!btn) return;

  var id = btn.getAttribute('data-labor');
  var msg = document.querySelector('.labor-msg[data-msg="' + id + '"]');
  btn.disabled = true;
  btn.textContent = 'Recording\u2026';
  if (msg) { msg.className = 'labor-msg'; msg.textContent = ''; }

  var out = await window.OmegaHercules.completeLabor(id);

  /* Never report success without checking the write's actual result. */
  if (!out.ok) {
    btn.disabled = false;
    btn.textContent = 'Mark complete';
    if (msg) { msg.className = 'labor-msg err'; msg.textContent = 'Could not record: ' + out.error; }
    return;
  }
  await renderLabors();
}, false);

window.addEventListener('DOMContentLoaded', renderLabors);
</script>
<script type="module" src="/omega-analytics-init.js"></script><script type="module" src="/omega-speed-insights-init.js"></script></body>
</html>
