# Runner canary for issue #157.
#
# Proves the registered self-hosted runner actually executes work: a non-zero
# runner id, real steps, and a retrievable log -- #157's acceptance criterion.
#
# DELIBERATELY DOES NOT INVOKE BASH. Every one of this workflow's first 29 runs
# failed, and not one was a code failure. On this Windows runner `bash`
# resolves to the WSL shim at C:\Windows\System32\bash.exe with no distro
# installed, so it dies before reading any script:
#
#   WSL (10 - Relay) ERROR: CreateProcessCommon:800:
#   execvpe(/bin/bash) failed: No such file or directory
#
# Two fixes were tried and both failed on the same line: `shell: cmd` then
# `bash ...`, and `shell: bash` -- which Actions ALSO resolved to the shim
# ("shell: C:\Windows\system32\bash.EXE --noprofile --norc -e -o pipefail {0}"
# is in run 27's log), so its documented Git-for-Windows behaviour does not
# hold here.
#
# The third fix is to stop needing bash. This probe never had to run
# ci-local.sh: ci.yml already runs all 18 blocking checks on this exact runner
# and passes, so duplicating them here proved nothing and cost a second slot on
# a single-runner queue. `shell: cmd` invoking python/node directly is the form
# ci.yml uses and is proven to work here.
#
# runner-diagnostics.yml was deleted alongside this: it ran the same
# ci-local.sh on the same runner on an HOURLY cron, so it produced a guaranteed
# red run every hour and competed for the one runner. It duplicated this file.
name: Runner Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-hosted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Prove the runner is real
        shell: cmd
        run: |
          @echo off
          if "%RUNNER_NAME%"=="" exit /b 1
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if "%RUNNER_ARCH%"=="" exit /b 1
          echo runner_name=%RUNNER_NAME%
          echo runner_os=%RUNNER_OS% arch=%RUNNER_ARCH%
          echo run_id=%GITHUB_RUN_ID% attempt=%GITHUB_RUN_ATTEMPT%
          echo SELF_HOSTED_RUNNER_OK=true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A real repo check, run the way ci.yml runs its checks -- python
      # directly under cmd, no shell indirection. Cheap and deterministic.
      - name: Toolchain and a real repo check execute on this runner
        shell: cmd
        run: |
          python --version
          node --version
          python scripts/workflow-contract.py
      - name: Execution marker
        shell: cmd
        run: |
          @echo off
          if "%RUNNER_NAME%"=="" exit /b 1
          echo RUNNER_PROBE_EXECUTED=true
          echo RUNNER_PROBE_RUN_ID=%GITHUB_RUN_ID%
          echo RUNNER_PROBE_RUN_ATTEMPT=%GITHUB_RUN_ATTEMPT%
