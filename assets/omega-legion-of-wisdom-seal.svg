<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="lw-t lw-d">
  <title id="lw-t">Legion of Wisdom seal</title>
  <desc id="lw-d">A circular gold seal. A faceted winged lion above a gold Omega on an onyx field, nine blue stars above its head. Ring text: The 144,000 Unified Consciousness Grid, Legion of Wisdom.</desc>
  <style>
    .wing{transform-box:view-box}
    .wing-r{transform-origin:384px 292px}
    .wing-l{transform-origin:216px 292px}
    @media (prefers-reduced-motion:no-preference){
      .wing-r{animation:beatR 5.2s ease-in-out infinite}
      .wing-l{animation:beatL 5.2s ease-in-out infinite}
      .stars .s{animation:twinkle 3.4s ease-in-out infinite}
      .stars .s:nth-child(2){animation-delay:-.4s}.stars .s:nth-child(3){animation-delay:-.9s}.stars .s:nth-child(4){animation-delay:-1.3s}
      .stars .s:nth-child(5){animation-delay:-1.8s}.stars .s:nth-child(6){animation-delay:-2.2s}.stars .s:nth-child(7){animation-delay:-2.6s}
      .stars .s:nth-child(8){animation-delay:-3s}.stars .s:nth-child(9){animation-delay:-3.2s}
      .eye{animation:eyes 4.6s ease-in-out infinite}
    }
    @keyframes beatR{0%,100%{transform:rotate(0)}50%{transform:rotate(-4.5deg)}}
    @keyframes beatL{0%,100%{transform:rotate(0)}50%{transform:rotate(4.5deg)}}
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes eyes{0%,100%{opacity:1}50%{opacity:.55}}
  </style>
  <defs>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8eab0"/><stop offset=".35" stop-color="#d9b445"/><stop offset=".7" stop-color="#a97f22"/><stop offset="1" stop-color="#e9cf7a"/></linearGradient>
    <linearGradient id="goldMane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98a"/><stop offset=".55" stop-color="#c49a30"/><stop offset="1" stop-color="#8a6414"/></linearGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeab0"/><stop offset=".6" stop-color="#dcb54a"/><stop offset="1" stop-color="#a47a1c"/></linearGradient>
    <linearGradient id="goldWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6414"/><stop offset=".5" stop-color="#d9b445"/><stop offset="1" stop-color="#fbeab0"/></linearGradient>
    <linearGradient id="goldWing2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8902a"/><stop offset="1" stop-color="#f6e7a8"/></linearGradient>
    <radialGradient id="field" cx="50%" cy="46%" r="60%"><stop offset="0" stop-color="#101c3a"/><stop offset=".7" stop-color="#070b18"/><stop offset="1" stop-color="#03040a"/></radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="fieldClip"><circle cx="300" cy="300" r="236"/></clipPath>
