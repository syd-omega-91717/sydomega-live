name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Runner diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_NAME)) { throw 'RUNNER_NAME is empty' }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_OS)) { throw 'RUNNER_OS is empty' }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_ARCH)) { throw 'RUNNER_ARCH is empty' }
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "runner_os=$env:RUNNER_OS"
          Write-Host "runner_arch=$env:RUNNER_ARCH"
          Write-Host "run=$env:GITHUB_RUN_ID"
          Write-Host "attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path . -File -Filter '*.js')
          if ($files.Count -eq 0) { throw 'No root JavaScript files found' }
          foreach ($file in $files) { node --check $file.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Inline JavaScript syntax
        run: python scripts/check-inline-js.py
      - name: Repository audit
        run: python scripts/audit.py
      - name: Audit tooling tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Production contract
        run: python scripts/production-contract.py
      - name: Workflow contract
        run: python scripts/workflow-contract.py
      - name: 16-block architecture contract
        run: python scripts/architecture-contract.py
      - name: 16-block implementation readiness
        run: python scripts/architecture-readiness.py
      - name: Capability registry
        run: python scripts/capability-audit.py --check
      - name: Capability runtime audit
        run: python scripts/capability-audit.py
      - name: Registry JSON
        run: python -m json.tool docs/capabilities/registry.json
      - name: Schema dictionary
        run: python scripts/schema-dictionary.py
        continue-on-error: true
      - name: RLS audit
        run: python scripts/rls-auditor.py
        continue-on-error: true
      - name: Silent failure audit
        run: python scripts/silent-failure-detector.py
        continue-on-error: true
      - name: Migration consistency
        run: python scripts/migration-consistency.py
        continue-on-error: true
      - name: Upsert conflict audit
        run: python scripts/upsert-conflict-check.py
        continue-on-error: true
      - name: Skill and agent registry
        run: python scripts/omega-registry.py --check
      - name: Context budget
        run: python scripts/context-budget.py
      - name: Client credential scan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $hits = @(Get-ChildItem -Path . -Recurse -File -Include '*.js','*.html','*.json' | Select-String -Pattern 'service_role|SUPABASE_SERVICE_ROLE_KEY')
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Host $_.ToString() }
            throw 'Client credential marker detected'
          }
      - name: Execution marker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_NAME)) { throw 'Runner identity missing' }
          Write-Host 'CI_EXECUTED=true'
          Write-Host "CI_RUN_ID=$env:GITHUB_RUN_ID"
          Write-Host "CI_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
