name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: python

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        # Deliberately AFTER setup-python, not first. `shell: python`
        # needs an interpreter on PATH, and a capability probe measured
        # pwsh working at step 6 but NOT at step 1 on this runner
        # ("pwsh: command not found"), which is exactly the mistake of
        # measuring in one position and assuming another. setup-python
        # guarantees it from here on, on both Windows and Linux.
        run: |
          import os, sys
          for var in ("RUNNER_NAME", "RUNNER_OS", "RUNNER_ARCH"):
              if not os.environ.get(var):
                  print(f"::error::{var} is empty - no real runner")
                  sys.exit(1)
          print("runner=" + os.environ["RUNNER_NAME"])
          print("runner_os=" + os.environ["RUNNER_OS"])
          print("runner_arch=" + os.environ["RUNNER_ARCH"])
          print("run=" + os.environ.get("GITHUB_RUN_ID", ""))
          print("attempt=" + os.environ.get("GITHUB_RUN_ATTEMPT", ""))
      - name: JavaScript syntax
        shell: python
        run: |
          import pathlib, subprocess, sys
          bad = [p.name for p in sorted(pathlib.Path(".").glob("*.js"))
                 if subprocess.run(["node", "--check", p.name]).returncode != 0]
          if bad:
              print("::error::syntax error in: " + ", ".join(bad))
              sys.exit(1)
          print(f"node --check clean")
      - name: Inline JavaScript syntax
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/check-inline-js.py']).returncode)
      - name: Repository audit
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/audit.py']).returncode)
      - name: Audit tooling tests
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', '-m', 'unittest', 'discover', '-s', 'scripts/tests', '-v']).returncode)
      - name: Production contract
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/production-contract.py']).returncode)
      - name: Workflow contract
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/workflow-contract.py']).returncode)
      - name: 16-block architecture contract
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/architecture-contract.py']).returncode)
      - name: 16-block implementation readiness
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/architecture-readiness.py']).returncode)
      - name: Capability registry
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/capability-audit.py', '--check']).returncode)
      - name: Capability runtime audit
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/capability-audit.py']).returncode)
      - name: Registry JSON
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', '-m', 'json.tool', 'docs/capabilities/registry.json']).returncode)
      - name: Schema dictionary
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/schema-dictionary.py']).returncode)
        continue-on-error: true
      - name: RLS audit
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/rls-auditor.py']).returncode)
        continue-on-error: true
      - name: Silent failure audit
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/silent-failure-detector.py']).returncode)
        continue-on-error: true
      - name: Migration consistency
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/migration-consistency.py']).returncode)
        continue-on-error: true
      - name: Upsert conflict audit
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/upsert-conflict-check.py']).returncode)
        continue-on-error: true
      - name: Skill and agent registry
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/omega-registry.py', '--check']).returncode)
      - name: i18n contract
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/i18n-contract.py']).returncode)
      - name: Context budget
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/context-budget.py']).returncode)
      - name: Client credential scan
        # shell: python, so this is identical on Windows and Linux. It replaces
        # a findstr pipeline that only existed on Windows. Semantics preserved:
        # recursive over *.js/*.html/*.json, case-insensitive, .git excluded,
        # non-zero exit on any hit -- matching scripts/ci-local.sh step 5.
        shell: python
        run: |
          import pathlib, sys
          NEEDLES = ("service_role", "supabase_service_role_key")
          hits = []
          for path in pathlib.Path(".").rglob("*"):
              if ".git" in path.parts or not path.is_file():
                  continue
              if path.suffix not in (".js", ".html", ".json"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  low = line.lower()
                  if any(x in low for x in NEEDLES):
                      hits.append(f"{path}:{n}: {line.strip()[:160]}")
          if hits:
              print("::error::service-role credential marker found in client code")
              for h in hits:
                  print(h)
              sys.exit(1)
          print("no service-role credential marker in client code")
      - name: Execution marker
        shell: python
        run: |
          import os, sys
          if not os.environ.get("RUNNER_NAME"):
              sys.exit(1)
          print("CI_EXECUTED=true")
          print("CI_RUN_ID=" + os.environ.get("GITHUB_RUN_ID", ""))
          print("CI_RUN_ATTEMPT=" + os.environ.get("GITHUB_RUN_ATTEMPT", ""))
