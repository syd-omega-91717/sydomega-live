name: Capability Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sydomega-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}" && test -n "${RUNNER_OS:-}" && test -n "${RUNNER_ARCH:-}"
          echo "runner=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "run=$GITHUB_RUN_ID"
          echo "attempt=$GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate capability registry
        run: python scripts/capability-audit.py --check
      - name: Source runtime audit
        run: python scripts/capability-audit.py
      - name: Validate registry JSON
        run: python -m json.tool docs/capabilities/registry.json
      - name: Validate architecture runtime
        run: python scripts/architecture-readiness.py
      - name: Install Playwright runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm --prefix "$RUNNER_TEMP/pw" install playwright --no-save --no-audit --no-fund --loglevel error
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          echo "OMEGA_SCRATCHPAD=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
      - name: Runtime verification (headless render of capability entrypoints)
        run: node scripts/verify-runtime.js
      - name: Execution marker
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          echo "CAPABILITY_EVIDENCE_EXECUTED=true"
          echo "CAPABILITY_EVIDENCE_RUN_ID=$GITHUB_RUN_ID"
          echo "CAPABILITY_EVIDENCE_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
