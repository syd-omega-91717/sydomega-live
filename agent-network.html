<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ω SYDOMEGA — Agent Network</title>
<style>
:root {
  /* Canonical tokens are deliberately NOT redefined here. This file carried its
     own divergent set (--gold:#ffd700 against the brand's #C9A84C, and nine
     more) -- CLAUDE.md 8.1 class 8, two divergent copies of one canonical
     table. Variables genuinely local to this page are kept below.

     This comment previously said two things that are both false, measured in
     FIXES_LOG 155, and they are corrected here so the error stops spreading:

       "bg.js owns --void, --gold, --cyan"
           bg.js declares ZERO custom properties. The owners are theme.js and
           css/omega-system.css. (--void additionally has a runtime owner that
           beats every stylesheet: bg.js:781 sets it inline on <html> from
           localStorage['omega_bg'].)

       "a page <style> beats bg.js"
           Backwards. A page's own <style> is sheet 0 and every injected sheet
           lands after it, so the page LOSES every equal-specificity tie. That
           inversion is exactly why so much of the estate accumulated token
           declarations that never applied to anything; the swept count is in
           FIXES_LOG 155, derived rather than typed here, because a number
           written into a page is a number that goes stale. */
  --D: 'Cinzel Decorative', serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(135deg, var(--void) 0%, var(--void2) 100%);
  color: var(--ink);
  font-family: var(--R);
  overflow-x: hidden;
  min-height: 100vh;
}

#omega-noise-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/></filter><rect width="100" height="100" filter="url(%23n)" opacity="0.03"/></svg>');
  pointer-events: none;
  z-index: 999;
  opacity: 0.035;
}

.shell {
  display: flex;
  min-height: 100vh;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.topbar {
  padding: 2rem;
  border-bottom: 1px solid rgba(0,229,255,0.1);
  background: rgba(10,14,21,0.8);
  backdrop-filter: blur(10px);
}

.topbar h1 {
  font-family: var(--D);
  font-size: 2.5rem;
  color: var(--gold);
  margin-bottom: 0.5rem;
  letter-spacing: 2px;
}

.topbar p {
  color: var(--muted);
  font-size: 0.95rem;
}

.network-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#network-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.agent-panel {
  position: fixed;
  right: 0;
  top: 0;
  width: 320px;
  height: 100vh;
  background: rgba(10,14,21,0.95);
  border-left: 1px solid rgba(0,229,255,0.2);
  backdrop-filter: blur(10px);
  overflow-y: auto;
  padding: 2rem 1.5rem;
  z-index: 100;
  transform: translateX(350px);
  transition: transform 0.3s ease;
}

.agent-panel.active {
  transform: translateX(0);
}

.agent-panel-title {
  font-family: var(--D);
  font-size: 1.5rem;
  color: var(--gold);
  margin-bottom: 1rem;
  letter-spacing: 1px;
}

.agent-stat {
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid rgba(255,215,0,0.1);
}

.agent-stat-label {
  font-family: var(--M);
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 0.3rem;
}

.agent-stat-value {
  font-family: var(--D);
  font-size: 1.8rem;
  color: var(--cyan);
}

.agent-info {
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--muted);
}

.close-panel {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: none;
  border: none;
  color: var(--gold);
  font-size: 1.5rem;
  cursor: pointer;
  z-index: 110;
}

.legend {
  /* Was `position: fixed`, which was wrong twice over. It is a legend FOR the
     canvas it sits beside inside .network-container, not viewport furniture --
     and at `left: 2rem` (x=32) it would have sat under the 80px sidebar even
     if it had worked. It never did work: a fixed element resolves `bottom`
     against its nearest containing block, and this one is inside a
     perspective'd ancestor, so it rendered at y=1457 on a 700px viewport --
     757px below the fold. .network-container is already `position: relative`,
     so `absolute` pins it to the bottom-left of the graph, which is what a
     graph legend is for. */
  position: absolute;
  bottom: 2rem;
  left: 2rem;
  background: rgba(10,14,21,0.95);
  border: 1px solid rgba(0,229,255,0.2);
  padding: 1.5rem;
  border-radius: 4px;
  backdrop-filter: blur(10px);
  max-width: 280px;
  z-index: 50;
}

.legend-title {
  font-family: var(--D);
  font-size: 1rem;
  color: var(--gold);
  margin-bottom: 1rem;
  letter-spacing: 1px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 0.7rem;
}

.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}

@keyframes glow-pulse {
  0%, 100% { filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px currentColor); }
  50% { filter: drop-shadow(0 0 12px currentColor) drop-shadow(0 0 24px currentColor); }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}

@media (max-width: 900px) {
  .agent-panel {
    width: 100%;
  }
  
  .legend {
    max-width: 240px;
    bottom: 1rem;
    left: 1rem;
  }
}
</style>
</head>
<body>
<div id="omega-noise-overlay"></div>

<!-- No inline display:none here. bg.js hides #app with a CSS rule keyed on
     `body:not(.omega-approved)` and lifts it by adding that class; an INLINE
     display:none cannot be lifted by any rule, so this page rendered blank
     permanently -- nothing in it ever removed the attribute. -->
<div class="shell" id="app">
  <aside class="side" id="omega-side" data-page="agent-network" aria-label="Navigation"></aside>
  
  <main class="main">
    <div class="topbar">
      <h1>⚡︎ AGENT NETWORK</h1>
      <p>12 Sovereign Executors • Archetypal Command Lattice • Click any node to explore</p>
    </div>
    
    <div class="network-container">
      <canvas id="network-canvas" role="img" aria-label="12-agent constellation network visualization"></canvas>
      <div class="legend">
        <div class="legend-title">NETWORK TOPOLOGY</div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--gold);"></div>
          <span>Core Executor</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--cyan);"></div>
          <span>Secondary Function</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--green);"></div>
          <span>Active Status</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: rgba(255,215,0,0.4);"></div>
          <span>Connection Link</span>
        </div>
      </div>
    </div>
    
    <div id="agent-panel" class="agent-panel">
      <button class="close-panel" onclick="closePanel()" aria-label="Close agent panel">✕</button>
      <div id="agent-content" data-stagger data-stagger-gap="60"></div>
    </div>
    <div data-page-emblem="agent-network" style="margin:20px auto 0"></div>
</main>
</div>

<script src="/bg.js" defer></script>
<script>
/* The roster is DERIVED, never restated. This page previously carried its own
   twelve-agent list and every single sign in it was wrong -- offset by four
   positions, so Sentinel read Sagittarius where the canon says Aries, and
   12 of 12 disagreed with omega-agents.json. That is CLAUDE.md 8.1 class 8,
   the failure that once had the live onboarding flow assigning the wrong god
   to nine of twelve signs.

   Colour is not restated either: omega-emblems.js owns the per-sign palette
   and exposes color(sign). The old literals were a third problem again --
   #ffd700 where the brand is #C9A84C.

   Same fetch-with-fallback posture as omega-constellation.js and agents.html
   use for the same file: names and signs only, nothing derived, so an offline
   render shows the real roster or the same twelve names, never an invention. */
const SIGN_GLYPH = {
  Aries:'\u2648\uFE0E', Taurus:'\u2649\uFE0E', Gemini:'\u264A\uFE0E',
  Cancer:'\u264B\uFE0E', Leo:'\u264C\uFE0E', Virgo:'\u264D\uFE0E',
  Libra:'\u264E\uFE0E', Scorpio:'\u264F\uFE0E', Sagittarius:'\u2650\uFE0E',
  Capricorn:'\u2651\uFE0E', Aquarius:'\u2652\uFE0E', Pisces:'\u2653\uFE0E'
};
const FALLBACK_AGENTS = [
  { name:'Sentinel', sign:'Aries',       role:'Security Guardian' },
  { name:'Merchant', sign:'Taurus',      role:'Commerce Steward' },
  { name:'Scout',    sign:'Gemini',      role:'Discovery Scout' },
  { name:'Warden',   sign:'Cancer',      role:'Family Warden' },
  { name:'Sovereign',sign:'Leo',         role:'Governance Sovereign' },
  { name:'Auditor',  sign:'Virgo',       role:'Validation Auditor' },
  { name:'Proxy',    sign:'Libra',       role:'Execution Proxy' },
  { name:'Oracle',   sign:'Scorpio',     role:'Prediction Oracle' },
  { name:'Beacon',   sign:'Sagittarius', role:'Onboarding Beacon' },
  { name:'Analyst',  sign:'Capricorn',   role:'Finance Analyst' },
  { name:'Tutor',    sign:'Aquarius',    role:'Education Tutor' },
  { name:'Historian',sign:'Pisces',      role:'Archive Historian' }
];

let agents = [];

function shapeAgent(a) {
  const sign = a.sign || 'Aries';
  let colour = 'var(--gold)';
  try {
    if (window.OmegaEmblem && typeof window.OmegaEmblem.color === 'function') {
      colour = window.OmegaEmblem.color(sign);
    }
  } catch (e) { /* keep the token fallback */ }
  return {
    id: String(a.name || '').toLowerCase(),
    name: a.name,
    domain: a.role || (Array.isArray(a.domains) ? a.domains.slice(0, 2).join(' & ') : ''),
    sign: sign,
    symbol: SIGN_GLYPH[sign] || '\u03A9',
    color: colour,
    status: a.name === 'Sovereign' ? 'core' : 'active'
  };
}

function loadAgents() {
  return fetch('/omega-agents.json')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      const list = j && (j.agents || j);
      return (Array.isArray(list) && list.length) ? list : FALLBACK_AGENTS;
    })
    .catch(function () { return FALLBACK_AGENTS; })
    .then(function (list) { agents = list.map(shapeAgent); return agents; });
}

function drawNetwork() {
  const canvas = document.getElementById('network-canvas');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const radius = Math.min(canvas.width, canvas.height) / 3;
  
  // Draw connections
  ctx.strokeStyle = 'rgba(0,229,255,0.15)';
  ctx.lineWidth = 2;
  for (let i = 0; i < agents.length; i++) {
    const angle1 = (i / agents.length) * Math.PI * 2 - Math.PI / 2;
    const x1 = centerX + Math.cos(angle1) * radius;
    const y1 = centerY + Math.sin(angle1) * radius;
    
    for (let j = i + 1; j < agents.length; j++) {
      const angle2 = (j / agents.length) * Math.PI * 2 - Math.PI / 2;
      const x2 = centerX + Math.cos(angle2) * radius;
      const y2 = centerY + Math.sin(angle2) * radius;
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }
  
  // Draw central sovereign
  ctx.fillStyle = 'rgba(255,215,0,0.1)';
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius * 0.5, 0, Math.PI * 2);
  ctx.fill();
  
  /* A canvas 2d context cannot resolve var(), so read the canonical token
     off the document rather than restating a hex here. */
  ctx.fillStyle = (getComputedStyle(document.documentElement)
    .getPropertyValue('--gold') || '#C9A84C').trim();
  ctx.font = 'bold 48px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Ω', centerX, centerY);
  
  // Draw agent nodes
  agents.forEach((agent, idx) => {
    const angle = (idx / agents.length) * Math.PI * 2 - Math.PI / 2;
    const x = centerX + Math.cos(angle) * radius;
    const y = centerY + Math.sin(angle) * radius;
    
    agent.x = x;
    agent.y = y;
    
    // Glow
    ctx.fillStyle = agent.color.replace(')', ', 0.2)').replace('rgb', 'rgba');
    ctx.beginPath();
    ctx.arc(x, y, 35, 0, Math.PI * 2);
    ctx.fill();
    
    // Node circle
    ctx.fillStyle = agent.color;
    ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI * 2);
    ctx.fill();
    
    // Border
    ctx.strokeStyle = agent.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Symbol
    ctx.fillStyle = '#000';
    ctx.font = 'bold 20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(agent.symbol, x, y);
    
    // Label
    ctx.fillStyle = agent.color;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(agent.name, x, y + 45);
  });
}

function openPanel(agentId) {
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;
  
  const panel = document.getElementById('agent-panel');
  const content = document.getElementById('agent-content');
  
  content.innerHTML = `
    <div class="agent-panel-title" data-reveal="fade-up">${agent.name}</div>
    <div class="agent-stat" data-reveal="rotate-in">
      <div class="agent-stat-label">Symbol</div>
      <div class="agent-stat-value" style="font-size: 2.5rem;">${agent.symbol}</div>
    </div>
    <div class="agent-stat" data-reveal="depth-in">
      <div class="agent-stat-label">Domain</div>
      <div class="agent-info">${agent.domain}</div>
    </div>
    <div class="agent-stat" data-reveal="depth-in">
      <div class="agent-stat-label">Status</div>
      <div class="agent-info" style="color: ${agent.status === 'core' ? 'var(--gold)' : 'var(--green)'}">${agent.status.toUpperCase()}</div>
    </div>
    <div class="agent-stat" data-reveal="depth-in">
      <div class="agent-stat-label">Authority</div>
      <div class="agent-info">Level 7 · Active Executor</div>
    </div>
    <div class="agent-stat" data-reveal="depth-in">
      <div class="agent-stat-label">Last Activity</div>
      <div class="agent-info">Real-time · Live monitoring</div>
    </div>
  `;
  
  panel.classList.add('active');
}

function closePanel() {
  document.getElementById('agent-panel').classList.remove('active');
}

function setupCanvasClickListener() {
  const canvas = document.getElementById('network-canvas');
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    for (let agent of agents) {
      const dist = Math.sqrt((x - agent.x) ** 2 + (y - agent.y) ** 2);
      if (dist < 35) {
        openPanel(agent.id);
        break;
      }
    }
  });
}

/* Draw once, and again only when the box actually changes size. This ran
   drawNetwork() inside an unbroken requestAnimationFrame loop -- a full
   canvas clear, buffer reallocation (canvas.width = ...) and twelve-node
   redraw, sixty times a second, forever, for a diagram that never moves.
   omega-gateway.js's own header records the same lesson: draw statically and
   let CSS carry any motion.

   A ResizeObserver rather than a resize event, because the approval guard
   reveals the shell without firing one (CLAUDE.md 8.1 class 3) -- that reveal
   is exactly when this canvas first gets a non-zero width. */
window.addEventListener('load', () => {
  loadAgents().then(() => {
    drawNetwork();
    setupCanvasClickListener();
  });
});

(function observeCanvasSize() {
  const canvas = document.getElementById('network-canvas');
  if (!canvas) return;
  if (window.ResizeObserver) {
    new ResizeObserver(() => { if (agents.length) drawNetwork(); }).observe(canvas);
  } else {
    window.addEventListener('resize', () => { if (agents.length) drawNetwork(); });
  }
})();
</script>
<script type="module" src="/omega-analytics-init.js"></script><script type="module" src="/omega-speed-insights-init.js"></script></body>
</html>
