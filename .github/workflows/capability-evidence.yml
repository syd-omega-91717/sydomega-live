name: Capability Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "os=$env:RUNNER_OS"
          Write-Host "arch=$env:RUNNER_ARCH"
          Write-Host "run=$env:GITHUB_RUN_ID"
          Write-Host "attempt=$env:GITHUB_RUN_ATTEMPT"
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_NAME)) { throw 'Runner name is empty' }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate capability registry
        run: python scripts/capability-audit.py --check
      - name: Source runtime audit
        run: python scripts/capability-audit.py
      - name: Validate registry JSON
        run: python -m json.tool docs/capabilities/registry.json
