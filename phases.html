<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Omega SYD OMEGA 91717 - The Phases</title>
<meta name="theme-color" content="#C9A84C"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Courier+Prime:wght@400;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --void:#0A0A0F; --panel:#0d0d15; --gold:#C9A84C; --solar:#E2C86D; --cyan:#00E5FF; --crimson:#8B0000; --ink:#e9e6dc; --muted:#85837b; --line:rgba(201,168,76,0.16); --display:'Cinzel Decorative',serif; --body:'Rajdhani',sans-serif; --mono:'Courier Prime',monospace; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--void);color:var(--ink);font-family:var(--body);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:26px 18px 90px}
  .topbar .t{font-family:var(--display);font-weight:700;color:var(--gold);font-size:clamp(20px,3vw,30px);letter-spacing:2px}
  .topbar small{display:block;font-family:var(--mono);color:var(--muted);letter-spacing:3px;font-size:11px;margin-top:6px}
  .hero{margin:22px 0;border:1px solid var(--line);border-radius:16px;padding:22px;background:linear-gradient(180deg,rgba(201,168,76,.05),transparent)}
  .hero .cur{font-family:var(--display);font-size:52px;color:var(--gold);line-height:1}
  .hero .nm{font-family:var(--display);color:var(--solar);font-size:20px;margin-top:4px}
  .hero .auth{font-family:var(--mono);color:var(--cyan);letter-spacing:2px;font-size:13px;margin-top:10px}
  .bar{height:8px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--solar))}
  .bar-lbl{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:1px;margin-top:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:22px}
  .card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel);transition:all .25s}
  .card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 28px -8px rgba(226,200,109,.5)}
  .card.locked{opacity:.5}
  .card .rn{font-family:var(--display);color:var(--gold);font-size:26px}
  .card .gn{font-family:var(--body);font-weight:600;color:var(--ink);margin:4px 0}
  .card .th{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:1px}
  .card .tag{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:2px;padding:3px 8px;border-radius:10px}
  .tag.now{background:rgba(201,168,76,.16);color:var(--solar)} .tag.done{background:rgba(63,178,127,.14);color:#7ad1a0} .tag.lock{background:rgba(255,255,255,.04);color:var(--muted)}
  .gate{max-width:460px;margin:80px auto;text-align:center;border:1px solid var(--line);border-radius:16px;padding:40px}
  .gate .g{font-family:var(--display);font-size:52px;color:var(--gold)} .gate h2{font-family:var(--display);color:var(--gold)}
  .gate a{display:inline-block;font-family:var(--mono);letter-spacing:2px;font-size:12px;color:var(--void);background:var(--gold);padding:13px 24px;text-decoration:none;margin-top:12px}
</style>
</head>
<body>
  <div id="gate" class="gate" style="display:none"><div class="g">&#937;</div><h2 id="gate-h">The Phases</h2><p id="gate-p" style="color:var(--muted)">Sign in to see your phase.</p><a href="/account.html">GO TO MEMBER ACCESS &rarr;</a></div>
  <div id="app" class="wrap" style="display:none">
    <div class="topbar"><div class="t">THE PHASES</div><small>12 NARRATIVE PHASES &middot; YOUR ARC THROUGH THE 729</small></div>
    <div class="hero">
      <div class="cur" id="cur-grade">--</div>
      <div class="nm" id="cur-name">--</div>
      <div class="auth" id="cur-auth">AUTHORITY --</div>
      <div class="bar"><i id="bar" style="width:0%"></i></div>
      <div class="bar-lbl" id="bar-lbl">--</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient("https://ydqhzvvoyufiiqvzcjns.supabase.co","sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q");
  const APEX=15.588;
  const NAMES=['The Awakening','The Calling','The Foundation','The First Gate','The Trials','The Ascent','The Convergence','The Sovereign Trial','The Celestial Alignment','The Dominion','The Legacy','The Omega'];
  const LORE=['Your cosmology awakens. The matrix opens.','The signs reveal your path and agent.','Knowledge takes root across the first nodes.','The first of twelve gates yields.','Mastery is tested in the arena.','You climb past the midpoint of the 729.','All three axes move in synchrony.','The Order weighs your authority.','Planet, element, god and agent align fully.','Your influence spreads across the matrix.','Your heritage is sealed into the vault.','The apex. Sovereign mastery, 9-9-9.'];
  function grd(auth){ return Math.max(1, Math.min(12, Math.ceil(auth/APEX*12))); }
  function boot(){ supabase.auth.getSession().then(function(r){
    var s=r.data.session; if(!s){ document.getElementById('gate').style.display='block'; return; }
    supabase.from('profiles').select('axis_a,axis_b,axis_c').eq('id',s.user.id).maybeSingle().then(function(p){
      var a=Number((p.data&&p.data.axis_a)||1),b=Number((p.data&&p.data.axis_b)||1),c=Number((p.data&&p.data.axis_c)||1);
      var auth=Math.sqrt(a*a+b*b+c*c); var g=grd(auth);
      document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block';
      document.getElementById('cur-grade').textContent='PHASE '+g;
      document.getElementById('cur-name').textContent=NAMES[g-1];
      document.getElementById('cur-auth').textContent='AUTHORITY '+auth.toFixed(3)+' / '+APEX;
      var lo=(g-1)/12*APEX, hi=g/12*APEX, within=Math.max(0,Math.min(1,(auth-lo)/(hi-lo)));
      document.getElementById('bar').style.width=(within*100).toFixed(1)+'%';
      document.getElementById('bar-lbl').textContent=g<12?('NEXT: PHASE '+(g+1)+' \u2014 '+NAMES[g]+' at authority '+hi.toFixed(2)):'THE OMEGA PHASE REACHED';
      var grid=document.getElementById('grid'); grid.innerHTML='';
      for(var i=1;i<=12;i++){ (function(i){
        var st=i<g?'done':(i===g?'now':'lock'); var tag=i<g?'PASSED':(i===g?'CURRENT':'LOCKED');
        var el=document.createElement('div'); el.className='card '+(i===g?'on':(i>g?'locked':''));
        el.innerHTML='<div class="rn">'+(i<10?'0'+i:i)+'</div><div class="gn">'+NAMES[i-1]+'</div><div class="th" style="margin:6px 0">'+LORE[i-1]+'</div><div class="th">authority &ge; '+((i-1)/12*APEX).toFixed(2)+'</div><span class="tag '+st+'">'+tag+'</span>';
        grid.appendChild(el);
      })(i); }
    });
  }); }
  boot();
</script>
<script src="/nav.js"></script>
<script src="/bg.js"></script>
</body>
</html>
