name: Supabase Runtime Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Supabase runtime health
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Runtime contract
        shell: python
        run: python scripts/supabase-runtime-contract.py
