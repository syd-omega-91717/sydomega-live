<style>
  :root{ --void:#0A0A0F; --panel:#0d0d15; --panel-2:#11111c; --gold:#C9A84C; --solar:#E2C86D; --cyan:#00E5FF; --crimson:#8B0000; --ink:#e9e6dc; --muted:#85837b; --line:rgba(201,168,76,0.16); --display:'Cinzel Decorative',serif; --body:'Rajdhani',sans-serif; --mono:'Courier Prime',monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(201,168,76,.07),transparent 48%)}
  a{color:inherit;text-decoration:none}
  .shell{position:relative;z-index:1;display:flex;min-height:100vh}
  .side{width:248px;flex-shrink:0;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,rgba(13,13,21,.6),transparent)}
  .brand{font-family:var(--display);font-weight:900;color:var(--gold);font-size:22px;letter-spacing:1px;text-align:center}
  .brand small{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:4px;margin-top:6px}
  .nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
  .nav a,.nav .lk{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--ink);padding:11px 12px;border-left:2px solid transparent;cursor:pointer}
  .nav a:hover{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.04)}
  .nav a.on{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.06)}
  .nav .sec{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin:18px 0 6px 12px}
  .nav .lk{color:var(--muted);cursor:default}
  .nav .lk .ph{font-size:8px;letter-spacing:1px;color:var(--crimson);border:1px solid rgba(139,0,0,.5);padding:2px 5px}
  .side .out{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--cyan);padding:11px 12px;cursor:pointer;border-top:1px solid var(--line)}

  .main{flex:1;min-width:0;padding:24px clamp(16px,3vw,40px) 60px}
  .topbar{border-bottom:1px solid var(--line);padding-bottom:18px}
  .topbar .t{font-family:var(--display);font-weight:700;color:var(--gold);font-size:clamp(18px,3vw,26px);letter-spacing:2px}
  .topbar .t small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:4px}

  .searchwrap{position:relative;margin:22px 0 8px}
  #q{width:100%;font-family:var(--body);font-size:20px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--gold);padding:18px 20px;color-scheme:dark}
  #q:focus{outline:none;border-color:var(--cyan);border-left-color:var(--gold)}
  .count{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);margin:8px 2px 18px}

  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .res{display:block;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);padding:16px 18px;cursor:pointer;transition:transform .14s,border-color .14s}
  .res:hover,.res.hot{transform:translateY(-2px);border-color:var(--gold);background:rgba(201,168,76,.05)}
  .res .rh{display:flex;align-items:center;gap:10px}
  .res .ic{width:30px;height:30px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--gold);font-size:15px;flex-shrink:0}
  .res .rl{font-family:var(--display);font-weight:700;color:var(--gold);font-size:15px;letter-spacing:.5px}
  .res .rd{font-weight:300;color:var(--muted);font-size:13px;line-height:1.5;margin-top:8px}
  .res .go{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--cyan);margin-top:10px}
  .res.owner{border-left:2px solid var(--solar)}
  .empty{font-family:var(--mono);font-size:12px;color:var(--muted);padding:20px 0}

  .gate-card{max-width:440px;margin:14vh auto 0;border:1px solid var(--line);background:var(--panel);padding:40px 30px;text-align:center}
  .gate-card .g{font-family:var(--display);font-size:56px;color:var(--gold)}
  .gate-card h2{font-family:var(--display);color:var(--gold);font-weight:700;margin:10px 0}
  .gate-card p{font-weight:300;color:var(--muted);margin-bottom:22px}
  .gate-card a{display:inline-block;font-family:var(--mono);letter-spacing:2px;font-size:12px;color:var(--void);background:var(--gold);padding:14px 26px}
  #app{display:none}
  @media(max-width:760px){ .shell{flex-direction:column} .side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line)} .nav{flex-direction:row;flex-wrap:wrap} .nav .sec,.nav .lk{display:none} }
</style>
</head>
<body>
<div id="gate" class="gate-card" style="display:none">
  <div class="g">&#937;</div>
  <h2 id="gate-h">Search</h2>
  <p id="gate-p">Sign in to search the Order.</p>
  <a href="/account.html">GO TO MEMBER ACCESS &rarr;</a>
</div>

<div class="shell" id="app" style="display:none">
  <aside class="side" id="omega-side" data-page="search"></aside>
  <main class="main">
    <div class="topbar"><div class="t">SEARCH<small>FIND ANY CHAMBER OF THE ORDER</small></div><canvas id="srch-ring-auth" data-omega-ring data-ring-size="44" data-ring-color="gold" data-ring-value="0" data-ring-live style="flex-shrink:0;margin-left:auto" aria-label="Authority ring" role="img" data-tooltip="Your sovereign authority score — visualised as a living ring. Apex = 27.8367" data-tooltip-placement="bottom"></canvas></div>
    <div class="searchwrap"><input id="q" type="text" placeholder="Type a name or word \u2014 matrix, games, agents, contracts, horoscope\u2026" autocomplete="off" /></div>
    <div class="count" id="count"></div>
    <div class="results" id="results"></div>
  </main>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  var sb=window.__omegaSb||(window.__omegaSb=createClient('https://ydqhzvvoyufiiqvzcjns.supabase.co','sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q'));var supabase=sb;
  let isOwner=false;

  const INDEX=[
    {l:'Dashboard',p:'/dashboard.html',d:'Your command center \u2014 standing, agent, certificates, modules.',k:'home overview command radar'},
    {l:'Profile',p:'/profile.html',d:'Your identity, axes, photo, recovery details, evolution log.',k:'account name avatar photo phone country recovery axes'},
    {l:'Ascension',p:'/ascension.html',d:'The 12-phase engine and the 9-tier ladder of rank.',k:'phases tiers rank promotion levels grades'},
    {l:'The Lattice',p:'/matrix.html',d:'Your 729-node matrix rendered in rotating 3D.',k:'matrix 3d cube nodes 9x9x9 lattice'},
    {l:'AI Agents',p:'/agents.html',d:'The twelve agents \u2014 each upgrades with your matrix.',k:'agents sentinel oracle sovereign chat console level'},
    {l:'Honors',p:'/honors.html',d:'Grades, levels, certificates, trophies, medals, labels, commitment.',k:'trophies medals certificates grades levels labels awards'},
    {l:'Horoscope',p:'/horoscope.html',d:'Daily reading, character, and your god/planet ascent.',k:'horoscope zodiac sign god planet daily stars personality'},
    {l:'Academy',p:'/academy.html',d:'Lessons that raise your Knowledge axis.',k:'academy lessons learn knowledge education'},
    {l:'The Games',p:'/gaming.html',d:'12 games \u00d7 12 stages, matrix-gated, raising Mastery.',k:'games arena play sequence mastery stages nodes'},
    {l:'Contributions',p:'/contributions.html',d:'Acts that raise your Contribution axis.',k:'contributions give acts contribution'},
    {l:'Consultancy',p:'/consultancy.html',d:'Request counsel with confidentiality + commission.',k:'consultancy advice experts confidential commission file'},
    {l:'Commissions',p:'/contracts.html',d:'Draft member-to-trade contracts with the Order\u2019s cut.',k:'contracts commission deal counterparty agreement'},
    {l:'Media Codex',p:'/media.html',d:'The Codex and the nine-film cycle.',k:'media codex films cycle'},
    {l:'Cinema',p:'/cinema.html',d:'The Myth Verse \u2014 the nine-film saga catalog.',k:'cinema films saga movies posters myth verse'},
    {l:'Publishing',p:'/publishing.html',d:'Commit works to your private archive (approved to go public).',k:'publishing works archive manuscript upload private approval'},
    {l:'Marketing',p:'/marketing.html',d:'Reserve placement \u2014 submitted for your approval.',k:'marketing ads placement boost approval creative'},
    {l:'News & Wire',p:'/news.html',d:'Sovereign dispatches and the member wire.',k:'news dispatches wire feed intel bulletin'},
    {l:'Treasury',p:'/treasury.html',d:'The internal \u03A9 economy and supply.',k:'treasury omega economy supply tokens vault'},
    {l:'Sigil Vault',p:'/sigil.html',d:'Your earned sovereign medallions.',k:'sigil vault medallions crests seals'},
    {l:'Family & Heritage',p:'/family.html',d:'Your bloodline tree and the Heritage Protocol.',k:'family heritage bloodline tree heir succession'},
    {l:'Hall of the Order',p:'/hall.html',d:'Public standing and stats of the Order.',k:'hall stats public sovereigns leaderboard'},
    {l:'Settings',p:'/settings.html',d:'Background colour, the score, and your preferences.',k:'settings background colour theme music preferences'},
    {l:'Charter',p:'/charter.html',d:'The eleven Articles and the economic framework.',k:'charter articles law ownership governance'},
    {l:'Approvals',p:'/approvals.html',d:'Owner only \u2014 admit members and approve publications.',k:'approvals owner admit access approve queue',owner:true}
  ];

  function recentKey(){ return 'omega_recent_searches'; }
  function getRecent(){ try{ return JSON.parse(localStorage.getItem(recentKey())||'[]'); }catch(e){ return []; } }
  function pushRecent(item){
    try{
      var r=getRecent().filter(function(x){ return x.p!==item.p; });
      r.unshift({l:item.l,p:item.p});
      localStorage.setItem(recentKey(), JSON.stringify(r.slice(0,5)));
    }catch(e){}
  }

  function render(list){
    var box=document.getElementById('results'); box.innerHTML='';
    if(!list.length){ box.innerHTML='<div class="empty">No chamber matches that. Try \u201cmatrix\u201d, \u201cgames\u201d, \u201cagents\u201d\u2026</div>'; document.getElementById('count').textContent='0 RESULTS'; return; }
    document.getElementById('count').textContent=list.length+' '+(list.length===1?'CHAMBER':'CHAMBERS');
    list.forEach(function(it,idx){
      var a=document.createElement('a'); a.className='res'+(it.owner?' owner':'')+(idx===0?' hot':''); a.href=it.p;
      a.addEventListener('click',function(){ pushRecent(it); });
      a.innerHTML='<div class="rh"><div class="ic">\u03A9</div><div class="rl">'+it.l+'</div></div><div class="rd">'+it.d+'</div><div class="go">OPEN \u2192</div>';
      box.appendChild(a);
    });
  }
  function renderRecent(){
    var box=document.getElementById('results'); box.innerHTML='';
    var recent=getRecent();
    if(!recent.length){ render(visible()); return; }
    document.getElementById('count').textContent='RECENT';
    recent.forEach(function(it){
      var full=INDEX.find(function(x){ return x.p===it.p; });
      if(!full || (full.owner && !isOwner)) return;
      var a=document.createElement('a'); a.className='res'; a.href=full.p;
      a.addEventListener('click',function(){ pushRecent(full); });
      a.innerHTML='<div class="rh"><div class="ic">\u21BB</div><div class="rl">'+full.l+'</div></div><div class="rd">'+full.d+'</div><div class="go">OPEN \u2192</div>';
      box.appendChild(a);
    });
  }
  function visible(){ return INDEX.filter(function(it){ return !it.owner || isOwner; }); }
  function search(){
    var q=document.getElementById('q').value.trim().toLowerCase();
    var pool=visible();
    if(!q){ renderRecent(); return; }
    var terms=q.split(/\s+/);
    var scored=pool.map(function(it){
      var hay=(it.l+' '+it.d+' '+it.k).toLowerCase();
      var score=0; terms.forEach(function(t){ if(it.l.toLowerCase().indexOf(t)!==-1) score+=3; else if(hay.indexOf(t)!==-1) score+=1; });
      return {it:it,score:score};
    }).filter(function(x){ return x.score>0; }).sort(function(a,b){ return b.score-a.score; });
    render(scored.map(function(x){ return x.it; }));
  }
  var searchTimer=null;
  function debouncedSearch(){ clearTimeout(searchTimer); searchTimer=setTimeout(search,150); }

  function showGate(h,p){ document.getElementById('gate-h').textContent=h; document.getElementById('gate-p').textContent=p; document.getElementById('gate').style.display='block'; document.getElementById('app').style.display='none'; }

  async function boot(){
    var sess=(await supabase.auth.getSession()).data.session;
    if(!sess){ showGate('Search','Sign in to search the Order.'); return; }
    var pr=await supabase.from('profiles').select('sign,is_owner').eq('id',sess.user.id).maybeSingle();
    if(!pr.data || !pr.data.sign){ showGate('Set Your Cosmology','Set your cosmology first.'); return; }
    isOwner=!!(pr.data && pr.data.is_owner);
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='flex';
    renderRecent();
    document.getElementById('q').focus();
  }
  document.getElementById('q').addEventListener('input',debouncedSearch);
  document.getElementById('q').addEventListener('keydown',function(e){ if(e.key==='Enter'){ var first=document.querySelector('.res'); if(first) window.location.href=first.getAttribute('href'); } });
  document.getElementById('logout')?.addEventListener('click',async function(){ await supabase.auth.signOut(); window.location.href='/account.html'; });
  boot();
</script>
<script src="/nav.js"></script>
<script src="/bg.js"></script><script src="/omega-demo-video.js" defer></script>
</body>
</html>
