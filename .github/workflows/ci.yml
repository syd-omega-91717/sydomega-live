name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          if (-not $env:RUNNER_OS)   { exit 1 }
          if (-not $env:RUNNER_ARCH) { exit 1 }
          "runner=$env:RUNNER_NAME"
          "runner_os=$env:RUNNER_OS"
          "runner_arch=$env:RUNNER_ARCH"
          "run=$env:GITHUB_RUN_ID"
          "attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem -File -Filter *.js | ForEach-Object {
            node --check $_.Name
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Inline JavaScript syntax
        shell: pwsh
        run: python scripts/check-inline-js.py
      - name: Repository audit
        shell: pwsh
        run: python scripts/audit.py
      - name: Audit tooling tests
        shell: pwsh
        run: python -m unittest discover -s scripts/tests -v
      - name: Production contract
        shell: pwsh
        run: python scripts/production-contract.py
      - name: Workflow contract
        shell: pwsh
        run: python scripts/workflow-contract.py
      - name: 16-block architecture contract
        shell: pwsh
        run: python scripts/architecture-contract.py
      - name: 16-block implementation readiness
        shell: pwsh
        run: python scripts/architecture-readiness.py
      - name: Capability registry
        shell: pwsh
        run: python scripts/capability-audit.py --check
      - name: Capability runtime audit
        shell: pwsh
        run: python scripts/capability-audit.py
      - name: Registry JSON
        shell: pwsh
        run: python -m json.tool docs/capabilities/registry.json
      - name: Schema dictionary
        shell: pwsh
        run: python scripts/schema-dictionary.py
        continue-on-error: true
      - name: RLS audit
        shell: pwsh
        run: python scripts/rls-auditor.py
        continue-on-error: true
      - name: Silent failure audit
        shell: pwsh
        run: python scripts/silent-failure-detector.py
        continue-on-error: true
      - name: Migration consistency
        shell: pwsh
        run: python scripts/migration-consistency.py
        continue-on-error: true
      - name: Upsert conflict audit
        shell: pwsh
        run: python scripts/upsert-conflict-check.py
        continue-on-error: true
      - name: Skill and agent registry
        shell: pwsh
        run: python scripts/omega-registry.py --check
      - name: i18n contract
        shell: pwsh
        run: python scripts/i18n-contract.py
      - name: Context budget
        shell: pwsh
        run: python scripts/context-budget.py
      - name: Client credential scan
        # shell: python, so this is identical on Windows and Linux. It replaces
        # a findstr pipeline that only existed on Windows. Semantics preserved:
        # recursive over *.js/*.html/*.json, case-insensitive, .git excluded,
        # non-zero exit on any hit -- matching scripts/ci-local.sh step 5.
        shell: python
        run: |
          import pathlib, sys
          NEEDLES = ("service_role", "supabase_service_role_key")
          hits = []
          for path in pathlib.Path(".").rglob("*"):
              if ".git" in path.parts or not path.is_file():
                  continue
              if path.suffix not in (".js", ".html", ".json"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  low = line.lower()
                  if any(x in low for x in NEEDLES):
                      hits.append(f"{path}:{n}: {line.strip()[:160]}")
          if hits:
              print("::error::service-role credential marker found in client code")
              for h in hits:
                  print(h)
              sys.exit(1)
          print("no service-role credential marker in client code")
      - name: Execution marker
        shell: pwsh
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          "CI_EXECUTED=true"
          "CI_RUN_ID=$env:GITHUB_RUN_ID"
          "CI_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
