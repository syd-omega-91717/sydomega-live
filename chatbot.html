<style>
  :root{ --void:#0A0A0F; --panel:#0d0d15; --panel-2:#11111c; --gold:#C9A84C; --solar:#E2C86D; --cyan:#00E5FF; --crimson:#8B0000; --ink:#e9e6dc; --muted:#85837b; --line:rgba(201,168,76,0.16); --display:'Cinzel Decorative',serif; --body:'Rajdhani',sans-serif; --mono:'Courier Prime',monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(201,168,76,.07),transparent 48%)}
  a{color:inherit;text-decoration:none}
  .shell{position:relative;z-index:1;display:flex;min-height:100vh}
  .side{width:248px;flex-shrink:0;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,rgba(13,13,21,.6),transparent)}
  .brand{font-family:var(--display);font-weight:900;color:var(--gold);font-size:22px;letter-spacing:1px;text-align:center}
  .brand small{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:4px;margin-top:6px}
  .nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
  .nav a,.nav .lk{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--ink);padding:11px 12px;border-left:2px solid transparent;cursor:pointer}
  .nav a:hover{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.04)}
  .nav a.on{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.06)}
  .nav .sec{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin:18px 0 6px 12px}
  .nav .lk{color:var(--muted);cursor:default}
  .nav .lk .ph{font-size:8px;letter-spacing:1px;color:var(--crimson);border:1px solid rgba(139,0,0,.5);padding:2px 5px}
  .side .out{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--cyan);padding:11px 12px;cursor:pointer;border-top:1px solid var(--line)}

  .main{flex:1;min-width:0;padding:24px clamp(16px,3vw,40px) 30px;display:flex;flex-direction:column;min-height:100vh}
  .topbar{border-bottom:1px solid var(--line);padding-bottom:18px}
  .topbar .t{font-family:var(--display);font-weight:700;color:var(--gold);font-size:clamp(18px,3vw,26px);letter-spacing:2px}
  .topbar .t small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:4px}

  .chat{flex:1;display:flex;flex-direction:column;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);margin-top:18px;min-height:0}
  .log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:300px}
  .bub{max-width:80%;padding:12px 15px;font-size:15px;line-height:1.6;font-weight:300}
  .bub.b{align-self:flex-start;border:1px solid var(--line);border-left:2px solid var(--gold);background:rgba(201,168,76,.04);color:var(--ink)}
  .bub.u{align-self:flex-end;border:1px solid rgba(0,229,255,.3);background:rgba(0,229,255,.05);color:var(--ink)}
  .bub b{color:var(--gold);font-weight:400}
  .bub .nm{display:block;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:5px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 12px}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--cyan);border:1px solid var(--line);padding:6px 11px;cursor:pointer}
  .chip:hover{border-color:var(--gold);color:var(--gold)}
  .inrow{display:flex;gap:10px;border-top:1px solid var(--line);padding:14px 18px}
  .inrow input{flex:1;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:12px 14px;color-scheme:dark}
  .inrow input:focus{outline:none;border-color:var(--cyan)}
  .inrow button{font-family:var(--mono);letter-spacing:2px;font-size:12px;color:var(--void);background:var(--gold);padding:0 20px;border:1px solid var(--gold);cursor:pointer}
  .inrow button:hover{background:transparent;color:var(--gold)}

  .gate-card{max-width:440px;margin:14vh auto 0;border:1px solid var(--line);background:var(--panel);padding:40px 30px;text-align:center}
  .gate-card .g{font-family:var(--display);font-size:56px;color:var(--gold)}
  .gate-card h2{font-family:var(--display);color:var(--gold);font-weight:700;margin:10px 0}
  .gate-card p{font-weight:300;color:var(--muted);margin-bottom:22px}
  .gate-card a{display:inline-block;font-family:var(--mono);letter-spacing:2px;font-size:12px;color:var(--void);background:var(--gold);padding:14px 26px}
  #app{display:none}
  @media(max-width:760px){ .shell{flex-direction:column} .side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line)} .nav{flex-direction:row;flex-wrap:wrap} .nav .sec,.nav .lk{display:none} }

<style>
.omega-hero-band{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-bottom:1px solid rgba(201,168,76,.15);background:linear-gradient(135deg,rgba(201,168,76,.05),rgba(10,10,15,.8),rgba(0,229,255,.03));min-height:90px}
.ohb-left{padding:18px clamp(14px,2.5vw,28px);border-right:1px solid rgba(201,168,76,.15)}

</style>
    <div class="omega-hero-band">
      <div class="ohb-left">
        <div class="ohb-stat" id="ohb-l-chatbot">--</div>
        <div class="ohb-lbl">AI SESSIONS</div>
      </div>
      <div class="ohb-center">
        <canvas id="ohb-cv-chatbot" width="120" height="120" style="width:60px;height:60px;display:block"></canvas>
      </div>
      <div class="ohb-right">
        <div class="ohb-stat" id="ohb-r-chatbot">--</div>
        <div class="ohb-lbl">QUERIES HANDLED</div>
      </div>
    </div>
    <script>
    (function(){var cv=document.getElementById('ohb-cv-chatbot');if(!cv||!cv.getContext)return;
    var ctx=cv.getContext('2d'),t=0;
    function frame(){ctx.clearRect(0,0,120,120);
    for(var i=0;i<8;i++){ctx.beginPath();
    ctx.arc(60,60,20+i*5+4*Math.sin(t*.03+i),t*.008*((i%2)?1:-1),t*.008*((i%2)?1:-1)+Math.PI*(0.5+0.3*Math.sin(t*.02+i)));
    ctx.strokeStyle='rgba(201,168,76,'+(0.08+0.12*(8-i)/8)+')'+(i===7?'':'');
    ctx.lineWidth=1+0.5*(8-i)/8;ctx.stroke();}
    ctx.font='bold 22px "Cinzel Decorative",serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(201,168,76,'+(0.7+0.3*Math.sin(t*.04))+')';
    ctx.shadowColor='#C9A84C';ctx.shadowBlur=10+5*Math.sin(t*.04);
    ctx.fillText('\u03A9',60,60);ctx.shadowBlur=0;t++;requestAnimationFrame(frame);}frame();
    })();
    </script></div>
    <div class="chat">
      <div class="log" id="log"></div>
      <div class="chips" id="chips"></div>
      <div class="inrow">
        <input id="msg" type="text" placeholder="Ask about the matrix, your standing, or any chamber\u2026" autocomplete="off" />
        <button id="send">SEND</button>
      </div>
    </div>
  
    <div style="display:flex;justify-content:center;padding:18px 0 8px;border-top:1px solid rgba(201,168,76,.15);margin-top:auto">
      <canvas id="pg-cv-chatbot" width="80" height="80" style="width:40px;height:40px;opacity:.6"></canvas>
    </div>
    <script>
    (function(){
      var cv=document.getElementById('pg-cv-chatbot');
      if(!cv||!cv.getContext)return;
      var ctx=cv.getContext('2d'),t=0;
      function frame(){
        ctx.clearRect(0,0,80,80);
        ctx.save();ctx.translate(40,40);ctx.rotate(t*.008);
        for(var i=0;i<6;i++){
          ctx.rotate(Math.PI/3);ctx.beginPath();
          ctx.moveTo(0,0);ctx.lineTo(26+4*Math.sin(t*.04+i),0);
          ctx.strokeStyle='rgba(201,168,76,'+(0.25+0.25*Math.sin(t*.05+i))+')';
          ctx.lineWidth=1;ctx.stroke();
        }
        ctx.restore();
        ctx.font='bold 18px "Cinzel Decorative",serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='rgba(201,168,76,'+(0.5+0.3*Math.sin(t*.04))+')';
        ctx.shadowColor='#C9A84C';ctx.shadowBlur=8+4*Math.sin(t*.04);
        ctx.fillText('\u03A9',40,40);ctx.shadowBlur=0;
        t++;requestAnimationFrame(frame);
      }
      frame();
    })();
    </script></main>

<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
var sb=window.__omegaSb||(window.__omegaSb=createClient('https://ydqhzvvoyufiiqvzcjns.supabase.co','sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q'));
var _history=[],_profile=null,_currentAgent=null;

function sid(id,v){var el=document.getElementById(id);if(el)el.textContent=String(v==null?'--':v);}

(async function init(){
  try{
    var s=(await sb.auth.getSession()).data.session;
    if(!s){location.replace('/account.html');return;}
    _profile=(await sb.from('profiles').select('*').eq('id',s.user.id).maybeSingle()).data||{};
    if(!_profile.is_owner&&!_profile.access_approved){location.replace('/pending.html');return;}
    document.getElementById('app').style.display='flex';
    if(window.__omegaPopulate)window.__omegaPopulate(_profile,s.user);
    window.__omegaUserLoaded=true;
    /* Select default agent based on member sign */
    if(_profile.agent_name) selectAgentByName(_profile.agent_name);
    /* Load conversation history from memory */
    if(window.OmegaMemory){
      var ctx=await window.OmegaMemory.context();
      if(ctx) addMsg('system','Memory context loaded: '+ctx.split('\n')[0],'var(--muted)');
    }
  }catch(e){document.getElementById('app').style.display='flex';console.warn(e);}
})();

function selectAgentByName(name){
  _currentAgent=name;
  var agentEl=document.querySelector('[data-agent="'+name+'"]');
  if(agentEl) agentEl.click();
}

function addMsg(role,text,col){
  var msgs=document.getElementById('chat-msgs')||document.querySelector('.chat-msgs,.messages');
  if(!msgs) return;
  var d=document.createElement('div');
  d.style.cssText='padding:10px 14px;border-radius:2px;margin-bottom:8px;max-width:88%;font-size:11px;line-height:1.7;'
    +(role==='user'?'background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.15);align-self:flex-end;color:#e9e6dc;margin-left:auto'
    :role==='system'?'color:rgba(138,134,118,.5);font-family:var(--M,"Courier Prime",monospace);font-size:8px;letter-spacing:1px;text-align:center;width:100%'
    :'background:rgba(10,10,15,.8);border:1px solid rgba(201,168,76,.06);color:#e9e6dc;align-self:flex-start');
  if(col) d.style.color=col;
  /* Render markdown for AI responses */
  if(role==='ai'&&window.OmegaOSS){
    window.OmegaOSS.require('marked',function(marked){
      if(marked){d.innerHTML=marked.parse(text,{breaks:true,gfm:true});d.querySelectorAll('code').forEach(function(c){c.style.cssText='font-family:var(--M,"Courier Prime",monospace);font-size:.85em;background:rgba(201,168,76,.08);padding:1px 5px;border-radius:2px;color:var(--solar,#E2C86D)';});d.querySelectorAll('a').forEach(function(a){a.style.color='var(--cyan,#00E5FF)';});}else d.textContent=text;
    });
  }else{d.textContent=text;}
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function showTyping(show){
  var t=document.getElementById('chat-typing');
  if(t) t.style.display=show?'flex':'none';
}

window.sendChatMessage=async function(){
  var inp=document.getElementById('chat-input')||document.getElementById('chat-inp');
  if(!inp||!inp.value.trim()) return;
  var q=inp.value.trim();inp.value='';
  addMsg('user',q);
  _history.push({role:'user',content:q});
  showTyping(true);
  /* Route through OmegaIntelligence if available, else direct Supabase */
  var reply='';
  if(window.OmegaIntelligence){
    try{reply=await window.OmegaIntelligence.ask(q,_history.slice(-6));}catch(e){}
  }
  if(!reply){
    /* Fallback: direct concierge call — matches concierge/index.ts contract */
    try{
      var PHI=1.6180339887,EU=2.7182818285;
      var a=Number(_profile.axis_a||0.001),b=Number(_profile.axis_b||0.001),c=Number(_profile.axis_c||0.001);
      var auth=_profile.is_owner?27.8367:Math.sqrt(Math.pow(a,3)+Math.pow(b,3)+Math.pow(c,3))*PHI/EU;
      var r=await sb.functions.invoke('concierge',{body:{
        message:q,
        context:{
          sign:_profile.sign||'unknown',
          a:a.toFixed(3),b:b.toFixed(3),c:c.toFixed(3),
          auth:auth.toFixed(4),
          tier:_profile.subscription_tier||'free',
          rank:_profile.rank||'--'
        }
      }});
      if(r.data&&r.data.reply)reply=r.data.reply;
    }catch(e){reply='The Concierge is temporarily unavailable.';}
  }
  showTyping(false);
  if(reply){
    _history.push({role:'assistant',content:reply});
    addMsg('ai',reply);
    /* Store to memory */
    if(window.OmegaMemory) window.OmegaMemory.store('conversation:'+Date.now(),q.slice(0,100)+'→'+reply.slice(0,150),'conversation');
    /* Telemetry */
    if(window.OmegaTelemetry) window.OmegaTelemetry.track('chatbot_query',{agent:_currentAgent,query_len:q.length,reply_len:reply.length});
  }
};

/* Enter key sends */
var inp2=document.getElementById('chat-input')||document.getElementById('chat-inp');
if(inp2) inp2.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();window.sendChatMessage();}});
</script>
