name: Runner Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - name: Environment Check
        shell: cmd
        run: |
          @echo off
          echo === SYD OMEGA GitHub Actions Runner ===
          if "%RUNNER_NAME%"=="" exit /b 1
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if "%RUNNER_ARCH%"=="" exit /b 1
          echo Runner Name: %RUNNER_NAME%
          echo Runner OS: %RUNNER_OS%
          echo Runner Arch: %RUNNER_ARCH%
          echo Run ID: %GITHUB_RUN_ID%
          echo Run Attempt: %GITHUB_RUN_ATTEMPT%
          echo SELF_HOSTED_RUNNER_PROVISIONED=true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime tools
        shell: cmd
        run: |
          python --version
          node --version

      # Git for Windows bash by absolute path -- see runner-probe.yml: both
      # `shell: cmd` + `bash ...` and `shell: bash` resolve to the WSL shim on
      # this runner, which has no distro installed.
      - name: Local CI Validation
        shell: 'C:\Program Files\Git\bin\bash.exe -eo pipefail {0}'
        run: |
          bash --version
          scripts/ci-local.sh

      - name: Success Summary
        shell: cmd
        run: |
          @echo off
          echo SELF_HOSTED_RUNNER_HEALTHY=true
          echo SELF_HOSTED_RUNNER_NAME=%RUNNER_NAME%
          echo SELF_HOSTED_RUNNER_RUN_ID=%GITHUB_RUN_ID%
          echo SELF_HOSTED_RUNNER_RUN_ATTEMPT=%GITHUB_RUN_ATTEMPT%
