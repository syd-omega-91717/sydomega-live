name: Vercel Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the validated main artifact to Vercel Production'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.ico'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.mp4'
      - '**/*.webm'
      - 'vendor/**'
      - 'i18n/**'
      - 'assets/**'
      - 'static/**'
      - 'images/**'
      - 'img/**'
      - 'icons/**'
      - 'media/**'
      - 'fonts/**'
      - 'audio/**'
      - 'video/**'
      - 'css/**'
      - 'js/**'
      - '.well-known/**'
      - 'vercel.json'
      - 'scripts/vercel-build.sh'
      - 'scripts/vercel-build-enhance.mjs'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static contract
        run: python scripts/vercel_static_contract.py
      - name: Build artifact
        run: bash scripts/vercel-build.sh
      - name: Artifact invariants
        run: |
          set -euo pipefail
          test -s public/index.html
          test -f public/vendor/supabase-js.js
          test "$(find public -type f -name '*.html' | wc -l)" -gt 0
          echo 'VERCEL_PRODUCTION_ARTIFACT=PASS'

  credentials:
    name: Resolve deployment credentials
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ -n "$TOKEN" && -n "$ORG" && -n "$PROJECT" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_CREDENTIALS=READY'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_CREDENTIALS=NOT_CONFIGURED'
          fi

  deploy:
    name: Deploy production
    needs: credentials
    if: >-
      needs.credentials.outputs.ready == 'true' &&
      (github.event_name == 'push' || inputs.deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pin deployment to the intended Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
      - name: Deploy to Vercel Production
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  controlled:
    name: Controlled deployment state
    needs: credentials
    if: needs.credentials.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep provider promotion controlled
        run: |
          echo 'VERCEL_PRODUCTION_DEPLOYMENT=CONTROLLED'
          echo 'Artifact validation passed; automatic provider churn remains disabled.'
          echo 'Configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to enable promotion.'
