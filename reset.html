<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&#937; SYD OMEGA 91717  --  Password Recovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Courier+Prime:wght@400;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --void:#07070b; --panel:#0d0d15; --panel-2:#11111c; --gold:#C9A84C; --solar:#E2C86D; --cyan:#00E5FF; --crimson:#8B0000; --green:#3fb27f; --ink:#e9e6dc; --muted:#85837b; --line:rgba(201,168,76,0.16); --display:'Cinzel Decorative',serif; --body:'Rajdhani',sans-serif; --mono:'Courier Prime',monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--ink);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(201,168,76,.10),transparent 46%)}
  a{color:inherit}
  .wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .panel{width:100%;max-width:440px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);padding:38px 30px;text-align:center}
  .g{font-family:var(--display);font-size:54px;color:var(--gold);text-shadow:0 0 30px rgba(201,168,76,.35)}
  h1{font-family:var(--display);font-weight:700;color:var(--gold);font-size:24px;letter-spacing:1px;margin:10px 0 4px}
  .sub{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--cyan);margin-bottom:22px}
  p.lead{font-weight:300;color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:20px}
  label{display:block;text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);margin:14px 0 7px}
  input{width:100%;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:13px 15px;color-scheme:dark}
  input:focus{outline:none;border-color:var(--cyan)}
  .btn{width:100%;font-family:var(--mono);letter-spacing:2px;font-size:12px;color:var(--void);background:var(--gold);padding:14px;border:1px solid var(--gold);cursor:pointer;margin-top:20px}
  .btn:hover{background:transparent;color:var(--gold)}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{font-family:var(--mono);font-size:11px;letter-spacing:1px;min-height:16px;margin-top:14px}
  .msg.bad{color:var(--crimson)} .msg.ok{color:var(--green)} .msg.info{color:var(--cyan)}
  .back{display:inline-block;margin-top:22px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--cyan);text-decoration:none}
  .back:hover{color:var(--gold)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="g">&#937;</div>
    <h1 id="title">PASSWORD RECOVERY</h1>
    <div class="sub">SYD OMEGA 91717</div>

    <div id="view-request">
      <p class="lead">Enter the email bound to your account. The Order will send a secure link to restore your access.</p>
      <label for="r-email">EMAIL</label>
      <input type="email" id="r-email" placeholder="you@example.com" autocomplete="email" />
      <button class="btn" id="r-send">SEND RECOVERY LINK</button>
      <div class="msg" id="r-msg"></div>
      <a class="back" href="/account.html">&larr; BACK TO MEMBER ACCESS</a>
    </div>

    <div id="view-reset" class="hidden">
      <p class="lead">Set a new password for your sovereign account.</p>
      <label for="r-pw">NEW PASSWORD</label>
      <input type="password" id="r-pw" placeholder="at least 6 characters" autocomplete="new-password" />
      <label for="r-pw2">CONFIRM PASSWORD</label>
      <input type="password" id="r-pw2" placeholder="repeat it" autocomplete="new-password" />
      <button class="btn" id="r-update">UPDATE PASSWORD</button>
      <div class="msg" id="r-msg2"></div>
      <a class="back" href="/account.html">&larr; BACK TO MEMBER ACCESS</a>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient("https://ydqhzvvoyufiiqvzcjns.supabase.co","sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q");

  function show(which){
    document.getElementById('view-request').classList.toggle('hidden', which!=='request');
    document.getElementById('view-reset').classList.toggle('hidden', which!=='reset');
    document.getElementById('title').textContent = which==='reset' ? 'SET NEW PASSWORD' : 'PASSWORD RECOVERY';
  }

  var inRecovery = false;
  supabase.auth.onAuthStateChange(function(event){
    if(event==='PASSWORD_RECOVERY'){ inRecovery=true; show('reset'); }
  });
  // also detect from the link hash directly
  if(location.hash.indexOf('type=recovery')!==-1){ inRecovery=true; show('reset'); } else { show('request'); }

  async function sendLink(){
    var email=document.getElementById('r-email').value.trim();
    var msg=document.getElementById('r-msg'), btn=document.getElementById('r-send');
    if(!email || email.indexOf('@')<1){ msg.className='msg bad'; msg.textContent='Enter a valid email.'; return; }
    btn.disabled=true; msg.className='msg info'; msg.textContent='Sending...';
    var redirectTo = window.location.origin + '/reset.html';
    var r = await supabase.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    btn.disabled=false;
    if(r.error){ msg.className='msg bad'; msg.textContent=r.error.message||'Could not send link.'; return; }
    msg.className='msg ok'; msg.textContent='If that email has an account, a recovery link is on its way. Check your inbox.';
  }

  async function updatePw(){
    var pw=document.getElementById('r-pw').value, pw2=document.getElementById('r-pw2').value;
    var msg=document.getElementById('r-msg2'), btn=document.getElementById('r-update');
    if(pw.length<6){ msg.className='msg bad'; msg.textContent='Password must be at least 6 characters.'; return; }
    if(pw!==pw2){ msg.className='msg bad'; msg.textContent='Passwords do not match.'; return; }
    btn.disabled=true; msg.className='msg info'; msg.textContent='Updating...';
    var r = await supabase.auth.updateUser({ password: pw });
    btn.disabled=false;
    if(r.error){ msg.className='msg bad'; msg.textContent=r.error.message||'Could not update. Request a fresh link.'; return; }
    msg.className='msg ok'; msg.textContent='Password updated. Entering the Order...';
    setTimeout(function(){ window.location.href='/dashboard.html'; }, 1400);
  }

  document.getElementById('r-send').addEventListener('click',sendLink);
  document.getElementById('r-update').addEventListener('click',updatePw);
  document.getElementById('r-email').addEventListener('keydown',function(e){ if(e.key==='Enter') sendLink(); });
  document.getElementById('r-pw2').addEventListener('keydown',function(e){ if(e.key==='Enter') updatePw(); });
</script>
<script src="/bg.js"></script>
</body>
</html>
