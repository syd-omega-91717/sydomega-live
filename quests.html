<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quests — Ω SYD OMEGA 91717</title>
  <meta name="description" content="Browse and complete quests to earn XP and progress your character.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://sydomega.com/quests.html">
  <script src="/bg.js" defer></script>
  <script src="/nav.js" defer></script>
  <style>
    :root {
      --quest-filter-height: 60px;
    }

    .quests-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .quest-filters {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    .quest-filters .filter-chip {
      padding: 0.5rem 1rem;
      border: 1px solid var(--cyan);
      border-radius: 20px;
      background: transparent;
      color: var(--cyan);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .quest-filters .filter-chip:hover,
    .quest-filters .filter-chip.active {
      background: rgba(0, 212, 170, 0.2);
      border-color: var(--solar);
      color: var(--solar);
    }

    .quests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .quest-card {
      padding: 1.5rem;
      border: 1px solid rgba(0, 212, 170, 0.3);
      border-radius: 12px;
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .quest-card:hover {
      border-color: var(--solar);
      background: rgba(10, 10, 20, 0.8);
      transform: translateY(-4px);
    }

    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .quest-title {
      font-family: var(--D);
      font-size: 1.25rem;
      color: var(--gold);
      margin: 0;
    }

    .quest-difficulty {
      display: flex;
      gap: 0.25rem;
    }

    .quest-difficulty-star {
      font-size: 1rem;
      color: var(--solar);
    }

    .quest-description {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0;
    }

    .quest-meta {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .quest-meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .quest-meta-icon {
      color: var(--cyan);
    }

    .quest-element {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.85rem;
      background: rgba(0, 212, 170, 0.15);
      color: var(--cyan);
      text-transform: capitalize;
    }

    .quest-xp-reward {
      font-family: var(--M);
      color: var(--solar);
      font-weight: bold;
    }

    .quest-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
    }

    .quest-btn {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: var(--cyan);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--R);
      font-size: 0.9rem;
    }

    .quest-btn:hover {
      background: rgba(0, 212, 170, 0.1);
      border-color: var(--cyan);
    }

    .quest-btn.primary {
      background: rgba(0, 212, 170, 0.2);
      border-color: var(--solar);
      color: var(--solar);
    }

    .quest-btn.primary:hover {
      background: rgba(217, 119, 6, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }

    .quest-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 1.1rem;
    }

    .quest-loading {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }

    .quest-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 1rem 1.5rem;
      background: rgba(0, 212, 170, 0.9);
      color: var(--void);
      border-radius: 8px;
      animation: toast-slide-up 0.3s ease;
      z-index: 1000;
      font-weight: bold;
    }

    .quest-toast.error {
      background: rgba(220, 38, 38, 0.9);
      color: white;
    }

    @keyframes toast-slide-up {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @media (max-width: 900px) {
      .quests-grid {
        grid-template-columns: 1fr;
      }

      .quest-filters {
        flex-direction: column;
      }

      .quest-filters .filter-chip {
        width: 100%;
      }
    }
  </style>
</head>
<body data-page="quests">
  <div id="omega-side" data-omega-nav></div>

  <main class="main">
    <div id="app" class="shell">
      <div class="main-content">
        <div class="quests-container">
          <div class="quest-filters">
            <button class="filter-chip active" data-filter="all">All Quests</button>
            <button class="filter-chip" data-filter="platform">Platform Quests</button>
            <button class="filter-chip" data-filter="user">User Quests</button>
            <button class="filter-chip" data-filter="difficulty-1">Easy</button>
            <button class="filter-chip" data-filter="difficulty-5">Hard</button>
            <button class="filter-chip" data-filter="element-fire">Fire</button>
            <button class="filter-chip" data-filter="element-water">Water</button>
            <button class="filter-chip" data-filter="element-earth">Earth</button>
            <button class="filter-chip" data-filter="element-air">Air</button>
          </div>

          <div id="quests-grid" class="quests-grid">
            <div class="quest-loading">Loading quests...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from '/vendor/supabase-js.js';
    import DOMPurify from '/vendor/dompurify.min.js';

    const supabase = createClient(
      window.SUPABASE_URL || 'https://ydqhzvvoyufiiqvzcjns.supabase.co',
      window.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkcWh6dnZveXVmaWlxdnpjanMiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcxMjk2MzAwMCwiZXhwIjoxODcwNzI5MDAwfQ.H8h3fUxzPaC5B2_N0bfJTp5bPNSv3mH6X8mL6w5L0Oo'
    );

    let quests = [];
    let currentFilter = 'all';
    let userCharacter = null;

    const gridEl = document.getElementById('quests-grid');
    const filterChips = document.querySelectorAll('.filter-chip');

    async function loadQuests() {
      gridEl.innerHTML = '<div class="quest-loading">Loading quests...</div>';

      try {
        const { data, error } = await supabase
          .from('quests')
          .select('*')
          .eq('is_active', true);

        if (error) {
          console.error('Error loading quests:', error);
          gridEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Failed to load quests</div></div>';
          return;
        }

        quests = data || [];

        // Load user character to check tier access
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
          const { data: charData } = await supabase
            .from('characters')
            .select('*')
            .eq('user_id', user.id)
            .single();
          userCharacter = charData;
        }

        renderQuests();
      } catch (err) {
        console.error('Error:', err);
        gridEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Error loading quests</div></div>';
      }
    }

    function filterQuests() {
      if (currentFilter === 'all') return quests;

      if (currentFilter === 'platform') {
        return quests.filter(q => !q.is_user_generated);
      }
      if (currentFilter === 'user') {
        return quests.filter(q => q.is_user_generated);
      }
      if (currentFilter.startsWith('difficulty-')) {
        const diff = parseInt(currentFilter.split('-')[1]);
        return quests.filter(q => q.difficulty === diff);
      }
      if (currentFilter.startsWith('element-')) {
        const element = currentFilter.split('-')[1];
        return quests.filter(q => q.element_theme === element);
      }

      return quests;
    }

    function renderQuests() {
      const filtered = filterQuests();

      if (filtered.length === 0) {
        gridEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✨</div><div class="empty-state-text">No quests found</div></div>';
        return;
      }

      gridEl.innerHTML = filtered.map(quest => `
        <div class="quest-card" data-quest-id="${quest.id}">
          <div class="quest-header">
            <h3 class="quest-title">${DOMPurify.sanitize(quest.title)}</h3>
            <div class="quest-difficulty">
              ${Array(quest.difficulty).fill('★').join('')}
            </div>
          </div>

          <p class="quest-description">${DOMPurify.sanitize(quest.description)}</p>

          <div class="quest-meta">
            <div class="quest-meta-item">
              <span class="quest-meta-icon">✦</span>
              <span class="quest-xp-reward">${quest.xp_reward} XP</span>
            </div>
            <span class="quest-element">${quest.element_theme}</span>
          </div>

          <div class="quest-actions">
            <button class="quest-btn primary" data-action="accept">Accept Quest</button>
            <button class="quest-btn" data-action="details">Details</button>
          </div>
        </div>
      `).join('');

      // Attach event listeners
      document.querySelectorAll('.quest-card').forEach(card => {
        const questId = card.dataset.questId;
        const acceptBtn = card.querySelector('[data-action="accept"]');
        const detailsBtn = card.querySelector('[data-action="details"]');

        acceptBtn.addEventListener('click', () => acceptQuest(questId));
        detailsBtn.addEventListener('click', () => showQuestDetail(questId));
      });

      // Dispatch custom event for voice-responsive animations
      window.dispatchEvent(new CustomEvent('omega:quests-rendered', {
        detail: { questCount: filtered.length, timestamp: Date.now() }
      }));
    }

    async function acceptQuest(questId) {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        showToast('Please sign in to accept quests', 'error');
        return;
      }

      try {
        // Verify gamification is enabled
        const { data: settings } = await supabase
          .from('platform_settings')
          .select('bool_value')
          .eq('key', 'gamification_enabled')
          .single();

        if (!settings || !settings.bool_value) {
          showToast('Gamification is not yet enabled', 'error');
          return;
        }

        // Get or create character
        const { data: character, error: charError } = await supabase.rpc('get_character_or_create', {
          p_user_id: user.id
        });

        if (charError) {
          showToast('Failed to load character', 'error');
          return;
        }

        showToast(`You accepted the quest! Get ready, ${character[0]?.name || 'Adventurer'}!`);

        // Dispatch custom event for voice-responsive particles
        window.dispatchEvent(new CustomEvent('omega:quest-accepted', {
          detail: { questId, characterId: character[0]?.id, timestamp: Date.now() }
        }));

        // Redirect to character page after 1.5s
        setTimeout(() => {
          window.location.href = '/character.html';
        }, 1500);
      } catch (err) {
        console.error('Error accepting quest:', err);
        showToast('Error accepting quest', 'error');
      }
    }

    function showQuestDetail(questId) {
      const quest = quests.find(q => q.id === questId);
      if (!quest) return;

      alert(`Quest: ${quest.title}\n\n${quest.description}\n\nDifficulty: ${quest.difficulty}/5\nXP Reward: ${quest.xp_reward}\nElement: ${quest.element_theme}`);
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `quest-toast ${type === 'error' ? 'error' : ''}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => toast.remove(), 3000);
    }

    filterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        filterChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.filter;
        renderQuests();
      });
    });

    // Load quests on page load
    loadQuests();

    // Listen for custom animation events
    window.addEventListener('omega:quest-complete', (e) => {
      console.log('Quest completed:', e.detail);
      loadQuests(); // Refresh list
    });
  </script>
</body>
</html>
