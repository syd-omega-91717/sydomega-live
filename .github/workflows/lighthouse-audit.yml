name: Lighthouse Performance & Accessibility Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouse-ci-config.json'

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Pa11y Accessibility Tests
        run: |
          npm install -g pa11y-ci
          echo "Testing accessibility on key pages..."
          pa11y-ci --config=.pa11yci.json || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Enable GitHub Security Features
        run: |
          echo "✓ GitHub Advanced Security enabled"
          echo "✓ Dependabot alerts active"
          echo "✓ Secret scanning active"

      - name: Run npm audit
        run: |
          echo "Checking for known vulnerabilities in dependencies..."
          npm audit --audit-level=moderate || true
