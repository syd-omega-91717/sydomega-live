name: Vercel Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the validated main artifact to Vercel Production'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.ico'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.mp4'
      - '**/*.webm'
      - 'vendor/**'
      - 'i18n/**'
      - 'assets/**'
      - 'static/**'
      - 'images/**'
      - 'img/**'
      - 'icons/**'
      - 'media/**'
      - 'fonts/**'
      - 'audio/**'
      - 'video/**'
      - 'css/**'
      - 'js/**'
      - '.well-known/**'
      - 'vercel.json'
      - 'scripts/vercel-build.sh'
      - 'scripts/vercel-build-enhance.mjs'
      - 'scripts/release-surface-quality.py'
      - 'scripts/omega-enterprise-readiness-contract.py'
      - 'scripts/vercel-production-smoke.sh'
      - 'scripts/vercel-production-surface-smoke.py'
      - 'scripts/vercel-deployment-auth-check.sh'
      - '.github/workflows/vercel-production.yml'
      - '!supabase/**'
      - '!docs/runtime/supabase-edge-functions-live.json'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - 'scripts/**'
      - '.github/workflows/vercel-production.yml'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          echo "runner=${RUNNER_NAME}"
          echo "run=${GITHUB_RUN_ID}"
      - name: Execution marker
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          echo "VERCEL_PRODUCTION_VALIDATE_EXECUTED=true"
          echo "VERCEL_PRODUCTION_VALIDATE_RUN_ID=${GITHUB_RUN_ID}"
      - name: Static contract
        run: python scripts/vercel_static_contract.py
      - name: Vercel production dispatch regression contract
        run: python -m unittest scripts/tests/test_vercel_production_dispatch_contract.py
      - name: Release surface quality
        run: python scripts/release-surface-quality.py
      - name: Build artifact
        run: bash scripts/vercel-build.sh
      - name: Production surface contract
        run: python scripts/omega-production-surface-contract.py
      - name: Responsive surface contract
        run: python scripts/omega-responsive-surface-contract.py
      - name: Repository production proof contract
        run: python scripts/production-proof-contract.py
      - name: Enterprise readiness contract
        run: python scripts/omega-enterprise-readiness-contract.py
      - name: Capability registry contract
        run: python scripts/omega-capability-contract.py
      - name: Product catalog contract
        run: python scripts/omega-product-catalog-contract.py
      - name: RPC security policy contract
        run: python scripts/omega-rpc-security-policy-contract.py
      - name: Canon and agent contract
        run: python scripts/omega-canon-agent-contract.py
      - name: Production chain contract
        run: python scripts/omega-production-chain-contract.py
      - name: Achievement and referral contract
        run: python scripts/omega-achievement-referral-contract.py
      - name: Notification worker contract
        run: python scripts/omega-notification-worker-contract.py
      - name: Unified 18-module runtime contract
        run: python scripts/omega-module-runtime-contract.py
      - name: Runtime gateway auth contract
        run: python scripts/omega-runtime-gateway-contract.py
      - name: Architecture convergence audit
        run: python scripts/omega-convergence-audit.py --json > production-proof-convergence.json
      - name: Artifact invariants
        run: |
          set -euo pipefail
          test -s public/index.html
          test -f public/vendor/supabase-js.js
          test -s public/.well-known/omega-release.json
          OMEGA_RELEASE_SHA="$GITHUB_SHA" node scripts/omega-release-manifest.mjs --check public/.well-known/omega-release.json
          test "$(find public -type f -name '*.html' | wc -l)" -gt 0
          echo 'VERCEL_PRODUCTION_ARTIFACT=PASS'

  credentials:
    name: Resolve deployment credentials
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      org: ${{ steps.export.outputs.org }}
      project: ${{ steps.export.outputs.project }}
    steps:
      - id: check
        shell: bash
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_w0v6eD1jUUzfPjiDq3ztOfvp' }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_H3aTU3D4mR7TD19etdPTeYmhvANY' }}
        run: |
          set -euo pipefail
          echo "org_resolved=${ORG:+yes}"
          echo "project_resolved=${PROJECT:+yes}"
          if [[ -n "$TOKEN" && -n "$ORG" && -n "$PROJECT" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_CREDENTIALS=READY'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_CREDENTIALS=NOT_CONFIGURED missing=VERCEL_TOKEN'
          fi
      - id: export
        shell: bash
        env:
          ORG: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_w0v6eD1jUUzfPjiDq3ztOfvp' }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_H3aTU3D4mR7TD19etdPTeYmhvANY' }}
        run: |
          set -euo pipefail
          echo "org=$ORG" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Production promotion
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ needs.credentials.outputs.org }}
      VERCEL_PROJECT_ID: ${{ needs.credentials.outputs.project }}
    steps:
      - name: Refuse production promotion from non-main manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error title=Production deployment refused::Manual production promotion is allowed only from refs/heads/main."
          echo "requested_ref=$GITHUB_REF"
          exit 1
      - name: Controlled state when token is unavailable
        if: needs.credentials.outputs.ready != 'true'
        env:
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'VERCEL_PRODUCTION_DEPLOYMENT=CONTROLLED'
          echo 'Artifact validation passed; production promotion is waiting for VERCEL_TOKEN.'
          echo 'No provider mutation was attempted.'
          echo '::warning title=Production promotion pending::VERCEL_TOKEN is not configured. Artifact validation passed, but this run cannot promote the production alias.'
          if [[ "$DEPLOY_REQUESTED" == "true" ]]; then
            echo "::error title=Production promotion blocked::A production deploy was requested, but VERCEL_TOKEN is unavailable. Configure valid deployment credentials; do not treat artifact validation as a production deployment."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.credentials.outputs.ready == 'true'
        with:
          node-version: '20'
      - name: Pin deployment to the intended Vercel project
        if: needs.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
      - name: Verify Vercel token and project authority
        if: needs.credentials.outputs.ready == 'true'
        run: bash scripts/vercel-deployment-auth-check.sh
      - name: Pull Vercel production settings
        if: >-
          needs.credentials.outputs.ready == 'true' &&
          (github.event_name == 'push' || inputs.deploy == true)
        run: npx --yes vercel@59.6.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build immutable production artifact
        if: >-
          needs.credentials.outputs.ready == 'true' &&
          (github.event_name == 'push' || inputs.deploy == true)
        env:
          OMEGA_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npx --yes vercel@59.6.0 build --prod --yes --token "$VERCEL_TOKEN"
          node scripts/omega-release-manifest.mjs --check .vercel/output/static/.well-known/omega-release.json
      - name: Deploy prebuilt production artifact
        if: >-
          needs.credentials.outputs.ready == 'true' &&
          (github.event_name == 'push' || inputs.deploy == true)
        run: npx --yes vercel@59.6.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      - name: Verify production domain smoke routes (apex)
        if: >-
          needs.credentials.outputs.ready == 'true' &&
          (github.event_name == 'push' || inputs.deploy == true)
        env:
          OMEGA_PRODUCTION_BASE_URL: https://sydomega.com
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/vercel-production-smoke.sh

      - name: Verify production domain smoke routes (www)
        if: >-
          needs.credentials.outputs.ready == 'true' &&
          (github.event_name == 'push' || inputs.deploy == true)
        env:
          OMEGA_PRODUCTION_BASE_URL: https://www.sydomega.com
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/vercel-production-smoke.sh

      - name: Verify every built HTML route is live
        if: >-
          needs.credentials.outputs.ready == 'true' &&
          (github.event_name == 'push' || inputs.deploy == true)
        env:
          OMEGA_PRODUCTION_BASE_URL: https://sydomega.com
          OMEGA_PUBLIC_DIR: public
          OMEGA_SMOKE_WORKERS: '12'
          OMEGA_SMOKE_RETRIES: '2'
        run: python scripts/vercel-production-surface-smoke.py
