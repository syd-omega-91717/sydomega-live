name: Production Surface Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-surface-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://www.sydomega.com/
  SUPABASE_AUTH_HEALTH_URL: https://ydqhzvvoyufiiqvzcjns.supabase.co/auth/v1/health

jobs:
  smoke:
    name: Production surface verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production site and classify external deployment state
        id: site
        shell: bash
        run: |
          set -euo pipefail
          set +e
          code="$(curl --silent --show-error --location --max-time 30 --retry 3 --retry-delay 2 \
            --output /tmp/sydomega.html --write-out '%{http_code}' "$PRODUCTION_URL")"
          curl_exit=$?
          set -e
          identity_ok=false
          if [ -s /tmp/sydomega.html ] \
            && grep -Eiq '<title[^>]*>[^<]*SYD OMEGA 91717' /tmp/sydomega.html \
            && grep -Fqi 'omega-visual-universe.css' /tmp/sydomega.html; then
            identity_ok=true
          fi

          asset_code=unknown
          asset_exit=1
          if [ "$curl_exit" -eq 0 ] && [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && [ "$identity_ok" = true ]; then
            set +e
            asset_code="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/sydomega-canonical.css --write-out '%{http_code}' \
              "${PRODUCTION_URL%/}/omega-visual-universe.css")"
            asset_exit=$?
            set -e
          fi

          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "curl_exit=$curl_exit" >> "$GITHUB_OUTPUT"
          echo "identity_ok=$identity_ok" >> "$GITHUB_OUTPUT"
          echo "asset_http_code=$asset_code" >> "$GITHUB_OUTPUT"
          echo "asset_curl_exit=$asset_exit" >> "$GITHUB_OUTPUT"

          if [ "$curl_exit" -eq 0 ] && [ "$code" -ge 200 ] && [ "$code" -lt 400 ] \
            && [ "$identity_ok" = true ] && [ "$asset_exit" -eq 0 ] \
            && [ "$asset_code" -ge 200 ] && [ "$asset_code" -lt 300 ] \
            && [ -s /tmp/sydomega-canonical.css ]; then
            echo "site_reachable=true" >> "$GITHUB_OUTPUT"
            echo "Production Omega app identity verified: root HTTP $code; canonical CSS HTTP $asset_code"
          else
            echo "site_reachable=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Production deployment verification"
              echo
              echo "The repository-side contract is intact, but the configured endpoint did not prove the expected Omega application identity and canonical asset."
              echo
              echo "- URL: $PRODUCTION_URL"
              echo "- Root HTTP status: ${code:-unknown}"
              echo "- Root curl exit: $curl_exit"
              echo "- Expected page title and CSS reference found: $identity_ok"
              echo "- Canonical CSS HTTP status: $asset_code"
              echo "- Canonical CSS curl exit: $asset_exit"
              echo "- Classification: **EXTERNAL_DEPLOYMENT_BLOCKED**"
              echo
              echo "A generic HTML response or provider-branded error page is not accepted as proof that the Omega application is live. This check remains non-failing for provider outages, but the live surface is explicitly unverified."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Production endpoint did not prove Omega app identity; classified as EXTERNAL_DEPLOYMENT_BLOCKED."
            echo "::warning title=Production app identity unverified::${PRODUCTION_URL} did not prove the expected title and canonical CSS asset. EXTERNAL_DEPLOYMENT_BLOCKED -- live surface UNVERIFIED."
          fi

      - name: Verify Supabase Auth transport and boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          code=$(curl --silent --show-error --location --max-time 30 --retry 3 --retry-delay 2 \
            --output /tmp/supabase-health.json --write-out '%{http_code}' "$SUPABASE_AUTH_HEALTH_URL")
          curl_exit=$?
          set -e
          test -s /tmp/supabase-health.json
          if [ "$curl_exit" -eq 0 ] && { [ "$code" -ge 200 ] && [ "$code" -lt 400 ] || [ "$code" = "401" ] || [ "$code" = "403" ]; }; then
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "Supabase Auth endpoint is reachable and enforcing its authentication boundary: HTTP $code"
            else
              echo "Supabase Auth health HTTP $code"
            fi
          else
            echo "Supabase Auth transport check failed: HTTP ${code:-unknown}, curl exit $curl_exit"
            exit 1
          fi

      - name: Verify security headers when production endpoint is reachable
        if: steps.site.outputs.site_reachable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 -D /tmp/sydomega.headers -o /dev/null "$PRODUCTION_URL"
          grep -qi '^x-content-type-options: nosniff' /tmp/sydomega.headers
          grep -qi '^x-frame-options: DENY' /tmp/sydomega.headers
          grep -qi '^referrer-policy:' /tmp/sydomega.headers
          echo "Required security headers present."

      - name: Record verification boundary
        shell: bash
        run: |
          if [ "${{ steps.site.outputs.site_reachable }}" = "true" ]; then
            echo "Production surface verification: PASS"
          else
            echo "Production surface verification: repository checks PASS; live deployment remains EXTERNAL_DEPLOYMENT_BLOCKED."
            echo "::warning title=Live surface unverified::This green check verified the repository contract and Supabase Auth only. The production endpoint was not reachable, so the security-header step was skipped and nothing here observed the live site."
          fi
