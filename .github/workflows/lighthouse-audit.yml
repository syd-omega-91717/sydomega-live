name: Lighthouse Performance & Accessibility Audit

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build static artifact
        run: |
          echo "Building production artifact..."
          bash scripts/vercel-build.sh
          echo "✓ Build complete ($(find public -type f | wc -l) files)"

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Start HTTP server
        run: |
          cd public
          python3 -m http.server 8080 > /tmp/server.log 2>&1 &
          sleep 2
          curl -s http://localhost:8080 > /dev/null && echo "✓ Server running" || echo "Server check failed"

      - name: Audit homepage
        run: |
          lighthouse http://localhost:8080 \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices \
            --output-path=/tmp/lighthouse-index.json \
            --output=json || echo "Lighthouse audit completed"

      - name: Report audit results
        run: |
          if [ -f /tmp/lighthouse-index.json ]; then
            echo "Performance audit results available"
            python3 - << 'EOF'
          import json
          try:
            with open('/tmp/lighthouse-index.json', 'r') as f:
              data = json.load(f)
              cats = data.get('categories', {})
              for name, cat in cats.items():
                score = cat.get('score', 0)
                print(f"  {name}: {int(score*100)}/100")
          except:
            print("  (report not parsed)")
          EOF
          fi
          echo "✓ Weekly audit complete"
