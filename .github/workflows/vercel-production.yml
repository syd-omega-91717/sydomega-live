name: Vercel Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the validated main artifact to Vercel Production'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.ico'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.mp4'
      - '**/*.webm'
      - 'vendor/**'
      - 'i18n/**'
      - 'assets/**'
      - 'static/**'
      - 'images/**'
      - 'img/**'
      - 'icons/**'
      - 'media/**'
      - 'fonts/**'
      - 'audio/**'
      - 'video/**'
      - 'css/**'
      - 'js/**'
      - '.well-known/**'
      - 'vercel.json'
      - 'scripts/vercel-build.sh'
      - 'scripts/vercel-build-enhance.mjs'

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static contract
        run: python scripts/vercel_static_contract.py
      - name: Build artifact
        run: bash scripts/vercel-build.sh
      - name: Artifact invariants
        run: |
          set -euo pipefail
          test -s public/index.html
          test -f public/vendor/supabase-js.js
          test "$(find public -type f -name '*.html' | wc -l)" -gt 0
          echo 'VERCEL_PRODUCTION_ARTIFACT=PASS'

  deploy:
    name: Deploy production
    needs: validate
    if: >-
      (github.event_name == 'push' || inputs.deploy == true) &&
      env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy to Vercel Production
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

  configuration:
    name: Deployment configuration
    needs: validate
    if: >-
      env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - name: Record controlled state
        run: |
          echo 'VERCEL_PRODUCTION_DEPLOYMENT=CONTROLLED'
          echo 'The repository is intentionally protected from automatic provider churn.'
          echo 'Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to enable production promotion.'
