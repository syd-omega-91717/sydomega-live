name: Page Overlap Audit

# Advisory only, and O(n^2) over the whole page estate: measured at 2-5
# minutes locally, against 0.79s for all eleven blocking gates combined. On a
# single serial self-hosted runner that cost bought nothing per-push, since a
# PASS here never blocked a merge. It runs nightly and on demand instead.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-overlap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlap:
    name: Detect overlapping pages
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run overlap audit
        shell: pwsh
        run: python scripts/page-overlap-audit.py
