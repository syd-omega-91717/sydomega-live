name: Omega Intelligence Fabric

on:
  push:
    branches: [main]
    paths:
      - "core/intelligence_fabric/**"
      - "scripts/omega_fabric_audit.py"
      - "tests/test_intelligence_fabric.py"
      - ".github/workflows/omega-intelligence-fabric.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/intelligence_fabric/**"
      - "scripts/omega_fabric_audit.py"
      - "tests/test_intelligence_fabric.py"
      - ".github/workflows/omega-intelligence-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile fabric
        run: python -m compileall -q core/intelligence_fabric scripts/omega_fabric_audit.py
      - name: Structural audit
        run: python scripts/omega_fabric_audit.py
      - name: Fabric tests
        run: python -m unittest discover -s tests -p 'test_intelligence_fabric.py' -v
