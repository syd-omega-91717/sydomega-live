name: Cloudflare Pages

# Deploy the canonical static artifact to Cloudflare Pages on every main push.
# Manual dispatch remains available for a controlled redeploy from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: sydomega
      WRANGLER: wrangler@4.151.1
    steps:
      - name: Check credentials
        id: creds
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=Cloudflare deployment credentials missing::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. Production deployment must never silently skip."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Refuse production fallback deploy from non-main
        if: steps.creds.outputs.ready == 'true' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error title=Cloudflare production deployment refused::Manual production fallback is allowed only from refs/heads/main."
          echo "requested_ref=$GITHUB_REF"
          exit 1

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned smoke-test dependency
        if: steps.creds.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Build artifact
        if: steps.creds.outputs.ready == 'true'
        env:
          CF_PAGES_BRANCH: main
        shell: bash
        run: bash scripts/vercel-build.sh

      - name: Create the Pages project once
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes "${WRANGLER}" pages project list 2>/dev/null | grep -qw "${PROJECT}"; then
            echo "project ${PROJECT} exists"
          else
            npx --yes "${WRANGLER}" pages project create "${PROJECT}" --production-branch main
          fi

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "${WRANGLER}" pages deploy public \
            --project-name "${PROJECT}" --branch main \
            --commit-hash "${GITHUB_SHA}" --commit-dirty=true

      - name: Smoke test the deployment
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://${PROJECT}.pages.dev"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${url}/")" || code=000
            [ "${code}" = "200" ] && break
            sleep 10
          done
          [ "${code}" = "200" ] || { echo "root returned ${code}"; exit 1; }
          curl --silent --show-error --head --max-time 20 "${url}/" | grep -qi '^content-security-policy:' || { echo "CSP header missing"; exit 1; }
          served=""
          for attempt in 1 2 3 4 5 6; do
            served="$(curl --silent --show-error --fail --max-time 15 "${url}/.well-known/omega-release.json" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).commit_sha||""))}catch(e){}})' || true)"
            if [ "${served}" = "${GITHUB_SHA}" ]; then break; fi
            echo "manifest_attempt=${attempt} served=${served:-none} expected=${GITHUB_SHA}"
            sleep 10
          done
          [ "${served}" = "${GITHUB_SHA}" ] || { echo "::error title=Release manifest mismatch::Cloudflare Pages does not serve the exact commit deployed by this workflow."; exit 1; }
          python scripts/cloudflare-production-smoke.py --base-url "${url}" --workers 16 --timeout 20
          echo "CLOUDFLARE_PAGES=PASS ${url} commit=${served}"

          # Verify both canonical production hosts only after the Pages deployment is live.
          base="https://sydomega.com"
          www_base="https://www.sydomega.com"
          expected="${GITHUB_SHA}"
          served=""
          www_served=""
          for attempt in $(seq 1 30); do
            manifest="$(curl --location --silent --show-error --fail --max-redirs 5 --connect-timeout 8 --max-time 10 "${base}/.well-known/omega-release.json" 2>/dev/null || true)"
            www_manifest="$(curl --location --silent --show-error --fail --max-redirs 5 --connect-timeout 8 --max-time 10 "${www_base}/.well-known/omega-release.json" 2>/dev/null || true)"
            served="$(printf '%s' "${manifest}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).commit_sha||""))}catch(e){}})')"
            www_served="$(printf '%s' "${www_manifest}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).commit_sha||""))}catch(e){}})')"
            if [ "${served}" = "${expected}" ] && [ "${www_served}" = "${expected}" ]; then break; fi
            echo "production_attempt=${attempt} root_served=${served:-none} www_served=${www_served:-none} expected=${expected}"
            sleep 10
          done
          [ "${served}" = "${expected}" ] || { echo "::error title=Production SHA mismatch::sydomega.com does not serve the exact deployed commit."; exit 1; }
          [ "${www_served}" = "${expected}" ] || { echo "::error title=WWW production SHA mismatch::www.sydomega.com does not serve the exact deployed commit."; exit 1; }

          root_code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-redirs 5 --connect-timeout 10 --max-time 30 "${base}/")"
          [ "${root_code}" = "200" ] || { echo "production root final response returned ${root_code}"; exit 1; }
          curl --location --silent --show-error --dump-header "${RUNNER_TEMP}/production-headers.txt" --output /dev/null --max-redirs 5 --connect-timeout 10 --max-time 30 "${base}/"
          grep -Eiq '^content-security-policy:' "${RUNNER_TEMP}/production-headers.txt" || { echo "CSP header missing"; exit 1; }
          grep -Eiq '^strict-transport-security:' "${RUNNER_TEMP}/production-headers.txt" || { echo "HSTS header missing"; exit 1; }
          for path in account.html profile.html world.html news.html media.html privacy.html terms.html vault.html; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-redirs 5 --connect-timeout 10 --max-time 30 "${base}/${path}")"
            [ "${code}" = "200" ] || { echo "core route /${path} final response returned ${code}"; exit 1; }
          done
          python scripts/cloudflare-production-smoke.py --base-url "${base}" --workers 16 --timeout 20
          echo "CLOUDFLARE_PRODUCTION=PASS host=sydomega.com commit=${served} www_commit=${www_served} root=${root_code}"
