name: Content Uniqueness Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-uniqueness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Page identity and uniqueness
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Python
        shell: pwsh
        run: python --version
      - name: Check page uniqueness
        shell: pwsh
        run: python scripts/content-uniqueness-contract.py
