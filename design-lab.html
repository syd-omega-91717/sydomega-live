<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- omega-morph:start --><style id="omega-vt">:where(html){background-color:#0A0A0F;color-scheme:dark}@view-transition{navigation:auto}::view-transition-group(omega-morph){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}::view-transition-old(omega-morph),::view-transition-new(omega-morph){height:100%;object-fit:contain}@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}</style><script id="omega-vt-morph" src="/omega-morph.js"></script><!-- omega-morph:end -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>&#937; SYD OMEGA 91717 &mdash; Design Lab</title>
<script src="/bg.js" defer></script>
<style>
  /* Page-local only. A page <style> is sheet 0 and loses every tie to the global
     sheets (CLAUDE.md 4), so every selector here is prefixed `.dl` (0,2,0) to
     outrank the global `a[href]` / `button` rules (0,1,1) rather than relying on
     order. Class names avoid the substrings the global CSS claims by wildcard:
     card, panel, sigil, icon, secondary. Palette values are the measured concept
     DNA, scoped to this page; nothing global is redeclared. */
  .dl{--dl-gold:#C9A84C;--dl-gold-hi:#E2C86D;--dl-gold-pale:#F7E0A0;--dl-crim:#A81A36;
    --dl-line:rgba(201,168,76,.38);--dl-text:#D8D5CB;--dl-mute:#B8B29F}
  /* TONAL DEPTH: the measured gap. Concept images hold 10-23% of pixels in the
     lit-surface tier (luminance 32-63); the real pages hold 2-3%. These slabs are
     the lit surface: lighter than the page, a gold hairline, an inner top
     highlight and a soft outer glow. */
  .dl .dl-slab{position:relative;border:1px solid var(--dl-line);border-radius:12px;padding:18px 20px;
    background:radial-gradient(120% 90% at 0% 0%,rgba(201,168,76,.12),transparent 55%),
               linear-gradient(165deg,#2e2a23 0%,#1c1a15 100%);
    box-shadow:inset 0 1px 0 rgba(247,224,160,.16),0 0 28px rgba(201,168,76,.08),0 12px 32px rgba(0,0,0,.5)}
  .dl .dl-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:stretch;
    background:radial-gradient(90% 130% at 100% 0%,rgba(168,26,54,.30),transparent 62%),
               radial-gradient(120% 90% at 0% 0%,rgba(201,168,76,.13),transparent 55%),
               linear-gradient(165deg,#2e2a23 0%,#1c1a15 100%)}
  .dl .dl-stage{position:relative;min-height:280px;border-radius:10px;overflow:hidden;
    background:radial-gradient(70% 70% at 50% 45%,rgba(201,168,76,.16),transparent 70%),#0d0c0a}
  .dl .dl-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
  .dl .dl-metric{border:1px solid rgba(201,168,76,.28);border-radius:10px;padding:14px 14px 12px;
    background:linear-gradient(165deg,#34302a,#211e19);box-shadow:inset 0 1px 0 rgba(247,224,160,.12)}
  .dl .dl-cap{font-family:var(--M,"Courier Prime",monospace);font-size:12px;letter-spacing:.16em;
    color:var(--dl-mute);text-transform:uppercase}
  .dl .dl-num{display:block;margin-top:6px;font-family:var(--D,"Cinzel Decorative",serif);
    font-size:clamp(28px,3.6vw,44px);line-height:1.05;color:var(--dl-gold-hi);
    text-shadow:0 0 18px rgba(226,200,109,.35)}
  .dl .dl-sub{display:block;margin-top:4px;font-family:var(--R,Rajdhani,sans-serif);font-size:14px;color:var(--dl-text)}
  .dl .dl-note{margin:30px 0 10px;font-family:var(--M,"Courier Prime",monospace);font-size:12px;
    letter-spacing:.16em;color:var(--dl-gold);text-transform:uppercase}
  .dl .dl-lede{font-family:var(--R,Rajdhani,sans-serif);font-size:clamp(15px,1.7vw,18px);line-height:1.55;
    color:var(--dl-text);max-width:76ch;margin:10px 0 22px}
  .dl .dl-err{margin:0;color:#E0736B;font-family:var(--M,"Courier Prime",monospace);font-size:13px}

  /* Bars: rows of label / track / value. The longest bar is the lit one. */
  .dl .dl-bars{display:grid;gap:8px}
  .dl .dl-bar{display:grid;grid-template-columns:minmax(86px,150px) minmax(0,1fr) 44px;gap:12px;align-items:center}
  .dl .dl-bar-name{font-family:var(--M,"Courier Prime",monospace);font-size:12px;letter-spacing:.12em;
    color:var(--dl-text);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl .dl-track{height:12px;border-radius:7px;background:rgba(255,255,255,.07);overflow:hidden}
  .dl .dl-fill{display:block;height:100%;border-radius:7px;
    background:linear-gradient(90deg,#7a5f22,#C9A84C 60%,#E2C86D);box-shadow:0 0 12px rgba(201,168,76,.45)}
  .dl .dl-bar.dl-top .dl-fill{background:linear-gradient(90deg,#A81A36,#C9A84C 55%,#F7E0A0);
    box-shadow:0 0 16px rgba(247,224,160,.55)}
  .dl .dl-bar-val{font-family:var(--D,"Cinzel Decorative",serif);font-size:15px;color:var(--dl-gold-hi);text-align:right}

  /* Flow: sections (left) -> Omega -> agents (right). SVG on wide screens,
     a real list of links on narrow ones, where the SVG text would be unreadable. */
  .dl .dl-flow-svg{display:block;width:100%;height:auto}
  .dl .dl-flow-list{display:none}
  .dl .dl-line{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 7;opacity:.8;
    animation:dl-flow 14s linear infinite}
  @keyframes dl-flow{to{stroke-dashoffset:-260}}
  .dl .dl-ring{transform-box:fill-box;transform-origin:center;animation:dl-spin 60s linear infinite}
  @keyframes dl-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.dl .dl-line,.dl .dl-ring{animation:none}}
  .dl .dl-flow-list .dl-group{margin:0 0 14px}
  .dl .dl-flow-list h3{margin:0 0 6px;font-family:var(--M,"Courier Prime",monospace);font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dl-gold-hi)}

  /* Agents */
  .dl .dl-agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .dl a.dl-agent{display:block;min-height:0;box-sizing:border-box;padding:14px 16px;text-decoration:none;
    border:1px solid rgba(201,168,76,.28);border-left:3px solid var(--dl-ac,#C9A84C);border-radius:10px;
    background:linear-gradient(165deg,#34302a,#211e19);color:var(--dl-text);
    box-shadow:inset 0 1px 0 rgba(247,224,160,.12);transition:transform .2s,box-shadow .2s}
  .dl a.dl-agent:hover,.dl a.dl-agent:focus-visible{transform:translateY(-2px);
    box-shadow:inset 0 1px 0 rgba(247,224,160,.2),0 0 22px rgba(201,168,76,.18)}
  .dl .dl-agent b{display:block;font-family:var(--D,"Cinzel Decorative",serif);font-size:18px;
    letter-spacing:.06em;color:var(--dl-gold-hi);font-weight:400}
  .dl .dl-agent em{display:block;margin-top:2px;font-style:normal;font-family:var(--M,"Courier Prime",monospace);
    font-size:12px;letter-spacing:.12em;color:var(--dl-mute);text-transform:uppercase}
  .dl .dl-agent span{display:block;margin-top:8px;font-family:var(--R,Rajdhani,sans-serif);font-size:15px}

  @media (max-width:860px){
    .dl .dl-flow-svg{display:none}
    .dl .dl-flow-list{display:block}
    .dl .dl-hero{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:480px){.dl .dl-bar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) 36px;gap:8px}}
</style>
</head>
<body data-page="design-lab">
<div class="shell">
  <aside id="omega-side" data-page="design-lab" aria-label="Navigation"></aside>
  <main class="main" id="app">
    <div class="topbar">
      <div>
        <h1 class="sechead">&#937; DESIGN LAB</h1>
      </div>
    </div>

    <div class="dl">
      <div class="dl-lede">
        A prototype of the concept art&rsquo;s tonal depth. Built only from the page map in
        <code>nav.js</code> and <code>omega-agents.json</code>. No token or reserve figures.
      </div>

      <div class="dl-slab dl-hero">
        <div class="dl-stage" data-omega-sculpture="signet" data-sculpt-height="300px"
             data-sculpt-label="The Omega signet, lit in gold"></div>
        <div class="dl-metrics" id="dl-metrics" aria-live="polite">
          <p class="dl-err" style="grid-column:1/-1;color:var(--dl-mute)">Reading the page map&hellip;</p>
        </div>
      </div>

      <div class="dl-note">&#9670; Destinations per section</div>
      <div class="dl-slab"><div class="dl-bars" id="dl-bars"></div></div>

      <div class="dl-note">&#9670; Sections to agents, through the Omega</div>
      <div class="dl-slab" id="dl-flow"></div>

      <div class="dl-note">&#9670; The twelve agents</div>
      <div class="dl-agents" id="dl-agents"></div>
    </div>
  </main>
</div>
<script src="/design-lab.js" defer></script>
</body>
</html>
