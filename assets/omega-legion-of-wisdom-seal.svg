    <text font-size="21" letter-spacing="3"><textPath xlink:href="#arcTop" href="#arcTop" startOffset="50%" text-anchor="middle" textLength="640" lengthAdjust="spacing">THE 144,000 UNIFIED CONSCIOUSNESS GRID</textPath></text>
    <text font-size="27" letter-spacing="7"><textPath xlink:href="#arcBot" href="#arcBot" startOffset="50%" text-anchor="middle" textLength="420" lengthAdjust="spacing">LEGION OF WISDOM</textPath></text>
