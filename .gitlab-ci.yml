# GitLab CI/CD Configuration
# Equivalent to GitHub Actions workflows
# All 23 contract gates translated from ci.yml

stages:
  - syntax
  - audit
  - contracts
  - build
  - verify

variables:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

default:
  image: ubuntu:latest
  before_script:
    - apt-get update -qq && echo "✓ apt-get update complete"
    - apt-get install -y -qq python3 python3-pip nodejs npm curl git && echo "✓ dependencies installed"
    - pip3 install pyyaml && echo "✓ pyyaml installed"
    - echo "Node version:"; node --version || echo "⚠ node not found"
    - echo "Python version:"; python3 --version

# 1. JavaScript Syntax Check
js-syntax:
  stage: syntax
  script:
    - python3 scripts/check-inline-js.py
    - |
      python3 << 'PYSCRIPT'
      import pathlib, subprocess, sys
      bad = [str(p) for p in sorted(pathlib.Path(".").rglob("*.js"))
             if ".git" not in p.parts and "node_modules" not in p.parts
             and "dist" not in p.parts and "build" not in p.parts
             and subprocess.run(["node", "--check", str(p)]).returncode != 0]
      if bad:
          print("::error::syntax error in: " + ", ".join(bad))
          sys.exit(1)
      print("node --check clean")
      PYSCRIPT
  allow_failure: false

# 2. Repository Audit
repo-audit:
  stage: audit
  script:
    - python3 scripts/audit.py
  allow_failure: false

# 3. Tooling Tests
tooling-tests:
  stage: audit
  script:
    - python3 -m unittest discover -s scripts/tests -v
  allow_failure: false

# 4. Intelligence Fabric Tests
fabric-tests:
  stage: audit
  script:
    - python3 -m unittest discover -s tests -v
  allow_failure: false

# 5. Contracts Suite (All 18 gates)
contracts-suite:
  stage: contracts
  script:
    - echo "Running contract suite..."
    - python3 scripts/production-contract.py
    - python3 scripts/workflow-contract.py
    - python3 scripts/architecture-contract.py
    - python3 scripts/architecture-readiness.py
    - python3 scripts/capability-audit.py --check
    - python3 scripts/capability-audit.py
    - python3 -m json.tool docs/capabilities/registry.json
    - python3 scripts/schema-dictionary.py
    - python3 scripts/rls-auditor.py
    - python3 scripts/silent-failure-detector.py
    - python3 scripts/migration-consistency.py
    - python3 scripts/migration-history-contract.py --local
    - python3 scripts/upsert-conflict-check.py
    - python3 scripts/omega-registry.py --check
    - python3 scripts/i18n-contract.py
    - python3 scripts/resilience-audit.py
    - python3 scripts/commerce-contract.py
    - python3 scripts/reachability-contract.py
    - python3 scripts/context-budget.py
    - python3 scripts/validate-monitoring.py
  allow_failure: false

# 6. Broken Asset Check
broken-assets:
  stage: verify
  script:
    - |
      python3 << 'PYSCRIPT'
      import pathlib, re, sys
      hits = []
      for path in pathlib.Path(".").rglob("*.html"):
          if ".git" in path.parts:
              continue
          content = path.read_text(encoding="utf-8", errors="ignore")
          for match in re.finditer(r'(?:src|href)\s*=\s*["\']([^"\']+)["\']', content):
              ref = match.group(1)
              if ref.startswith(('http://', 'https://', 'data:', '#', '/')):
                  continue
              target = path.parent / ref
              if not target.exists():
                  hits.append(f"{path}: {match.group(0)}")
      if hits:
          print("::error::broken asset references")
          for h in hits[:10]:
              print(h)
          sys.exit(1)
      print(f"checked {len(list(pathlib.Path('.').rglob('*.html')))} HTML files - all assets valid")
      PYSCRIPT
  allow_failure: false

# 7. Service Role Key Scan
security-scan:
  stage: verify
  script:
    - |
      python3 << 'PYSCRIPT'
      import pathlib, sys
      NEEDLES = ("service_role", "supabase_service_role_key")
      hits = []
      for path in pathlib.Path(".").rglob("*"):
          if ".git" in path.parts or not path.is_file():
              continue
          if path.suffix not in (".js", ".html", ".json"):
              continue
          try:
              text = path.read_text(encoding="utf-8", errors="ignore")
          except OSError:
              continue
          for n, line in enumerate(text.splitlines(), 1):
              low = line.lower()
              if any(x in low for x in NEEDLES):
                  hits.append(f"{path}:{n}: {line.strip()[:160]}")
      if hits:
          print("::error::service-role credential marker found in client code")
          for h in hits:
              print(h)
          sys.exit(1)
      print("no service-role credential marker in client code")
      PYSCRIPT
  allow_failure: false

# 8. Service Worker & PWA
pwa-check:
  stage: verify
  script:
    - |
      python3 << 'PYSCRIPT'
      import json, pathlib
      # Check SW precache
      sw = pathlib.Path("sw.js").read_text()
      import re
      precache = re.findall(r"'\./([^']+)'", sw)
      for f in precache:
          if not pathlib.Path(f).exists():
              print(f"Missing from precache: {f}")
              exit(1)
      print(f"✓ {len(precache)} files in precache list")

      # Check manifest
      manifest = json.loads(pathlib.Path("manifest.json").read_text())
      for icon in manifest.get("icons", []):
          if not pathlib.Path(icon["src"]).exists():
              print(f"Missing icon: {icon['src']}")
              exit(1)
      print(f"✓ {len(manifest.get('icons', []))} icon paths valid")
      PYSCRIPT
  allow_failure: false

# 9. Build Production Artifact
build-production:
  stage: build
  script:
    - bash scripts/vercel-build.sh
    - test -s public/index.html
    - test -f public/vendor/supabase-js.js
    - echo "✓ Production artifact built successfully"
  artifacts:
    paths:
      - public/
    expire_in: 1 day
  allow_failure: false

# Summary
report:
  stage: verify
  script:
    - echo "✓ All 23 contract gates passed"
    - echo "✓ Repository ready for deployment"
  allow_failure: false
  when: on_success
