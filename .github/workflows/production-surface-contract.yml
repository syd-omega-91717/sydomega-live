name: Production Surface Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-surface:
    name: Production surface contract
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python
        shell: pwsh
        run: python --version

      - name: Run production surface contract
        shell: pwsh
        run: python scripts/production-surface-contract.py
