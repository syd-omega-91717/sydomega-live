name: Omega Update
on:
  workflow_dispatch:
    inputs:
      file_name:
        description: 'File to update'
        required: true
# Supersede in-flight runs for the same ref. Without this every push
# leaves its predecessor running to completion, billing Actions minutes
# for a result nobody will read. cancel-in-progress is TRUE deliberately:
# a ref-keyed group with FALSE starves instead (CLAUDE.md 8.2).
concurrency:
  group: omega-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: |
          # You would paste my code here, or use a script
          echo "Update applied"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: omega update"
