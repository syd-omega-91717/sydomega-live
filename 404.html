<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>&#937; SYD OMEGA 91717 &mdash; 404 Node Not Found</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{--void:#0A0A0F;--gold:#C9A84C;--solar:#E2C86D;--cyan:#00E5FF;--muted:#8a8676}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:#e9e6dc;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.omega{font-family:'Cinzel Decorative',serif;font-size:clamp(80px,20vw,160px);color:rgba(201,168,76,.08);line-height:1;margin-bottom:-20px}
.code{font-family:'Cinzel Decorative',serif;font-size:clamp(14px,3vw,20px);color:var(--gold);letter-spacing:6px;margin-bottom:12px}
.msg{font-family:'Courier Prime',monospace;font-size:13px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.sub{font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:2px;color:rgba(138,134,118,.5);margin-bottom:32px}
a{font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:3px;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,.3);padding:10px 20px;border-radius:2px;margin:4px;display:inline-block;transition:.18s}
a:hover{background:rgba(201,168,76,.08);border-color:var(--gold)}
canvas{position:fixed;inset:0;z-index:-1;width:100%;height:100%;opacity:.4}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="omega">&#937;</div>
<div class="code">404 &mdash; NODE NOT FOUND</div>
<div class="msg">The lattice node you are seeking does not exist.</div>
<div class="sub">9&#215;9&#215;9 = 729 INNER NODES &middot; 12&#215;12&#215;9&#179; = 104,976 CANONICAL &middot; THIS URL IS NONE OF THEM</div>
<div>
  <a href="/dashboard.html">&#9670; RETURN TO DASHBOARD</a>
  <a href="/gaming.html">&#9671; GAMING UNIVERSE</a>
  <a href="/knowledge.html">&#9670; KNOWLEDGE GRAPH</a>
</div>
<script>
(function(){
  var cv=document.getElementById('cv');
  var ctx=cv.getContext('2d');
  var W,H,pts=[];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;pts=[];}
  function mkPt(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,a:Math.random()*Math.PI*2};}
  window.addEventListener('resize',resize);resize();
  for(var i=0;i<60;i++)pts.push(mkPt());
  function frame(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.a+=.005;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;});
    for(var i=0;i<pts.length;i++){
      ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,2,0,Math.PI*2);
      ctx.fillStyle='rgba(201,168,76,.4)';ctx.fill();
      for(var j=i+1;j<pts.length;j++){
        var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y;
        var d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);
        ctx.strokeStyle='rgba(201,168,76,'+(1-d/120)*.08+')';ctx.lineWidth=.5;ctx.stroke();}
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){});}</script>
</body>
</html>
