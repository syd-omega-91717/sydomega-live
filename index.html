*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,rgba(201,168,76,.075),transparent 25%),radial-gradient(circle at 50% 50%,rgba(0,229,255,.035),transparent 43%)}
.world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 52%,rgba(13,20,29,.4),transparent 55%)}
.grid{position:absolute;inset:-15%;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:42px 42px;transform:perspective(800px) rotateX(68deg) scale(1.35);transform-origin:center bottom;opacity:.38}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(201,168,76,.38) 0 1px,transparent 1.4px);background-size:173px 151px,271px 219px;background-position:31px 19px,92px 77px;opacity:.42}
.orbit{position:absolute;left:50%;top:42%;width:min(1450px,120vw);height:min(420px,38vw);transform:translate(-50%,-50%) rotate(-5deg);border:1px solid rgba(201,168,76,.075);border-radius:50%;box-shadow:0 0 80px rgba(0,229,255,.018)}.orbit:after{content:"";position:absolute;inset:24% 17%;border:1px solid rgba(0,229,255,.045);border-radius:50%}
.shell{position:relative;z-index:2;width:100%;height:100%;display:grid;place-items:center;padding:28px}.card{width:min(540px,calc(100vw - 48px));min-height:596px;padding:54px 42px 42px;border:1px solid rgba(201,168,76,.25);border-radius:26px;background:linear-gradient(145deg,rgba(20,22,23,.92),rgba(5,8,13,.9));box-shadow:0 30px 110px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;text-align:center}
.emblem{position:relative;width:178px;height:178px;display:grid;place-items:center;margin:0 auto 20px;border:1px solid rgba(201,168,76,.55);border-radius:50%;font-family:Georgia,"Times New Roman",serif;font-size:78px;color:var(--gold-hi);text-shadow:0 0 28px rgba(255,225,130,.55);box-shadow:0 0 35px rgba(201,168,76,.1),inset 0 0 35px rgba(201,168,76,.04)}.emblem:before,.emblem:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.emblem:before{inset:-16px;border:1px solid rgba(201,168,76,.3)}.emblem:after{inset:31px;border:1px solid rgba(0,229,255,.23)}
.kicker{margin-top:1px;color:var(--cyan);font-family:Georgia,"Times New Roman",serif;font-size:8px;font-weight:700;letter-spacing:.43em;text-transform:uppercase}h1{margin:15px 0 9px;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(39px,5vw,53px);line-height:.98;letter-spacing:.16em;color:#f7e8b4;text-shadow:0 0 24px rgba(201,168,76,.12)}.rule{width:270px;height:1px;margin:19px auto 14px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.65),transparent)}.sub{color:#7c8493;font-family:Georgia,"Times New Roman",serif;font-size:7px;letter-spacing:.38em;text-transform:uppercase}
.enter{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:28px;min-width:160px;padding:11px 20px;border:1px solid rgba(201,168,76,.72);border-radius:999px;color:#f0dfab;background:rgba(201,168,76,.025);text-decoration:none;font-family:Georgia,"Times New Roman",serif;font-size:12px;font-weight:700;letter-spacing:.12em;box-shadow:0 0 20px rgba(201,168,76,.08);transition:all .25s ease}.enter:hover,.enter:focus-visible{background:rgba(201,168,76,.1);box-shadow:0 0 34px rgba(201,168,76,.16);transform:translateY(-2px);outline:none}.enter span{font-size:15px}.stats{display:flex;justify-content:center;gap:36px;margin-top:28px}.stat strong{display:block;color:#eee3c4;font-family:Georgia,"Times New Roman",serif;font-size:10px;font-weight:400;letter-spacing:.12em}.stat small{display:block;margin-top:4px;color:#687080;font-size:5px;letter-spacing:.3em;text-transform:uppercase}.discover{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:4;color:#697183;text-decoration:none;font-size:9px;letter-spacing:.22em;text-transform:uppercase;transition:color .2s;white-space:nowrap}.discover:hover,.discover:focus-visible{color:var(--gold);outline:none}
@media(max-width:560px){body{overflow:auto}.shell{min-height:100%;padding:20px}.card{min-height:560px;padding:42px 25px 34px}.emblem{width:145px;height:145px;font-size:66px}h1{font-size:34px;letter-spacing:.12em}.stats{gap:20px}.discover{position:fixed;bottom:10px;font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
