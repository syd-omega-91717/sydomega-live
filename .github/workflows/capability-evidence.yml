name: Capability Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sydomega-quality-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: python

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        run: |
          import os
          print("runner=" + os.environ.get("RUNNER_NAME", "unknown"))
          print("runner_os=" + os.environ.get("RUNNER_OS", "unknown"))
          print("runner_arch=" + os.environ.get("RUNNER_ARCH", "unknown"))
          print("run=" + os.environ.get("GITHUB_RUN_ID", "unknown"))
          print("attempt=" + os.environ.get("GITHUB_RUN_ATTEMPT", "unknown"))
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate capability registry
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/capability-audit.py', '--check']).returncode)
      - name: Source runtime audit
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/capability-audit.py']).returncode)
      - name: Validate registry JSON
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', '-m', 'json.tool', 'docs/capabilities/registry.json']).returncode)
      - name: Validate architecture runtime
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/architecture-readiness.py']).returncode)
      - name: Runtime verification (headless render of capability entrypoints)
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['node', 'scripts/verify-runtime.js']).returncode)
      - name: Execution marker
        shell: python
        run: |
          import os
          runner = os.environ.get("RUNNER_NAME", "unknown")
          if runner != "unknown":
            print("CAPABILITY_EVIDENCE_EXECUTED=true")
            print("CAPABILITY_EVIDENCE_RUN_ID=" + os.environ.get("GITHUB_RUN_ID", ""))
            print("CAPABILITY_EVIDENCE_RUN_ATTEMPT=" + os.environ.get("GITHUB_RUN_ATTEMPT", ""))