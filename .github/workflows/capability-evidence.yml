name: Capability Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capability-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate capability registry
        run: python3 scripts/capability-audit.py

      - name: Validate registry JSON
        run: python3 -m json.tool docs/capabilities/registry.json >/dev/null

      - name: Verify generated registry is committed
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- docs/capabilities/registry.json
