name = "sydomega-rate-limiter"
main = "workers/rate-limiter.js"
compatibility_date = "2024-09-11"

[env.production]
route = "sydomega.com/*"
zone_id = "your_zone_id_here"

[[kv_namespaces]]
binding = "RATE_LIMIT_STORE"
id = "rate-limit-store"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "sydomega-rate-limiter"
