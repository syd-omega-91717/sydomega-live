name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository audit
        run: python scripts/audit.py
      - name: Audit tooling tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Intelligence fabric tests
        run: python -m unittest discover -s tests -v
      - name: Production contract
        run: python scripts/production-contract.py
      - name: Workflow contract
        run: python scripts/workflow-contract.py
      - name: Capability audit
        run: python scripts/capability-audit.py --check
      - name: i18n contract
        run: python scripts/i18n-contract.py
      - name: Resilience audit
        run: python scripts/resilience-audit.py
      - name: Commerce contract
        run: python scripts/commerce-contract.py
      - name: Reachability contract
        run: python scripts/reachability-contract.py
      - name: Context budget
        run: python scripts/context-budget.py
