name: Visual Page Survey

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'scripts/visual-page-survey.py'
      - '.github/workflows/visual-page-survey.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'scripts/visual-page-survey.py'
      - '.github/workflows/visual-page-survey.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-page-survey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  survey:
    name: Survey every visual page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run complete visual survey
        run: python scripts/visual-page-survey.py --json visual-page-survey.json
      - name: Publish survey summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Ω Visual Page Survey"
            echo
            python scripts/visual-page-survey.py
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload page-by-page survey
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        if: always()
        with:
          name: omega-visual-page-survey
          path: visual-page-survey.json
          if-no-files-found: error
