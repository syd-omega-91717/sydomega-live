<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SYD OMEGA 91717 — ORRERY · the twelve tracks as one living wheel: signs, gods, elements, agents, gates and houses">
<title>&#937; SYD OMEGA 91717 &mdash; ORRERY</title>

<link rel="manifest" href="/manifest.json">
<script src="/bg.js" defer></script>
<script src="/omega-sparkline.js" defer></script>
</head>
<body>
<a href="#main-content" class="skip-link">SKIP TO CONTENT</a>
<div class="shell" id="app" style="display:none">
  <aside class="side" id="omega-side" data-page="orrery" aria-label="Navigation"></aside>
  <main class="main" role="main" id="main-content">
    <div class="topbar">
      <div class="t">ORRERY<small>COSMOS &middot; 12 TRACKS &middot; ONE WHEEL</small></div>
    </div>

    <div class="pad orr">
      <!-- LENS: one wheel, six systems -->
      <div class="orr-lens" role="tablist" aria-label="Lens" id="orr-lens"></div>
      <!-- ELEMENT FILTER -->
      <div class="orr-els" id="orr-els" aria-label="Elements"></div>

      <div class="orr-grid">
        <div class="orr-stage">
          <div class="orr-wheel" id="orr-wheel" tabindex="0" role="group"
               aria-label="Twelve tracks. Arrow keys turn the wheel; drag to spin.">
            <!-- The spokes turn WITH the ring: a static spoke layer pointed the
                 highlight at whichever sign used to sit there. -->
            <div class="orr-ring" id="orr-ring">
              <svg class="orr-svg" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="41" class="orr-orbit"/>
                <circle cx="50" cy="50" r="27" class="orr-orbit orr-inner"/>
                <g id="orr-spokes"></g>
              </svg>
              <div id="orr-nodes"></div>
            </div>
            <div class="orr-core" aria-live="polite">
              <div class="orr-omega">&#937;</div>
              <div class="orr-core-v" id="orr-core-v">&nbsp;</div>
              <div class="orr-core-k" id="orr-core-k">&nbsp;</div>
            </div>
          </div>
        </div>

        <!-- SELECTED TRACK -->
        <section class="card orr-panel" id="orr-panel" aria-live="polite">
          <div class="orr-head">
            <span class="orr-mark" id="orr-mark"></span>
            <div>
              <div class="orr-n" id="orr-n"></div>
              <div class="orr-sign" id="orr-sign"></div>
              <div class="orr-role" id="orr-role"></div>
            </div>
          </div>
          <div class="orr-facets" id="orr-facets"></div>
          <blockquote class="orr-voice" id="orr-voice"></blockquote>
          <div class="orr-step">
            <button class="btn" type="button" id="orr-prev" data-omega-task-id="orrery.track.prev" aria-label="Previous track">&#8592;</button>
            <button class="btn btn-fill" type="button" id="orr-mine" data-omega-task-id="orrery.track.mine" hidden>MY TRACK</button>
            <button class="btn" type="button" id="orr-next" data-omega-task-id="orrery.track.next" aria-label="Next track">&#8594;</button>
          </div>
        </section>
      </div>

      <!-- YOU: only what the database records for this member -->
      <section class="orr-you" id="orr-you" hidden>
        <div class="kpi"><div class="kpi-l">AUTHORITY</div><div class="kpi-n" id="you-auth">&ndash;</div></div>
        <div class="kpi"><div class="kpi-l">LATTICE</div><div class="kpi-n" id="you-node">&ndash;</div><div class="orr-sub" id="you-pct"></div></div>
        <div class="kpi orr-axes" id="you-axes"></div>
        <div class="kpi"><div class="kpi-l">POINTS</div><div class="kpi-n" id="you-pts">&ndash;</div>
          <div data-omega-spark data-spark-label="POINTS PER DAY" id="you-spark"></div></div>
        <div class="kpi"><div class="kpi-l">EVOLUTIONS</div><div class="kpi-n" id="you-evo">&ndash;</div></div>
        <div class="kpi"><div class="kpi-l">TASKS DONE</div><div class="kpi-n" id="you-tasks">&ndash;</div></div>
      </section>
    </div>
  </main>
</div>

<style>
.orr{display:flex;flex-direction:column;gap:14px}
.orr-lens,.orr-els{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:700px){.orr-lens,.orr-els{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .orr-lens button,.orr-els button{flex:0 0 auto}}
.orr-lens button,.orr-els button{font-family:var(--M);font-size:12px;letter-spacing:1.5px;padding:7px 12px;
  background:rgba(255,255,255,.03);color:var(--muted);border:1px solid rgba(255,255,255,.1);border-radius:2px;cursor:pointer;
  transition:color .2s,border-color .2s,background .2s}
.orr-lens button[aria-selected="true"]{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.1)}
.orr-els button[aria-pressed="true"]{color:var(--ink);border-color:var(--el,var(--cyan));background:rgba(255,255,255,.07)}
.orr-els button[disabled]{opacity:.45;cursor:default}
.orr-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.orr-stage{display:flex;justify-content:center}
.orr-wheel{position:relative;width:100%;max-width:560px;aspect-ratio:1;touch-action:none;cursor:grab;outline:none;user-select:none}
.orr-wheel:focus-visible{box-shadow:0 0 0 2px var(--gold);border-radius:50%}
.orr-wheel.drag{cursor:grabbing}
.orr-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orr-orbit{fill:none;stroke:rgba(201,168,76,.28);stroke-width:.25}
.orr-inner{stroke:rgba(0,229,255,.16);stroke-dasharray:.6 1.4}
#orr-spokes line{stroke:rgba(201,168,76,.16);stroke-width:.18;transition:stroke .3s,stroke-width .3s}
#orr-spokes line.on{stroke:var(--gold);stroke-width:.45}
.orr-ring{position:absolute;inset:0;transform:rotate(var(--rot,0deg));transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.orr-wheel.drag .orr-ring{transition:none}
.orr-node{position:absolute;left:var(--x);top:var(--y);width:15%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:none;border:0;padding:0;cursor:pointer;color:var(--ink);transition:opacity .3s,filter .3s}
/* A shared button rule sets overflow:hidden, which clipped every label. */
.orr-wheel .orr-node{overflow:visible}
.orr-node>.orr-face{position:relative;display:block;transform:rotate(calc(-1 * var(--rot,0deg)));
  transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.orr-wheel.drag .orr-node>.orr-face{transition:none}
.orr-node [data-omega-emblem]{display:block;width:100%;aspect-ratio:1;transition:transform .3s}
/* omega-emblems.js draws a dashed ring that overflows the emblem box and
   paints over anything directly beneath it, so the label sits clear of it
   and above it. */
.orr-node .orr-lbl{position:absolute;z-index:2;left:50%;top:128%;transform:translateX(-50%);font-family:var(--M);font-size:12px;
  letter-spacing:1px;white-space:nowrap;color:var(--ink);opacity:.72;text-shadow:0 1px 6px #000,0 0 2px #000;pointer-events:none}
.orr-node:hover [data-omega-emblem],.orr-node:focus-visible [data-omega-emblem]{transform:scale(1.12)}
.orr-node[aria-pressed="true"] [data-omega-emblem]{transform:scale(1.3);filter:drop-shadow(0 0 10px var(--c))}
.orr-node[aria-pressed="true"] .orr-lbl{color:var(--gold)}
.orr-node.dim{opacity:.22;filter:grayscale(.7)}
.orr-node.you::before{content:'';position:absolute;inset:-14%;border:1px dashed var(--cyan);border-radius:50%;pointer-events:none;
  animation:orr-you 18s linear infinite}
@keyframes orr-you{to{rotate:360deg}}
.orr-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;text-align:center;pointer-events:none}
.orr-omega{font-family:var(--D);font-size:clamp(28px,7vw,54px);color:var(--gold);line-height:1;text-shadow:0 0 24px rgba(201,168,76,.45)}
.orr-core-v{font-family:var(--D);font-size:clamp(14px,2.4vw,20px);color:var(--ink);margin-top:6px;line-height:1.2}
.orr-core-k{font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted);margin-top:4px}
.orr-panel{padding:18px;display:flex;flex-direction:column;gap:14px;--card-accent:var(--c,var(--gold))}
.orr-head{display:flex;gap:14px;align-items:center}
.orr-mark{width:72px;height:72px;flex-shrink:0;display:block}
.orr-mark>[data-omega-emblem]{display:block;width:100%;height:100%}
.orr-n{font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted)}
.orr-sign{font-family:var(--D);font-size:26px;color:var(--c,var(--gold));line-height:1.1}
.orr-role{font-family:var(--R);font-size:15px;color:var(--ink);opacity:.85}
.orr-facets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.orr-facet{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:2px;
  color:var(--ink);text-decoration:none;transition:border-color .2s,background .2s}
.orr-facet:hover,.orr-facet:focus-visible{border-color:var(--c,var(--gold));background:rgba(255,255,255,.04)}
.orr-facet b{font-family:var(--M);font-size:12px;letter-spacing:1.5px;color:var(--muted);font-weight:400}
.orr-facet span{font-family:var(--R);font-size:14px;line-height:1.25}
.orr-facet.lens{border-color:var(--gold)}
.orr-voice{margin:0;padding:0 0 0 10px;border-left:2px solid var(--c,var(--gold));font-family:var(--R);font-size:15px;font-style:italic;color:var(--ink);opacity:.8}
.orr-voice:empty{display:none}
.orr-step{display:flex;gap:8px;justify-content:space-between}
.orr-you{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.orr-you .kpi{padding:12px}
.orr-you .kpi-l{font-family:var(--M);font-size:12px;letter-spacing:1.5px;color:var(--muted)}
.orr-sub{font-family:var(--M);font-size:12px;color:var(--muted)}
.orr-axes{display:flex;flex-direction:column;gap:6px}
.orr-ax{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-family:var(--M);font-size:12px;color:var(--muted)}
.orr-ax .bar-track{height:4px}
@media (max-width:900px){.orr-grid{grid-template-columns:1fr}}
@media (max-width:480px){.orr-node .orr-lbl{display:none}.orr-facets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.orr-ring,.orr-node>.orr-face,.orr-node [data-omega-emblem]{transition:none}.orr-node.you::before{animation:none}}
</style>

<script type="module" src="/omega-orrery.js"></script>
<script type="module" src="/omega-analytics-init.js"></script><script type="module" src="/omega-speed-insights-init.js"></script></body>
</html>
