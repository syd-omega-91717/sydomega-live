  <text x="500" y="98" text-anchor="middle" font-family="Cinzel Decorative, Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="7" fill="url(#goldText)" filter="url(#textGlow)">SYD&#160;&#160;OMEGA&#160;&#160;91717</text>
  <text x="500" y="132" text-anchor="middle" font-family="'Courier New', monospace" font-size="12.5" letter-spacing="4.5" fill="#00E5FF" fill-opacity="0.85">SOVEREIGN PERSONAL PLATFORM &#183; INVITATION ONLY</text>
  <text x="500" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" letter-spacing="3.5" fill="#8a8676">HABITS &#183; LEARNING &#183; FINANCE &#183; MEDIA &#183; COMMUNITY</text>

  <rect x="0" y="0" width="1000" height="2" fill="url(#scan)">
    <animate attributeName="y" values="0;200;0" dur="8s" repeatCount="indefinite"/>
