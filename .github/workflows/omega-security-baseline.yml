name: Omega Security Baseline

on:
  push:
    branches: [claude/sydomega91717-audit-1tyoja]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'

permissions:
  contents: read

concurrency:
  group: omega-security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Static security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run security baseline
        run: python3 scripts/omega_security_baseline.py
