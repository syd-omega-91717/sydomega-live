name: Workflow Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: python

jobs:
  workflow-contract:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        # Deliberately AFTER setup-python, not first. `shell: python`
        # needs an interpreter on PATH, and a capability probe measured
        # pwsh working at step 6 but NOT at step 1 on this runner
        # ("pwsh: command not found"), which is exactly the mistake of
        # measuring in one position and assuming another. setup-python
        # guarantees it from here on, on both Windows and Linux.
        run: |
          import os, sys
          for var in ("RUNNER_NAME", "RUNNER_OS", "RUNNER_ARCH"):
              if not os.environ.get(var):
                  print(f"::error::{var} is empty - no real runner")
                  sys.exit(1)
          print("runner=" + os.environ["RUNNER_NAME"])
          print("runner_os=" + os.environ["RUNNER_OS"])
          print("runner_arch=" + os.environ["RUNNER_ARCH"])
          print("run=" + os.environ.get("GITHUB_RUN_ID", ""))
          print("attempt=" + os.environ.get("GITHUB_RUN_ATTEMPT", ""))
      - name: Validate workflow contracts
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/workflow-contract.py']).returncode)
      - name: Validate architecture contract
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/architecture-contract.py']).returncode)
      - name: Validate implementation readiness
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run(['python', 'scripts/architecture-readiness.py']).returncode)
      - name: Validate local production gate help path
        shell: python
        run: |
          import pathlib, sys
          p = pathlib.Path("scripts/ci-local.sh")
          if not p.is_file():
              sys.exit(1)
          if "--help" not in p.read_text(encoding="utf-8", errors="ignore"):
              sys.exit(1)
          print("ci-local.sh help contract verified")
      - name: Execution marker
        shell: python
        run: |
          import os, sys
          if not os.environ.get("RUNNER_NAME"):
              sys.exit(1)
          print("WORKFLOW_CONTRACT_EXECUTED=true")
          print("WORKFLOW_CONTRACT_RUN_ID=" + os.environ.get("GITHUB_RUN_ID", ""))
          print("WORKFLOW_CONTRACT_RUN_ATTEMPT=" + os.environ.get("GITHUB_RUN_ATTEMPT", ""))
