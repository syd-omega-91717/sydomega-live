name: Cloudflare Pages

# Deploys the same artifact Vercel would build to Cloudflare Pages.
# This is a manual fallback; the connected Pages integration normally deploys main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: sydomega
      WRANGLER: wrangler@4.151.1
    steps:
      - name: Check credentials
        id: creds
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Pages deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set."
          fi

      - name: Refuse production fallback deploy from non-main
        if: steps.creds.outputs.ready == 'true' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error title=Cloudflare production deployment refused::Manual production fallback is allowed only from refs/heads/main."
          echo "requested_ref=$GITHUB_REF"
          exit 1

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned smoke-test dependency
        if: steps.creds.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Build artifact
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: bash scripts/vercel-build.sh

      - name: Create the Pages project once
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes "${WRANGLER}" pages project list 2>/dev/null | grep -qw "${PROJECT}"; then
            echo "project ${PROJECT} exists"
          else
            npx --yes "${WRANGLER}" pages project create "${PROJECT}" --production-branch main
          fi

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "${WRANGLER}" pages deploy public \
            --project-name "${PROJECT}" --branch main \
            --commit-hash "${GITHUB_SHA}" --commit-dirty=true

      - name: Verify release manifest and smoke-test production
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://${PROJECT}.pages.dev"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${url}/")" || code=000
            [ "${code}" = "200" ] && break
            sleep 10
          done
          [ "${code}" = "200" ] || { echo "root returned ${code}"; exit 1; }
          curl --silent --show-error --head --max-time 20 "${url}/" | grep -qi '^content-security-policy:' || { echo "CSP header missing"; exit 1; }
          served=""
          for attempt in 1 2 3 4 5 6; do
            served="$(curl --silent --show-error --fail --max-time 15 "${url}/.well-known/omega-release.json" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).commit_sha||""))}catch(e){}})' || true)"
            if [ "${served}" = "${GITHUB_SHA}" ]; then break; fi
            echo "manifest_attempt=${attempt} served=${served:-none} expected=${GITHUB_SHA}"
            sleep 10
          done
          [ "${served}" = "${GITHUB_SHA}" ] || { echo "::error title=Release manifest mismatch::Cloudflare Pages does not serve the exact commit deployed by this workflow."; exit 1; }
          python scripts/cloudflare-production-smoke.py --base-url "${url}" --workers 16 --timeout 20
          echo "CLOUDFLARE_PAGES=PASS ${url} commit=${served}"
