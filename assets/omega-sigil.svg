<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SYD OMEGA 91717 sovereign sigil">
  <defs>
    <radialGradient id="sigilCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a1608" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020206" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sigilGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#9B6BF0" stop-opacity="0.06"/>
      <stop offset="75%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    <filter id="sigilBlurSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sigilBlurStrong" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="9" result="b"/>
    </filter>
    <filter id="cometGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="116" fill="#020206"/>
  <circle cx="120" cy="120" r="116" fill="url(#sigilCore)"/>
  <circle cx="120" cy="120" r="116" fill="url(#sigilGlow)"/>
  <circle cx="120" cy="120" r="114" fill="none" stroke="#C9A84C" stroke-opacity="0.16" stroke-width="1"/>

  <!-- static innermost ring -->
  <circle cx="120" cy="120" r="52" fill="none" stroke="#00E5FF" stroke-opacity="0.22" stroke-width="1"/>

  <g transform="translate(120,120)">

    <!-- outer ring: gold, 12 zodiac ticks, rotates one way -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="42s" repeatCount="indefinite"/>
      <circle r="100" fill="none" stroke="#C9A84C" stroke-opacity="0.75" stroke-width="1.3"/>
      <g stroke="#C9A84C" stroke-opacity="0.55" stroke-width="1.1">
        <path d="M0 -100 L0 -91"/><path d="M0 100 L0 91"/>
        <path d="M-100 0 L-91 0"/><path d="M100 0 L91 0"/>
        <path d="M70.7 -70.7 L64.3 -64.3"/><path d="M-70.7 -70.7 L-64.3 -64.3"/>
        <path d="M70.7 70.7 L64.3 64.3"/><path d="M-70.7 70.7 L-64.3 64.3"/>
        <path d="M25.9 -97.3 L23.6 -88.7"/><path d="M-25.9 -97.3 L-23.6 -88.7"/>
        <path d="M25.9 97.3 L23.6 88.7"/><path d="M-25.9 97.3 L-23.6 88.7"/>
        <path d="M97.3 25.9 L88.7 23.6"/><path d="M97.3 -25.9 L88.7 -23.6"/>
        <path d="M-97.3 25.9 L-88.7 23.6"/><path d="M-97.3 -25.9 L-88.7 -23.6"/>
      </g>
      <g fill="#E2C86D">
        <circle cx="100" cy="0" r="2.8"/><circle cx="-100" cy="0" r="2.8"/>
        <circle cx="0" cy="100" r="2.8"/><circle cx="0" cy="-100" r="2.8"/>
      </g>
    </g>

    <!-- middle ring: cyan, ordinal markers, rotates opposite way, faster -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="27s" repeatCount="indefinite"/>
      <circle r="76" fill="none" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1"/>
      <g fill="#00E5FF" fill-opacity="0.95">
        <circle cx="53.7" cy="53.7" r="1.9"/><circle cx="-53.7" cy="53.7" r="1.9"/>
        <circle cx="53.7" cy="-53.7" r="1.9"/><circle cx="-53.7" cy="-53.7" r="1.9"/>
      </g>
    </g>

    <!-- comet: small glowing point orbiting the outer ring -->
    <g fill="#E2C86D" filter="url(#cometGlow)">
      <circle r="2.6">
        <animateMotion dur="9s" repeatCount="indefinite" path="M100,0 A100,100 0 1,1 -100,0 A100,100 0 1,1 100,0"/>
      </circle>
    </g>

    <!-- core glyph: blurred halo layer + crisp layer -->
    <text x="0" y="19" text-anchor="middle" font-family="Cinzel Decorative, Georgia, 'Times New Roman', serif" font-size="58" fill="#C9A84C" filter="url(#sigilBlurStrong)" opacity="0.55">&#937;</text>
    <text x="0" y="19" text-anchor="middle" font-family="Cinzel Decorative, Georgia, 'Times New Roman', serif" font-size="58" fill="#F0DA8E" filter="url(#sigilBlurSoft)">
      &#937;
      <animate attributeName="opacity" values="0.78;1;0.78" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
