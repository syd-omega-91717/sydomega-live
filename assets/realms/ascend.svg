<svg width="88" height="88" viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ascend realm icon">
  <defs>
    <radialGradient id="g-ascend" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#E86A3A" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#020206" stop-opacity="0"/>
    </radialGradient>
    <filter id="f-ascend" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="44" cy="44" r="42" fill="#020206"/>
  <circle cx="44" cy="44" r="42" fill="url(#g-ascend)"/>
  <circle cx="44" cy="44" r="34" fill="none" stroke="#E86A3A" stroke-opacity="0.55" stroke-width="1.3">
    <animate attributeName="stroke-opacity" values="0.35;0.75;0.35" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="44" r="41" fill="none" stroke="#E86A3A" stroke-opacity="0.18" stroke-width="1"/>
  <text x="44" y="57" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#E86A3A" filter="url(#f-ascend)">▲</text>
</svg>
