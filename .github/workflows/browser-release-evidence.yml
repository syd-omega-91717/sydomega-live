name: Browser Accessibility and Performance Evidence

# This job tests LIVE production (OMEGA_BASE_URL below), never the PR's code,
# so a pull_request trigger only added production traffic on a Hobby-plan
# account that Vercel blocked for usage on 2026-10-06. The block is for Edge
# Requests: one page view here costs 198-392 requests (measured 2026-10-18), so
# a run of ~20 pages with a retry spent ~10k of the ~1M monthly Hobby budget,
# and it ran on every push to main as well as daily. Weekly and on demand only.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMEGA_BASE_URL: https://sydomega.com
      npm_config_package_lock: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install isolated browser test dependencies
        run: npm install --no-save --ignore-scripts @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser release suite
        run: npx --no-install playwright test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omega-browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 30
