<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ω SYDOMEGA — Agent Network</title>
<style>
:root {
  --void: #0a0e15;
  --void2: #1a1f2e;
  --gold: #ffd700;
  --solar: #ffb700;
  --cyan: #00e5ff;
  --crim: #ff3b5c;
  --green: #2ecc71;
  --purple: #9b59b6;
  --muted: #7f8c8d;
  --ink: #ecf0f1;
  --D: 'Cinzel Decorative', serif;
  --R: 'Rajdhani', sans-serif;
  --M: 'Courier Prime', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(135deg, var(--void) 0%, var(--void2) 100%);
  color: var(--ink);
  font-family: var(--R);
  overflow-x: hidden;
  min-height: 100vh;
}

#omega-noise-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/></filter><rect width="100" height="100" filter="url(%23n)" opacity="0.03"/></svg>');
  pointer-events: none;
  z-index: 999;
  opacity: 0.035;
}

.shell {
  display: flex;
  min-height: 100vh;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.topbar {
  padding: 2rem;
  border-bottom: 1px solid rgba(0,229,255,0.1);
  background: rgba(10,14,21,0.8);
  backdrop-filter: blur(10px);
}

.topbar h1 {
  font-family: var(--D);
  font-size: 2.5rem;
  color: var(--gold);
  margin-bottom: 0.5rem;
  letter-spacing: 2px;
}

.topbar p {
  color: var(--muted);
  font-size: 0.95rem;
}

.network-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#network-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.agent-panel {
  position: fixed;
  right: 0;
  top: 0;
  width: 320px;
  height: 100vh;
  background: rgba(10,14,21,0.95);
  border-left: 1px solid rgba(0,229,255,0.2);
  backdrop-filter: blur(10px);
  overflow-y: auto;
  padding: 2rem 1.5rem;
  z-index: 100;
  transform: translateX(350px);
  transition: transform 0.3s ease;
}

.agent-panel.active {
  transform: translateX(0);
}

.agent-panel-title {
  font-family: var(--D);
  font-size: 1.5rem;
  color: var(--gold);
  margin-bottom: 1rem;
  letter-spacing: 1px;
}

.agent-stat {
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid rgba(255,215,0,0.1);
}

.agent-stat-label {
  font-family: var(--M);
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 0.3rem;
}

.agent-stat-value {
  font-family: var(--D);
  font-size: 1.8rem;
  color: var(--cyan);
}

.agent-info {
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--muted);
}

.close-panel {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: none;
  border: none;
  color: var(--gold);
  font-size: 1.5rem;
  cursor: pointer;
  z-index: 110;
}

.legend {
  position: fixed;
  bottom: 2rem;
  left: 2rem;
  background: rgba(10,14,21,0.95);
  border: 1px solid rgba(0,229,255,0.2);
  padding: 1.5rem;
  border-radius: 4px;
  backdrop-filter: blur(10px);
  max-width: 280px;
  z-index: 50;
}

.legend-title {
  font-family: var(--D);
  font-size: 1rem;
  color: var(--gold);
  margin-bottom: 1rem;
  letter-spacing: 1px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 0.7rem;
}

.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}

@keyframes glow-pulse {
  0%, 100% { filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px currentColor); }
  50% { filter: drop-shadow(0 0 12px currentColor) drop-shadow(0 0 24px currentColor); }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}

@media (max-width: 900px) {
  .agent-panel {
    width: 100%;
  }
  
  .legend {
    max-width: 240px;
    bottom: 1rem;
    left: 1rem;
  }
}
</style>
</head>
<body>
<div id="omega-noise-overlay"></div>

<div class="shell" id="app" style="display:none">
  <aside class="side" id="omega-side" data-page="agent-network" aria-label="Navigation"></aside>
  
  <main class="main">
    <div class="topbar">
      <h1>⚡ AGENT NETWORK</h1>
      <p>12 Sovereign Executors • Archetypal Command Lattice • Click any node to explore</p>
    </div>
    
    <div class="network-container">
      <canvas id="network-canvas" role="img" aria-label="12-agent constellation network visualization"></canvas>
      <div class="legend">
        <div class="legend-title">NETWORK TOPOLOGY</div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--gold);"></div>
          <span>Core Executor</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--cyan);"></div>
          <span>Secondary Function</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--green);"></div>
          <span>Active Status</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: rgba(255,215,0,0.4);"></div>
          <span>Connection Link</span>
        </div>
      </div>
    </div>
    
    <div id="agent-panel" class="agent-panel">
      <button class="close-panel" onclick="closePanel()">✕</button>
      <div id="agent-content"></div>
    </div>
  </main>
</div>

<script src="/bg.js"></script>
<script>
const agents = [
  { id: 'sentinel', name: 'Sentinel', domain: 'Security & Gates', symbol: '♐', color: '#ffd700', status: 'active' },
  { id: 'merchant', name: 'Merchant', domain: 'Commerce & Revenue', symbol: '♑', color: '#ffb700', status: 'active' },
  { id: 'scout', name: 'Scout', domain: 'Discovery & Exploration', symbol: '♒', color: '#00e5ff', status: 'active' },
  { id: 'warden', name: 'Warden', domain: 'Family & Privacy', symbol: '♓', color: '#9b59b6', status: 'active' },
  { id: 'sovereign', name: 'Sovereign', domain: 'Governance & Authority', symbol: '♈', color: '#ffd700', status: 'core' },
  { id: 'auditor', name: 'Auditor', domain: 'Validation & Verification', symbol: '♉', color: '#2ecc71', status: 'active' },
  { id: 'proxy', name: 'Proxy', domain: 'Execution & Dispatch', symbol: '♊', color: '#00e5ff', status: 'active' },
  { id: 'oracle', name: 'Oracle', domain: 'Prediction & Insight', symbol: '♋', color: '#9b59b6', status: 'active' },
  { id: 'beacon', name: 'Beacon', domain: 'Onboarding & Welcome', symbol: '♌', color: '#2ecc71', status: 'active' },
  { id: 'analyst', name: 'Analyst', domain: 'Analytics & Intelligence', symbol: '♍', color: '#00e5ff', status: 'active' },
  { id: 'tutor', name: 'Tutor', domain: 'Education & Learning', symbol: '♎', color: '#ffb700', status: 'active' },
  { id: 'historian', name: 'Historian', domain: 'Archive & Record', symbol: '♏', color: '#9b59b6', status: 'active' }
];

function drawNetwork() {
  const canvas = document.getElementById('network-canvas');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const radius = Math.min(canvas.width, canvas.height) / 3;
  
  // Draw connections
  ctx.strokeStyle = 'rgba(0,229,255,0.15)';
  ctx.lineWidth = 2;
  for (let i = 0; i < agents.length; i++) {
    const angle1 = (i / agents.length) * Math.PI * 2 - Math.PI / 2;
    const x1 = centerX + Math.cos(angle1) * radius;
    const y1 = centerY + Math.sin(angle1) * radius;
    
    for (let j = i + 1; j < agents.length; j++) {
      const angle2 = (j / agents.length) * Math.PI * 2 - Math.PI / 2;
      const x2 = centerX + Math.cos(angle2) * radius;
      const y2 = centerY + Math.sin(angle2) * radius;
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }
  
  // Draw central sovereign
  ctx.fillStyle = 'rgba(255,215,0,0.1)';
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius * 0.5, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 48px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Ω', centerX, centerY);
  
  // Draw agent nodes
  agents.forEach((agent, idx) => {
    const angle = (idx / agents.length) * Math.PI * 2 - Math.PI / 2;
    const x = centerX + Math.cos(angle) * radius;
    const y = centerY + Math.sin(angle) * radius;
    
    agent.x = x;
    agent.y = y;
    
    // Glow
    ctx.fillStyle = agent.color.replace(')', ', 0.2)').replace('rgb', 'rgba');
    ctx.beginPath();
    ctx.arc(x, y, 35, 0, Math.PI * 2);
    ctx.fill();
    
    // Node circle
    ctx.fillStyle = agent.color;
    ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI * 2);
    ctx.fill();
    
    // Border
    ctx.strokeStyle = agent.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Symbol
    ctx.fillStyle = '#000';
    ctx.font = 'bold 20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(agent.symbol, x, y);
    
    // Label
    ctx.fillStyle = agent.color;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(agent.name, x, y + 45);
  });
}

function openPanel(agentId) {
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;
  
  const panel = document.getElementById('agent-panel');
  const content = document.getElementById('agent-content');
  
  content.innerHTML = `
    <div class="agent-panel-title">${agent.name}</div>
    <div class="agent-stat">
      <div class="agent-stat-label">Symbol</div>
      <div class="agent-stat-value" style="font-size: 2.5rem;">${agent.symbol}</div>
    </div>
    <div class="agent-stat">
      <div class="agent-stat-label">Domain</div>
      <div class="agent-info">${agent.domain}</div>
    </div>
    <div class="agent-stat">
      <div class="agent-stat-label">Status</div>
      <div class="agent-info" style="color: ${agent.status === 'core' ? '#ffd700' : '#2ecc71'}">${agent.status.toUpperCase()}</div>
    </div>
    <div class="agent-stat">
      <div class="agent-stat-label">Authority</div>
      <div class="agent-info">Level 7 · Active Executor</div>
    </div>
    <div class="agent-stat">
      <div class="agent-stat-label">Last Activity</div>
      <div class="agent-info">Real-time · Live monitoring</div>
    </div>
  `;
  
  panel.classList.add('active');
}

function closePanel() {
  document.getElementById('agent-panel').classList.remove('active');
}

function setupCanvasClickListener() {
  const canvas = document.getElementById('network-canvas');
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    for (let agent of agents) {
      const dist = Math.sqrt((x - agent.x) ** 2 + (y - agent.y) ** 2);
      if (dist < 35) {
        openPanel(agent.id);
        break;
      }
    }
  });
}

window.addEventListener('load', () => {
  drawNetwork();
  setupCanvasClickListener();
  window.addEventListener('resize', drawNetwork);
});

// Redraw on scroll to maintain responsiveness
requestAnimationFrame(function animateNetwork() {
  drawNetwork();
  requestAnimationFrame(animateNetwork);
});
</script>
</body>
</html>
