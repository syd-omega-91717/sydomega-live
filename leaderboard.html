<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Leaderboards — Ω</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='8' y='26' font-size='28' font-family='Cinzel Decorative'%3EΩ%3C/text%3E%3C/svg%3E">
  <script src="/bg.js" defer></script>
  <script src="/nav.js" defer></script>
  <style>
    .lb-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .lb-tab-btn { padding: 0.75rem 1.5rem; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; color: var(--muted); cursor: pointer; transition: all 0.2s ease; font-family: var(--M); }
    .lb-tab-btn.active { background: rgba(6,182,212,.3); border-color: var(--cyan); color: var(--cyan); }
    .lb-tab-btn:hover { background: rgba(255,255,255,.1); }
    .lb-table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
    .lb-table th { text-align: left; padding: 1rem; border-bottom: 2px solid rgba(6,182,212,.3); color: var(--cyan); font-family: var(--D); }
    .lb-table td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,.05); color: var(--ink); }
    .lb-table tr:hover { background: rgba(255,255,255,.02); }
    .lb-rank { color: var(--gold); font-weight: bold; min-width: 30px; }
    .lb-rank.top1 { color: #FFD700; font-size: 1.2rem; }
    .lb-rank.top2 { color: #C0C0C0; }
    .lb-rank.top3 { color: #CD7F32; }
    .lb-loading { text-align: center; color: var(--muted); padding: 2rem; }
  </style>
</head>
<body>
  <div id="omega-side"></div>
  <main>
    <div class="shell">
      <div class="side"></div>
      <div class="main">
        <div id="app">
          <h1 style="font-family: var(--D); color: var(--cyan);">Domain Leaderboards</h1>
          <p style="color: var(--muted); margin-bottom: 2rem;">Compare your mastery across all 12 domains.</p>

          <div class="lb-tabs" id="lb-tabs"></div>
          <div id="lb-loading" class="lb-loading">Loading leaderboards...</div>
          <div id="lb-container" style="display: none;">
            <table class="lb-table" id="lb-table">
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Member</th>
                  <th>Level</th>
                  <th>Points</th>
                </tr>
              </thead>
              <tbody id="lb-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    (async function() {
      const tabs = document.getElementById('lb-tabs');
      const tbody = document.getElementById('lb-tbody');
      const loading = document.getElementById('lb-loading');
      const container = document.getElementById('lb-container');

      const domains = ['prophecy', 'finance', 'education', 'discovery', 'validation', 'execution',
                       'governance', 'onboarding', 'archive', 'family', 'security'];

      let currentDomain = 'finance';

      async function loadLeaderboard(domain) {
        tbody.innerHTML = '';
        
        try {
          const { data: entries, error } = await window.supabase
            .from('leaderboard_entries')
            .select('rank, user_id, level, points, profiles(display_name)')
            .eq('domain', domain)
            .order('points', { ascending: false })
            .limit(100);

          if (error) throw error;

          (entries || []).forEach((entry, idx) => {
            const row = document.createElement('tr');
            const rankClass = idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : '';
            const displayName = entry.profiles?.display_name || 'Member';

            row.innerHTML = `
              <td><span class="lb-rank ${rankClass}">${idx + 1}</span></td>
              <td>${displayName}</td>
              <td style="color: var(--cyan);">${entry.level}/9</td>
              <td style="color: var(--gold);">${entry.points} pts</td>
            `;
            tbody.appendChild(row);
          });

          if (!entries || entries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--muted);">No entries yet</td></tr>';
          }
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--crim);">Error: ${error.message}</td></tr>`;
        }
      }

      // Create tabs
      domains.forEach(domain => {
        const btn = document.createElement('button');
        btn.className = `lb-tab-btn ${domain === currentDomain ? 'active' : ''}`;
        btn.textContent = domain.charAt(0).toUpperCase() + domain.slice(1);
        btn.onclick = () => {
          document.querySelectorAll('.lb-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentDomain = domain;
          loadLeaderboard(domain);
        };
        tabs.appendChild(btn);
      });

      loading.style.display = 'none';
      container.style.display = 'block';
      loadLeaderboard(currentDomain);
    })();
  </script>
</body>
</html>
