name: Omega Enterprise Gate

# This gate remains available for explicit verification, but is intentionally
# excluded from automatic push execution while the repository's GitHub Actions
# runner entitlement is unavailable. This prevents repeated infrastructure
# failures and Actions-minute/deployment noise without changing the application
# or production build surface. The same static/architecture checks remain in
# the repository and can be run explicitly once Actions capacity is restored.
on:
  workflow_dispatch:

concurrency:
  group: omega-enterprise-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    name: Enterprise architecture gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Architecture evolution gate
        run: python scripts/omega_enterprise_architecture_gate.py

      - name: Repository integrity gate
        run: python scripts/repository_integrity_audit.py

      - name: Static production artifact gate
        run: bash scripts/vercel-build.sh

      - name: Artifact contract
        run: test -s public/index.html && test -s public/vendor/supabase-js.js
