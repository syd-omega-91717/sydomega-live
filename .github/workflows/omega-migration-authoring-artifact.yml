name: Temporary Supabase Migration Authoring Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/omega-migration-authoring-artifact.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Generate CLI-authored migration skeleton
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned Supabase CLI v2
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Inspect migration command
        run: supabase migration new --help

      - name: Generate timestamp through Supabase CLI
        run: |
          set -euo pipefail
          supabase migration new omega_consultancy_runtime_schema_parity
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path("supabase/migrations").glob("*_omega_consultancy_runtime_schema_parity.sql"))
          if len(files) != 1:
              raise SystemExit(f"expected exactly one generated migration, found {len(files)}")
          generated = files[0]
          version = generated.name.split("_", 1)[0]
          if len(version) != 14 or not version.isdigit():
              raise SystemExit(f"Supabase CLI emitted an invalid migration version: {version}")
          latest_provider_version = "20261112091500"
          if version <= latest_provider_version:
              # The CLI uses runner UTC; the provider's latest version is ahead of
              # this runner clock. Preserve the CLI-created file and move only its
              # version to the next monotonic second/minute after the provider ledger.
              target = generated.with_name("20261112091600_omega_consultancy_runtime_schema_parity.sql")
              if target.exists():
                  raise SystemExit(f"target migration version already exists: {target}")
              generated.rename(target)
              generated = target
              version = generated.name.split("_", 1)[0]
          if version <= latest_provider_version:
              raise SystemExit(f"migration version {version} is not after provider latest {latest_provider_version}")
          print(f"CLI_GENERATED_MIGRATION={generated}")
          PY

      - name: Upload CLI-generated migration skeleton
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omega-consultancy-schema-migration
          path: supabase/migrations/*_omega_consultancy_runtime_schema_parity.sql
          if-no-files-found: error
          retention-days: 1
