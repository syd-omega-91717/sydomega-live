name: Vercel Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the validated main artifact to Vercel Production'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.ico'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.mp4'
      - '**/*.webm'
      - 'vendor/**'
      - 'i18n/**'
      - 'assets/**'
      - 'static/**'
      - 'images/**'
      - 'img/**'
      - 'icons/**'
      - 'media/**'
      - 'fonts/**'
      - 'audio/**'
      - 'video/**'
      - 'css/**'
      - 'js/**'
      - '.well-known/**'
      - 'vercel.json'
      - 'scripts/vercel-build.sh'
      - 'scripts/vercel-build-enhance.mjs'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static contract
        run: python scripts/vercel_static_contract.py
      - name: Build artifact
        run: bash scripts/vercel-build.sh
      - name: Artifact invariants
        run: |
          set -euo pipefail
          test -s public/index.html
          test -f public/vendor/supabase-js.js
          test "$(find public -type f -name '*.html' | wc -l)" -gt 0
          echo 'VERCEL_PRODUCTION_ARTIFACT=PASS'

  credentials:
    name: Resolve deployment credentials
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      org: ${{ steps.export.outputs.org }}
      project: ${{ steps.export.outputs.project }}
    steps:
      - id: check
        shell: bash
        env:
          # Only VERCEL_TOKEN is a secret. The other two are public identifiers:
          # the Vercel bot prints both in every PR comment on this repo, and
          # .vercel/project.json carries them by convention. Requiring all three
          # as secrets meant a partial setup silently produced NOT_CONFIGURED
          # with no clue which one was missing -- so they default here and the
          # secrets stay as overrides.
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_w0v6eD1jUUzfPjiDq3ztOfvp' }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_H3aTU3D4mR7TD19etdPTeYmhvANY' }}
        run: |
          set -euo pipefail
          echo "org_resolved=${ORG:+yes}"
          echo "project_resolved=${PROJECT:+yes}"
          if [[ -n "$TOKEN" && -n "$ORG" && -n "$PROJECT" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_CREDENTIALS=READY'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_CREDENTIALS=NOT_CONFIGURED missing=VERCEL_TOKEN'
          fi
      - id: export
        shell: bash
        env:
          ORG: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_w0v6eD1jUUzfPjiDq3ztOfvp' }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_H3aTU3D4mR7TD19etdPTeYmhvANY' }}
        run: |
          set -euo pipefail
          echo "org=$ORG" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    needs: credentials
    if: >-
      needs.credentials.outputs.ready == 'true' &&
      (github.event_name == 'push' || inputs.deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ needs.credentials.outputs.org }}
      VERCEL_PROJECT_ID: ${{ needs.credentials.outputs.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pin deployment to the intended Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
      - name: Deploy to Vercel Production
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  controlled:
    name: Controlled deployment state
    needs: credentials
    if: needs.credentials.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep provider promotion controlled
        run: |
          echo 'VERCEL_PRODUCTION_DEPLOYMENT=CONTROLLED'
          echo 'Artifact validation passed; nothing was promoted to production.'
          # This job used to end here, and the workflow reported plain success
          # while deploying nothing -- the same shape as the production smoke
          # gate going green during an outage (FIXES_LOG.md 105). Measured
          # 2026-09-06: runs 2 and 3 both "succeeded" this way, with the deploy
          # job skipped, while the production alias served a 404 page from a
          # deployment dated 2026-09-05 06:50. A warning makes the inert state
          # visible on the run and the commit without failing an owner-only
          # configuration gap.
          echo '::warning title=Production was NOT promoted::VERCEL_TOKEN is not configured, so the deploy job is skipped and this run changed nothing in production. The org and project ids resolve automatically; only the token is missing. Create one at vercel.com/account/tokens and add it as the repository secret VERCEL_TOKEN.'
