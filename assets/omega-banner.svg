<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SYD OMEGA 91717 — Sovereign Personal Platform, invitation only">
  <defs>
    <linearGradient id="voidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#020206"/>
    </linearGradient>
    <radialGradient id="bannerGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2C86D"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E2C86D"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
