name: Supabase Edge Runtime Reconciliation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hardening/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Source vs live Edge Function reconciliation
    runs-on: ubuntu-latest
    steps:
      # On pull requests, reconcile the currently deployed main source with
      # Validate the proposed source and its explicit runtime classification together.
      # PENDING_DEPLOY is a truthful non-live state, not a claim of provider parity.
      # On push to main, github.sha is the exact deployed-branch source to reconcile.
      - name: Checkout deployed-source baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate Edge Function reconciliation
        run: python3 scripts/supabase-edge-runtime-reconciliation.py
