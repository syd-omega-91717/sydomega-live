name: Production Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-contract-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  contract:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          if (-not $env:RUNNER_OS)   { exit 1 }
          if (-not $env:RUNNER_ARCH) { exit 1 }
          "runner=$env:RUNNER_NAME"
          "runner_os=$env:RUNNER_OS"
          "runner_arch=$env:RUNNER_ARCH"
          "run=$env:GITHUB_RUN_ID"
          "attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production contract
        shell: pwsh
        run: python scripts/production-contract.py
      - name: JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem -File -Filter *.js | ForEach-Object {
            node --check $_.Name
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Execution marker
        shell: pwsh
        run: |
          if (-not $env:RUNNER_NAME) { exit 1 }
          "PRODUCTION_CONTRACT_EXECUTED=true"
          "PRODUCTION_CONTRACT_RUN_ID=$env:GITHUB_RUN_ID"
          "PRODUCTION_CONTRACT_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
