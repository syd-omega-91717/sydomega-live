  .tile .td{font-weight:300;color:var(--muted);font-size:12px;line-height:1.45;margin-top:6px}

  .gate-card{max-width:440px;margin:14vh auto 0;border:1px solid var(--line);background:var(--panel);padding:40px 30px;text-align:center}

  @media(prefers-reduced-motion:reduce){ .bar .fl{transition:none} .tile,.tile::after{transition:none} }
</style>

  function showGate(h,p){ document.getElementById('gate-h').textContent=h; document.getElementById('gate-p').textContent=p; document.getElementById('gate').style.display='block'; document.getElementById('app').style.display='none'; }

  // ===== animated authority gauge =====
  function drawGauge(pct){
    var cv=document.getElementById('authgauge'); if(!cv) return; var x=cv.getContext('2d'); var w=256,cx=128,cy=128,r=104;
    var target=Math.max(0,Math.min(1,pct)); var cur=0;
    function step(){
      cur += (target-cur)*0.06; if(Math.abs(target-cur)<0.002) cur=target;
      x.clearRect(0,0,w,w);
      x.lineWidth=14; x.lineCap='round';
      x.beginPath(); x.arc(cx,cy,r,-Math.PI/2,1.5*Math.PI); x.strokeStyle='#15151f'; x.stroke();
      var g=x.createLinearGradient(0,0,w,w); g.addColorStop(0,'#00E5FF'); g.addColorStop(1,'#C9A84C');
      x.beginPath(); x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+cur*2*Math.PI); x.strokeStyle=g; x.shadowColor='rgba(201,168,76,.5)'; x.shadowBlur=14; x.stroke(); x.shadowBlur=0;
      if(cur!==target && !reduce) requestAnimationFrame(step);
    }
    step();
  }

  // ===== breathing radar =====
  function radar(a,b,c){
    var cv=document.getElementById('radar'); if(!cv) return; var x=cv.getContext('2d'); var W=400,H=340,cx=200,cy=180,R=120;
    var ax=[a/9,b/9,c/9]; var t=0;
    function frame(){
      t+=0.02; x.clearRect(0,0,W,H);
      var br=reduce?0:Math.sin(t)*4;
      // rings
      for(var k=1;k<=3;k++){ x.beginPath();
        for(var i=0;i<3;i++){ var ang=-Math.PI/2+i*2*Math.PI/3; var rr=R*k/3; var px=cx+Math.cos(ang)*rr, py=cy+Math.sin(ang)*rr; if(i===0)x.moveTo(px,py);else x.lineTo(px,py);} x.closePath(); x.strokeStyle='rgba(201,168,76,.10)'; x.stroke(); }
      // axes + labels
      var labels=['KNOWLEDGE','MASTERY','CONTRIB.']; var cols=['#00E5FF','#C9A84C','#E2C86D'];
      for(var i=0;i<3;i++){ var ang=-Math.PI/2+i*2*Math.PI/3; x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R); x.strokeStyle='rgba(201,168,76,.18)'; x.stroke();
        x.fillStyle='#85837b'; x.font='9px Courier Prime'; x.textAlign='center'; x.fillText(labels[i],cx+Math.cos(ang)*(R+18),cy+Math.sin(ang)*(R+18)+3); }
      // triad
      x.beginPath();
      for(var i=0;i<3;i++){ var ang=-Math.PI/2+i*2*Math.PI/3; var rr=(R*ax[i])+br; var px=cx+Math.cos(ang)*rr, py=cy+Math.sin(ang)*rr; if(i===0)x.moveTo(px,py);else x.lineTo(px,py); }
      x.closePath(); var g=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R); g.addColorStop(0,'rgba(0,229,255,.35)'); g.addColorStop(1,'rgba(201,168,76,.35)');
      x.fillStyle=g; x.fill(); x.strokeStyle='#C9A84C'; x.lineWidth=1.5; x.stroke();
      for(var i=0;i<3;i++){ var ang=-Math.PI/2+i*2*Math.PI/3; var rr=(R*ax[i])+br; x.beginPath(); x.arc(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,3,0,7); x.fillStyle=cols[i]; x.fill(); }
      if(!reduce) requestAnimationFrame(frame);
    }
    frame();
  }

  // ===== living command orb =====
  function orb(){
    var cv=document.getElementById('orb'); if(!cv) return; var x=cv.getContext('2d');
    function size(){ cv.width=cv.clientWidth*devicePixelRatio; cv.height=cv.clientHeight*devicePixelRatio; x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
    size(); window.addEventListener('resize',size);
    var stars=[]; for(var i=0;i<70;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.2,p:Math.random()*6});
    var nodes=[]; for(var i=0;i<26;i++) nodes.push({a:Math.random()*6.28,rad:60+Math.random()*150,sp:.002+Math.random()*.006,z:Math.random(),s:Math.random()*1.8+.6});
    var t=0;
    function frame(){
      t+=0.01; var W=cv.clientWidth,H=cv.clientHeight,cx=W*0.5,cy=H*0.42;
      x.clearRect(0,0,W,H);
      for(var s of stars){ var tw=.4+.6*Math.abs(Math.sin(t+s.p)); x.globalAlpha=tw*.6; x.fillStyle='#cbb873'; x.beginPath(); x.arc(s.x*W,s.y*H,s.r,0,7); x.fill(); }
      x.globalAlpha=1;
      // concentric rings
      for(var k=0;k<3;k++){ var rr=70+k*44; x.beginPath(); x.ellipse(cx,cy,rr,rr*.36,t*(k%2?-.3:.3),0,7); x.strokeStyle='rgba(201,168,76,'+(.16-k*.03)+')'; x.lineWidth=1; x.stroke(); }
      // orbiting matrix nodes
      for(var n of nodes){ n.a+=n.sp; var rr=n.rad; var px=cx+Math.cos(n.a)*rr, py=cy+Math.sin(n.a)*rr*.36; var d=.5+.5*Math.sin(n.a);
        x.globalAlpha=.3+d*.7; x.fillStyle=n.z>.5?'#00E5FF':'#C9A84C'; x.beginPath(); x.arc(px,py,n.s*(.6+d*.7),0,7); x.fill(); }
      x.globalAlpha=1;
      // core glow + Omega
      var grd=x.createRadialGradient(cx,cy,2,cx,cy,60); grd.addColorStop(0,'rgba(226,200,109,.5)'); grd.addColorStop(1,'rgba(226,200,109,0)');
      x.fillStyle=grd; x.beginPath(); x.arc(cx,cy,60,0,7); x.fill();
      x.fillStyle='#E2C86D'; x.font='900 '+(40+Math.sin(t*2)*2)+'px "Cinzel Decorative", serif'; x.textAlign='center'; x.textBaseline='middle';
      x.shadowColor='rgba(201,168,76,.7)'; x.shadowBlur=24; x.fillText('\u03A9',cx,cy); x.shadowBlur=0;
      if(!reduce) requestAnimationFrame(frame); 
    }
    if(reduce){ frame(); } else frame();
  }

  async function boot(){
    var sess=(await supabase.auth.getSession()).data.session;
    if(!sess){ showGate('Command','Sign in to enter your command.'); return; }
    var pr=await supabase.from('profiles').select('display_name,sign,axis_a,axis_b,axis_c,is_owner').eq('id',sess.user.id).maybeSingle();

    var d=pr.data, sign=d.sign;
    var a=Number(d.axis_a||1), b=Number(d.axis_b||1), c=Number(d.axis_c||1);
    var auth=Math.sqrt(a*a+b*b+c*c), tier=Math.max(1,Math.min(9,Math.floor(Math.min(a,b,c)))), rank=RANKS[tier-1];
    var name=d.display_name || (sign+' Sovereign');

    document.getElementById('h-name').textContent=name;
    document.getElementById('h-sub').innerHTML=(GLY[sign]||'')+' <b>'+sign+'</b> \u00B7 RANK <b>'+rank+'</b> \u00B7 '+FACT[sign]+' \u00B7 AGENT <b>'+AGENT[sign]+'</b>';

    // gauge + bars
    drawGauge(auth/15.588457);
    document.getElementById('auth-v').textContent=auth.toFixed(2);
    document.getElementById('va').textContent=a.toFixed(2); document.getElementById('vb').textContent=b.toFixed(2); document.getElementById('vc').textContent=c.toFixed(2);
    setTimeout(function(){ document.getElementById('fa').style.width=(a/9*100)+'%'; document.getElementById('fb').style.width=(b/9*100)+'%'; document.getElementById('fc').style.width=(c/9*100)+'%'; },120);
    document.getElementById('standfoot').innerHTML='NODE <b>('+Math.round(a)+','+Math.round(b)+','+Math.round(c)+')</b> \u00B7 TIER <b>'+tier+'</b> / 9 \u00B7 MATERIAL <b>'+['Sand','Glass','Iron','Steel','Titanium','Carbon','Gold','Platinum','Omega Master'][tier-1]+'</b>';

    radar(a,b,c);

    // next gate
    var GEN=Math.sqrt(3),APEX=Math.sqrt(243); var ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
    var GN=['Sand','Glass','Iron','Steel','Titanium','Carbon','Gold','Platinum','Diamond','Adamant','Aether','Omega'];
    var open=0; for(var g=0;g<12;g++){ if(auth>=GEN+(g/11)*(APEX-GEN)) open++; }
    if(open>=12){ document.getElementById('ng-r').textContent='\u03A9'; document.getElementById('ng-n').textContent='The Omega Gate'; document.getElementById('ng-s').textContent='All twelve gates stand open.'; }
    else { var th=GEN+(open/11)*(APEX-GEN); document.getElementById('ng-r').textContent=ROMAN[open]; document.getElementById('ng-n').textContent='The Gate of '+GN[open]; document.getElementById('ng-s').textContent='Opens at authority '+th.toFixed(2)+' \u00B7 you are at '+auth.toFixed(2); }

    buildChambers(!!d.is_owner);
    orb();
  }
  document.getElementById('logout').addEventListener('click',async function(){ await supabase.auth.signOut(); window.location.href='/account.html'; });
  boot();
</script>
<script src="/nav.js"></script>
<script src="/bg.js"></script>
</body>
