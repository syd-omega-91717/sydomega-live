name: Supabase Full Migration Replay

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "hardening/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-full-replay-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Fresh database replay (all migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Test migration inventory gate
        run: python3 -m unittest scripts/tests/test_migration_replay_contract.py -v

      - name: Validate migration inventory
        run: python3 scripts/migration-replay-contract.py

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Replay every migration from zero
        run: supabase db reset

      - name: Re-run migration inventory after replay
        run: python3 scripts/migration-replay-contract.py

      - name: Run migration security audit
        run: python3 scripts/supabase-migration-security-audit.py

      - name: Run latest hardening contract
        run: python3 -m unittest scripts/tests/test_rls_rpc_performance_hardening.py

      - name: Run family-access authorization and privacy probes
        shell: bash
        run: |
          set -euo pipefail
          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$db_url"
          psql "$db_url" -v ON_ERROR_STOP=1 -f scripts/tests/family-access-migration-probe.sql

      - name: Run authenticated content pipeline end-to-end
        shell: bash
        run: python3 scripts/tests/test_content_pipeline_e2e.py

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
