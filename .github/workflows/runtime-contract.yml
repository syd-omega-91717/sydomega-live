name: Runtime Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime syntax and configuration contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify runtimes
        run: |
          python --version
          node --version
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -not -path './build/*' -print0)
          echo "Checked $count JavaScript files."
      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('config')
          files = list(root.rglob('*.json')) if root.exists() else []
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'Checked {len(files)} JSON configuration files.')
          PY
      - name: Workflow syntax contract
        run: python scripts/workflow-contract.py
