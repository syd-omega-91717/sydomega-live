name: Page Estate Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-estate-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Page estate quality
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit page estate
        shell: pwsh
        run: python scripts/page-estate-quality.py
