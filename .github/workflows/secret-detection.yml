name: Secret Detection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # gitleaks-action scans only the pushed commit range on push/pull_request
  # events; schedule and workflow_dispatch scan the whole history. Weekly keeps
  # the "full-history" name true (2026-10-04: 8,224 commits, 0 findings).
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
