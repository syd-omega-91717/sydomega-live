name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production HTTP surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys, urllib.request

          urls = [
              "https://sydomega.com/",
              "https://www.sydomega.com/",
              "https://sydomega.com/healthz.html",
              "https://www.sydomega.com/healthz.html",
          ]
          failures = []
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "SYD-OMEGA-Production-Smoke/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read(4096)
                      status = r.status
                      ctype = r.headers.get("content-type", "")
                  print(f"SMOKE url={url} status={status} content_type={ctype}")
                  if status < 200 or status >= 400:
                      failures.append(f"{url}: HTTP {status}")
                  if not body:
                      failures.append(f"{url}: empty response")
              except Exception as exc:
                  failures.append(f"{url}: {exc}")

          if failures:
              print("::error::Production smoke failed")
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print("PRODUCTION_SMOKE=PASS")
          PY

      - name: Verify production Supabase endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          url = "https://ydqhzvvoyufiiqvzcjns.supabase.co/rest/v1/"
          req = urllib.request.Request(url, headers={"User-Agent": "SYD-OMEGA-Production-Smoke/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(f"SUPABASE_HTTP status={r.status}")
                  if r.status >= 500:
                      raise SystemExit("Supabase returned server error")
          except urllib.error.HTTPError as e:
              # 401/403 is expected without a client key; 5xx is not.
              print(f"SUPABASE_HTTP status={e.code}")
              if e.code >= 500:
                  raise
          print("SUPABASE_ENDPOINT=REACHABLE")
          PY
