name: Enterprise CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:

    name: Enterprise Validation

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      NODE_ENV: test
      CI: true

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x

    defaults:
      run:
        shell: bash

    steps:

      #######################################################################
      # Checkout
      #######################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #######################################################################
      # Node
      #######################################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Environment Information
        run: |
          echo "Node Version"
          node -v
          echo "NPM Version"
          npm -v

      #######################################################################
      # Root
      #######################################################################

      - name: Detect Root Package
        id: root
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Root Dependencies
        if: steps.root.outputs.exists == 'true'
        run: npm install

      - name: Root Lint
        if: steps.root.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Root Typecheck
        if: steps.root.outputs.exists == 'true'
        run: npm run typecheck --if-present

      - name: Root Tests
        if: steps.root.outputs.exists == 'true'
        run: npm test --if-present

      - name: Root Build
        if: steps.root.outputs.exists == 'true'
        run: npm run build --if-present

      #######################################################################
      # Backend
      #######################################################################

      - name: Detect Backend
        id: backend
        run: |
          if [ -f backend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backend Install
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: npm install

      - name: Backend Lint
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present

      - name: Backend Typecheck
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: npm run typecheck --if-present

      - name: Backend Tests
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: npm test --if-present

      - name: Backend Build
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: npm run build --if-present

      #######################################################################
      # Frontend
      #######################################################################

      - name: Detect Frontend
        id: frontend
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Frontend Install
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm install

      - name: Frontend Lint
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Frontend Typecheck
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Frontend Tests
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Frontend Build
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build --if-present

      #######################################################################
      # Artifacts
      #######################################################################

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sydomega-build
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/dist/**
            frontend/dist/**
            dist/**
            build/**
            coverage/**
            reports/**
            logs/**
