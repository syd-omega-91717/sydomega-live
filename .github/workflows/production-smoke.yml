name: Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refuse manual production smoke from non-main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error title=Production smoke refused::Manual production smoke is allowed only from refs/heads/main."
          exit 1

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify non-conflict release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-contract-audit.py

      - name: Wait for exact Cloudflare Pages production release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          url = "https://sydomega.com/.well-known/omega-release.json"
          expected = os.environ["GITHUB_SHA"]
          deadline = time.time() + 600
          last = "not yet reachable"
          while time.time() < deadline:
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "SYD-OMEGA-Cloudflare-Release-Smoke/1.0"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      manifest = json.loads(response.read().decode("utf-8"))
                  served = str(manifest.get("commit_sha") or "")
                  print(f"RELEASE_MANIFEST served={served or 'missing'} expected={expected}")
                  if served == expected:
                      print(f"CLOUDFLARE_RELEASE=READY commit={served}")
                      sys.exit(0)
                  last = f"served {served or 'no commit_sha'}"
              except Exception as exc:
                  last = str(exc)
                  print(f"RELEASE_MANIFEST retry: {last}")
              time.sleep(10)
          print(f"::error::Cloudflare Pages did not publish exact main SHA {expected}: {last}")
          sys.exit(1)
          PY

      - name: Verify all registered production pages and same-origin assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-production-smoke.py --base-url https://sydomega.com --workers 12 --timeout 20

      - name: Build exact release artifact for page identity comparison
        env:
          OMEGA_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/vercel-build.sh

      - name: Verify production page identity against the exact release artifact
        env:
          OMEGA_PRODUCTION_BASE_URL: https://sydomega.com
          OMEGA_PUBLIC_DIR: public
          OMEGA_SMOKE_WORKERS: '12'
          OMEGA_SMOKE_RETRIES: '2'
        run: python3 scripts/vercel-production-surface-smoke.py

      - name: Verify canonical production entrypoints and security headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import urllib.request

          urls = [
              "https://sydomega.com/",
              "https://www.sydomega.com/",
              "https://sydomega.com/healthz.html",
              "https://www.sydomega.com/healthz.html",
          ]
          failures = []
          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "SYD-OMEGA-Cloudflare-Release-Smoke/1.0"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read(4096)
                      status = response.status
                      headers = response.headers
                  print(f"SMOKE url={url} status={status} content_type={headers.get('content-type','')} bytes={len(body)}")
                  if status != 200 or not body:
                      failures.append(f"{url}: final HTTP {status} or empty body")
                  if url.endswith("/") and "sydomega.com" in url:
                      if not headers.get("Content-Security-Policy"):
                          failures.append(f"{url}: CSP missing")
                      if not headers.get("Strict-Transport-Security"):
                          failures.append(f"{url}: HSTS missing")
              except Exception as exc:
                  failures.append(f"{url}: {exc}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print("CLOUDFLARE_PRODUCTION_SMOKE=PASS")
          PY

      - name: Verify canonical Supabase health
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.error
          import urllib.request

          base = "https://ydqhzvvoyufiiqvzcjns.supabase.co"
          checks = [f"{base}/auth/v1/health", f"{base}/rest/v1/"]
          for url in checks:
              request = urllib.request.Request(url, headers={"User-Agent": "SYD-OMEGA-Cloudflare-Release-Smoke/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
              print(f"SUPABASE_HTTP url={url} status={status}")
              if status >= 500:
                  raise SystemExit(f"Supabase returned server error: {status}")
          print("SUPABASE_ENDPOINT=REACHABLE")
          PY
