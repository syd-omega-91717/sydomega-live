name: Ω Spatial Realm Integration

on:
  push:
    branches:
      - fix/registry-regeneration-20260915
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-spatial-realm-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply idempotent integration
        run: node scripts/integrate-spatial-realms.js

      - name: Syntax check spatial runtime
        run: node --check omega-spatial-realms.js && node --check scripts/integrate-spatial-realms.js

      - name: Verify integration markers
        run: |
          grep -q 'omega-spatial-realms.js' bg.js
          grep -q 'data-omega-spatial-realm="gaming"' gaming.html
          grep -q 'data-omega-spatial-realm="cinema"' cinema.html
          grep -q '/characters.html' nav.js
          grep -q '/movies.html' nav.js

      - name: Commit materialized integration
        run: |
          if git diff --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bg.js gaming.html cinema.html nav.js
          git commit -m 'feat(spatial): materialize gaming, cinema, character and movie navigation'
          git push
