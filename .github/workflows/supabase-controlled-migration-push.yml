name: Supabase Controlled Migration Push

on:
  workflow_dispatch:
    inputs:
      migration_version:
        description: Exact version listed as pending in supabase/pending-migrations.json
        required: true
        type: string
      confirm_production_apply:
        description: Confirm applying exactly one migration to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Validate explicit confirmation, secrets, and single pending migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          CONFIRM_PRODUCTION_APPLY: ${{ inputs.confirm_production_apply }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRM_PRODUCTION_APPLY}" = "true" || { echo "::error::Explicit production confirmation is required."; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret."; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "::error::Missing SUPABASE_DB_PASSWORD secret."; exit 1; }
          python - <<'PY'
          import json, os, pathlib, re, sys
          version = os.environ["MIGRATION_VERSION"]
          if not re.fullmatch(r"\d{14}", version):
              sys.exit("Migration version must be exactly 14 digits.")
          manifest = json.loads(pathlib.Path("supabase/pending-migrations.json").read_text())
          pending = manifest.get("pending", [])
          selected = [m for m in pending if str(m.get("version")) == version]
          if len(pending) != 1 or len(selected) != 1:
              sys.exit("Fail closed: exactly one pending migration must exist, and it must match the requested version.")
          item = selected[0]
          if item.get("liveStatus") != "NOT_APPLIED" or item.get("blocksProduction") is not True:
              sys.exit("Requested migration is not in the expected pending production state.")
          file = pathlib.Path("supabase/migrations") / item["file"]
          if not file.is_file() or not file.name.startswith(version + "_"):
              sys.exit("The pending manifest does not point to the expected local migration file.")
          print(f"Validated one pending migration: {file.name}")
          PY

      - name: Link the authorized production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref ydqhzvvoyufiiqvzcjns --password "${SUPABASE_DB_PASSWORD}"

      - name: Verify remote history and dry-run contains exactly the selected migration
        env:
          MIGRATION_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "${RUNNER_TEMP}/migrations-before.txt"
          supabase db push --dry-run --linked 2>&1 | tee "${RUNNER_TEMP}/migration-dry-run.txt"
          python - <<'PY'
          import os, pathlib, re, sys
          version = os.environ["MIGRATION_VERSION"]
          before = pathlib.Path(os.environ["RUNNER_TEMP"], "migrations-before.txt").read_text()
          dry = pathlib.Path(os.environ["RUNNER_TEMP"], "migration-dry-run.txt").read_text()
          rows = []
          for line in before.splitlines():
              match = re.match(r"^\s*(\d{14})?\s*[│|]\s*(\d{14})?\s*[│|]", line)
              if match and (match.group(1) or match.group(2)):
                  rows.append((match.group(1) or None, match.group(2) or None))
          if not rows:
              sys.exit("Could not parse linked migration history; refusing production push.")
          mismatches = [(local, remote) for local, remote in rows if local != remote]
          if mismatches != [(version, None)]:
              sys.exit(f"Remote history drift or unexpected pending versions: {mismatches!r}")
          versions = set(re.findall(r"\b(\d{14})(?:_[A-Za-z0-9_-]+\.sql)?\b", dry))
          if versions != {version}:
              sys.exit(f"Dry-run did not contain exactly the selected migration: {sorted(versions)!r}")
          print(f"Preflight passed: dry-run would apply only {version}.")
          PY

      - name: Apply the one reviewed migration
        env:
          MIGRATION_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          supabase db push --linked --yes

      - name: Verify remote migration history after push
        env:
          MIGRATION_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "${RUNNER_TEMP}/migrations-after.txt"
          python - <<'PY'
          import os, pathlib, re, sys
          version = os.environ["MIGRATION_VERSION"]
          text = pathlib.Path(os.environ["RUNNER_TEMP"], "migrations-after.txt").read_text()
          rows = []
          for line in text.splitlines():
              match = re.match(r"^\s*(\d{14})?\s*[│|]\s*(\d{14})?\s*[│|]", line)
              if match and (match.group(1) or match.group(2)):
                  rows.append((match.group(1) or None, match.group(2) or None))
          if not rows or any(local != remote for local, remote in rows):
              sys.exit("Post-push migration history is not fully reconciled.")
          if (version, version) not in rows:
              sys.exit("Selected migration is not recorded as applied on the remote database.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Supabase migration applied\n\nVerified local/remote history match for `{version}`.\n")
          print(f"Verified {version} is recorded as applied.")
          PY
