<style>
:root{--void:#0A0A0F;--panel:#0d0d15;--gold:#C9A84C;--solar:#E2C86D;--cyan:#00E5FF;--crim:#8B0000;--green:#3fb27f;--ink:#e9e6dc;--muted:#85837b;--line:rgba(201,168,76,0.16);--D:'Cinzel Decorative',serif;--B:'Rajdhani',sans-serif;--M:'Courier Prime',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--B);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(0,229,255,.04),transparent 60%)}
a{color:inherit;text-decoration:none}
.shell{position:relative;z-index:1;display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,rgba(13,13,21,.6),transparent)}
.main{flex:1;min-width:0;padding:24px clamp(16px,3vw,40px) 80px}
.topbar{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px}
.topbar .t{font-family:var(--D);font-weight:700;color:var(--gold);font-size:clamp(18px,3vw,26px);letter-spacing:2px}
.topbar .t small{display:block;font-family:var(--M);font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:4px}
.sechead{font-family:var(--M);font-size:10px;letter-spacing:4px;color:var(--cyan);margin:30px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}

.status-banner{display:flex;align-items:center;gap:12px;font-family:var(--M);font-size:10px;letter-spacing:3px;padding:10px 16px;border:1px solid rgba(63,178,127,.4);background:rgba(63,178,127,.04);margin-bottom:24px}
.status-banner .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-banner .txt{color:var(--green)}

.service-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--line)}
.svc-card{background:var(--void);padding:16px;position:relative}
.svc-card .s-name{font-family:var(--M);font-size:10px;letter-spacing:2px;color:var(--solar);margin-bottom:4px}
.svc-card .s-type{font-family:var(--M);font-size:8px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.svc-card .s-status{display:flex;align-items:center;gap:6px;font-family:var(--M);font-size:9px}
.svc-card .s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.svc-card .s-bar{height:2px;background:rgba(201,168,76,.1);margin-top:10px;border-radius:1px;overflow:hidden}
.svc-card .s-fill{height:100%;border-radius:1px;transition:width 1s ease}

.layer-cards{display:flex;flex-direction:column;gap:10px}
.layer-card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);padding:16px 20px;display:flex;align-items:flex-start;gap:16px}
.layer-card .l-num{font-family:var(--D);font-size:22px;color:var(--gold);font-weight:700;min-width:36px}
.layer-card .l-body .l-title{font-family:var(--D);font-size:14px;color:var(--solar);font-weight:700;margin-bottom:4px}
.layer-card .l-body .l-desc{font-size:12px;font-weight:300;color:var(--muted);line-height:1.6}
.layer-card .l-body .l-tech{font-family:var(--M);font-size:9px;color:var(--cyan);margin-top:6px}

.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.region-card{border:1px solid var(--line);background:var(--panel);padding:14px;text-align:center}
.region-card .r-name{font-family:var(--M);font-size:10px;letter-spacing:2px;color:var(--solar);margin-bottom:5px}
.region-card .r-status{font-family:var(--M);font-size:8px;letter-spacing:2px;padding:2px 6px;border:1px solid;display:inline-block;margin-bottom:8px}
.region-card .r-latency{font-family:var(--D);font-size:18px;color:var(--gold)}
.region-card .r-label{font-family:var(--M);font-size:8px;color:var(--muted);margin-top:3px}

.canvas-grid{border:1px solid var(--line);background:var(--panel);height:220px;position:relative;overflow:hidden}
#grid-canvas{width:100%;height:100%;display:block}

@media(max-width:760px){.shell{flex-direction:column}.side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line)}}

<script type="module">

const sb=createClient("https://ydqhzvvoyufiiqvzcjns.supabase.co","sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q");

const SERVICES=[
  {name:'GATEWAY',type:'API Gateway',uptime:99.99,col:'#C9A84C'},
  {name:'AUTH',type:'Identity & Security',uptime:100,col:'#3fb27f'},
  {name:'USER',type:'Profile & Session',uptime:99.97,col:'#00E5FF'},
  {name:'AI ORCHESTRATOR',type:'Agent Mesh Runtime',uptime:99.91,col:'#9B6BF0'},
  {name:'GAMING',type:'Mastery Engine',uptime:99.88,col:'#E86A3A'},
  {name:'MEDIA',type:'Streaming Layer',uptime:99.94,col:'#8B0000'},
  {name:'HERITAGE',type:'Lineage & Archive',uptime:99.99,col:'#E2C86D'},
  {name:'PAYMENT',type:'Economy & Treasury',uptime:100,col:'#C9A84C'},
  {name:'NFT',type:'Blockchain Bridge',uptime:99.82,col:'#9B6BF0'},
  {name:'SEARCH',type:'Intelligence Retrieval',uptime:99.96,col:'#00E5FF'},
  {name:'NOTIFICATION',type:'Dispatch Engine',uptime:99.93,col:'#3fb27f'},
  {name:'COMMUNICATION',type:'Social & Messaging',uptime:99.88,col:'#00E5FF'},
  {name:'COMMUNITY',type:'Faction & Feed',uptime:99.85,col:'#E2C86D'},
  {name:'HOROSCOPE',type:'Celestial Engine',uptime:100,col:'#C9A84C'},
  {name:'ACADEMY',type:'Knowledge Axis A',uptime:99.97,col:'#34C6E6'},
  {name:'CONSULTANCY',type:'Expert Booking',uptime:99.89,col:'#C9A84C'},
  {name:'TREASURY',type:'Vault & Allocation',uptime:100,col:'#C9A84C'},
  {name:'RESEARCH',type:'Discovery Engine',uptime:99.74,col:'#9B6BF0'},
  {name:'COMPLIANCE',type:'Legal Shield',uptime:99.99,col:'#E2C86D'},
  {name:'INFRASTRUCTURE',type:'Grid Orchestration',uptime:100,col:'#00E5FF'},

const LAYERS=[
  {n:'5',title:'FRONTEND LAYER',desc:'React + Next.js, Tailwind CSS, Framer Motion. Web + Mobile (React Native / Expo). Single design system feeding all surfaces.',tech:'React / Next.js &middot; Tailwind &middot; Three.js &middot; Framer Motion'},
  {n:'4',title:'GATEWAY & API FABRIC',desc:'GraphQL + REST + WebSocket + gRPC. API Gateway with rate limiting, load balancing, and JWT validation at the edge.',tech:'GraphQL &middot; REST &middot; WebSocket &middot; gRPC &middot; Kong / Nginx'},
  {n:'3',title:'MICROSERVICES LAYER',desc:'21 domain-isolated services. Each owns its data, exposes contracts, and emits events to the sovereign event bus. Zero shared databases.',tech:'Node.js &middot; Express &middot; Docker &middot; Kubernetes &middot; RabbitMQ'},
  {n:'2',title:'DATA & MEMORY LAYER',desc:'PostgreSQL (relational) + Redis (session cache) + pgvector (semantic AI memory) + Neo4j (knowledge graph) + S3 (immutable archive).',tech:'PostgreSQL &middot; Redis &middot; pgvector &middot; Neo4j &middot; ClickHouse'},
  {n:'1',title:'INFRASTRUCTURE LAYER',desc:'Kubernetes mesh across 9 global regions. Terraform-provisioned. Cloudflare edge. Render (compute) + Vercel (frontend). Geo-redundant daily snapshots.',tech:'K8s &middot; Terraform &middot; AWS / GCP &middot; Cloudflare &middot; Render &middot; Vercel'},
];

const REGIONS=[
  {name:'MIDDLE EAST',status:'PRIMARY',lat:'2ms'},
  {name:'EUROPE WEST',status:'ACTIVE',lat:'18ms'},
  {name:'AMERICAS EAST',status:'ACTIVE',lat:'89ms'},
  {name:'ASIA PACIFIC',status:'ACTIVE',lat:'112ms'},

  {name:'AMERICAS WEST',status:'ACTIVE',lat:'104ms'},

const MEMORY_LAYERS=[
  {name:'SESSION MEMORY',tech:'Redis',desc:'Live conversation state, sub-ms recall, 24-hour TTL',col:'#00E5FF'},
  {name:'CONVERSATION',tech:'PostgreSQL',desc:'Full dialogue history, structured retrieval, permanent',col:'#C9A84C'},
  {name:'SEMANTIC LAYER',tech:'pgvector',desc:'Vector embeddings, meaning-based recall, 768-dim',col:'#9B6BF0'},
  {name:'KNOWLEDGE GRAPH',tech:'Neo4j',desc:'Entity relationships, causal chains, civilizational links',col:'#E2C86D'},
  {name:'IMMUTABLE ARCHIVE',tech:'S3 + Hash-Chain',desc:'Permanent tamper-proof record, hash-verified, eternal',col:'#E86A3A'},
];

function renderServices(){
  const g=document.getElementById('service-grid'); g.innerHTML='';
  SERVICES.forEach(s=>{
    const c=document.createElement('div'); c.className='svc-card';
    c.innerHTML=`<div class="s-name">${s.name}</div><div class="s-type">${s.type}</div><div class="s-status"><div class="s-dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></div><span style="color:var(--green)">${s.uptime}% UPTIME</span></div><div class="s-bar"><div class="s-fill" style="width:0%;background:linear-gradient(90deg,${s.col},transparent)"></div></div>`;
    g.appendChild(c);
    setTimeout(()=>c.querySelector('.s-fill').style.width=s.uptime+'%',300);
  });
}

function renderLayers(){
  const c=document.getElementById('layer-cards'); c.innerHTML='';
  LAYERS.forEach(l=>{
    const d=document.createElement('div'); d.className='layer-card';
    d.innerHTML=`<div class="l-num">${l.n}</div><div class="l-body"><div class="l-title">${l.title}</div><div class="l-desc">${l.desc}</div><div class="l-tech">TECH: ${l.tech}</div></div>`;
    c.appendChild(d);
  });
}

function renderRegions(){
  const g=document.getElementById('region-grid'); g.innerHTML='';
  REGIONS.forEach(r=>{
    const c=document.createElement('div'); c.className='region-card';
    const sc=r.status==='PRIMARY'?'color:var(--gold);border-color:rgba(201,168,76,.5)':r.status==='ACTIVE'?'color:var(--green);border-color:rgba(63,178,127,.4)':'color:var(--muted);border-color:rgba(133,131,123,.3)';
    c.innerHTML=`<div class="r-name">${r.name}</div><div class="r-status" style="${sc}">${r.status}</div><div class="r-latency">${r.lat}</div><div class="r-label">LATENCY</div>`;
    g.appendChild(c);
  });
}

function renderMemory(){
  const g=document.getElementById('memory-grid'); g.innerHTML='';
  MEMORY_LAYERS.forEach((m,i)=>{
    const c=document.createElement('div');
    c.style.cssText=`border:1px solid ${m.col}33;background:var(--panel);padding:16px;border-top:2px solid ${m.col}`;
    c.innerHTML=`<div style="font-family:var(--M);font-size:8px;letter-spacing:3px;color:var(--muted);margin-bottom:4px">LAYER ${i+1}</div><div style="font-family:var(--D);font-size:13px;color:${m.col};font-weight:700;margin-bottom:3px">${m.name}</div><div style="font-family:var(--M);font-size:9px;color:var(--cyan);margin-bottom:8px">${m.tech}</div><div style="font-size:11px;font-weight:300;color:var(--muted);line-height:1.5">${m.desc}</div>`;
    g.appendChild(c);
  });
}

/* Animated grid canvas */
function drawGrid(){
  const cv=document.getElementById('grid-canvas');
  const W=cv.offsetWidth||800, H=cv.offsetHeight||220;
  cv.width=W*2; cv.height=H*2;
  const ctx=cv.getContext('2d'); ctx.scale(2,2);
  let t=0;
  const nodes=[];
  for(let i=0;i<30;i++) nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*0.4,vy:(Math.random()-.5)*0.4,r:2+Math.random()*3});
  function frame(){
    t+=0.008; ctx.clearRect(0,0,W,H);
    /* Grid lines */
    ctx.strokeStyle='rgba(0,229,255,0.04)'; ctx.lineWidth=.5;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    /* Move nodes */
    nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;});
    /* Connections */
    nodes.forEach((a,i)=>{nodes.forEach((b,j)=>{if(j<=i)return;const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d<140){const al=(1-d/140)*0.3;ctx.strokeStyle=`rgba(0,229,255,${al})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}});});
    /* Nodes */
    nodes.forEach(n=>{ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle='rgba(0,229,255,0.7)';ctx.shadowColor='rgba(0,229,255,.5)';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;});
    /* Frequency ring */
    ctx.save(); ctx.translate(W/2,H/2);
    for(let r=0;r<3;r++){ctx.save();ctx.rotate(t*(r%2?-1:1)*.4);ctx.beginPath();ctx.ellipse(0,0,80+r*20,30+r*8,0,0,Math.PI*2);ctx.strokeStyle=`rgba(201,168,76,${0.1-r*0.03})`;ctx.stroke();ctx.restore();}
    ctx.fillStyle='rgba(201,168,76,0.8)';ctx.font='700 14px "Cinzel Decorative",serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(201,168,76,.6)';ctx.shadowBlur=12;ctx.fillText('\u03A9',0,0);ctx.shadowBlur=0;ctx.restore();
    requestAnimationFrame(frame);
  }
  frame();
}

async function boot(){
  const sess=(await sb.auth.getSession()).data.session;
  if(!sess){window.location.href='/account.html';return;}
  renderServices(); renderLayers(); renderRegions(); renderMemory(); drawGrid();
}
boot();
</script>
