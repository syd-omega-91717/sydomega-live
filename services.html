<style>

.side{width:80px;flex-shrink:0}
.main{flex:1;min-width:0;padding-bottom:80px}
.topbar{border-bottom:1px solid var(--line);padding:20px clamp(14px,3vw,36px);background:rgba(8,8,15,.9)}
.topbar .t{font-family:var(--D);font-weight:700;color:var(--gold);font-size:clamp(16px,2.5vw,24px);letter-spacing:2px}
.topbar .t small{display:block;font-family:var(--M);font-size:9px;color:var(--muted);letter-spacing:3px;margin-top:3px}
.pad{padding:0 clamp(14px,3vw,36px)}
.sechead{font-family:var(--M);font-size:10px;letter-spacing:4px;color:var(--cyan);margin:28px clamp(14px,3vw,36px) 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}

/* SERVICES GRID */
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.svc-card{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),rgba(7,7,11,.7));padding:22px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden;text-decoration:none;display:block}
.svc-card:hover{border-color:rgba(201,168,76,.35);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.svc-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.svc-canvas{display:block;margin:0 auto 14px}
.svc-category{font-family:var(--M);font-size:8px;letter-spacing:3px;color:var(--muted);margin-bottom:4px}
.svc-name{font-family:var(--D);font-size:16px;font-weight:700;margin-bottom:6px}
.svc-desc{font-size:12px;font-weight:300;color:var(--muted);line-height:1.7;margin-bottom:12px}
.svc-link{font-family:var(--M);font-size:9px;letter-spacing:2px;padding:7px 14px;border:1px solid;display:inline-block;transition:all .15s}
.svc-link:hover{background:rgba(201,168,76,.08)}
@media(max-width:760px){.shell{flex-direction:column}.side{width:100%;height:auto}}

function drawSvcIcon(cv, sym, col){
  cv.width=100;cv.height=80;cv.style.width='50px';cv.style.height='40px';
  const ctx=cv.getContext('2d');let t=0;
  function f(){
    t+=.025;ctx.clearRect(0,0,100,80);
    const g=ctx.createRadialGradient(50,40,0,50,40,44);g.addColorStop(0,col+'33');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(50,40,44,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(50,40);ctx.rotate(t*.4);
    ctx.beginPath();ctx.arc(0,0,38,0,Math.PI*2);ctx.strokeStyle=col+'33';ctx.lineWidth=.8;ctx.stroke();
    ctx.restore();
    const tmp=document.createElement('div');tmp.innerHTML=sym;
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10+3*Math.sin(t*1.5);
    ctx.font='700 22px "Courier Prime",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(tmp.textContent||sym,50,41);ctx.shadowBlur=0;
    requestAnimationFrame(f);
  }
  f();
}

async function boot(){
  const sess=(await sb.auth.getSession()).data.session;
  if(!sess){window.location.href='/account.html';return;}
  const g=document.getElementById('services-grid');g.innerHTML='';
  SVCS.forEach(s=>{
    const a=document.createElement('a');a.className='svc-card';a.href=s.href;
    a.style.borderTopColor=s.col+'55';
    const cv=document.createElement('canvas');cv.className='svc-canvas';
    a.innerHTML=`<div class="svc-category" style="color:${s.col}aa">${s.cat}</div><div class="svc-name" style="color:${s.col}">${s.name}</div><div class="svc-desc">${s.desc}</div><span class="svc-link" style="color:${s.col};border-color:${s.col}44">ENTER SERVICE --></span>`;
    a.insertBefore(cv,a.firstChild);
    g.appendChild(a);
    requestAnimationFrame(()=>drawSvcIcon(cv,s.sym,s.col));
  });
}
boot();
