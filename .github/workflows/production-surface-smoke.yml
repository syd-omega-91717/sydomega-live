name: Production Surface Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Live production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public site
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 --retry 3 --retry-delay 2 \
            --output /tmp/sydomega.html --write-out '%{http_code}' https://www.sydomega.com/ | tee /tmp/http_code
          test "$(cat /tmp/http_code)" -ge 200
          test "$(cat /tmp/http_code)" -lt 400
          test -s /tmp/sydomega.html
          grep -qi '<html' /tmp/sydomega.html
          echo "Production site smoke test passed."

      - name: Verify public Supabase Auth health
        run: |
          set -euo pipefail
          code=$(curl --fail --silent --show-error --location --max-time 30 --retry 3 --retry-delay 2 \
            --output /tmp/supabase-health.json --write-out '%{http_code}' \
            https://ydqhzvvoyufiiqvzcjns.supabase.co/auth/v1/health)
          test "$code" -ge 200
          test "$code" -lt 400
          test -s /tmp/supabase-health.json
          echo "Supabase Auth health HTTP $code"

      - name: Verify security headers
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 -D /tmp/sydomega.headers -o /dev/null https://www.sydomega.com/
          grep -qi '^x-content-type-options: nosniff' /tmp/sydomega.headers
          grep -qi '^x-frame-options: DENY' /tmp/sydomega.headers
          grep -qi '^referrer-policy:' /tmp/sydomega.headers
          echo "Required security headers present."
