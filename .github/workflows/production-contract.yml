name: Production Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}" && test -n "${RUNNER_OS:-}" && test -n "${RUNNER_ARCH:-}"
          echo "runner=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "run=$GITHUB_RUN_ID"
          echo "attempt=$GITHUB_RUN_ATTEMPT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production contract
        run: python scripts/production-contract.py
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Execution marker
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          echo "PRODUCTION_CONTRACT_EXECUTED=true"
          echo "PRODUCTION_CONTRACT_RUN_ID=$GITHUB_RUN_ID"
          echo "PRODUCTION_CONTRACT_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
