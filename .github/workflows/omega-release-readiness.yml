name: Omega Release Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Release readiness
        run: python scripts/omega_release_readiness.py

      - name: Python syntax
        run: python -m compileall -q scripts core tests

      - name: Artifact build
        run: bash scripts/vercel-build.sh

      # Assert only what the build actually guarantees. omega-visual-engine.js
      # was asserted here from this gate's first commit (b2196692) and has never
      # existed in this repository -- `git log --all --diff-filter=A --
      # '*omega-visual-engine.js'` returns nothing on any branch -- so the step
      # failed on every run it ever had, main included. scripts/vercel-build-
      # enhance.mjs:63 treats that engine as OPTIONAL (`if (engine && ...)`),
      # reports `engine=not-found`, and still exits VERCEL_ARTIFACT_ENHANCE=PASS:
      # this gate asserted as mandatory what the build itself treats as optional.
      # If a visual engine is ever added, add the assertion back alongside it --
      # do not re-add it before the module exists.
      - name: Artifact invariants
        run: |
          test -s public/index.html
          test -s public/vendor/supabase-js.js
          test -s public/assets/js/omega-runtime-observability.js
          test -d public/i18n
          test -d public/vendor
