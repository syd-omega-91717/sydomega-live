name: Omega Update
on:
  workflow_dispatch:
    inputs:
      file_name:
        description: 'File to update'
        required: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: |
          # You would paste my code here, or use a script
          echo "Update applied"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: omega update"
