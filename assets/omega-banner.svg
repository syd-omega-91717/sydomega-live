      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="textGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1000" height="200" fill="url(#voidGrad)"/>
  <rect width="1000" height="200" fill="url(#grid)"/>
  <rect width="1000" height="200" fill="url(#bannerGlow)"/>

  <g stroke="#C9A84C" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M16 38 V16 H38"/>
    <path d="M962 16 H984 V38"/>
    <path d="M984 162 V184 H962"/>
    <path d="M38 184 H16 V162"/>
