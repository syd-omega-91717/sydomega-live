<style>
  :root{ --void:#0A0A0F; --panel:#0d0d15; --panel-2:#11111c; --gold:#C9A84C; --solar:#E2C86D; --cyan:#00E5FF; --crimson:#8B0000; --green:#3fb27f; --ink:#e9e6dc; --muted:#85837b; --line:rgba(201,168,76,0.16); --display:'Cinzel Decorative',serif; --body:'Rajdhani',sans-serif; --mono:'Courier Prime',monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% -5%,rgba(0,229,255,.07),transparent 50%),radial-gradient(circle at 50% 100%,rgba(201,168,76,.06),transparent 50%)}
  a{color:inherit;text-decoration:none}
  .shell{position:relative;z-index:1;display:flex;min-height:100vh}
  .side{width:248px;flex-shrink:0;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,rgba(13,13,21,.6),transparent)}
  .brand{font-family:var(--display);font-weight:900;color:var(--gold);font-size:22px;letter-spacing:1px;text-align:center}
  .brand small{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:4px;margin-top:6px}
  .nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
  .nav a,.nav .lk{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--ink);padding:11px 12px;border-left:2px solid transparent;cursor:pointer}
  .nav a:hover{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.04)}
  .nav a.on{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.06)}
  .nav .sec{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin:18px 0 6px 12px}
  .nav .lk{color:var(--muted);cursor:default}
  .side .out{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--cyan);padding:11px 12px;cursor:pointer;border-top:1px solid var(--line)}

  .main{flex:1;min-width:0;padding:24px clamp(16px,3vw,40px) 60px;max-width:1000px}
  .hello{border-bottom:1px solid var(--line);padding-bottom:20px}
  .hello .eye{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--cyan)}
  .hello .h{font-family:var(--display);font-weight:900;color:var(--gold);font-size:clamp(24px,4vw,38px);margin-top:8px;line-height:1.1}
  .hello .s{font-weight:300;color:var(--muted);font-size:15px;margin-top:10px;max-width:64ch;line-height:1.6}
  .hello .s b{color:var(--gold);font-weight:400}

  .prog{display:flex;align-items:center;gap:18px;margin:22px 0;border:1px solid rgba(0,229,255,.25);background:rgba(0,229,255,.04);padding:16px 18px}
  .ring{position:relative;width:72px;height:72px;flex-shrink:0}
  .ring canvas{width:72px;height:72px}
  .ring .rc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--cyan);font-size:18px}
  .prog .pt{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);line-height:1.6}
  .prog .pt b{color:var(--solar)}

  .sechead{font-family:var(--mono);font-size:11px;letter-spacing:4px;color:var(--gold);margin:24px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .steps{display:flex;flex-direction:column;gap:10px}
  .step{display:flex;align-items:center;gap:15px;border:1px solid var(--line);background:linear-gradient(90deg,var(--panel),transparent);padding:15px 17px;transition:transform .12s,border-color .12s}
  .step:hover{transform:translateX(3px);border-color:var(--gold)}
  .step .mk{width:30px;height:30px;flex-shrink:0;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .step.done .mk{border-color:var(--green);color:var(--green);background:rgba(63,178,127,.08)}
  .step .tx{flex:1;min-width:0}
  .step .tx .t1{font-family:var(--display);font-weight:700;color:var(--gold);font-size:15px}
  .step .tx .t2{font-weight:300;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
  .step .go{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--cyan);border:1px solid var(--line);padding:8px 12px;flex-shrink:0}
  .step:hover .go{border-color:var(--cyan)}
  .step.done .go{color:var(--green);border-color:rgba(63,178,127,.4)}

  .map{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:6px}
  .mc{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);padding:16px;border-top:2px solid var(--ec)}
  .mc .mh{font-family:var(--display);font-weight:700;color:var(--gold);font-size:15px}
  .mc .ml{font-weight:300;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
  .mc .mlinks{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .mc .mlinks a{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--cyan);border:1px solid var(--line);padding:5px 8px}
  .mc .mlinks a:hover{border-color:var(--cyan)}

  .gate-card{max-width:440px;margin:14vh auto 0;border:1px solid var(--line);background:var(--panel);padding:40px 30px;text-align:center}
  .gate-card .g{font-family:var(--display);font-size:56px;color:var(--gold)}
  .gate-card h2{font-family:var(--display);color:var(--gold);font-weight:700;margin:10px 0}
  .gate-card p{font-weight:300;color:var(--muted);margin-bottom:22px}
  .gate-card a{display:inline-block;font-family:var(--mono);letter-spacing:2px;font-size:12px;color:var(--void);background:var(--gold);padding:14px 26px}
  #app{display:none}
  @media(max-width:760px){ .shell{flex-direction:column} .side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line)} .nav{flex-direction:row;flex-wrap:wrap} .nav .sec,.nav .lk{display:none} }
</style>
</head>
<body>
<div id="gate" class="gate-card" style="display:none">
  <div class="g">&#937;</div>
  <h2 id="gate-h">The Beacon</h2>
  <p id="gate-p">Sign in and the Beacon will guide you.</p>
  <a href="/account.html">GO TO MEMBER ACCESS &rarr;</a>
</div>

<div class="shell" id="app" style="display:none">
  <aside class="side" id="omega-side" data-page="beacon"></aside>
  <main class="main">
    <div class="hello">
      <div class="eye">THE BEACON  .  YOUR GUIDE INTO THE ORDER</div>
      <div class="h" id="h-hello">Welcome.</div>
      <div class="s" id="h-sub"> -- </div>
    </div>

    <div class="prog">
      <div class="ring"><canvas id="ring" width="144" height="144"></canvas><div class="rc" id="ring-t">0/6</div></div>
      <div class="pt" id="prog-text"> -- </div>
    </div>

    <div class="sechead">YOUR FIRST STEPS</div>
    <div class="steps" id="steps"></div>

    <div class="sechead">HOW THE ORDER IS ORGANISED</div>
    <div class="map" id="map"></div>
  </main>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  var sb=window.__omegaSb||(window.__omegaSb=createClient('https://ydqhzvvoyufiiqvzcjns.supabase.co','sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q'));var supabase=sb;
  const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  const GLY={Aries:'\u2648',Taurus:'\u2649',Gemini:'\u264A',Cancer:'\u264B',Leo:'\u264C',Virgo:'\u264D',Libra:'\u264E',Scorpio:'\u264F',Sagittarius:'\u2650',Capricorn:'\u2651',Aquarius:'\u2652',Pisces:'\u2653'};
  function showGate(h,p){ document.getElementById('gate-h').textContent=h; document.getElementById('gate-p').textContent=p; document.getElementById('gate').style.display='block'; document.getElementById('app').style.display='none'; }

  function drawRing(pct){
    var cv=document.getElementById('ring'); var x=cv.getContext('2d'); var w=144,cx=72,cy=72,r=58;
    var target=pct,cur=0;
    function step(){ cur+=(target-cur)*0.08; if(Math.abs(target-cur)<0.003)cur=target;
      x.clearRect(0,0,w,w); x.lineWidth=10; x.lineCap='round';
      x.beginPath(); x.arc(cx,cy,r,-Math.PI/2,1.5*Math.PI); x.strokeStyle='#15151f'; x.stroke();
      x.beginPath(); x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+cur*2*Math.PI); x.strokeStyle='#00E5FF'; x.shadowColor='rgba(0,229,255,.5)'; x.shadowBlur=12; x.stroke(); x.shadowBlur=0;
      if(cur!==target && !reduce) requestAnimationFrame(step);
    } step();
  }

  const MAP=[
    ['Ascend','#00E5FF','Rise through the 729 on three axes.',[['Dashboard','/dashboard.html'],['Triads','/triads.html'],['Gates','/gates.html'],['Ascension','/ascension.html']]],
    ['Learn & Prove','#C9A84C','Raise your three axes.',[['Academy','/academy.html'],['Games','/gaming.html'],['Contributions','/contributions.html']]],
    ['Your Cosmos','#E2C86D','Who you are in the Order.',[['Horoscope','/horoscope.html'],['Pantheons','/pantheons.html'],['Factions','/factions.html'],['Kings','/kings.html']]],
    ['Create & Trade','#A9C2D8','Works, counsel, economy.',[['Publishing','/publishing.html'],['Consultancy','/consultancy.html'],['Wallet','/wallet.html'],['Marketplace','/marketplace.html']]],
    ['The Order','#34C6E6','Community and standing.',[['Hall of Sovereigns','/sovereigns.html'],['Social','/social.html'],['Family','/family.html'],['Charter','/charter.html']]],
    ['You','#D9B86A','Your identity and controls.',[['Passport','/passport.html'],['Profile','/profile.html'],['Membership','/subscriptions.html'],['Settings','/settings.html']]]
  ];

  async function boot(){
    var sess=(await supabase.auth.getSession()).data.session;
    if(!sess){ showGate('The Beacon','Sign in and the Beacon will guide you.'); return; }
    var uid=sess.user.id;
    var pr=await supabase.from('profiles').select('display_name,sign,element,kyc_status,avatar_url').eq('id',uid).maybeSingle();
    if(!pr.data || !pr.data.sign){ showGate('Set Your Cosmology','Set your cosmology first, then return to the Beacon.'); return; }
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='flex';

    var d=pr.data, sign=d.sign, name=d.display_name||'Sovereign';
    document.getElementById('h-hello').innerHTML='Welcome, '+name+'.';
    document.getElementById('h-sub').innerHTML='You are '+(GLY[sign]||'')+' <b>'+sign+'</b>, of the <b>'+(d.element||'')+'</b> element. The Order is large, but the path is simple: <b>raise three axes</b>  --  Knowledge, Mastery, Contribution  --  and the gates, ranks, and honours open as you climb. Here is where to begin.';

    // real progress
    var kinds={academy:false,gaming:false,contribution:false};
    try{ var tc=await supabase.from('task_completions').select('kind').eq('user_id',uid); (tc.data||[]).forEach(function(r){ if(r.kind in kinds) kinds[r.kind]=true; }); }catch(e){}
    var hasPassport=!!(d.kyc_status && d.kyc_status!=='none');

    var steps=[
      ['Stand at your Command','See your living dashboard  --  your triad, authority, and next gate.','/dashboard.html',true],
      ['Clear your first Academy lesson','Answer the matrix and raise your Knowledge (axis A).','/academy.html',kinds.academy],
      ['Win your first Game node','Master a challenge and raise your Mastery (axis B).','/gaming.html',kinds.gaming],
      ['Log your first Contribution','Record an act of service and raise your Contribution (axis C).','/contributions.html',kinds.contribution],
      ['Claim your Sovereign Passport','Receive your identity card; submit verification when ready.','/passport.html',hasPassport],
      ['Find your place in the cosmos','Meet your Faction, your Pantheon name, and the Twelve Triads.','/pantheons.html',false]
    ];
    var doneCount=steps.filter(function(s){return s[3];}).length;
    var box=document.getElementById('steps'); box.innerHTML='';
    steps.forEach(function(s){
      var el=document.createElement('a'); el.className='step'+(s[3]?' done':''); el.href=s[2];
      el.innerHTML='<div class="mk">'+(s[3]?'\u2713':'\u25CB')+'</div><div class="tx"><div class="t1">'+s[0]+'</div><div class="t2">'+s[1]+'</div></div><div class="go">'+(s[3]?'DONE':'GO \u2192')+'</div>';
      box.appendChild(el);
    });
    document.getElementById('ring-t').textContent=doneCount+'/6';
    document.getElementById('prog-text').innerHTML='You have begun <b>'+doneCount+'</b> of <b>6</b> first steps. Each one moves a real axis in your 729 \u2014 there is no rush, only the climb.';
    drawRing(doneCount/6);

    var map=document.getElementById('map'); map.innerHTML='';
    MAP.forEach(function(m){
      var el=document.createElement('div'); el.className='mc'; el.style.setProperty('--ec',m[1]);
      el.innerHTML='<div class="mh">'+m[0]+'</div><div class="ml">'+m[2]+'</div><div class="mlinks">'+m[3].map(function(l){return '<a href="'+l[1]+'">'+l[0]+'</a>';}).join('')+'</div>';
      map.appendChild(el);
    });
  }
  document.getElementById('logout')?.addEventListener('click',async function(){ await supabase.auth.signOut(); window.location.href='/account.html'; });
  boot();
</script>
<script src="/nav.js"></script>
<script src="/bg.js"></script><script src="/omega-demo-video.js" defer></script>
</body>
