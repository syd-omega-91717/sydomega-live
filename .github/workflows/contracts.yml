# Unified static contract gate. One checkout and one deterministic suite.
name: Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Static contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        run: |
          python - <<'PY'
          import os
          print('runner=' + os.environ.get('RUNNER_NAME','unknown'))
          print('run=' + os.environ.get('GITHUB_RUN_ID','unknown'))
          PY
      - name: Execution marker
        run: |
          python - <<'PY'
          import os
          assert os.environ.get('RUNNER_NAME')
          print('CONTRACTS_EXECUTED=true')
          print('CONTRACTS_RUN_ID=' + os.environ.get('GITHUB_RUN_ID',''))
          PY
      - name: Run contract suite
        run: python scripts/contract-suite.py
      - name: Enforce all-roles module control
        run: python scripts/omega-all-roles-control.py
      - name: Enforce information architecture audit
        if: always()
        run: python scripts/audit-information-architecture.py
      - name: Enforce single WebGL owner
        if: always()
        run: python scripts/audit-webgl-ownership.py
      - name: Enforce schema consolidation (migrations authoritative)
        if: always()
        run: python scripts/schema-consolidation-gate.py
      - name: Enforce RPC consolidation (no duplicates)
        if: always()
        run: python scripts/rpc-consolidation-gate.py
