name: Ω Page Evidence Materialization

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'docs/capabilities/registry.json'
      - 'docs/OMEGA_DOMAIN_REGISTRY.md'
      - 'scripts/omega-page-contract-bootstrap.py'
      - 'scripts/omega-page-action-audit.py'
      - 'config/omega-page-contracts.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-page-evidence-materialization
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # repository-pinned setup-python
        with:
          python-version: '3.12'

      - name: Materialize page source evidence
        run: |
          python scripts/omega-page-contract-bootstrap.py --promote
          python scripts/omega-page-action-audit.py --write

      - name: Validate generated control plane
        run: |
          python scripts/omega-page-contract-audit.py
          python scripts/omega-page-contract-bootstrap.py
          python scripts/omega-page-action-audit.py --check
          python -m unittest scripts/tests/test_omega_unified_platform_fabric.py scripts/tests/test_omega_page_contract_bootstrap.py

      # The refreshed files are uploaded, not pushed. The repository setting
      # "Allow GitHub Actions to create and approve pull requests" is off, so
      # `gh pr create` failed on every main push and each run left a stray
      # automation/page-evidence-* branch behind (run 38288717671). A
      # maintainer reviews the artifact and commits it by hand.
      - name: Upload refreshed evidence when changed
        id: changed
        run: |
          if git diff --quiet -- config/omega-page-contracts.json config/omega-page-review-tasks.json config/omega-page-action-audit.json config/omega-page-contract-bootstrap.json; then
            echo "No page evidence changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- config/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload evidence artifact
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-evidence-${{ github.sha }}
          path: |
            config/omega-page-contracts.json
            config/omega-page-review-tasks.json
            config/omega-page-action-audit.json
            config/omega-page-contract-bootstrap.json
          retention-days: 14

      - name: Publish evidence summary
        run: |
          {
            echo "## Ω Page Evidence Materialization"
            echo ""
            echo "- Generated from direct repository HTML source."
            echo "- Semantic/authorization/production claims remain UNVERIFIED unless independently evidenced."
            echo "- Page contracts and action audit are uploaded as the page-evidence artifact when they change; nothing is pushed."
          } >> "$GITHUB_STEP_SUMMARY"
