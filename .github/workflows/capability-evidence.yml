name: Capability Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          echo "run=${GITHUB_RUN_ID}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          test -n "${RUNNER_NAME}"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate capability registry
        run: python3 scripts/capability-audit.py --check
      - name: Source runtime audit
        run: python3 scripts/capability-audit.py
      - name: Validate registry JSON
        run: python3 -m json.tool docs/capabilities/registry.json >/dev/null
