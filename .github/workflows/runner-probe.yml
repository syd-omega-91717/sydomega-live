# GitHub-hosted runner canary for issue #157.
# Mandatory quality gates use the same hosted runner class; this probe exists
# to provide an explicit execution proof without depending on a self-hosted PC.
name: Runner Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove the runner is real
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_OS:-}"
          test -n "${RUNNER_ARCH:-}"
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS arch=$RUNNER_ARCH"
          echo "run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          echo "GITHUB_HOSTED_RUNNER_OK=true"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deterministic contract on a GitHub-hosted runner
        run: |
          python3 --version
          node --version
          bash scripts/ci-local.sh
      - name: Execution marker
        run: |
          echo "RUNNER_PROBE_EXECUTED=true"
          echo "RUNNER_PROBE_RUN_ID=$GITHUB_RUN_ID"
          echo "RUNNER_PROBE_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
