name: Ω Schema Evidence

on:
  push:
    branches: [main]
    paths:
      - "supabase/live-schema.json"
      - "supabase/migrations/**"
      - "config/omega-schema-evidence-policy.json"
      - "scripts/omega-schema-evidence.py"
  pull_request:
    branches: [main]
    paths:
      - "supabase/live-schema.json"
      - "supabase/migrations/**"
      - "config/omega-schema-evidence-policy.json"
      - "scripts/omega-schema-evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate schema evidence
        run: python scripts/omega-schema-evidence.py
