name: Hosted Runner Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosted-runner-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Runner proof
        shell: cmd
        run: |
          @echo off
          if "%RUNNER_NAME%"=="" exit /b 1
          if "%RUNNER_OS%"=="" exit /b 1
          if "%RUNNER_ARCH%"=="" exit /b 1
          echo HOSTED_RUNNER_EXECUTED=true
          echo runner=%RUNNER_NAME%
          echo runner_os=%RUNNER_OS%
          echo runner_arch=%RUNNER_ARCH%
          echo run=%GITHUB_RUN_ID%
