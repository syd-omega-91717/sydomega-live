<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>&#937; SYD OMEGA 91717 &mdash; Examination</title>
<link rel="manifest" href="/manifest.json">
<style>
.xm-wrap{padding:16px var(--pad,20px) 40px;min-width:0}
.xm-title{font-family:var(--D);font-size:clamp(20px,4vw,28px);letter-spacing:3px;color:var(--gold);margin:4px 0 14px}
.xm-kpis .kpi{text-align:center}
.xm-panel[hidden]{display:none!important}
.fc-card{max-width:620px;margin:0 auto 16px;padding:22px;text-align:center}
.fc-meta{font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:12px}
.fc-q{font-size:18px;line-height:1.45;margin-bottom:16px;overflow-wrap:anywhere}
.fc-a{font-size:15px;line-height:1.5;color:var(--ink);text-align:left;padding:12px 14px;border-left:3px solid var(--cyan);background:rgba(255,255,255,.04);margin-bottom:14px;overflow-wrap:anywhere}
.fc-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fc-row .btn,.fc-form .btn{min-height:44px;padding:0 16px}
.fc-g0{color:var(--crim)!important;border-color:var(--crim)!important}
.fc-g3{color:#e8a33c!important;border-color:#e8a33c!important}
.fc-g4{color:var(--cyan)!important;border-color:var(--cyan)!important}
.fc-g5{color:var(--green)!important;border-color:var(--green)!important}
.fc-sub{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.fc-form{display:grid;gap:10px;max-width:620px}
.fc-form textarea,.fc-form select{width:100%;min-height:44px}
.fc-form .fc-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-list{display:grid;gap:8px}
.fc-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--purple,#9B6BF0);background:rgba(10,12,18,.5)}
.fc-item.due{border-left-color:var(--crim)}
.fc-item .fc-txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.fc-item small{display:block;font-family:var(--M);font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.fc-del{min-width:44px;min-height:44px;background:none;border:1px solid rgba(255,255,255,.12);color:var(--muted);cursor:pointer}
.fc-msg{font-family:var(--M);font-size:12px;letter-spacing:1px;color:var(--cyan);min-height:16px}
@media (max-width:480px){.fc-form .fc-two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<aside class="side" id="omega-side" data-page="exam"></aside>
<main class="main">
<div class="xm-wrap">
  <h1 class="xm-title">EXAMINATION</h1>

  <div class="kpi-row xm-kpis">
    <div class="kpi"><div class="kpi-n" id="xm-passed">0/12</div><div class="kpi-l">SECTORS PASSED</div></div>
    <div class="kpi"><div class="kpi-n" id="xm-avg">0%</div><div class="kpi-l">BEST AVERAGE</div></div>
    <div class="kpi"><div class="kpi-n" id="xm-answered">0</div><div class="kpi-l">ANSWERED</div></div>
  </div>

  <div class="tab-row" role="tablist">
    <button type="button" class="tab-btn act" role="tab" aria-selected="true" data-tab="exams" onclick="xmTab('exams')">EXAMS</button>
    <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="cards" onclick="xmTab('cards')">FLASHCARDS</button>
  </div>

  <section class="xm-panel" id="xm-exams" role="tabpanel">
    <div id="xm-mount"></div>
  </section>

  <section class="xm-panel" id="xm-cards" role="tabpanel" hidden>
    <div class="fc-sub">
      <button type="button" class="btn btn-cyan" data-sub="review" onclick="fcSub('review')">REVIEW</button>
      <button type="button" class="btn" data-sub="list" onclick="fcSub('list')">ALL <span id="fc-count">0</span></button>
      <button type="button" class="btn" data-sub="add" onclick="fcSub('add')">+ ADD</button>
    </div>
    <div id="fc-review"></div>
    <div id="fc-list" class="fc-list" hidden></div>
    <div id="fc-add" hidden>
      <div class="fc-form">
        <textarea id="fc-q" rows="2" placeholder="Question" aria-label="Question"></textarea>
        <textarea id="fc-a" rows="3" placeholder="Answer" aria-label="Answer"></textarea>
        <div class="fc-two">
          <select id="fc-domain" aria-label="Domain">
            <option value="strategy">Strategy</option><option value="finance">Finance</option>
            <option value="science">Science</option><option value="philosophy">Philosophy</option>
            <option value="health">Health</option><option value="trivia">Trivia</option>
            <option value="custom" selected>Custom</option>
          </select>
          <select id="fc-diff" aria-label="Difficulty">
            <option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option>
          </select>
        </div>
        <div class="fc-row" style="justify-content:flex-start">
          <button type="button" class="btn btn-gold" onclick="fcAdd()">ADD CARD</button>
        </div>
        <div class="fc-two">
          <select id="fc-triv" aria-label="Open Trivia DB category">
            <option value="9">Trivia &middot; General</option><option value="17">Trivia &middot; Science</option>
            <option value="18">Trivia &middot; Computers</option><option value="19">Trivia &middot; Mathematics</option>
            <option value="22">Trivia &middot; Geography</option><option value="23">Trivia &middot; History</option>
          </select>
          <button type="button" class="btn" id="fc-triv-btn" onclick="fcImport()">IMPORT 10</button>
        </div>
        <div class="fc-msg" id="fc-msg" aria-live="polite"></div>
      </div>
    </div>
  </section>
</div>
</main>
</div>

<script>
/* ── KPIs + exam mount ── */
function xmKpis(){
  var s=window.OmegaExam?window.OmegaExam.stats():{passed:0,avg:0,answered:0};
  document.getElementById('xm-passed').textContent=s.passed+'/12';
  document.getElementById('xm-avg').textContent=s.avg+'%';
  document.getElementById('xm-answered').textContent=s.answered;
}
function xmTab(id){
  document.querySelectorAll('.tab-row .tab-btn').forEach(function(b){var on=b.getAttribute('data-tab')===id;b.classList.toggle('act',on);b.setAttribute('aria-selected',on?'true':'false');});
  document.getElementById('xm-exams').hidden=id!=='exams';
  document.getElementById('xm-cards').hidden=id!=='cards';
  if(id==='cards')fcSub(fcView);
}
document.addEventListener('omega-exam:update',xmKpis);
(function boot(){
  if(window.OmegaExam){window.OmegaExam.mount(document.getElementById('xm-mount'));xmKpis();return;}
  setTimeout(boot,50);
})();

/* ── Flashcards: spaced repetition (SM-2) on the existing omega_exam data ── */
var questions=[],fcQueue=[],fcIdx=0,fcView='review';
var SEEDS=[
  {q:'What is the Rule of 72?',a:'Divide 72 by an annual interest rate to estimate years to double. At 7%: 72÷7 ≈ 10.3 years.',domain:'finance',diff:'easy'},
  {q:'What is the Pareto Principle?',a:'80% of outcomes come from 20% of causes. Apply it to identify the high-leverage 20% of inputs.',domain:'strategy',diff:'easy'},
  {q:'Define second-order thinking.',a:'Thinking about consequences of consequences — "and then what?" First-order: action → immediate effect. Second-order: action → effect → downstream effects.',domain:'philosophy',diff:'medium'},
  {q:'What is the forgetting curve and how do you fight it?',a:'Ebbinghaus 1885: without reinforcement, ~50% forgotten in 24h, ~70% in a week. Countermeasure: spaced repetition — review at expanding intervals.',domain:'science',diff:'medium'},
  {q:'What is the OODA loop?',a:'Observe → Orient → Decide → Act. Boyd\'s decision framework. Faster OODA cycles confer decisive advantage in competitive environments.',domain:'strategy',diff:'medium'},
  {q:'What are Dunbar\'s Number tiers?',a:'Inner 5 (intimate), Close 15, Tribe 50, Network 150, Outer 500. Cognitive limit for maintaining stable social relationships.',domain:'science',diff:'hard'},
  {q:'What is the 4% rule in finance?',a:'Bengen 1994: a portfolio can sustain 4% annual withdrawal for 30+ years. FI number = Annual Expenses × 25.',domain:'finance',diff:'medium'},
  {q:'What is the testing effect?',a:'Roediger & Karpicke 2006: retrieval practice (testing yourself) produces far better long-term retention than re-reading. Tests ARE the learning.',domain:'science',diff:'easy'},
  {q:'Define the authority formula AUTH.',a:'AUTH = sqrt(A³ + B³ + C³) × φ/e. APEX = 27.8367. A=Accomplishment, B=Breadth, C=Consistency. φ=1.618 (golden ratio), e=2.718.',domain:'custom',diff:'hard'},
  {q:'What is Cognitive Load Theory?',a:'Sweller 1988: working memory holds ~4 chunks. Externalizing knowledge (notes, systems) frees working memory for higher-order reasoning. Reduce extraneous load, maximize germane load.',domain:'science',diff:'hard'}
];
function today(){return new Date().toISOString().slice(0,10);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function fcLoad(){
  var raw=null;try{raw=localStorage.getItem('omega_exam');}catch(e){}
  try{questions=JSON.parse(raw||'null')||[];}catch(e){questions=[];}
  if(!Array.isArray(questions))questions=[];
  if(!questions.length)questions=SEEDS.map(function(s,i){return Object.assign({id:'s'+i,repetitions:0,interval:1,easiness:2.5,nextReview:today()},s);});
}
function fcSave(){try{localStorage.setItem('omega_exam',JSON.stringify(questions));return true;}catch(e){fcMsg('NOT SAVED — STORAGE UNAVAILABLE');return false;}}
function isDue(q){return (q.nextReview||'')<=today();}
function mk(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function fcMsg(t){var m=document.getElementById('fc-msg');if(m){m.textContent=t;setTimeout(function(){if(m.textContent===t)m.textContent='';},3000);}}
function fcSub(v){
  fcView=v;
  ['review','list','add'].forEach(function(k){document.getElementById('fc-'+k).hidden=k!==v;});
  document.querySelectorAll('.fc-sub .btn').forEach(function(b){b.classList.toggle('btn-cyan',b.getAttribute('data-sub')===v);});
  document.getElementById('fc-count').textContent=questions.length;
  if(v==='review')fcReview();
  if(v==='list')fcList();
}
function fcReview(){
  if(fcIdx>=fcQueue.length){fcQueue=questions.filter(isDue).sort(function(){return Math.random()-.5;});fcIdx=0;}
  var box=document.getElementById('fc-review');box.textContent='';
  var card=mk('div','card fc-card');
  if(!fcQueue.length){
    var next=questions.map(function(q){return q.nextReview;}).sort()[0]||'—';
    card.appendChild(mk('div','fc-meta','ALL CAUGHT UP · NEXT '+next));
    box.appendChild(card);return;
  }
  var q=fcQueue[fcIdx];
  card.appendChild(mk('div','fc-meta',(fcIdx+1)+'/'+fcQueue.length+' · '+String(q.domain||'custom').toUpperCase()+' · '+(q.interval||1)+'d'));
  card.appendChild(mk('div','fc-q',q.q));
  var ans=mk('div','fc-a',q.a);ans.hidden=true;card.appendChild(ans);
  var row=mk('div','fc-row');
  var flip=mk('button','btn btn-gold','REVEAL');flip.type='button';
  flip.onclick=function(){ans.hidden=false;flip.remove();grades.hidden=false;};
  row.appendChild(flip);card.appendChild(row);
  var grades=mk('div','fc-row');grades.hidden=true;
  [[0,'MISS'],[3,'HARD'],[4,'GOOD'],[5,'EASY']].forEach(function(g){
    var b=mk('button','btn fc-g'+g[0],g[1]);b.type='button';b.onclick=function(){fcGrade(q.id,g[0]);};grades.appendChild(b);
  });
  card.appendChild(grades);box.appendChild(card);
}
function fcGrade(id,g){
  var o=questions.find(function(x){return x.id===id;});
  if(o){
    o.easiness=typeof o.easiness==='number'?o.easiness:2.5;o.repetitions=o.repetitions|0;o.interval=o.interval||1;
    if(g>=3){
      o.easiness=Math.max(1.3,o.easiness+(0.1-(5-g)*(0.08+(5-g)*0.02)));
      if(o.repetitions===0)o.interval=1;else if(o.repetitions===1)o.interval=6;else o.interval=Math.round(o.interval*o.easiness);
      o.repetitions++;
    }else{o.repetitions=0;o.interval=1;}
    var d=new Date();d.setDate(d.getDate()+o.interval);o.nextReview=d.toISOString().slice(0,10);
  }
  fcSave();fcIdx++;fcReview();
}
function fcList(){
  var list=document.getElementById('fc-list');list.textContent='';
  if(!questions.length){list.appendChild(mk('div','fc-meta','NO CARDS'));return;}
  questions.forEach(function(q){
    var it=mk('div','fc-item'+(isDue(q)?' due':''));
    var t=mk('div','fc-txt',q.q);
    t.appendChild(mk('small',null,String(q.domain||'custom').toUpperCase()+' · '+(q.interval||1)+'d · '+(q.nextReview||'')+(q.source?' · '+q.source:'')));
    it.appendChild(t);
    var del=mk('button','fc-del','✕');del.type='button';del.setAttribute('aria-label','Delete card');
    del.onclick=function(){if(!confirm('Delete?'))return;questions=questions.filter(function(x){return x.id!==q.id;});fcSave();fcQueue=[];fcSub('list');};
    it.appendChild(del);list.appendChild(it);
  });
}
function fcAdd(){
  var q=document.getElementById('fc-q').value.trim(),a=document.getElementById('fc-a').value.trim();
  if(!q||!a){fcMsg('QUESTION AND ANSWER REQUIRED');return;}
  questions.push({id:uid(),q:q,a:a,domain:document.getElementById('fc-domain').value,diff:document.getElementById('fc-diff').value,repetitions:0,interval:1,easiness:2.5,nextReview:today()});
  if(!fcSave())return;
  document.getElementById('fc-q').value='';document.getElementById('fc-a').value='';
  document.getElementById('fc-count').textContent=questions.length;fcQueue=[];fcMsg('CARD ADDED');
}
function decodeEntities(s){return new DOMParser().parseFromString('<!doctype html><body>'+s,'text/html').body.textContent||'';}
function fcImport(){
  var btn=document.getElementById('fc-triv-btn');btn.disabled=true;
  fetch('https://opentdb.com/api.php?amount=10&type=multiple&category='+encodeURIComponent(document.getElementById('fc-triv').value))
    .then(function(r){return r.json();}).then(function(d){
      if(!d||d.response_code!==0||!d.results||!d.results.length){fcMsg('NO QUESTIONS RETURNED');return;}
      d.results.forEach(function(r){
        questions.push({id:uid(),q:decodeEntities(r.question),a:'Correct answer: '+decodeEntities(r.correct_answer),domain:'trivia',diff:r.difficulty||'medium',repetitions:0,interval:1,easiness:2.5,nextReview:today(),source:'Open Trivia DB · '+decodeEntities(r.category)});
      });
      if(fcSave()){fcQueue=[];document.getElementById('fc-count').textContent=questions.length;fcMsg(d.results.length+' IMPORTED');}
    }).catch(function(){fcMsg('OPEN TRIVIA DB UNREACHABLE');}).finally(function(){btn.disabled=false;});
}
fcLoad();
</script>
<script src="/omega-exam-engine.js" defer></script>
<script src="/bg.js" defer></script>
<script type="module" src="/omega-analytics-init.js"></script><script type="module" src="/omega-speed-insights-init.js"></script></body>
</html>
