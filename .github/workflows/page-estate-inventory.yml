name: Page Estate Inventory

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-estate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory static page estate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build deterministic inventory
        shell: pwsh
        run: python scripts/build-content-registry.py
      - name: Verify inventory is deterministic
        shell: pwsh
        run: |
          $before = Get-FileHash config/page-estate.generated.json -Algorithm SHA256
          python scripts/build-content-registry.py
          $after = Get-FileHash config/page-estate.generated.json -Algorithm SHA256
          if ($before.Hash -ne $after.Hash) { throw 'Page estate inventory is not deterministic' }
