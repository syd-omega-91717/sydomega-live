name: One-time registry regeneration
on:
  push:
    branches:
      - fix/registry-regeneration-20260915
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical registry
        run: python3 scripts/omega-registry.py
      - name: Commit generated registry and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OMEGA_SKILL_REGISTRY.md
          git rm .github/workflows/one-time-registry-regeneration.yml
          if git diff --cached --quiet; then
            echo 'No registry drift detected after regeneration.'
            exit 0
          fi
          git commit -m 'chore: regenerate skill registry from repository state'
          git push origin HEAD:fix/registry-regeneration-20260915
