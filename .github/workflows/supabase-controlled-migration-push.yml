name: Supabase Controlled Migration Push

on:
  workflow_dispatch:
    inputs:
      migration_version:
        description: Exact version listed as pending in supabase/pending-migrations.json
        required: true
        type: string
      confirm_production_apply:
        description: Confirm applying exactly one migration to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Validate explicit confirmation, secrets, and single pending migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          CONFIRM_PRODUCTION_APPLY: ${{ inputs.confirm_production_apply }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRM_PRODUCTION_APPLY}" = "true" || { echo "::error::Explicit production confirmation is required."; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret."; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "::error::Missing SUPABASE_DB_PASSWORD secret."; exit 1; }
          python - <<'PY'
          import json, os, pathlib, re, sys
          version = os.environ["MIGRATION_VERSION"]
          if not re.fullmatch(r"\d{14}", version):
              sys.exit("Migration version must be exactly 14 digits.")
          manifest = json.loads(pathlib.Path("supabase/pending-migrations.json").read_text())
          pending = manifest.get("pending", [])
          selected = [m for m in pending if str(m.get("version")) == version]
          if len(pending) != 1 or len(selected) != 1:
              sys.exit("Fail closed: exactly one pending migration must exist, and it must match the requested version.")
          item = selected[0]
          if item.get("liveStatus") != "NOT_APPLIED" or item.get("blocksProduction") is not True:
              sys.exit("Requested migration is not in the expected pending production state.")
          file = pathlib.Path("supabase/migrations") / item["file"]
          if not file.is_file() or not file.name.startswith(version + "_"):
              sys.exit("The pending manifest does not point to the expected local migration file.")
          sql = file.read_text(encoding="utf-8")
          if version == "20261022130000":
              owner_guard = "auth.uid() IS NOT NULL AND auth.uid() IS DISTINCT FROM NEW.user_id"
              if owner_guard not in sql:
                  sys.exit("Consent audit owner guard is missing; refusing production migration.")
              print(f"Validated one pending consent-audit migration: {file.name}")
          elif version == "20261116214700":
              required = (
                  "rename column key_name to name",
                  "rename column is_active to active",
                  "add column name text",
                  "add column active boolean default true",
              )
              missing = [marker for marker in required if marker not in sql.lower()]
              if missing:
                  sys.exit(f"API-key compatibility migration is missing required idempotent column handling: {missing!r}")
              if "drop column" in sql.lower() or "drop table" in sql.lower():
                  sys.exit("Destructive API-key schema operation detected; refusing production migration.")
              if "grant " in sql.lower():
                  sys.exit("Privilege changes are not allowed in the API-key compatibility migration.")
              print(f"Validated replay-safe API-key metadata compatibility migration: {file.name}")
          elif version == "20261118120000":
              import hashlib
              expected_sha256 = "dbc051dc7a59d22a28732ec263f8a5e7f4d4848b8c29410188c667a74ea7226a"
              actual_sha256 = hashlib.sha256(sql.encode("utf-8")).hexdigest()
              if actual_sha256 != expected_sha256:
                  sys.exit("Publication attachment migration bytes differ from the reviewed production migration.")
              required = (
                  "create unique index if not exists storage_files_id_owner_unique",
                  "add column if not exists content_file_id uuid",
                  "foreign key (content_file_id, user_id)",
                  "references public.storage_files (id, owner_id)",
                  "on delete set null (content_file_id)",
                  "content_file_id is null or (user_id is not null and file_path is null)",
              )
              missing = [marker for marker in required if marker not in sql.lower()]
              if missing:
                  sys.exit(f"Publication attachment migration is missing owner-binding controls: {missing!r}")
              forbidden = ("drop table", "drop column", "truncate", "delete from", "grant ")
              present = [marker for marker in forbidden if marker in sql.lower()]
              if present:
                  sys.exit(f"Unexpected destructive or privilege-changing operation detected: {present!r}")
              print(f"Validated owner-bound, backward-compatible publication attachment migration: {file.name}")
          elif version == "20261118090000":
              required = (
                  "revoke update on table public.media_reservations from public, anon, authenticated",
                  "revoke update (id, user_id, zone, duration, title, message, price_omega, status, created_at, file_path)",
                  "create or replace function private.set_reservation_status(p_id bigint, p_status text)",
                  "alter table public.media_reservations alter column id type bigint using 1::bigint",
                  "if row_count <> 0 then",
                  "if inbound_fk_count <> 0 then",
                  "drop policy if exists media_reservations_own",
                  "create policy media_reservations_select",
                  "create policy media_reservations_insert",
                  "add generated by default as identity",
                  "from public.platform_owners po where po.user_id = auth.uid()",
                  "auth.jwt()->>'aal'",
                  "insert into public.omega_platform_events",
                  "revoke all on function public.set_reservation_status(uuid, text)",
                  "grant execute on function public.set_reservation_status(bigint, text) to authenticated",
              )
              missing = [marker for marker in required if marker not in sql.lower()]
              if missing:
                  sys.exit(f"Owner reservation migration is missing required authorization or audit controls: {missing!r}")
              forbidden = ("drop table", "drop column", "truncate", "delete from")
              present = [marker for marker in forbidden if marker in sql.lower()]
              if present:
                  sys.exit(f"Destructive owner reservation migration operation detected: {present!r}")
              print(f"Validated owner-only, AAL2-protected, audited reservation decision migration: {file.name}")
          else:
              sys.exit("This controlled workflow is not authorized for the requested migration version.")
          PY

      - name: Link the authorized production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref ydqhzvvoyufiiqvzcjns --password "${SUPABASE_DB_PASSWORD}"

      - name: Verify live api_keys shape before compatibility no-op
        if: inputs.migration_version == '20261116214700'
        run: |
          set -euo pipefail
          supabase db dump --linked --schema public --file "${RUNNER_TEMP}/live-public-schema.sql"
          python - <<'PY'
          import pathlib, re, sys
          dump = pathlib.Path(__import__("os").environ["RUNNER_TEMP"], "live-public-schema.sql").read_text(encoding="utf-8")
          match = re.search(r"CREATE TABLE(?: IF NOT EXISTS)? public\.api_keys\s*\((.*?)\n\);", dump, re.IGNORECASE | re.DOTALL)
          if not match:
              sys.exit("Could not verify the live public.api_keys table definition; refusing compatibility migration.")
          body = match.group(1).lower()
          if not re.search(r"\bname\s+text\b", body):
              sys.exit("Live public.api_keys.name text column is missing; refusing no-op compatibility migration.")
          if not re.search(r"\bactive\s+boolean\b", body):
              sys.exit("Live public.api_keys.active boolean column is missing; refusing no-op compatibility migration.")
          if re.search(r"\bkey_name\b|\bis_active\b", body):
              sys.exit("Live public.api_keys still has legacy column names; refusing a production schema change.")
          print("Live api_keys has name/active and no legacy columns; compatibility migration is a verified no-op.")
          PY

      - name: Verify remote history and dry-run contains exactly the selected migration
        env:
          MIGRATION_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "${RUNNER_TEMP}/migrations-before.txt"
          push_args=(--linked)
          if [ "${MIGRATION_VERSION}" = "20261116214700" ]; then
            # The compatibility version is intentionally earlier than the
            # already-applied grant migration. --include-all selects missing
            # local versions; the Python preflight below proves there is only one.
            push_args+=(--include-all)
          fi
          supabase db push --dry-run "${push_args[@]}" 2>&1 | tee "${RUNNER_TEMP}/migration-dry-run.txt"
          python - <<'PY'
          import os, pathlib, re, sys
          version = os.environ["MIGRATION_VERSION"]
          before = pathlib.Path(os.environ["RUNNER_TEMP"], "migrations-before.txt").read_text()
          dry = pathlib.Path(os.environ["RUNNER_TEMP"], "migration-dry-run.txt").read_text()
          rows = []
          for line in before.splitlines():
              match = re.match(r"^\s*(\d{14})?\s*[│|]\s*(\d{14})?\s*[│|]", line)
              if match and (match.group(1) or match.group(2)):
                  rows.append((match.group(1) or None, match.group(2) or None))
          if not rows:
              sys.exit("Could not parse linked migration history; refusing production push.")
          mismatches = [(local, remote) for local, remote in rows if local != remote]
          if mismatches != [(version, None)]:
              sys.exit(f"Remote history drift or unexpected pending versions: {mismatches!r}")
          versions = set(re.findall(r"\b(\d{14})(?:_[A-Za-z0-9_-]+\.sql)?\b", dry))
          if versions != {version}:
              sys.exit(f"Dry-run did not contain exactly the selected migration: {sorted(versions)!r}")
          print(f"Preflight passed: dry-run would apply only {version}.")
          PY

      - name: Apply the one reviewed migration
        env:
          MIGRATION_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          push_args=(--linked --yes)
          if [ "${MIGRATION_VERSION}" = "20261116214700" ]; then
            push_args+=(--include-all)
          fi
          supabase db push "${push_args[@]}"

      - name: Verify remote migration history after push
        env:
          MIGRATION_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "${RUNNER_TEMP}/migrations-after.txt"
          python - <<'PY'
          import os, pathlib, re, sys
          version = os.environ["MIGRATION_VERSION"]
          text = pathlib.Path(os.environ["RUNNER_TEMP"], "migrations-after.txt").read_text()
          rows = []
          for line in text.splitlines():
              match = re.match(r"^\s*(\d{14})?\s*[│|]\s*(\d{14})?\s*[│|]", line)
              if match and (match.group(1) or match.group(2)):
                  rows.append((match.group(1) or None, match.group(2) or None))
          if not rows or any(local != remote for local, remote in rows):
              sys.exit("Post-push migration history is not fully reconciled.")
          if (version, version) not in rows:
              sys.exit("Selected migration is not recorded as applied on the remote database.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Supabase migration applied\n\nVerified local/remote history match for `{version}`.\n")
          print(f"Verified {version} is recorded as applied.")
          PY
