.omv-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin:14px 0 24px;min-width:0}
.omv-tile.card{position:relative;margin:0;padding:0;overflow:hidden;background:#04050a;border:1px solid rgba(201,168,76,.16);border-radius:4px}
.omv-hit{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;margin:0;border:0;background:#000;color:inherit;cursor:pointer;overflow:hidden}
.omv-hit img,.omv-hit video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.omv-hit img{transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .5s}
.omv-hit video{opacity:0;transition:opacity .45s}
.omv-tile.is-playing .omv-hit video{opacity:1}
.omv-tile:hover .omv-hit img,.omv-hit:focus-visible img{transform:scale(1.04);filter:brightness(1.12)}
.omv-hit:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.omv-hit::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px var(--omv-c),inset 0 -60px 60px -40px rgba(0,0,0,.7);opacity:0;transition:opacity .35s}
.omv-tile:hover .omv-hit::after,.omv-hit:focus-visible::after,.omv-tile.is-playing .omv-hit::after{opacity:1}
.omv-num{position:absolute;left:10px;top:8px;font-family:var(--M);font-size:12px;letter-spacing:3px;color:var(--omv-c);text-shadow:0 0 8px #000}
.omv-play{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--omv-c);background:rgba(0,0,0,.55);opacity:.85;transition:opacity .3s,transform .3s}
.omv-play::before{content:"";position:absolute;left:15px;top:11px;border-style:solid;border-width:8px 0 8px 12px;border-color:transparent transparent transparent var(--gold)}
.omv-tile.is-playing .omv-play{opacity:0;transform:scale(.8)}
.omv-cap{margin:0;padding:10px 12px 11px;font-family:var(--M);font-size:12px;letter-spacing:2.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omv-cap b{font-weight:400;color:var(--omv-c)}
.omv-lb{padding:0;border:1px solid rgba(201,168,76,.35);border-radius:4px;background:#000;color:var(--ink);width:min(1120px,94vw);max-width:94vw;max-height:94vh;overflow:hidden}
.omv-lb::backdrop{background:rgba(0,0,0,.86)}

.omv-lb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 4px 14px;font-family:var(--M);font-size:12px;letter-spacing:3px;color:var(--gold)}
.omv-lb-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.omv-x{flex:none;min-width:44px;min-height:44px;border:1px solid rgba(201,168,76,.35);background:none;color:var(--gold);font-size:20px;line-height:1;cursor:pointer;border-radius:4px}

<script>
(function(){
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)');
  var noHover=window.matchMedia&&matchMedia('(hover: none)');
  function isReduced(){return !!(reduced&&reduced.matches);}
  function start(tile){
    if(isReduced())return;
    var v=tile.querySelector('video');if(!v)return;
    var p=v.play();tile.classList.add('is-playing');
    if(p&&p.catch)p.catch(function(err){tile.classList.remove('is-playing');console.warn('[movies] preview did not start:',err&&err.name);});
  }
  function stop(tile){
    var v=tile.querySelector('video');tile.classList.remove('is-playing');
    if(v&&!v.paused){v.pause();}
  }
  var lb=document.getElementById('omv-lb'),lbv=document.getElementById('omv-lb-video'),lbt=document.getElementById('omv-lb-title'),opener=null;
  function openFilm(tile,btn){
    stop(tile);opener=btn;
    /* data-film is 01..12; rebuild it from a number so no page text reaches a URL. */
    var n=parseInt(tile.getAttribute('data-film'),10);
    if(!(n>=1&&n<=12))return;
    var nn=(n<10?'0':'')+n;
    lbt.textContent=btn.getAttribute('data-title')||'';
    lbv.setAttribute('data-omega-audio-required','true');
    lbv.setAttribute('data-omega-voice','Now playing '+(btn.getAttribute('data-title')||'this fictional SYD OMEGA franchise film')+'. This is fictional media-universe content, presented as cinematic lore and not real-world history.');
    var dir='/assets/movies/';
    lbv.poster=dir+'franchise-'+nn+'.jpg';
    lbv.src=dir+'franchise-'+nn+'.mp4';
    lbv.muted=false;
    lbv.setAttribute('data-omega-audio-state','READY_FOR_SOUND_MUSIC_VOICE');
    if(typeof lb.showModal==='function')lb.showModal();else lb.setAttribute('open','');
    document.getElementById('omv-x').focus();
    if(!isReduced()){var p=lbv.play();if(p&&p.catch)p.catch(function(err){console.warn('[movies] playback needs a tap:',err&&err.name);});}
  }
  function closeFilm(){if(lb.open){if(typeof lb.close==='function')lb.close();else{lb.removeAttribute('open');onClosed();}}}
  function onClosed(){
    lbv.pause();lbv.removeAttribute('src');lbv.load();
    if(opener&&opener.focus)opener.focus();opener=null;
  }
  lb.addEventListener('close',onClosed);
  lb.addEventListener('click',function(e){if(e.target===lb)closeFilm();});
  document.getElementById('omv-x').addEventListener('click',closeFilm);
  document.querySelectorAll('.omv-tile').forEach(function(tile){
    var btn=tile.querySelector('.omv-hit');
    tile.addEventListener('pointerenter',function(e){if(e.pointerType!=='touch')start(tile);});
    tile.addEventListener('pointerleave',function(e){if(e.pointerType!=='touch')stop(tile);});
    btn.addEventListener('focus',function(){if(!(noHover&&noHover.matches))start(tile);});
    btn.addEventListener('blur',function(){stop(tile);});
    btn.addEventListener('click',function(){
      // Touch: first tap previews, second tap opens the player.
      if(noHover&&noHover.matches&&!isReduced()&&!tile.classList.contains('is-playing')){
        document.querySelectorAll('.omv-tile.is-playing').forEach(stop);start(tile);return;
      }
      openFilm(tile,btn);
    });
  });
  /* MEDIA HUB 3-D CAROUSEL: built from the 12 tiles above, so titles, art and the player stay single-sourced. */
  (function(){
    var stage=document.getElementById('mh-stage');if(!stage)return;
    var tiles=[].slice.call(document.querySelectorAll('.omv-tile'));var N=tiles.length;if(!N)return;
    var cards=[],dots=[],pos=0,target=0,raf=0,drag=null,moved=false,hover=false,autoOn=!isReduced(),timer=0,idle=0;
    var now=document.getElementById('mh-now'),dotsEl=document.getElementById('mh-dots'),autoBtn=document.getElementById('mh-auto');
    tiles.forEach(function(t,i){
      var btn=t.querySelector('.omv-hit'),lab=btn.getAttribute('aria-label')||'',m=/,\s*([^,]+?)\s*\u00B7\s*([A-Za-z]+),\s*franchise/.exec(lab);
      var god=m?m[1]:'',sign=m?m[2]:'',n=(i<9?'0':'')+(i+1),c=t.style.getPropertyValue('--omv-c')||'#C9A84C';
