name: Omega Registry Sync

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - OMEGA_SKILL_REGISTRY.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-registry-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Regenerate registry
        run: python3 scripts/omega-registry.py

      - name: Commit generated registry
        run: |
          if git diff --quiet -- OMEGA_SKILL_REGISTRY.md; then
            echo 'OMEGA_SKILL_REGISTRY.md is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OMEGA_SKILL_REGISTRY.md
          git commit -m 'chore: synchronize generated omega registry'
          git push origin HEAD:${{ github.ref_name }}
