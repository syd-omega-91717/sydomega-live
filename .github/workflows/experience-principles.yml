name: Experience Principles
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experience-principles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate platform principles
        shell: pwsh
        run: python scripts/experience-principles-contract.py
