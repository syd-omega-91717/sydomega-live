name: Page Content and Purpose Audit

# Advisory-only quality reports: visible-copy repetition and semantic page-purpose overlap
# answer different questions. The purpose audit is O(n^2) over the page estate.
# Reports run nightly and on demand; they do not gate merges.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlap:
    name: Audit visible copy and page purpose
    # Was [self-hosted, Windows, X64]. That runner is dead -- runner-probe.yml,
    # whose only job is to prove it works, has never completed a run, and this
    # audit therefore never executed ONCE: measured in its own history as
    # 10m13s / 11m44s / 11m52s of queueing before timing out. A check that
    # never runs is not a lenient check, it is an absent one.
    #
    # The scripts are platform-independent and run on Linux. The visible-copy
    # audit reports exact and near-duplicate text; the page-purpose audit
    # reports semantic overlap candidates with supporting evidence. `shell:
    # pwsh` went with the Windows runner and is dropped; bash is the default here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Report repeated visible page copy
        run: python scripts/page-copy-audit.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report page-purpose overlap with source evidence
        run: python scripts/page-consolidation.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"
