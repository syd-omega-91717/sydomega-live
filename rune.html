<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>&#937; SYD OMEGA 91717 &mdash; SOVEREIGN SIGIL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Rajdhani:wght@300;400;600&family=Courier+Prime:wght@400;700&display=swap">
<script src="/bg.js" defer></script>
<style>
:root{--void:#0A0A0F;--void2:#020206;--gold:#C9A84C;--solar:#E2C86D;--cyan:#00E5FF;--crim:#8B0000;--green:#3fb27f;--purple:#9B6BF0;--muted:#8a8676;--ink:#e9e6dc;--line:rgba(201,168,76,.15);--D:"Cinzel Decorative",serif;--R:"Rajdhani",sans-serif;--M:"Courier Prime",monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--R);min-height:100vh}
.shell{display:flex;min-height:100vh}
.side{width:80px;flex-shrink:0;background:var(--void2);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:10px 0}
.main{flex:1;min-width:0;overflow-x:hidden}
.topbar{background:rgba(10,10,15,.97);border-bottom:1px solid var(--line);padding:12px clamp(14px,3vw,36px);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
.t{font-family:var(--D);font-size:.85rem;color:var(--solar);flex:1}
.t small{display:block;font-family:var(--M);font-size:7px;letter-spacing:2px;color:var(--muted);margin-top:2px}
.pad{padding:clamp(14px,3vw,36px)}
.card{border:1px solid var(--line);background:rgba(10,10,15,.55);padding:16px;border-radius:2px;margin-bottom:14px}
.sechead{font-family:var(--M);font-size:9px;letter-spacing:4px;color:var(--solar);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.lf{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,3vw,36px);border-top:1px solid var(--line);flex-wrap:wrap}
.lf span{font-family:var(--M);font-size:7.5px;letter-spacing:1.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Sigil display */
.sigil-stage{display:flex;align-items:center;justify-content:center;min-height:320px;background:rgba(0,0,0,.4);border:1px solid rgba(201,168,76,.1);border-radius:2px;padding:20px;position:relative}
.sigil-stage svg{max-width:300px;max-height:300px;width:100%;height:auto;filter:drop-shadow(0 0 20px var(--sigil-glow,rgba(226,200,109,.3)))}

/* Loading spinner */
.sigil-spin{font-family:var(--D);font-size:48px;color:var(--gold);animation:spin 3s linear infinite;display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Controls */
.btn{font-family:var(--M);font-size:8px;letter-spacing:2px;padding:9px 20px;border:1px solid var(--solar);background:rgba(226,200,109,.08);color:var(--solar);cursor:pointer;border-radius:2px;transition:.15s}
.btn:hover{background:rgba(226,200,109,.2)}
.btn-purple{border-color:var(--purple);background:rgba(155,107,240,.08);color:var(--purple)}
.btn-purple:hover{background:rgba(155,107,240,.2)}
.btn-cyan{border-color:var(--cyan);background:rgba(0,229,255,.05);color:var(--cyan)}
.btn-cyan:hover{background:rgba(0,229,255,.1)}

/* Attribute sliders */
.slider-row{margin-bottom:12px}
.slider-label{display:flex;justify-content:space-between;font-family:var(--M);font-size:8px;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.slider-label span{color:var(--solar)}
input[type=range]{width:100%;accent-color:var(--gold)}

/* Variant grid */
.variant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:10px}
.variant-tile{border:1px solid var(--line);background:rgba(10,10,15,.6);padding:10px;text-align:center;cursor:pointer;border-radius:2px;transition:.18s}
.variant-tile:hover{border-color:var(--solar);background:rgba(201,168,76,.05)}
.variant-tile svg{max-width:100px;max-height:100px;width:100%;height:auto}
.variant-name{font-family:var(--M);font-size:7px;letter-spacing:1.5px;color:var(--muted);margin-top:6px}

/* Info stats */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.info-stat{font-family:var(--M);font-size:7.5px}
.info-stat dt{letter-spacing:1px;color:var(--muted);margin-bottom:2px}
.info-stat dd{font-family:var(--D);font-size:13px;color:var(--solar)}

@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell" id="app" style="display:none">
  <aside class="side" id="omega-side" data-page="rune"></aside>
  <main class="main">
    <div class="topbar">
      <div class="t">SOVEREIGN SIGIL<small>PROCEDURAL SVG IDENTITY RUNE · DETERMINISTIC FROM AUTHORITY PARAMETERS</small></div>
    </div>

    <div class="pad">
      <div class="grid2">
        <!-- Left: sigil display -->
        <div>
          <div class="card">
            <div class="sechead">YOUR SOVEREIGN SIGIL</div>
            <div class="sigil-stage" id="sigil-stage">
              <span class="sigil-spin">Ω</span>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              <button class="btn" onclick="downloadSigil()">&#11015; DOWNLOAD SVG</button>
              <button class="btn btn-purple" onclick="animateSigil()">&#9654; ANIMATE</button>
              <button class="btn btn-cyan" onclick="copySvg()">&#9632; COPY SVG</button>
            </div>
          </div>

          <div class="card">
            <div class="sechead">SIGIL PARAMETERS</div>
            <dl class="info-grid" id="sigil-info"></dl>
          </div>
        </div>

        <!-- Right: controls -->
        <div>
          <div class="card">
            <div class="sechead">CUSTOMISE</div>

            <div class="slider-row">
              <div class="slider-label">SIZE <span id="sz-val">300</span>px</div>
              <input type="range" id="ctrl-size" min="150" max="600" value="300" oninput="updateSigil()">
            </div>

            <div class="slider-row">
              <div class="slider-label">AXIS A OVERRIDE <span id="a-val">—</span></div>
              <input type="range" id="ctrl-a" min="0" max="10" step="0.1" value="5" oninput="updateSigil()">
            </div>
            <div class="slider-row">
              <div class="slider-label">AXIS B OVERRIDE <span id="b-val">—</span></div>
              <input type="range" id="ctrl-b" min="0" max="10" step="0.1" value="5" oninput="updateSigil()">
            </div>
            <div class="slider-row">
              <div class="slider-label">AXIS C OVERRIDE <span id="c-val">—</span></div>
              <input type="range" id="ctrl-c" min="0" max="10" step="0.1" value="5" oninput="updateSigil()">
            </div>

            <div style="font-family:var(--M);font-size:8px;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px">ELEMENT OVERRIDE</div>
            <div id="elem-override" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px"></div>

            <button class="btn" onclick="resetToProfile()" style="width:100%">&#8635; RESET TO PROFILE</button>
          </div>

          <div class="card">
            <div class="sechead">ELEMENT VARIANTS</div>
            <div class="variant-grid" id="variant-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <footer class="lf"><span>Ω SOVEREIGN SIGIL · SYD OMEGA 91717</span><span id="rune-ts"></span></footer>
  </main>
</div>

<script type="module">
const SUPABASE_URL='https://ydqhzvvoyufiiqvzcjns.supabase.co';
const SUPABASE_KEY='sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q';
const PHI=1.6180339887,EU=2.7182818285;
const GATE_THRESH=[2.32,3.98,5.95,8.29,11,13.92,17.21,20.87,24.01,25.9,27.1,27.8367];
const SIGN_ELEM={Aries:'Fire',Taurus:'Water',Gemini:'Wind',Cancer:'Water',Leo:'Fire',Virgo:'Sand',Libra:'Wind',Scorpio:'Soul',Sagittarius:'Fire',Capricorn:'Metal',Aquarius:'Metal',Pisces:'Water'};
const ELEM_SIGILS={Fire:'☲',Water:'☰',Wind:'☱',Metal:'☳',Sand:'★',Soul:'✴',Space:'✶',Void:'✷','The All':'Ω'};
const GATE_NAMES=['INITIATE','ACOLYTE','SCHOLAR','KEEPER','GUARDIAN','ARCHITECT','SOVEREIGN','VANGUARD','HERALD','ORACLE','PRIME','APEX SOVEREIGN'];

function calcAuth(a,b,c){return Math.sqrt(Math.pow(a,3)+Math.pow(b,3)+Math.pow(c,3))*PHI/EU;}
function getGate(auth){let g=0;GATE_THRESH.forEach((t,i)=>{if(auth>=t)g=i;});return g+1;}

const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
const sb=window.__omegaSb||createClient(SUPABASE_URL,SUPABASE_KEY);
const {data:{session}}=await sb.auth.getSession();
if(!session){location.href='/account.html';throw 0;}
const {data:pr}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
if(pr?.approval_status==='pending'){location.href='/pending.html';throw 0;}
if(window.__omegaApprove)window.__omegaApprove(true);
document.getElementById('app').style.display='flex';
document.getElementById('rune-ts').textContent=new Date().toUTCString().split(' ').slice(1,4).join(' ');

/* Profile defaults */
const profA=Number(pr?.axis_a||0),profB=Number(pr?.axis_b||0),profC=Number(pr?.axis_c||0);
const profAuth=pr?.is_owner?27.8367:calcAuth(profA,profB,profC);
const profGate=getGate(profAuth);
const profElem=SIGN_ELEM[pr?.zodiac_sign]||'Void';
const profName=pr?.display_name||pr?.full_name||'Sovereign';

/* Init sliders */
document.getElementById('ctrl-a').value=profA;
document.getElementById('ctrl-b').value=profB;
document.getElementById('ctrl-c').value=profC;

let currentElem=profElem;
let animating=false;

/* Wait for sigil gen script to load */
function waitForSigil(){
  if(window.OmegaSigil){
    buildVariantGrid();
    buildElemOverride();
    updateSigil();
  } else {
    setTimeout(waitForSigil,200);
  }
}
waitForSigil();

window.updateSigil=function(){
  if(!window.OmegaSigil)return;
  const a=Number(document.getElementById('ctrl-a').value);
  const b=Number(document.getElementById('ctrl-b').value);
  const c=Number(document.getElementById('ctrl-c').value);
  const sz=Number(document.getElementById('ctrl-size').value);
  document.getElementById('a-val').textContent=a.toFixed(1);
  document.getElementById('b-val').textContent=b.toFixed(1);
  document.getElementById('c-val').textContent=c.toFixed(1);
  document.getElementById('sz-val').textContent=sz;
  const auth=calcAuth(a,b,c);
  const gate=getGate(auth);
  const opts={auth,elem:currentElem,axisA:a,axisB:b,axisC:c,gate,name:profName,size:sz};
  const stage=document.getElementById('sigil-stage');
  stage.innerHTML=window.OmegaSigil.generate(opts);
  /* Info */
  const infoEl=document.getElementById('sigil-info');
  infoEl.innerHTML=[
    ['AUTHORITY',auth.toFixed(4)],
    ['GATE',gate+' · '+GATE_NAMES[gate-1]],
    ['ELEMENT',ELEM_SIGILS[currentElem]+' '+currentElem.toUpperCase()],
    ['COMPLEXITY',gate+' points'],
  ].map(([k,v])=>`<div class="info-stat"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
};

window.resetToProfile=function(){
  currentElem=profElem;
  document.getElementById('ctrl-a').value=profA;
  document.getElementById('ctrl-b').value=profB;
  document.getElementById('ctrl-c').value=profC;
  document.querySelectorAll('.elem-override-btn').forEach(b=>b.classList.toggle('on',b.dataset.elem===profElem));
  updateSigil();
};

window.downloadSigil=function(){
  if(!window.OmegaSigil)return;
  const a=Number(document.getElementById('ctrl-a').value);
  const b=Number(document.getElementById('ctrl-b').value);
  const c=Number(document.getElementById('ctrl-c').value);
  const auth=calcAuth(a,b,c);
  const gate=getGate(auth);
  window.OmegaSigil.download({auth,elem:currentElem,axisA:a,axisB:b,axisC:c,gate,name:profName,size:600});
};

window.copySvg=function(){
  const stage=document.getElementById('sigil-stage');
  const svg=stage.innerHTML;
  navigator.clipboard.writeText(svg).then(()=>{
    const btn=document.querySelector('.btn-cyan');
    const orig=btn.textContent;btn.textContent='✓ COPIED';
    setTimeout(()=>btn.textContent=orig,1400);
  }).catch(()=>{});
};

window.animateSigil=function(){
  if(!window.OmegaSigil)return;
  animating=!animating;
  if(!animating)return;
  let t=0;
  function step(){
    if(!animating)return;
    const a=Number(document.getElementById('ctrl-a').value);
    const b=Number(document.getElementById('ctrl-b').value);
    const c=Number(document.getElementById('ctrl-c').value);
    const sz=Number(document.getElementById('ctrl-size').value);
    const auth=calcAuth(a,b,c);
    const gate=getGate(auth);
    /* Animated by modulating name hash slightly */
    const fakeName=profName+String(Math.round(t*0.5));
    const stage=document.getElementById('sigil-stage');
    stage.innerHTML=window.OmegaSigil.generate({auth,elem:currentElem,axisA:a,axisB:b,axisC:c,gate,name:fakeName,size:sz});
    t++;
    requestAnimationFrame(step);
  }
  step();
};

function buildElemOverride(){
  const container=document.getElementById('elem-override');
  Object.keys(ELEM_SIGILS).forEach(elem=>{
    const btn=document.createElement('button');
    btn.className='elem-override-btn btn'+(elem===currentElem?' '+'on':'');
    btn.dataset.elem=elem;
    btn.style.cssText='font-size:7px;letter-spacing:1px;padding:5px 8px;margin:0';
    btn.textContent=ELEM_SIGILS[elem]+' '+elem.slice(0,4).toUpperCase();
    if(elem===currentElem)btn.style.background='rgba(226,200,109,.2)';
    btn.addEventListener('click',()=>{
      currentElem=elem;
      document.querySelectorAll('.elem-override-btn').forEach(b=>{
        b.classList.remove('on');
        b.style.background='';
      });
      btn.classList.add('on');
      btn.style.background='rgba(226,200,109,.2)';
      updateSigil();
    });
    container.appendChild(btn);
  });
}

function buildVariantGrid(){
  const grid=document.getElementById('variant-grid');
  Object.keys(ELEM_SIGILS).forEach(elem=>{
    const tile=document.createElement('div');
    tile.className='variant-tile';
    const auth=calcAuth(profA,profB,profC);
    const gate=getGate(auth);
    tile.innerHTML=window.OmegaSigil.generate({auth,elem,axisA:profA,axisB:profB,axisC:profC,gate,name:profName,size:100});
    tile.innerHTML+=`<div class="variant-name">${ELEM_SIGILS[elem]} ${elem.toUpperCase()}</div>`;
    tile.addEventListener('click',()=>{
      currentElem=elem;
      document.querySelectorAll('.elem-override-btn').forEach(b=>{
        b.classList.toggle('on',b.dataset.elem===elem);
        b.style.background=b.dataset.elem===elem?'rgba(226,200,109,.2)':'';
      });
      updateSigil();
    });
    grid.appendChild(tile);
  });
}
</script>
</body>
</html>
