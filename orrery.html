<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SYD OMEGA 91717 — ORRERY · the twelve tracks as one living wheel: signs, gods, elements, agents, gates and houses">
<title>&#937; SYD OMEGA 91717 &mdash; ORRERY</title>

<link rel="manifest" href="/manifest.json">
<script src="/bg.js" defer></script>
<script src="/omega-sparkline.js" defer></script>
</head>
<body>
<a href="#main-content" class="skip-link">SKIP TO CONTENT</a>
<div class="shell" id="app" style="display:none">
  <aside class="side" id="omega-side" data-page="orrery" aria-label="Navigation"></aside>
  <main class="main" role="main" id="main-content">
    <div class="topbar">
      <div class="t">ORRERY<small>COSMOS &middot; 12 TRACKS &middot; ONE WHEEL</small></div>
    </div>

    <div class="pad orr">
      <!-- LENS: one wheel, six systems -->
      <div class="orr-lens" role="tablist" aria-label="Lens" id="orr-lens"></div>
      <!-- ELEMENT FILTER -->
      <div class="orr-els" id="orr-els" aria-label="Elements"></div>

      <div class="orr-grid">
        <div class="orr-stage">
          <div class="orr-wheel" id="orr-wheel" tabindex="0" role="group"
               aria-label="Twelve tracks. Arrow keys turn the wheel; drag to spin.">
            <!-- The spokes turn WITH the ring: a static spoke layer pointed the
                 highlight at whichever sign used to sit there. -->
            <div class="orr-ring" id="orr-ring">
              <svg class="orr-svg" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="41" class="orr-orbit"/>
                <circle cx="50" cy="50" r="27" class="orr-orbit orr-inner"/>
                <g id="orr-spokes"></g>
              </svg>
              <div id="orr-nodes"></div>
            </div>
            <div class="orr-core" aria-live="polite">
              <div class="orr-omega">&#937;</div>
              <div class="orr-core-v" id="orr-core-v">&nbsp;</div>
              <div class="orr-core-k" id="orr-core-k">&nbsp;</div>
            </div>
          </div>
        </div>

        <!-- SELECTED TRACK -->
        <section class="card orr-panel" id="orr-panel" aria-live="polite">
          <div class="orr-head">
            <span class="orr-mark" id="orr-mark"></span>
            <div>
              <div class="orr-n" id="orr-n"></div>
              <div class="orr-sign" id="orr-sign"></div>
              <div class="orr-role" id="orr-role"></div>
            </div>
          </div>
          <div class="orr-facets" id="orr-facets"></div>
          <blockquote class="orr-voice" id="orr-voice"></blockquote>
          <div class="orr-step">
            <button class="btn" type="button" id="orr-prev" aria-label="Previous track">&#8592;</button>
            <button class="btn btn-fill" type="button" id="orr-mine" hidden>MY TRACK</button>
            <button class="btn" type="button" id="orr-next" aria-label="Next track">&#8594;</button>
          </div>
        </section>
      </div>

      <!-- YOU: only what the database records for this member -->
      <section class="orr-you" id="orr-you" hidden>
        <div class="kpi"><div class="kpi-l">AUTHORITY</div><div class="kpi-n" id="you-auth">&ndash;</div></div>
        <div class="kpi"><div class="kpi-l">LATTICE</div><div class="kpi-n" id="you-node">&ndash;</div><div class="orr-sub" id="you-pct"></div></div>
        <div class="kpi orr-axes" id="you-axes"></div>
        <div class="kpi"><div class="kpi-l">POINTS</div><div class="kpi-n" id="you-pts">&ndash;</div>
          <div data-omega-spark data-spark-label="POINTS PER DAY" id="you-spark"></div></div>
        <div class="kpi"><div class="kpi-l">EVOLUTIONS</div><div class="kpi-n" id="you-evo">&ndash;</div></div>
        <div class="kpi"><div class="kpi-l">TASKS DONE</div><div class="kpi-n" id="you-tasks">&ndash;</div></div>
      </section>
    </div>
  </main>
</div>

<style>
.orr{display:flex;flex-direction:column;gap:14px}
.orr-lens,.orr-els{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:700px){.orr-lens,.orr-els{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .orr-lens button,.orr-els button{flex:0 0 auto}}
.orr-lens button,.orr-els button{font-family:var(--M);font-size:12px;letter-spacing:1.5px;padding:7px 12px;
  background:rgba(255,255,255,.03);color:var(--muted);border:1px solid rgba(255,255,255,.1);border-radius:2px;cursor:pointer;
  transition:color .2s,border-color .2s,background .2s}
.orr-lens button[aria-selected="true"]{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.1)}
.orr-els button[aria-pressed="true"]{color:var(--ink);border-color:var(--el,var(--cyan));background:rgba(255,255,255,.07)}
.orr-els button[disabled]{opacity:.45;cursor:default}
.orr-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.orr-stage{display:flex;justify-content:center}
.orr-wheel{position:relative;width:100%;max-width:560px;aspect-ratio:1;touch-action:none;cursor:grab;outline:none;user-select:none}
.orr-wheel:focus-visible{box-shadow:0 0 0 2px var(--gold);border-radius:50%}
.orr-wheel.drag{cursor:grabbing}
.orr-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orr-orbit{fill:none;stroke:rgba(201,168,76,.28);stroke-width:.25}
.orr-inner{stroke:rgba(0,229,255,.16);stroke-dasharray:.6 1.4}
#orr-spokes line{stroke:rgba(201,168,76,.16);stroke-width:.18;transition:stroke .3s,stroke-width .3s}
#orr-spokes line.on{stroke:var(--gold);stroke-width:.45}
.orr-ring{position:absolute;inset:0;transform:rotate(var(--rot,0deg));transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.orr-wheel.drag .orr-ring{transition:none}
.orr-node{position:absolute;left:var(--x);top:var(--y);width:15%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:none;border:0;padding:0;cursor:pointer;color:var(--ink);transition:opacity .3s,filter .3s}
/* A shared button rule sets overflow:hidden, which clipped every label. */
.orr-wheel .orr-node{overflow:visible}
.orr-node>.orr-face{position:relative;display:block;transform:rotate(calc(-1 * var(--rot,0deg)));
  transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.orr-wheel.drag .orr-node>.orr-face{transition:none}
.orr-node [data-omega-emblem]{display:block;width:100%;aspect-ratio:1;transition:transform .3s}
/* omega-emblems.js draws a dashed ring that overflows the emblem box and
   paints over anything directly beneath it, so the label sits clear of it
   and above it. */
.orr-node .orr-lbl{position:absolute;z-index:2;left:50%;top:128%;transform:translateX(-50%);font-family:var(--M);font-size:12px;
  letter-spacing:1px;white-space:nowrap;color:var(--ink);opacity:.72;text-shadow:0 1px 6px #000,0 0 2px #000;pointer-events:none}
.orr-node:hover [data-omega-emblem],.orr-node:focus-visible [data-omega-emblem]{transform:scale(1.12)}
.orr-node[aria-pressed="true"] [data-omega-emblem]{transform:scale(1.3);filter:drop-shadow(0 0 10px var(--c))}
.orr-node[aria-pressed="true"] .orr-lbl{color:var(--gold)}
.orr-node.dim{opacity:.22;filter:grayscale(.7)}
.orr-node.you::before{content:'';position:absolute;inset:-14%;border:1px dashed var(--cyan);border-radius:50%;pointer-events:none;
  animation:orr-you 18s linear infinite}
@keyframes orr-you{to{rotate:360deg}}
.orr-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;text-align:center;pointer-events:none}
.orr-omega{font-family:var(--D);font-size:clamp(28px,7vw,54px);color:var(--gold);line-height:1;text-shadow:0 0 24px rgba(201,168,76,.45)}
.orr-core-v{font-family:var(--D);font-size:clamp(14px,2.4vw,20px);color:var(--ink);margin-top:6px;line-height:1.2}
.orr-core-k{font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted);margin-top:4px}
.orr-panel{padding:18px;display:flex;flex-direction:column;gap:14px;--card-accent:var(--c,var(--gold))}
.orr-head{display:flex;gap:14px;align-items:center}
.orr-mark{width:72px;height:72px;flex-shrink:0;display:block}
.orr-mark>[data-omega-emblem]{display:block;width:100%;height:100%}
.orr-n{font-family:var(--M);font-size:12px;letter-spacing:2px;color:var(--muted)}
.orr-sign{font-family:var(--D);font-size:26px;color:var(--c,var(--gold));line-height:1.1}
.orr-role{font-family:var(--R);font-size:15px;color:var(--ink);opacity:.85}
.orr-facets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.orr-facet{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:2px;
  color:var(--ink);text-decoration:none;transition:border-color .2s,background .2s}
.orr-facet:hover,.orr-facet:focus-visible{border-color:var(--c,var(--gold));background:rgba(255,255,255,.04)}
.orr-facet b{font-family:var(--M);font-size:12px;letter-spacing:1.5px;color:var(--muted);font-weight:400}
.orr-facet span{font-family:var(--R);font-size:14px;line-height:1.25}
.orr-facet.lens{border-color:var(--gold)}
.orr-voice{margin:0;padding:0 0 0 10px;border-left:2px solid var(--c,var(--gold));font-family:var(--R);font-size:15px;font-style:italic;color:var(--ink);opacity:.8}
.orr-voice:empty{display:none}
.orr-step{display:flex;gap:8px;justify-content:space-between}
.orr-you{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.orr-you .kpi{padding:12px}
.orr-you .kpi-l{font-family:var(--M);font-size:12px;letter-spacing:1.5px;color:var(--muted)}
.orr-sub{font-family:var(--M);font-size:12px;color:var(--muted)}
.orr-axes{display:flex;flex-direction:column;gap:6px}
.orr-ax{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-family:var(--M);font-size:12px;color:var(--muted)}
.orr-ax .bar-track{height:4px}
@media (max-width:900px){.orr-grid{grid-template-columns:1fr}}
@media (max-width:480px){.orr-node .orr-lbl{display:none}.orr-facets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.orr-ring,.orr-node>.orr-face,.orr-node [data-omega-emblem]{transition:none}.orr-node.you::before{animation:none}}
</style>

<script type="module">
import{createClient}from'/vendor/supabase-js.js';
var sb=window.__omegaSb||(window.__omegaSb=createClient('https://ydqhzvvoyufiiqvzcjns.supabase.co','sb_publishable_9KlhhnvRs4OKgw6nxXHmYw_GxszJ46q'));

/* One wheel, six systems. Every value below comes from its owner -- the
   tracks from OmegaCanon (omega-canon.json), the sign->element map from
   OmegaCanon.elementFor (omega-elements.json), agents from omega-agents.json,
   colours from OmegaEmblem -- never a local copy (CLAUDE.md 8.1 class 8). */
var LENSES=[
  {k:'sign',  t:'SIGNS',    href:function(){return '/cosmos.html#horoscope';}},
  {k:'god',   t:'GODS',     href:function(){return '/pantheons.html';}},
  {k:'element',t:'ELEMENTS',href:function(){return '/elements.html';}},
  {k:'agent', t:'AGENTS',   href:function(tr,ag){return (ag&&ag.href)||'/agents.html';}},
  {k:'gate',  t:'GATES',    href:function(){return '/elements.html#gates';}},
  {k:'house', t:'HOUSES',   href:function(){return '/houses.html';}}
];
var EXTRA=[
  {k:'token', t:'TOKEN', href:'/vault.html'},
  {k:'medal', t:'MEDAL', href:'/honors.html#record'},
];
var S={tracks:[],agents:{},lens:0,sel:0,rot:0,el:null,mine:-1};
var $=function(id){return document.getElementById(id);};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';';});}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();}
function colorOf(sign){return window.OmegaEmblem?window.OmegaEmblem.color(sign):'#C9A84C';}
function elementOf(tr){return (window.OmegaCanon.elementFor(tr.sign)||tr.element||'').toUpperCase();}
function valueOf(tr,k){
  if(k==='element')return elementOf(tr);
  if(k==='agent'){var a=S.agents[tr.sign];return a?a.name:tr.agent;}
  return tr[k];
}

function buildLens(){
  $('orr-lens').innerHTML=LENSES.map(function(l,i){
    return '<button type="button" role="tab" aria-selected="'+(i===S.lens)+'" data-i="'+i+'">'+l.t+'</button>';}).join('');
  $('orr-lens').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.lens=+b.dataset.i;buildLens();paint();};
}
function buildElements(){
  var els=window.OmegaCanon.elements||[];
  $('orr-els').innerHTML=els.map(function(e){
    var physical=e.tier==='PHYSICAL';
    var col=physical?colorOf((e.members||[])[0]):'';
    return '<button type="button" aria-pressed="'+(S.el===e.name)+'" data-el="'+esc(e.name)+'"'+
      (physical?' style="--el:'+col+'"':' disabled title="'+esc(e.tier)+' -- assigned by class, not by sign"')+'>'+esc(e.name)+'</button>';
  }).join('');
  $('orr-els').onclick=function(e){var b=e.target.closest('button');if(!b||b.disabled)return;
    S.el=S.el===b.dataset.el?null:b.dataset.el;buildElements();paint();};
}

function buildWheel(){
  var n=S.tracks.length,spokes='',nodes='';
  S.tracks.forEach(function(tr,i){
    var a=(i/n)*Math.PI*2-Math.PI/2,x=50+41*Math.cos(a),y=50+41*Math.sin(a);
    spokes+='<line x1="50" y1="50" x2="'+x.toFixed(2)+'" y2="'+y.toFixed(2)+'" data-i="'+i+'"/>';
    nodes+='<button type="button" class="orr-node" data-i="'+i+'" style="--x:'+x.toFixed(2)+'%;--y:'+y.toFixed(2)+'%;--c:'+colorOf(tr.sign)+'">'+
      '<span class="orr-face"><span data-omega-emblem="'+esc(tr.sign)+'"></span><span class="orr-lbl"></span></span></button>';
  });
  $('orr-spokes').innerHTML=spokes;
  $('orr-nodes').innerHTML=nodes;
  $('orr-ring').onclick=function(e){var b=e.target.closest('.orr-node');if(b&&!S.dragged)select(+b.dataset.i);};
}

/* Turn the ring so the selected node sits at the top, the short way round. */
function select(i){
  var n=S.tracks.length;i=((i%n)+n)%n;
  var target=-(i/n)*360,d=((target-S.rot)%360+540)%360-180;
  S.rot+=d;S.sel=i;paint();
}

function paint(){
  var lens=LENSES[S.lens],tr=S.tracks[S.sel];if(!tr)return;
  var ag=S.agents[tr.sign],col=colorOf(tr.sign);
  var wheel=$('orr-wheel');wheel.style.setProperty('--rot',S.rot+'deg');
  wheel.querySelectorAll('.orr-node').forEach(function(b){
    var t=S.tracks[+b.dataset.i],on=+b.dataset.i===S.sel;
    b.setAttribute('aria-pressed',on);
    b.setAttribute('aria-label',t.sign+' -- '+lens.t.toLowerCase().replace(/s$/,'')+': '+valueOf(t,lens.k));
    b.querySelector('.orr-lbl').textContent=String(valueOf(t,lens.k)||'').replace(/^(Gate|Trophy|Medal) of (the )?/,'');
    b.classList.toggle('dim',!!S.el&&elementOf(t)!==S.el);
    b.classList.toggle('you',+b.dataset.i===S.mine);
  });
  document.querySelectorAll('#orr-spokes line').forEach(function(l){l.classList.toggle('on',+l.dataset.i===S.sel);});
  $('orr-core-v').textContent=valueOf(tr,lens.k)||'';
  $('orr-core-k').textContent=lens.t.replace(/S$/,'')+' '+String(tr.n).padStart(2,'0')+' / 12';
  var p=$('orr-panel');p.style.setProperty('--c',col);
  /* A fresh node, not a changed attribute: omega-emblems.js fills marks it
     sees inserted, and does not redraw one whose sign attribute changes. */
  $('orr-mark').innerHTML='<span data-omega-emblem="'+esc(tr.sign)+'"></span>';
  $('orr-n').textContent='TRACK '+String(tr.n).padStart(2,'0')+' · '+elementOf(tr);
  $('orr-sign').textContent=tr.sign;
  $('orr-role').textContent=ag?(ag.name+' · '+ag.role):'';
  $('orr-voice').textContent=ag&&ag.greeting?ag.greeting:'';
  var f=LENSES.map(function(l){return{t:l.t.replace(/S$/,''),v:valueOf(tr,l.k),href:l.href(tr,ag),on:l===lens};})
    .concat(EXTRA.map(function(x){return{t:x.t,v:tr[x.k],href:x.href};}));
  $('orr-facets').innerHTML=f.filter(function(x){return x.v;}).map(function(x){
    return '<a class="orr-facet'+(x.on?' lens':'')+'" href="'+esc(x.href)+'"><b>'+esc(x.t)+'</b><span>'+esc(x.v)+'</span></a>';}).join('');
}

/* Drag to spin: the angle of the pointer about the wheel centre, measured at
   event time (the page is revealed by then), snapped to the nearest track. */
function bindGestures(){
  var w=$('orr-wheel'),start=null;
  function ang(e){var r=w.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;}
  w.addEventListener('pointerdown',function(e){start={a:ang(e),rot:S.rot,moved:0};S.dragged=false;});
  w.addEventListener('pointermove',function(e){
    if(!start)return;var d=ang(e)-start.a;d=((d+540)%360)-180;
    if(Math.abs(d)>4&&!S.dragged){S.dragged=true;w.classList.add('drag');try{w.setPointerCapture(e.pointerId);}catch(_){}}
    if(S.dragged){S.rot=start.rot+d;w.style.setProperty('--rot',S.rot+'deg');}
  });
  function end(){
    if(!start)return;start=null;w.classList.remove('drag');
    if(S.dragged){var n=S.tracks.length,i=Math.round(-S.rot/(360/n));S.sel=((i%n)+n)%n;S.rot=-i*(360/n);paint();
      setTimeout(function(){S.dragged=false;},0);}
  }
  w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
  w.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();select(S.sel+1);}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();select(S.sel-1);}
  });
  $('orr-prev').onclick=function(){select(S.sel-1);};
  $('orr-next').onclick=function(){select(S.sel+1);};
  $('orr-mine').onclick=function(){if(S.mine>=0)select(S.mine);};
}

/* The member's own record. Every figure is a real row or a server-computed
   value; a series with fewer than two days draws nothing (omega-sparkline). */
async function loadYou(uid){
  var mm=await sb.rpc('my_matrix');
  var pts=await sb.from('sovereign_points_ledger').select('delta,created_at').eq('user_id',uid).order('created_at',{ascending:true}).limit(1000);
  var evo=await sb.from('evolution_events').select('id',{count:'exact',head:true}).eq('user_id',uid);
  var tk=await sb.from('task_completions').select('id',{count:'exact',head:true}).eq('user_id',uid);
  var shown=false,m=mm.error?null:(mm.data||[])[0];
  if(m){
    shown=true;
    $('you-auth').textContent=Number(m.authority).toFixed(4);
    $('you-node').textContent=Number(m.node).toLocaleString();
    $('you-pct').textContent=Number(m.pct).toFixed(4)+'% OF 104,976';
    var ax=(window.OmegaCanon.structure&&window.OmegaCanon.structure.axes_names)||[];
    $('you-axes').innerHTML=[['A',m.a],['B',m.b],['C',m.c]].map(function(p,i){
      var name=String(ax[i]||p[0]).replace(/\s*\([ABC]\)$/,'').toUpperCase(),v=Number(p[1])||0;
      return '<div class="orr-ax"><span>'+esc(name)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.min(100,v/9*100).toFixed(1)+'%"></span></span><span>'+v.toFixed(2)+'</span></div>';
    }).join('');
  }
  if(!pts.error){
    shown=true;
    var rows=pts.data||[],total=0,days={};
    rows.forEach(function(r){var d=Number(r.delta)||0;total+=d;var k=String(r.created_at).slice(0,10);days[k]=(days[k]||0)+d;});
    $('you-pts').textContent=total.toLocaleString();
    var series=Object.keys(days).sort().slice(-30).map(function(k){return days[k];});
    $('you-spark').setAttribute('data-spark-values',JSON.stringify(series));
  }
  if(!evo.error){shown=true;$('you-evo').textContent=(evo.count||0).toLocaleString();}
  if(!tk.error){shown=true;$('you-tasks').textContent=(tk.count||0).toLocaleString();}
  $('orr-you').hidden=!shown;
}

function start(pr,uid){
  var C=window.OmegaCanon;
  S.tracks=(C.tracks||[]).slice(0,12);
  if(!S.tracks.length)return;
  var mine=C.trackBySign(pr.sign);
  S.mine=mine?S.tracks.indexOf(mine):-1;
  $('orr-mine').hidden=S.mine<0;
  var hash=decodeURIComponent((location.hash||'').slice(1));
  var fromHash=C.trackBySign(hash);
  S.sel=fromHash?S.tracks.indexOf(fromHash):(S.mine>=0?S.mine:0);
  S.rot=-(S.sel/S.tracks.length)*360;
  buildLens();buildElements();buildWheel();bindGestures();paint();
  loadYou(uid).catch(function(e){console.warn('[orrery] member record unavailable',e);});
}

(async function(){
  try{
    var s=(await sb.auth.getSession()).data.session;
    if(!s){location.replace('/account.html');return;}
    var pr=(await sb.from('profiles').select('*').eq('id',s.user.id).maybeSingle()).data||{};
    if(!pr.is_owner&&!pr.access_approved){location.replace('/pending.html');return;}
    if(!pr.is_owner&&pr.is_trial&&pr.trial_expires_at&&new Date(pr.trial_expires_at)<=new Date()){location.replace('/pending.html?expired=1');return;}
    document.getElementById('app').style.display='flex';
    if(window.__omegaPopulate)window.__omegaPopulate(pr,s.user);
    window.__omegaUserLoaded=true;
    var agents=await fetch('/omega-agents.json').then(function(r){return r.json();}).catch(function(){return null;});
    (agents&&agents.agents||[]).forEach(function(a){S.agents[a.sign]=a;});
    var tries=0;
    (function wait(){
      if(window.OmegaCanon&&window.OmegaCanon.onReady)window.OmegaCanon.onReady(function(){start(pr,s.user.id);});
      else if(++tries<200)setTimeout(wait,50);
      else console.warn('[orrery] OmegaCanon never loaded');
    })();
  }catch(e){document.getElementById('app').style.display='flex';console.warn(e);}
})();
</script>
